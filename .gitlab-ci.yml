default:
  image: ghcr.io/astral-sh/uv:0.8.22-python3.12-bookworm
  tags:
    - nemollm-common-aws
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - job_execution_timeout
  cache:
    key:
      # Keep lightweight checks from restoring the much larger CPU-test cache.
      prefix: "$CI_JOB_NAME"
      files:
        - uv.lock
    paths:
      - .uv-cache/
  after_script:
    # Keep source-built wheels; redownload prebuilt wheels instead of archiving them.
    - uv cache prune --ci

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "internal"'

stages:
  - lint
  - test

variables:
  CUDA_VISIBLE_DEVICES: ""
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  HF_DATASETS_OFFLINE: "1"
  # Unit-test defaults point at GitHub's /home/TestData mount, absent on GitLab.
  HF_HOME: "$CI_PROJECT_DIR/.cache/huggingface"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  UV_LINK_MODE: copy
  UV_PYTHON_DOWNLOADS: never
  UV_PROJECT_ENVIRONMENT: "$CI_PROJECT_DIR/.venv"
  FF_USE_FASTZIP: "true"
  CACHE_COMPRESSION_LEVEL: fastest

lint:
  stage: lint
  variables:
    UV_PYTHON: "3.12"
  timeout: 10 minutes
  before_script:
    - uv sync --locked --only-group linting
  script:
    - uv run --no-sync ruff --version
    - uv run --no-sync ruff check --verbose .
    - uv run --no-sync ruff format --check --verbose .
    - uv run --no-sync bandit -r app.py nemo_automodel examples scripts tools tutorials -t B614
    - uv run --no-sync lint-imports --debug --verbose --no-cache

secret-detection:
  stage: lint
  variables:
    UV_PYTHON: "3.12"
    GIT_DEPTH: "0"
    RUNNER_SCRIPT_TIMEOUT: "5m"
  timeout: 10 minutes
  script:
    - |-
      set -o pipefail
      git diff --name-only --diff-filter=ACMRT -z \
        "$CI_MERGE_REQUEST_DIFF_BASE_SHA" "$CI_COMMIT_SHA" -- \
        | xargs -0 -r uv tool run --from detect-secrets==1.5.0 \
          detect-secrets-hook --no-verify --baseline .github/workflows/config/.secrets.baseline --

recipe-validation:
  stage: lint
  variables:
    UV_PYTHON: "3.12"
    GIT_DEPTH: "0"
    RUNNER_SCRIPT_TIMEOUT: "5m"
  timeout: 10 minutes
  before_script:
    - uv venv .venv
    - uv pip install --python .venv/bin/python PyYAML==6.0.3 ruamel.yaml==0.19.1
  script:
    - uv run --no-sync python tests/ci_tests/utils/validate_nightly_recipes.py --automodel-dir .
    - uv run --no-sync python tests/ci_tests/utils/validate_generate_ci.py --automodel-dir .
    - |-
      set -o pipefail
      git diff --name-only --diff-filter=A -z \
        "$CI_MERGE_REQUEST_DIFF_BASE_SHA" "$CI_COMMIT_SHA" -- examples/ \
        | xargs -0 -r uv run --no-sync python tests/ci_tests/utils/validate_new_recipe_ci.py --automodel-dir . --

retrieval-unit-tests:
  stage: test
  # Start alongside lint; this job does not consume its artifacts.
  needs: []
  image: ghcr.io/astral-sh/uv:0.8.22-python3.12-bookworm
  variables:
    UV_PYTHON: "3.12"
  timeout: 20 minutes
  before_script:
    # Retrieval processor imports need torchvision; mocked object-storage tests need boto3.
    - uv sync --locked --no-default-groups --group build --group test --group linting --extra diffusion --extra s3
  script:
    - uv run --no-sync ty --version
    - |-
      uv run --no-sync python - <<'PY'
      import subprocess
      import tomllib
      from pathlib import Path

      config = tomllib.loads(Path("pyproject.toml").read_text())
      targets = sorted({
          pattern.removesuffix("/**")
          for override in config["tool"]["ty"]["overrides"]
          for pattern in override["include"]
      })
      if not targets:
          raise SystemExit("No ty check targets configured in pyproject.toml")
      subprocess.run(["ty", "check", "--verbose", *targets], check=True)
      PY
    # Prefer directories and path globs so new tests are included automatically.
    # Keep optional-kernel/model and unrelated recipe suites outside this CPU/offline job.
    # Unmatched shell globs reach pytest as invalid paths and fail rather than silently disappearing.
    - >-
      uv run --no-sync pytest
      --cpu
      -m "not pleasefixme"
      --durations 32
      --durations-min 0
      --tb short
      -rA
      --junitxml pytest-report.xml
      tests/unit_tests/_transformers/test_*retrieval*.py
      tests/unit_tests/_transformers/test_*tokenizer*.py
      tests/unit_tests/_transformers/test_*export*.py
      tests/unit_tests/config
      tests/unit_tests/datasets/llm
      tests/unit_tests/datasets/test_*.py
      tests/unit_tests/loss
      tests/unit_tests/models/bi_encoder
      tests/unit_tests/models/test_*reranker*.py
      tests/unit_tests/recipes/retrieval
      tests/unit_tests/recipes/test_*retrieval*.py
      tests/unit_tests/recipes/test_train*encoder*.py
      tests/unit_tests/recipes/test_mine*.py
      tests/unit_tests/ci_tests/test_*config*.py
      tests/unit_tests/ci_tests/test_generate_ci_tests.py
  artifacts:
    when: always
    reports:
      junit: pytest-report.xml
