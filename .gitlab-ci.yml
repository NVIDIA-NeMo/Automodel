default:
  image: ghcr.io/astral-sh/uv:0.8.22-python3.10-bookworm
  tags:
    - nemollm-common
  interruptible: true
  cache:
    key:
      # Keep lightweight checks from restoring the much larger CPU-test cache.
      prefix: "$CI_JOB_NAME"
      files:
        - uv.lock
    paths:
      - .uv-cache/

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "internal"'

stages:
  - lint
  - test

variables:
  CUDA_VISIBLE_DEVICES: ""
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  UV_LINK_MODE: copy
  UV_PYTHON_DOWNLOADS: never
  UV_PROJECT_ENVIRONMENT: "$CI_PROJECT_DIR/.venv"

lint:
  stage: lint
  variables:
    UV_PYTHON: "3.10"
  timeout: 10 minutes
  before_script:
    - uv sync --locked --only-group linting
  script:
    - uv run --no-sync ruff --version
    - uv run --no-sync ruff check --verbose .
    - uv run --no-sync ruff format --check --verbose .
    - uv run --no-sync bandit -r app.py nemo_automodel examples scripts tools tutorials -t B614
    - uv run --no-sync lint-imports --debug --verbose --no-cache

secret-detection:
  stage: lint
  variables:
    UV_PYTHON: "3.10"
    GIT_DEPTH: "0"
  timeout: 5 minutes
  script:
    - |-
      set -o pipefail
      git diff --name-only --diff-filter=ACMRT -z \
        "$CI_MERGE_REQUEST_DIFF_BASE_SHA" "$CI_COMMIT_SHA" -- \
        | xargs -0 -r uv tool run --from detect-secrets==1.5.0 \
          detect-secrets-hook --no-verify --baseline .github/workflows/config/.secrets.baseline --

recipe-validation:
  stage: lint
  variables:
    UV_PYTHON: "3.10"
    GIT_DEPTH: "0"
  timeout: 5 minutes
  before_script:
    - uv venv .venv
    - uv pip install --python .venv/bin/python PyYAML==6.0.3 ruamel.yaml==0.19.1
  script:
    - uv run --no-sync python tests/ci_tests/utils/validate_nightly_recipes.py --automodel-dir .
    - uv run --no-sync python tests/ci_tests/utils/validate_generate_ci.py --automodel-dir .
    - |-
      set -o pipefail
      git diff --name-only --diff-filter=A -z \
        "$CI_MERGE_REQUEST_DIFF_BASE_SHA" "$CI_COMMIT_SHA" -- examples/ \
        | xargs -0 -r uv run --no-sync python tests/ci_tests/utils/validate_new_recipe_ci.py --automodel-dir . --

retrieval-unit-tests:
  stage: test
  # Start alongside lint; this job does not consume its artifacts.
  needs: []
  image: ghcr.io/astral-sh/uv:0.8.22-python3.12-bookworm
  variables:
    UV_PYTHON: "3.12"
  timeout: 20 minutes
  before_script:
    # The retrieval processors register torchvision-backed Hugging Face classes at import time.
    - uv sync --locked --no-default-groups --group build --group test --group linting --extra diffusion
  script:
    - uv run --no-sync ty --version
    - |-
      uv run --no-sync python - <<'PY'
      import subprocess
      import tomllib
      from pathlib import Path

      config = tomllib.loads(Path("pyproject.toml").read_text())
      targets = sorted({
          pattern.removesuffix("/**")
          for override in config["tool"]["ty"]["overrides"]
          for pattern in override["include"]
      })
      if not targets:
          raise SystemExit("No ty check targets configured in pyproject.toml")
      subprocess.run(["ty", "check", "--verbose", *targets], check=True)
      PY
    - >-
      uv run --no-sync pytest
      --cpu
      -m "not pleasefixme"
      --durations 32
      --durations-min 0
      --tb short
      -rA
      --junitxml pytest-report.xml
      tests/unit_tests/_transformers/test_retrieval.py
      tests/unit_tests/_transformers/test_retrieval_backbone_registry.py
      tests/unit_tests/_transformers/test_sentence_transformer_export.py
      tests/unit_tests/datasets/llm/test_bi_encoder_collator.py
      tests/unit_tests/datasets/llm/test_cross_encoder_collator.py
      tests/unit_tests/datasets/llm/test_retrieval_data_tools.py
      tests/unit_tests/datasets/llm/test_retrieval_dataset.py
      tests/unit_tests/datasets/llm/test_retrieval_distill_collator.py
      tests/unit_tests/datasets/test_retrieval_group_aware_split.py
      tests/unit_tests/loss/test_embedding_distill.py
      tests/unit_tests/models/bi_encoder
      tests/unit_tests/models/test_qwen3_reranker_collator_epoch.py
      tests/unit_tests/models/test_qwen3_reranker_scoring.py
      tests/unit_tests/recipes/retrieval
      tests/unit_tests/recipes/test_retrieval_bi_encoder_recipe.py
      tests/unit_tests/recipes/test_retrieval_distill_recipe.py
      tests/unit_tests/recipes/test_retrieval_import.py
      tests/unit_tests/recipes/test_train_cross_encoder.py
  artifacts:
    when: always
    reports:
      junit: pytest-report.xml
