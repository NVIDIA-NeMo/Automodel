# SCDD (Self-Correcting Discrete Diffusion) fine-tuning of LLaDA-8B.
# Paper: https://openreview.net/forum?id=zQKlzKB6I9
#
# The forward process mixes absorbing [MASK] noise with uniform token
# transitions, so the model trains on contexts holding wrong-but-plausible
# tokens and learns to overwrite them. That self-correction is what sustains
# quality when many positions are decoded per step.
#
# Scope note: the paper *pretrains* GPT-2-scale DiT backbones from scratch with
# this objective. This recipe instead applies it as SFT on LLaDA-8B, which was
# pretrained with the pure absorbing kernel, so fine-tuning has to teach
# self-correction on top of an absorbing-only prior. Treat the schedule settings
# below as a starting point, not as reproduced paper numbers.
#
# The forward-process block below matches the config shipped with the authors'
# released checkpoint: T=1000, ratio 0.1, gamma 1, t_peak 0.5, sampling_eps 1e-3.
# Their only other released setting differs solely in ratio: 0.2 -- every other
# field is identical, so ratio is the one schedule knob worth sweeping first.
#
# Their optimizer settings are NOT copied here: lr 5e-4, weight_decay 0.02,
# eps 1e-9, global batch 256, sequence length 512 all belong to a from-scratch
# pretraining run of a 90M-parameter DiT. The values below mirror llada_sft.yaml
# instead, so an SCDD run is directly comparable against the MDLM baseline on the
# same 8B model and data.
#
# Known gap: the authors' runs keep an EMA of the weights (decay 0.9999) and
# evaluate the EMA copy. AutoModel ships ``components/training/ema.py``, but the
# dLLM recipe does not wire it, so there is no ``ema:`` key to set here; expect
# somewhat noisier samples than the released checkpoints until it is threaded in.
#
# Usage (8-GPU single node):
#   python -m torch.distributed.run --nproc-per-node=8 \
#       nemo_automodel/recipes/dllm/train_ft.py \
#       -c examples/dllm_sft/llada_scdd.yaml
#
# Decode with the matching sampler, passing the same schedule:
#   python examples/dllm_generate/generate.py \
#       --checkpoint <consolidated dir> --sampler scdd \
#       --uniform_ratio 0.1 --schedule_shape 1.0 --schedule_peak 0.5

recipe: DiffusionLMSFTRecipe

step_scheduler:
  global_batch_size: 32    # per-device 1 x grad-accum 4 x 8 GPUs
  local_batch_size: 1
  ckpt_every_steps: 500
  val_every_steps: 500
  max_steps: null
  num_epochs: 2

dist_env:
  backend: nccl
  timeout_minutes: 30

seed: 42

wandb:
  enable: false
  project: dllm-scdd
  name: am-llada-scdd_run

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: GSAI-ML/LLaDA-8B-Base
  torch_dtype: float32     # fp32 master weights; compute stays bf16 via mp_policy
  trust_remote_code: true

checkpoint:
  enabled: true
  checkpoint_dir: dllm_checkpoints/llada_scdd/
  model_save_format: safetensors
  save_consolidated: final  # final step exports the consolidated HF dir generate.py loads

distributed:
  strategy: fsdp2
  dp_size: none
  tp_size: 1
  cp_size: 1               # SCDD does not support context parallelism (SCDDStrategy raises)
  pp_size: 1
  sequence_parallel: false
  activation_checkpointing: true   # 8B full FT; trade compute for memory
  mp_policy:
    param_dtype: bfloat16
    reduce_dtype: float32
    output_dtype: float32
  autocast_dtype: bfloat16
  offload_policy: null
  # Per-layer FSDP2 prefetch overlaps all-gather / reduce-scatter with compute.
  enable_fsdp2_prefetch: true
  fsdp2_forward_prefetch_depth: 1
  fsdp2_backward_prefetch_depth: 2

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy

# mode: scdd selects SCDDStrategy -- mixed absorbing + uniform corruption scored
# by the discrete-time SCDD NELBO. The ELBO is supported at every supervised
# position (corrupted or not), so the loss denominator is the supervised-token
# count rather than the corrupted-token count.
dllm:
  mode: scdd
  mask_token_id: 126336    # LLaDA <|mdm_mask|>
  # Required: the uniform channel draws replacements over the vocabulary minus
  # [MASK] and the clean token, and the ELBO normalises over that same domain.
  # Must equal the model's vocab_size -- SCDDStrategy.setup_extra rejects a mismatch.
  vocab_size: 126464
  # --- schedule: matches the authors' released checkpoint config ---
  eps: 0.001               # their training.sampling_eps
  num_timesteps: 1000      # their T; the ELBO compares t against t - 1/T
  # Peak share of uniform (correctable) noise -- their forward.ratio. 0
  # degenerates the objective to plain MDLM. The authors release 0.1 and 0.2;
  # start at 0.1 when fine-tuning an absorbing-pretrained checkpoint, it being
  # the smaller shift away from LLaDA's prior.
  uniform_ratio: 0.1
  schedule_shape: 1.0      # their forward.gamma; larger concentrates noise at the peak
  schedule_peak: 0.5       # their forward.t_peak
  # Positions per checkpointed chunk of the loss's vocabulary reduction. The
  # SCDD ELBO needs p_theta over the whole vocabulary, so it cannot use a fused
  # cross-entropy; chunking keeps the two [chunk, vocab] fp32 intermediates off
  # the backward tape. Lower this first if the loss runs out of memory; null
  # disables chunking.
  chunk_size: 1024
  supervise_padding: true

optimizer:
  _target_: torch.optim.AdamW
  betas: [0.9, 0.999]
  eps: 1.0e-8
  lr: 2.0e-5               # matches llada_sft.yaml so SCDD vs MDLM stays comparable
  weight_decay: 0.0

clip_grad_norm:
  max_norm: 1.0

lr_scheduler:
  lr_decay_style: cosine
  init_lr: 0.0
  min_lr: 0.0
  lr_warmup_steps: 200

dataset:
  _target_: nemo_automodel.components.datasets.llm.chat_dataset.ChatDataset
  path_or_dataset_id: allenai/tulu-3-sft-mixture
  split: train
  shuffle_seed: 42
  seq_length: 1024
  truncation: true
  unshifted: true
  # LLaDA-8B-Base ships a generation-only chat template that unconditionally
  # appends an assistant prompt and lacks {% generation %} tags, breaking answer-mask
  # extraction on multi-turn samples. Use a Llama-3 template with generation tags so
  # the tokenizer returns the assistant mask directly (supervises response + EOS).
  chat_template: examples/dllm_sft/llada_chat_template.jinja
  tokenizer:
    pretrained_model_name_or_path: GSAI-ML/LLaDA-8B-Base
    trust_remote_code: true

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.default_collater
  group_by_length: true
