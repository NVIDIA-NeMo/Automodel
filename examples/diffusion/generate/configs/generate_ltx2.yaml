model:
  pretrained_model_name_or_path: "diffusers/LTX-2.3-Diffusers"
  checkpoint: null
  lora_weights: null              # set to: PATH_TO_CKPT/checkpoint-1000
  lora_adapter_name: "default"    # must match adapter_name used at save time
  lora_scale: 1.0                 # lora_alpha / rank; 1.0 = full contribution


inference:
  num_inference_steps: 40
  guidance_scale: 4.0
  height: 384
  width: 768
  dtype: "bfloat16"
  max_samples: 10
  prompts:
    - "A cat sitting on a windowsill watching the rain"
  pipeline_kwargs:
    num_frames: 89
    frame_rate: 24.0

output:
  output_dir: "./inference_outputs"
  fps: 24
  # LTX-2 emits video and audio; the waveform is muxed into the output mp4.
  # Leave null to use the rate reported by the pipeline vocoder (48 kHz on 2.3).
  audio_sample_rate: null

distributed: null

vae:
  enable_slicing: true
  enable_tiling: true
  enable_cpu_offload: false

seed: 42
