recipe: DMD2DiffusionRecipe

model:
  pretrained_model_name_or_path: Qwen/Qwen-Image
  mode: finetune
  cache_dir: null
  attention_backend: flash
  torch_dtype: bfloat16
  compute_dtype: bfloat16
  transformer_engine_linear: false
  transformer_engine_fp8: false
  fuse_qkv_projections: false

dmd2:
  # Model Optimizer owns the math; this model-owned adapter owns Qwen calls.
  recipe_path: general/distillation/dmd2_qwen_image
  model_adapter:
    _target_: nemo_automodel.components.models.qwen_image.dmd2.QwenImageDMD2Adapter
    guidance: null
    gan_feature_indices: [30]
    gan_num_blocks: 60
    gan_inner_dim: 3072

  # Generate this once with the same Qwen text encoder used for the data cache.
  negative_prompt_embedding_path: PATH_TO_NEGATIVE_PROMPT_EMBEDDING
  guidance_scale: 4.0

  pred_type: flow
  num_train_timesteps: null
  student_sample_steps: 4
  student_sample_type: ode
  backward_simulation: false
  student_update_freq: 5
  fake_score_pred_type: x0

  # Full DMD2 GAN branch used by the validated production run.
  gan_loss_weight_gen: 0.03
  gan_use_same_t_noise: true
  gan_r1_reg_weight: 0.0
  gan_r1_reg_alpha: 0.1

  fake_score_lr: 2.0e-6
  discriminator_lr: 2.0e-6

  sample_t_cfg:
    time_dist_type: uniform
    min_t: 0.001
    max_t: 0.999
    shift: 5.0
    p_mean: 0.0
    p_std: 1.0
    # LightX2V shift-3 four-step schedule from the validated Qwen-Image run.
    t_list: [1.0, 0.9, 0.75, 0.5, 0.0]

  # The validated production run disabled EMA. To enable exact-resume EMA,
  # replace null with a full_tensor EMAConfig; this requires one full shadow
  # model per rank and therefore substantially more memory.
  ema: null

optim:
  # Match the student/fake-score/discriminator LR in the validated run.
  learning_rate: 2.0e-6
  clip_grad: 1.0
  optimizer:
    weight_decay: 0.01
    betas: [0.9, 0.999]
    foreach: false
    fused: true

lr_scheduler:
  lr_decay_style: constant
  lr_warmup_steps: 0
  min_lr: 2.0e-6

fsdp:
  dp_size: 8
  dp_replicate_size: 1
  tp_size: 1
  cp_size: 1
  pp_size: 1
  activation_checkpointing: true
  cpu_offload: false
  enable_compile: false

# The parent still constructs its standard adapter during setup; DMD2 replaces
# the flow-matching pipeline before training.
flow_matching:
  adapter_type: qwen_image
  adapter_kwargs:
    guidance_scale: 3.5
    use_guidance_embeds: false

step_scheduler:
  num_epochs: 200
  local_batch_size: 1
  global_batch_size: 8
  max_steps: 50000
  ckpt_every_steps: 1000
  save_checkpoint_every_epoch: false
  log_every: 1

data:
  dataloader:
    _target_: nemo_automodel.components.datasets.diffusion.build_text_to_image_multiresolution_dataloader
    cache_dir: PATH_TO_AUTOMODEL_QWEN_IMAGE_CACHE
    train_text_encoder: false
    num_workers: 2
    base_resolution: [1024, 1024]
    dynamic_batch_size: false
    shuffle: true
    drop_last: false

checkpoint:
  enabled: true
  checkpoint_dir: PATH_TO_CHECKPOINT_DIR
  model_save_format: safetensors
  save_consolidated: final
  diffusers_compatible: true
  is_async: false
  restore_from: null

wandb:
  enable: false
  project: qwen-image-dmd2
  mode: online
  name: qwen_image_dmd2_shift3

dist_env:
  backend: nccl
  timeout_minutes: 60

seed: 42

ci:
  recipe_owner: jingyu-ml
  time: "04:00:00"
  nodes: 1
