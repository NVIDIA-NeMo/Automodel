seed: 42

wandb:
  enable: false
  project: flux3-finetuning
  mode: online
  name: flux3_lora_run

dist_env:
  backend: "nccl"
  init_method: "env://"

model:
  # FLUX.3 checkpoints are modular pipelines (modular_model_index.json).
  # Accept the Hugging Face repository access conditions before loading.
  # Requires a Diffusers revision with FLUX.3 modular support; see the model guide.
  pretrained_model_name_or_path: "black-forest-labs/flux-3-image-klein-base"
  # Required when peft block is present — selects pre-inject hook and is
  # passed to auto_diffusion_pipeline for model-specific setup.
  model_type: "flux3"
  mode: "finetune"
  cache_dir: null
  attention_backend: "flash"

# ── LoRA / PEFT configuration ─────────────────────────────────────────────────
# Defaults aligned with diffusers/examples/dreambooth/train_dreambooth_lora_flux3.py.
# Target modules cover attention projections and feedforward in both the
# per-mode blocks (mode_blocks.image, txt_mode_blocks) and the joint
# single_transformer_blocks, plus the image embedder/output and text projector.
# Run `for n, m in model.named_modules(): print(n)` to verify exact names.
peft:
  _target_: nemo_automodel.components._peft.lora.PeftConfig
  dim: 4
  alpha: 4
  dropout: 0.0
  lora_dtype: bfloat16
  # Restrict T2I adapters to streams used during image generation.
  target_modules:
    - "mode_blocks.image.[0-9]*.attn.to_q"
    - "mode_blocks.image.[0-9]*.attn.to_k"
    - "mode_blocks.image.[0-9]*.attn.to_v"
    - "mode_blocks.image.[0-9]*.attn.to_out.0"
    - "mode_blocks.image.[0-9]*.ff.linear_in"
    - "mode_blocks.image.[0-9]*.ff.linear_out"
    - "txt_mode_blocks.*.attn.to_q"
    - "txt_mode_blocks.*.attn.to_k"
    - "txt_mode_blocks.*.attn.to_v"
    - "txt_mode_blocks.*.attn.to_out.0"
    - "txt_mode_blocks.*.ff.linear_in"
    - "txt_mode_blocks.*.ff.linear_out"
    - "single_transformer_blocks.*.attn.to_q"
    - "single_transformer_blocks.*.attn.to_k"
    - "single_transformer_blocks.*.attn.to_v"
    - "single_transformer_blocks.*.attn.to_out.0"
    - "single_transformer_blocks.*.ff.linear_in"
    - "single_transformer_blocks.*.ff.linear_out"
    - "x_embedders.image"
    - "proj_out"
    - "context_embedder"

optimizer:
  _target_: torch.optim.AdamW
  lr: 1e-4
  weight_decay: 1e-4
  betas: [0.9, 0.999]
  foreach: false
  fused: true

performance:
  check_loss: false
  grad_clip_foreach: true

lr_scheduler:
  lr_decay_style: cosine
  lr_warmup_steps: 500
  min_lr: 0.0

# FSDP2 with param_dtype=None when LoRA enabled:
#   base weights (bf16): sharded, no grad comms
#   LoRA weights (bf16): sharded, gradients reduced in fp32 by FSDP2
fsdp:
  dp_size: 8
  tp_size: 1
  cp_size: 1
  pp_size: 1
  activation_checkpointing: false
  cpu_offload: false
  defer_fsdp_grad_sync: true
  enable_compile: false
  enable_fsdp2_prefetch: true
  fsdp2_backward_prefetch_depth: 3
  fsdp2_forward_prefetch_depth: 2

flow_matching:
  adapter_type: "flux3"
  # DreamBooth default: weighting_scheme="none" = uniform u, no loss weighting.
  # Alternative: timestep_sampling: "logit_normal" (SD3 paper recommendation for fine-tuning).
  timestep_sampling: "uniform"
  logit_mean: 0.0
  logit_std: 1.0
  # shift=6.93 matches the FLUX.3 modular pipeline's t2i scheduler shift.
  # Dynamic shifting applies at inference per resolution; training uses the base shift.
  flow_shift: 6.93
  mix_uniform_ratio: 0.0
  sigma_min: 0.0
  sigma_max: 1.0
  num_train_timesteps: 1000
  # DreamBooth does not apply CFG dropout during training.
  # Set > 0 only if you want unconditional guidance support.
  cfg_dropout_prob: 0.0
  i2v_prob: 0.0
  use_loss_weighting: false
  log_interval: 100
  summary_log_interval: 10

step_scheduler:
  num_epochs: 1000
  local_batch_size: 1
  global_batch_size: 8
  ckpt_every_steps: 500
  log_remote_every_steps: 10
  # max_steps: null  # Set to limit training to a specific number of steps
  save_checkpoint_every_epoch: false

data:
  dataloader:
    _target_: nemo_automodel.components.datasets.diffusion.build_text_to_image_multiresolution_dataloader
    cache_dir: PATH_TO_YOUR_DATA
    train_text_encoder: false
    num_workers: 0
    base_resolution: [512, 512]
    dynamic_batch_size: false
    shuffle: true
    drop_last: false

checkpoint:
  enabled: true
  checkpoint_dir: PATH_TO_YOUR_CKPT_DIR
  # LoRA saves adapter_model.safetensors + adapter_config.json
  # (ignores model_save_format — PEFT format always used for LoRA)
  model_save_format: torch_save
  save_consolidated: false
  restore_from: null

ci:
  cluster_tag: h100
  recipe_owner: huiyingl
  time: "00:30:00"
  nodes: 1
