seed: 42

wandb:
  enable: false
  project: flux3-finetuning
  mode: online
  name: flux3_i2i_finetune_run

dist_env:
  backend: "nccl"
  init_method: "env://"
  timeout_minutes: 30

model:
  # FLUX.3 checkpoints are modular pipelines (modular_model_index.json).
  # Accept the Hugging Face repository access conditions before loading.
  # Requires a Diffusers revision with FLUX.3 modular support; see the model guide.
  pretrained_model_name_or_path: "black-forest-labs/flux-3-image-klein-base"
  mode: "finetune"
  cache_dir: null
  attention_backend: "flash"
  # Image-to-image: the image generation branch plus the clean image
  # conditioning branch (reference tokens at l = -1, timestep 0).

optimizer:
  _target_: torch.optim.AdamW
  lr: 1e-5
  weight_decay: 1e-4
  betas: [0.9, 0.999]
  foreach: false
  fused: true

performance:
  check_loss: false
  grad_clip_foreach: true

lr_scheduler:
  lr_decay_style: cosine
  lr_warmup_steps: 500
  min_lr: 0.0

# Adjust dp_size to the total number of GPUs
fsdp:
  dp_size: 8
  tp_size: 1
  cp_size: 1
  pp_size: 1
  activation_checkpointing: true
  cpu_offload: false
  defer_fsdp_grad_sync: true
  enable_compile: false
  enable_fsdp2_prefetch: true
  fsdp2_backward_prefetch_depth: 3
  fsdp2_forward_prefetch_depth: 2

flow_matching:
  adapter_type: "flux3"
  # DreamBooth default: weighting_scheme="none" = uniform u, no loss weighting.
  timestep_sampling: "uniform"
  logit_mean: 0.0
  logit_std: 1.0
  # shift=6.93 matches the FLUX.3 checkpoint's scheduler config.
  flow_shift: 6.93
  mix_uniform_ratio: 0.0
  sigma_min: 0.0
  sigma_max: 1.0
  num_train_timesteps: 1000
  cfg_dropout_prob: 0.0
  i2v_prob: 0.0
  use_loss_weighting: false
  log_interval: 100
  summary_log_interval: 10

step_scheduler:
  num_epochs: 1000
  local_batch_size: 1
  global_batch_size: 8
  ckpt_every_steps: 500
  log_remote_every_steps: 10
  # max_steps: null  # Set to limit training to a specific number of steps
  save_checkpoint_every_epoch: false

data:
  dataloader:
    _target_: nemo_automodel.components.datasets.diffusion.image_edit_dataset.ImageEditDataloaderConfig
    cache_dir: PATH_TO_YOUR_DATA
    # FLUX.3 pixel dims must be divisible by 16 (VAE /8 + 2x2 patchify).
    quantization: 16
    base_resolution: [512, 512]
    num_workers: 2
    dynamic_batch_size: false
    shuffle: true
    drop_last: false

checkpoint:
  enabled: true
  checkpoint_dir: PATH_TO_YOUR_CKPT_DIR
  model_save_format: safetensors
  save_consolidated: final
  diffusers_compatible: true
  restore_from: null

ci:
  cluster_tag: h100
  recipe_owner: huiyingl
  time: "00:30:00"
  nodes: 1
