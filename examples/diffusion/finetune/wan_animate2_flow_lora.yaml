seed: 42

wandb:
  enable: false
  project: wan-animate2-flow-matching
  mode: online
  name: wan_animate2_lora

dist_env:
  backend: nccl
  timeout_minutes: 30

model:
  pretrained_model_name_or_path: "Wan-AI/Wan2.2-Animate-2-14B-Diffusers"
  mode: finetune
  model_type: "wan_animate2"
  # PEFT uses bfloat16 storage and compute.
  torch_dtype: bfloat16
  compute_dtype: bfloat16

peft:
  _target_: nemo_automodel.components._peft.lora.PeftConfig
  dim: 64
  alpha: 64
  dropout: 0.0
  # Use the standard autograd path for checkpointed two-stream training.
  use_memory_efficient_lora: false
  # Train the self-attention query, key, and value projections.
  target_modules:
    - "*.self_attn.to_q"
    - "*.self_attn.to_k"
    - "*.self_attn.to_v"

step_scheduler:
  global_batch_size: 8
  local_batch_size: 1  # validated recipe shape
  ckpt_every_steps: 1000
  num_epochs: 100
  log_remote_every_steps: 2
  save_checkpoint_every_epoch: false

data:
  dataloader:
    _target_: nemo_automodel.components.datasets.diffusion.collate_fns.TextToVideoDataloaderConfig
    cache_dir: PATH_TO_YOUR_WAN_ANIMATE2_CACHE
    model_type: wan_animate2
    base_resolution: [512, 512]
    dynamic_batch_size: false
    shuffle: true
    drop_last: false
    num_workers: 2

optimizer:
  _target_: torch.optim.AdamW
  lr: 5e-5
  weight_decay: 0.01
  betas: [0.9, 0.999]
  # Keep the optimizer path used by the validated recipe.
  foreach: false

performance:
  check_loss: false
  grad_clip_foreach: true

lr_scheduler:
  lr_decay_style: cosine
  lr_warmup_steps: 0
  min_lr: 1e-6

flow_matching:
  adapter_type: "wan_animate2"
  adapter_kwargs: {}
  timestep_sampling: "uniform_discrete"
  use_sigma_noise: true
  flow_shift: 5.0
  sigma_min: 0.0
  sigma_max: 1.0
  num_train_timesteps: 1000
  i2v_prob: 0.0
  cfg_dropout_prob: 0.0
  use_loss_weighting: true
  loss_weighting_scheme: "bsmntw_shifted"
  log_interval: 100
  summary_log_interval: 10

fsdp:
  dp_size: 8
  dp_replicate_size: 1
  tp_size: 1  # not supported by this model
  cp_size: 1  # not supported by this model
  pp_size: 1
  activation_checkpointing: true
  defer_fsdp_grad_sync: true
  enable_fsdp2_prefetch: true
  fsdp2_backward_prefetch_depth: 2
  fsdp2_forward_prefetch_depth: 1

checkpoint:
  enabled: true
  checkpoint_dir: PATH_TO_YOUR_CKPT_DIR
  model_save_format: safetensors
  save_consolidated: false
  restore_from: null

ci:
  recipe_owner: zezhou
  time: "01:30:00"
  nodes: 1
