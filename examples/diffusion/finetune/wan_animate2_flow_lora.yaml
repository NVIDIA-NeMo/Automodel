seed: 42

wandb:
  enable: false
  project: wan-animate2-flow-matching
  mode: online
  name: wan_animate2_lora

dist_env:
  backend: nccl
  timeout_minutes: 30

model:
  pretrained_model_name_or_path: "Wan-AI/Wan2.2-Animate-2-14B-Diffusers"
  mode: finetune
  model_type: "wan_animate2"
  # Storage and compute dtypes must match for PEFT: split dtypes require FSDP
  # full-parameter training so FSDP can cast gathered parameters. The block-level
  # `e.dtype == torch.float32` assertion still holds because the transformer
  # computes the modulation tensor under its own inner float32 autocast, and
  # WanAnimate2ParallelizationStrategy disables cast_forward_inputs so FSDP2 does
  # not downcast it on the way into each block.
  torch_dtype: bfloat16
  compute_dtype: bfloat16

peft:
  _target_: nemo_automodel.components._peft.lora.PeftConfig
  dim: 64
  alpha: 64
  dropout: 0.0
  # The memory-efficient path routes through a custom autograd Function that
  # assumes the saved activation and the adapter factors share a dtype. This
  # transformer hands its projections float32 modulation output while the
  # adapters stay in the model dtype, so use the plain module path, whose
  # backward autograd generates and which handles the cast itself.
  use_memory_efficient_lora: false
  # The three self-attention input projections, matching the reference training
  # recipe. The output projection is deliberately excluded: upstream trains only
  # q, k, and v, for both LoRA and full fine-tuning.
  target_modules:
    - "*.self_attn.q"
    - "*.self_attn.k"
    - "*.self_attn.v"

step_scheduler:
  global_batch_size: 8
  local_batch_size: 1  # must stay 1; the reference pass cannot pack more than one sample
  ckpt_every_steps: 1000
  num_epochs: 100
  log_remote_every_steps: 2
  save_checkpoint_every_epoch: false

data:
  dataloader:
    _target_: nemo_automodel.components.datasets.diffusion.collate_fns.TextToVideoDataloaderConfig
    cache_dir: PATH_TO_YOUR_WAN_ANIMATE2_CACHE
    model_type: wan_animate2
    base_resolution: [512, 512]
    dynamic_batch_size: false
    shuffle: true
    drop_last: false
    num_workers: 2

optimizer:
  _target_: torch.optim.AdamW
  lr: 5e-5
  weight_decay: 0.01
  betas: [0.9, 0.999]
  # Multi-tensor AdamW is 2.1x SLOWER here, not faster: it raises mean step time
  # from 1.280s to 2.687s, step-time variance from 6.9% to 37.5%, and introduces
  # a 28% upward drift over 130 steps that a fixed cost cannot explain. Measured
  # A/B on one node at 256p/17f.
  foreach: false

performance:
  check_loss: false
  grad_clip_foreach: true

lr_scheduler:
  lr_decay_style: cosine
  lr_warmup_steps: 0
  min_lr: 1e-6

flow_matching:
  adapter_type: "wan_animate2"
  adapter_kwargs: {}
  timestep_sampling: "uniform"
  use_sigma_noise: true
  flow_shift: 5.0
  sigma_min: 0.0
  sigma_max: 1.0
  num_train_timesteps: 1000
  i2v_prob: 0.0
  cfg_dropout_prob: 0.0
  use_loss_weighting: true
  log_interval: 100
  summary_log_interval: 10

fsdp:
  dp_size: 8
  dp_replicate_size: 1
  tp_size: 1  # not supported by this model
  cp_size: 1  # not supported by this model
  pp_size: 1
  activation_checkpointing: true
  defer_fsdp_grad_sync: true
  enable_fsdp2_prefetch: true
  fsdp2_backward_prefetch_depth: 2
  fsdp2_forward_prefetch_depth: 1

checkpoint:
  enabled: true
  checkpoint_dir: PATH_TO_YOUR_CKPT_DIR
  model_save_format: safetensors
  save_consolidated: false
  restore_from: null

ci:
  recipe_owner: zezhou
  time: "01:30:00"
  nodes: 1
