# HunyuanImage-3.0 text-to-image full finetune (80B-total / 13B-active MoE).
#
# The MoE backbone is Automodel's own implementation, sharded with expert parallelism + FSDP2. The image-side modules (VAE, UNet
# patch embedding / final layer, timestep embedders) are loaded from the checkpoint's own remote code.
#
# Preprocess images into a latent + token-conditioning cache first:
#   python -m tools.diffusion.preprocessing_multiprocess image \
#       --dataset_name lambdalabs/naruto-blip-captions \
#       --dataset_media_column image --dataset_caption_column text \
#       --output_dir PATH_TO_YOUR_DATA --processor hunyuan_image3 \
#       --model_name tencent/HunyuanImage-3.0 --resolution_preset 1024p
#
# Generate with examples/diffusion/generate/generate_hunyuan_image3.py.

seed: 42

model:
  pretrained_model_name_or_path: tencent/HunyuanImage-3.0
  model_type: hunyuan_image3
  mode: finetune
  config_overrides:
    # Latents are precomputed; the VAE and vision tower are not needed for training.
    include_vae_and_vision: false
  backend:
    attn: sdpa
    linear: torch
    rms_norm: torch
    experts: torch
    dispatcher: torch
    gate_precision: float32
    enable_hf_state_dict_adapter: true


optimizer:
  _target_: transformer_engine.pytorch.optimizers.fused_adam.FusedAdam
  lr: 1.0e-5
  weight_decay: 0.01
  betas: [0.9, 0.999]
  master_weights: true
  store_param_remainders: true
  exp_avg_dtype: float32
  exp_avg_sq_dtype: float32
  adam_w_mode: true
  bias_correction: true

lr_scheduler:
  lr_decay_style: cosine
  lr_warmup_steps: 0
  min_lr: 1.0e-6

# 4 nodes x 8 GPUs, two experts per GPU; adjust dp_size/ep_size to the number of GPUs.
fsdp:
  dp_size: 32
  ep_size: 32
  tp_size: 1
  cp_size: 1
  pp_size: 1
  activation_checkpointing: true

flow_matching:
  adapter_type: hunyuan_image3
  adapter_kwargs: {}
  timestep_sampling: logit_normal
  logit_mean: 0.0
  logit_std: 1.0
  # The release samples with an SD3-style time shift of 3.0.
  flow_shift: 3.0
  mix_uniform_ratio: 0.0
  sigma_min: 0.0
  sigma_max: 1.0
  num_train_timesteps: 1000
  i2v_prob: 0.0
  # Probability of training on the unconditional (classifier-free guidance) sequence.
  cfg_dropout_prob: 0.0
  use_loss_weighting: false
  log_interval: 100
  summary_log_interval: 10

step_scheduler:
  num_epochs: 100
  max_steps: 600
  local_batch_size: 1
  global_batch_size: 32
  ckpt_every_steps: 300
  save_checkpoint_every_epoch: false
  log_remote_every_steps: 1

data:
  dataloader:
    _target_: nemo_automodel.components.datasets.diffusion.build_text_to_image_multiresolution_dataloader
    cache_dir: PATH_TO_YOUR_DATA
    train_text_encoder: false
    num_workers: 2
    base_resolution: [1024, 1024]
    dynamic_batch_size: false
    shuffle: true
    drop_last: false

checkpoint:
  enabled: true
  checkpoint_dir: PATH_TO_YOUR_CKPT_DIR
  model_save_format: safetensors
  save_consolidated: true
  restore_from: null

ci:
  recipe_owner: HuiyingLi
  time: "01:00:00"
  nodes: 4
