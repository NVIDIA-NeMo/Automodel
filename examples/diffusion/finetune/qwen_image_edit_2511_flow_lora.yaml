# Single-GPU, low-resolution starting configuration. See the QIE2511 model guide
# for cache preparation, checkpoint restore, and native adapter generation.
seed: 42

model:
  pretrained_model_name_or_path: "Qwen/Qwen-Image-Edit-2511"
  mode: "finetune"
  model_type: "qwen_image_edit"
  cache_dir: null
  torch_dtype: bfloat16
  compute_dtype: bfloat16
  attention_backend: "native"
  transformer_engine_linear: false
  transformer_engine_fp8: false
  fuse_qkv_projections: false

peft:
  _target_: nemo_automodel.components._peft.lora.PeftConfig
  dim: 8
  alpha: 8
  dropout: 0.0
  lora_dtype: bfloat16
  target_modules:
    - "*.attn.to_q"
    - "*.attn.to_k"
    - "*.attn.to_v"
    - "*.attn.to_out.0"
    - "*.attn.add_q_proj"
    - "*.attn.add_k_proj"
    - "*.attn.add_v_proj"
    - "*.attn.to_add_out"

optimizer:
  _target_: torch.optim.AdamW
  lr: 1e-5
  weight_decay: 0.01
  betas: [0.9, 0.999]
  foreach: false
  fused: true

lr_scheduler:
  lr_decay_style: cosine
  lr_warmup_steps: 0
  min_lr: 1e-6

clip_grad_norm:
  max_norm: 1.0

# One process, without FSDP or training offload. Launch with --nproc-per-node=1.
ddp:
  backend: "nccl"
  activation_checkpointing: true
  find_unused_parameters: true

flow_matching:
  adapter_type: "qwen_image_edit"
  timestep_sampling: "beta"
  beta_alpha: 2.5
  beta_beta: 1.5
  sigma_min: 0.0
  sigma_max: 1.0
  num_train_timesteps: 1000
  i2v_prob: 0.0
  cfg_dropout_prob: 0.0
  use_loss_weighting: false
  log_interval: 10
  summary_log_interval: 10

step_scheduler:
  num_epochs: null
  max_steps: 1000
  local_batch_size: 1
  global_batch_size: 1
  ckpt_every_steps: 100
  save_checkpoint_every_epoch: false
  log_remote_every_steps: 10

data:
  dataloader:
    _target_: nemo_automodel.components.datasets.diffusion.image_edit_dataset.ImageEditDataloaderConfig
    cache_dir: PATH_TO_YOUR_QWEN_IMAGE_EDIT_CACHE
    quantization: 64
    base_resolution: [256, 256]
    dynamic_batch_size: false
    num_workers: 0
    prefetch_factor: 2
    pin_memory: true
    shuffle: true
    drop_last: false
    seed: 42

checkpoint:
  enabled: true
  checkpoint_dir: PATH_TO_YOUR_CKPT_DIR
  model_save_format: safetensors
  save_consolidated: false
  diffusers_compatible: false
  is_async: false
  restore_from: null

performance:
  check_loss: true
  grad_clip_foreach: false

wandb: null

dist_env:
  backend: "nccl"
  init_method: "env://"
  timeout_minutes: 120

ci:
  cluster_tag: h100
  recipe_owner: Alizestl
  time: "00:30:00"
  nodes: 1
  nproc_per_node: 1
  max_steps: 20
