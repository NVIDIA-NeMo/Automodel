# HunyuanImage-3.0 (80B total / 13B active MoE) text-to-image LoRA fine-tuning.
#
# Single node, 8 GPUs: experts are sharded 8 ways (ep_size: 8), everything else with FSDP2.
#
# 1. Preprocess images and captions (latents from the release VAE, prompt tokens from the release tokenizer,
#    images snapped to the release's 33 resolutions around 1024x1024):
#      uv run python tools/diffusion/preprocessing_multiprocess.py image \
#        --image_dir PATH_TO_IMAGES --output_dir PATH_TO_YOUR_DATA \
#        --processor hunyuan_image3 --model_name tencent/HunyuanImage-3.0 --resolution_preset 1024p
# 2. Train:
#      uv run torchrun --nproc-per-node 8 examples/diffusion/finetune/finetune.py \
#        -c examples/diffusion/finetune/hunyuan_image3_t2i_flow_lora.yaml

seed: 42

wandb:
  enable: false
  project: hunyuan-image3-lora-finetuning
  mode: online
  name: hunyuan_image3_lora

dist_env:
  backend: "nccl"
  init_method: "env://"
  timeout_minutes: 30

model:
  pretrained_model_name_or_path: "tencent/HunyuanImage-3.0"
  model_type: "hunyuan_image3"
  mode: "finetune"
  cache_dir: null
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: sdpa
    linear: torch
    rms_norm: torch
    rope_fusion: false
    experts: torch_mm
    dispatcher: torch
    gate_precision: float32
    enable_hf_state_dict_adapter: true

peft:
  _target_: nemo_automodel.components._peft.lora.PeftConfig
  dim: 64
  alpha: 64
  dropout: 0.0
  target_modules:
    - "*.self_attn.qkv_proj"
    - "*.self_attn.o_proj"
    - "*.shared_mlp.gate_and_up_proj"
    - "*.shared_mlp.down_proj"

optimizer:
  _target_: transformer_engine.pytorch.optimizers.fused_adam.FusedAdam
  lr: 1e-4
  weight_decay: 0.01
  betas: [0.9, 0.999]
  # bf16 params + 16-bit remainders give fp32-precision master weights.
  master_weights: true
  store_param_remainders: true
  exp_avg_dtype: float32
  exp_avg_sq_dtype: float32
  adam_w_mode: true
  bias_correction: true

lr_scheduler:
  lr_decay_style: cosine
  lr_warmup_steps: 20
  min_lr: 1e-6

fsdp:
  tp_size: 1
  cp_size: 1
  pp_size: 1
  dp_replicate_size: 1
  ep_size: 8
  activation_checkpointing: true
  reduce_dtype: float32

flow_matching:
  adapter_type: "hunyuan_image3"
  timestep_sampling: "logit_normal"
  logit_mean: 0.0
  logit_std: 1.0
  # The release samples with flow_shift 3.0.
  flow_shift: 3.0
  mix_uniform_ratio: 0.0
  sigma_min: 0.0
  sigma_max: 1.0
  num_train_timesteps: 1000
  cfg_dropout_prob: 0.1
  use_loss_weighting: false
  log_interval: 100
  summary_log_interval: 10

step_scheduler:
  num_epochs: 10
  local_batch_size: 1
  global_batch_size: 8
  ckpt_every_steps: 200
  save_checkpoint_every_epoch: false
  log_remote_every_steps: 1

data:
  dataloader:
    _target_: nemo_automodel.components.datasets.diffusion.build_text_to_image_multiresolution_dataloader
    cache_dir: PATH_TO_YOUR_DATA
    train_text_encoder: false
    num_workers: 2
    base_resolution: [1024, 1024]
    dynamic_batch_size: false
    shuffle: true
    drop_last: false

checkpoint:
  enabled: true
  checkpoint_dir: PATH_TO_YOUR_CKPT_DIR
  model_save_format: safetensors
  save_consolidated: false
  restore_from: null

ci:
  recipe_owner: khazic
  time: "01:00:00"
  nodes: 1
