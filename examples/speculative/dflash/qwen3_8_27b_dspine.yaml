# DSpine draft training for Qwen3.8-27B (online target hidden-state capture).
#
# Qwen/Qwen3.8-27B ships as `Qwen3_5ForConditionalGeneration` (model_type qwen3_5),
# so its decoder hyper-parameters live on a nested `text_config`; the recipe unwraps
# that automatically. The draft itself is a plain, causal Qwen3-shaped stack.
#
# The settings below reproduce the released tencent/Qwen3.8-27B-DSpine-b16 drafter:
# block size 16, five layers on target layers [1, 16, 31, 46, 61], a draft
# attention sized independently of the target (32 heads / 8 kv / head_dim 128
# against the target's 24 / 4 / 256), and an 8192-token sliding window over the
# context. The saved draft loads into SGLang with
# ``--speculative-algorithm DSPINE`` (https://github.com/Tencent/DSpine).
#
# IMPORTANT: regenerate the training responses with the target model before
# training -- training uses teacher forcing on ground-truth tokens while
# inference is autoregressive, and the distribution mismatch hurts acceptance
# length otherwise.

recipe: TrainDSpineRecipe

dist_env:
  backend: nccl
  timeout_minutes: 30

# The 27B target is frozen (no gradients, no optimizer state); tp_size shards its
# weights across the two ranks. The draft stays DDP-replicated on both.
# Context parallelism is not supported together with tensor parallelism here.
distributed:
  strategy: fsdp2
  tp_size: 2

recipe_args:
  target_model_name_or_path: Qwen/Qwen3.8-27B
  train_data_path: /path/to/perfectblend_qwen3.8-27b_regen.jsonl   # regenerate with the target first
  val_data_path: null
  output_dir: ./outputs/dspine_qwen3_8_27b
  seq_length: 3072
  micro_batch_size: 1
  grad_accumulation_steps: 8
  num_workers: 4
  num_epochs: 6

  # --- DFlash backbone ---
  draft_num_hidden_layers: 5
  block_size: 16
  num_anchors: 512
  loss_decay_gamma: 7.0
  mask_token_id: 248070               # reserved token, matching the released drafter
  target_layer_ids: [1, 16, 31, 46, 61]
  attention_backend: flex_attention
  draft_sliding_window: 8192          # the released drafter's sliding_attention window

  # --- draft attention shape (omit to inherit the target's) ---
  draft_num_attention_heads: 32
  draft_num_key_value_heads: 8
  draft_head_dim: 128

  # --- DSpine adjacent causal injection, objective, and curriculum ---
  code_size: 1024
  message_size: 512
  refine_top_k: 16
  distribution_ce_weight: 0.1
  alignment_weight: 0.5
  candidate_mass_threshold: 1.0e-4
  teacher_forcing_layers: 3
  teacher_forcing_probability: 0.5
  teacher_forcing_hold_fraction: 0.16666666666666666
  teacher_forcing_zero_fraction: 0.3333333333333333
  objective_chunk_blocks: 64          # the 248k-token vocabulary makes each objective chunk large

  trust_remote_code: false
  shuffle_seed: 42
  log_every_steps: 10
  max_grad_norm: 1.0

optimizer:
  lr: 6.0e-4
  betas: [0.9, 0.95]
  weight_decay: 0.0
  warmup_ratio: 0.04
  min_lr_ratio: 0.0

checkpoint:
  enabled: true
  checkpoint_dir: ./outputs/dspine_qwen3_8_27b/checkpoints
  model_save_format: safetensors
  save_consolidated: true

ci:
  cluster_tag: h100
