# Single-device cache smoke for the Qwen3.5-4B MMFlash image objective.
# See README-mmflash.md for cache generation, the DFlash control, and decoding.
recipe: TrainDFlashRecipe

dist_env:
  backend: nccl
  timeout_minutes: 30

recipe_args:
  target_model_name_or_path: /path/to/Qwen3.5-4B
  target_embedding_key: model.language_model.embed_tokens.weight
  train_cache_path: /path/to/train-cache
  val_cache_path: /path/to/val-cache
  output_dir: ./outputs/qwen3_5_4b_mmflash
  seq_length: 1024
  micro_batch_size: 1
  grad_accumulation_steps: 1
  num_workers: 0
  num_epochs: 1
  draft_num_hidden_layers: 5
  draft_num_attention_heads: 32
  draft_num_key_value_heads: 8
  draft_head_dim: 128
  draft_intermediate_size: 9728
  block_size: 16
  target_layer_ids: [1, 8, 15, 22, 29]
  mask_token_id: 248070
  num_anchors: 32
  attention_backend: sdpa
  loss_type: mmflash
  mmflash_smoothing: 0.5
  visual_alpha: 1.0
  shuffle_seed: 42
  log_every_steps: 1
  max_grad_norm: 1.0

optimizer:
  lr: 6.0e-4
  betas: [0.9, 0.95]
  weight_decay: 0.0
  warmup_ratio: 0.04

checkpoint:
  enabled: true
  model_save_format: safetensors
  save_consolidated: true

ci:
  nemo_ci_schedule: skipped
  cluster_tag: h100
