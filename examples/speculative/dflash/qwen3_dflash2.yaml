# DFlash 2 draft training for a Qwen3 target (online target hidden-state capture).
#
# DFlash 2 (https://inco.ai/blog/dflash2/) keeps DFlash's one-pass parallel block
# draft and adds two cheap modules on top of it:
#   * a two-tap dynamic depthwise convolution before and after each attention and
#     MLP sublayer, which takes over the short-range within-block work and removes
#     most of DFlash's suffix decay (~3% extra draft parameters);
#   * a pairwise path selector that keeps each position's top-k candidates and
#     walks one coherent path through them instead of committing every position's
#     top-1 pick independently (~2M extra parameters).
# Training adds one term for the selector on top of the DFlash block CE:
#   loss = base_loss + selector_loss_weight * selector_loss
#
# IMPORTANT: regenerate the training responses with the target model before
# training -- training uses teacher forcing on ground-truth tokens while
# inference is autoregressive, and the distribution mismatch hurts acceptance
# length otherwise.

recipe: TrainDFlash2Recipe

dist_env:
  backend: nccl
  timeout_minutes: 30

recipe_args:
  target_model_name_or_path: Qwen/Qwen3-8B
  train_data_path: /path/to/perfectblend_qwen3-8b_regen.jsonl   # regenerate responses with the target model first
  val_data_path: null
  output_dir: ./outputs/dflash2_qwen3_8b
  seq_length: 3072
  micro_batch_size: 2
  grad_accumulation_steps: 1
  num_workers: 4
  num_epochs: 6

  # --- DFlash backbone (shared with the DFlash recipe) ---
  draft_num_hidden_layers: 5          # depth of the draft transformer stack
  block_size: 16                      # tokens drafted in parallel per block
  num_anchors: 256                    # blocks sampled per sequence per step
  loss_decay_gamma: 7.0               # block-position loss decay: exp(-k/gamma)
  # loss_type: dflash                 # "dflash" (fixed decay) or a D-PACE variant ("dpace",
  #                                   # "dpace-cumulative-confidence-only", "dpace-continuation-value-only":
  #                                   # same block, both loss terms reweighted by the draft's own
  #                                   # confidence). "variable_prefix" is rejected -- the selector
  #                                   # teacher-forces the predecessor from the fixed-anchor block layout.
  # dpace_alpha: 0.5                  # smoothing alpha for the D-PACE confidence products
  mask_token_id: 151669               # REQUIRED: token used for non-anchor block positions.
  #                                   # Pick a reserved / unused token id (do NOT rely on pad:
  #                                   # pad often aliases eos, which silently degrades quality).
  # target_layer_ids: [1, 9, 17, 25, 33]   # target layers captured as draft context
  attention_backend: flex_attention   # "flex_attention" (GPU main path) or "sdpa" (portable fallback)

  # --- DFlash 2 in-block convolution ---
  conv_kernel_size: 2                 # taps: the position itself and its predecessor
  conv_group_size: 16                 # channels sharing one dynamic tap correction

  # --- DFlash 2 path selector ---
  selector_rank: 256                  # width of the A / B token codebooks and the context gate
  selector_top_k: 16                  # candidates kept and scored per draft position
  selector_loss_weight: 1.0           # weight of the candidate-selection CE added to the block CE

  trust_remote_code: false
  # target_attn_implementation: sdpa   # frozen target's attention backend (unset = HF auto-select)
  shuffle_seed: 42
  log_every_steps: 10
  max_grad_norm: 1.0
  # mask_reasoning_content: true   # exclude <think>...</think> reasoning traces from loss

  # --- checkpoint cadence (independent; the fully-trained model is always saved) ---
  # ckpt_every_steps: 2000            # also save every N optimizer steps
  # save_checkpoint_every_epoch: false

optimizer:
  lr: 6.0e-4
  betas: [0.9, 0.95]
  weight_decay: 0.0
  warmup_ratio: 0.04
  min_lr_ratio: 0.1

checkpoint:
  enabled: true
  checkpoint_dir: ./outputs/dflash2_qwen3_8b/checkpoints
  model_save_format: safetensors
  save_consolidated: true
  # restore_from: LATEST  # "LATEST", a subdir like "epoch_1_step_1000", or an absolute path

