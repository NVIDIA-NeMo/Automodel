# DSpine draft training for a Qwen3 target (online target hidden-state capture).
#
# DSpine (Tencent, https://github.com/Tencent/DSpine; "Draft in Parallel,
# Condition Through Depth: Adjacent Causal Injection for Speculative Decoding")
# keeps DFlash's one-pass parallel block draft and changes two things:
#   * in-block attention is causal, and
#   * after every draft layer each position receives a gated, low-rank message
#     built from its predecessor's code (the anchor token's fixed codebook code
#     for the first position), so the left-to-right dependency unfolds over the
#     draft's depth while every position is still drafted in parallel.
# Decoding rescores each position's top-k candidates by redoing the last write
# with the exact previously chosen token (exact-sender refinement).
#
# The objective (SpecForge #1038) mixes CE with an L1 distance to the target's
# distribution for the backbone and for the refined candidates, plus a code
# alignment term; it reports the refined path as accuracy / accept_len and the
# backbone's own picks as base_accuracy / base_accept_len.
#
# The saved draft loads directly into SGLang with
# ``--speculative-algorithm DSPINE`` (https://github.com/Tencent/DSpine).
#
# IMPORTANT: regenerate the training responses with the target model before
# training -- training uses teacher forcing on ground-truth tokens while
# inference is autoregressive, and the distribution mismatch hurts acceptance
# length otherwise.

recipe: TrainDSpineRecipe

dist_env:
  backend: nccl
  timeout_minutes: 30

recipe_args:
  target_model_name_or_path: Qwen/Qwen3-8B
  train_data_path: /path/to/sharegpt_qwen3-8b_regen.jsonl   # regenerate responses with the target model first
  val_data_path: null
  output_dir: ./outputs/dspine_qwen3_8b
  seq_length: 3072
  micro_batch_size: 2
  grad_accumulation_steps: 1
  num_workers: 4
  num_epochs: 6

  # --- DFlash backbone (shared with the DFlash recipe) ---
  draft_num_hidden_layers: 5          # depth of the draft transformer stack
  block_size: 16                      # tokens drafted in parallel per block
  num_anchors: 512                    # blocks sampled per sequence per step
  loss_decay_gamma: 7.0               # block-position loss decay: exp(-(k-1)/gamma)
  mask_token_id: 151669               # REQUIRED: token used for non-anchor block positions.
  #                                   # Pick a reserved / unused token id (do NOT rely on pad:
  #                                   # pad often aliases eos, which silently degrades quality).
  # target_layer_ids: [1, 9, 17, 25, 33]   # target layers captured as draft context
  attention_backend: flex_attention   # "flex_attention" (GPU main path) or "sdpa" (portable fallback)

  # --- DSpine adjacent causal injection ---
  code_size: 1024                     # C: width of the fixed token codebook and the per-layer readouts
  message_size: 512                   # R: width of the gated predecessor message
  refine_top_k: 16                    # candidates rescored by the exact-sender refinement (power of 2, <= 64)

  # --- DSpine objective ---
  distribution_ce_weight: 0.1         # alpha: CE weight; the remaining 1 - alpha goes to the L1-to-target term
  alignment_weight: 0.5               # beta: weight of the code alignment term
  # alignment_warmup_steps: null      # beta ramps from 0 over this many steps (unset = the LR warmup)
  candidate_mass_threshold: 1.0e-4    # refinement L1 only where the target's mass on the candidates exceeds this
  teacher_forcing_layers: 3           # early layers whose predecessor codes the curriculum may teacher-force
  teacher_forcing_probability: 0.5    # per-block teacher-forcing probability at the start of training...
  teacher_forcing_hold_fraction: 0.16666666666666666  # ...held for this fraction of training...
  teacher_forcing_zero_fraction: 0.3333333333333333   # ...then decayed linearly to 0 by this fraction
  # objective_chunk_blocks: 128       # draft blocks per checkpointed full-vocabulary objective chunk

  trust_remote_code: false
  # target_attn_implementation: sdpa   # frozen target's attention backend (unset = HF auto-select)
  shuffle_seed: 42
  log_every_steps: 10
  max_grad_norm: 1.0
  # mask_reasoning_content: true   # exclude <think>...</think> reasoning traces from loss

  # --- checkpoint cadence (independent; the fully-trained model is always saved) ---
  # ckpt_every_steps: 2000            # also save every N optimizer steps
  # save_checkpoint_every_epoch: false

optimizer:
  lr: 6.0e-4
  betas: [0.9, 0.95]
  weight_decay: 0.0
  warmup_ratio: 0.04
  min_lr_ratio: 0.0                 # cosine decay to 0, as in the paper

checkpoint:
  enabled: true
  checkpoint_dir: ./outputs/dspine_qwen3_8b/checkpoints
  model_save_format: safetensors
  save_consolidated: true
  # restore_from: LATEST  # "LATEST", a subdir like "epoch_1_step_1000", or an absolute path

# wandb:
#   project: dspine
#   entity: my-team
#   name: qwen3-8b-dspine

ci:
  cluster_tag: h100
