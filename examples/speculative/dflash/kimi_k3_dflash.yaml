# DFlash draft training against the text backbone of a frozen Kimi K3 target.
#
# The target's 896 routed experts are sharded with expert parallelism. The
# trainable draft is a small dense K3 MLA stack: it keeps Q-LoRA, the compressed
# KV latent, output gating, fp32-variance RMSNorm, and the SiTU MLP, while KDA
# linear attention, routed and shared experts, MTP, and the attention-residual
# mixer stay in the target only.
#
# Two settings are load-bearing and differ from the Qwen3 DFlash configs:
#   * attention_backend must be sdpa. K3's MLA consumes a dense additive mask;
#     there is no FlexAttention path for this draft.
#   * pp_size must be 1. Online hidden-state capture hooks one complete,
#     non-pipelined target forward; use a larger ep_size to shard memory instead.
#
# Run the same command on every node, varying only --node-rank:
#   torchrun --nnodes=8 --node-rank=<RANK> --nproc_per_node=8 --master-addr=<NODE0_IP> --master-port=29500 -m nemo_automodel.recipes.llm.train_dflash -c examples/speculative/dflash/kimi_k3_dflash.yaml

recipe: TrainDFlashRecipe

dist_env:
  backend: nccl
  timeout_minutes: 120

wandb:
  enable: false
  project: kimi-k3-dflash
  tags: [dflash, kimi-k3, mla, hybridep]

distributed:
  strategy: fsdp2
  tp_size: 1
  cp_size: 1
  pp_size: 1
  ep_size: 64
  activation_checkpointing: false
  moe:
    reshard_after_forward: true
    wrap_outer_model: false

recipe_args:
  target_model_name_or_path: moonshotai/Kimi-K3
  # Or a local checkout of the same checkpoint:
  # target_model_name_or_path: /path/to/Kimi-K3
  train_data_path: /path/to/open-perfectblend-direct-clean   # <-- messages-format SFT data
  val_data_path: null
  output_dir: ./outputs/dflash_kimi_k3_perfectblend
  seq_length: 4096
  micro_batch_size: 1
  grad_accumulation_steps: 8
  num_workers: 2
  num_epochs: 10
  ckpt_every_steps: 500
  save_checkpoint_every_epoch: true

  # --- DFlash-specific ---
  draft_num_hidden_layers: 3
  block_size: 16
  # The draft attends over a dense [1, 1, num_anchors * block_size,
  # seq_length + num_anchors * block_size] mask, so anchors cost quadratically
  # more here than on the Qwen3 configs' sparse FlexAttention path. Raise it only
  # with the attention memory in mind.
  num_anchors: 128
  loss_decay_gamma: 7.0
  mask_token_id: 163605               # REQUIRED reserved token for non-anchor block positions
  target_layer_ids: [90, 91, 92]
  attention_backend: sdpa

  # Frozen-target backend knobs; these repeat build_kimi_k3_dflash_target_kwargs'
  # defaults and are spelled out here because they are the fields most often
  # retuned per cluster.
  target_dispatcher: hybridep
  target_experts: torch_mm
  target_enable_fsdp_optimizations: true

  trust_remote_code: false
  shuffle_seed: 42
  log_every_steps: 10
  max_grad_norm: 1.0

optimizer:
  lr: 1.0e-4
  betas: [0.9, 0.95]
  weight_decay: 0.0
  warmup_ratio: 0.04
  min_lr_ratio: 0.1

checkpoint:
  enabled: true
  checkpoint_dir: ./outputs/dflash_kimi_k3_perfectblend/checkpoints
  model_save_format: safetensors
  save_consolidated: final
  dequantize_base_checkpoint: true
