# Remote (train-inference disaggregated) DSpark training for a Qwen3-0.6B target:
# the frozen target runs in its own server process and this run holds only the
# draft. Both processes read this file. Start the server, then training:
#
#   CUDA_VISIBLE_DEVICES=0 python -m nemo_automodel.recipes.speculative_decoding.serve_dspark_target \
#     -c examples/speculative/dspark/qwen3_0.6b_dspark_remote.yaml
#
#   CUDA_VISIBLE_DEVICES=1 torchrun --nproc_per_node=1 -m nemo_automodel.recipes.speculative_decoding.train_dspark \
#     -c examples/speculative/dspark/qwen3_0.6b_dspark_remote.yaml
#
# See "Target Backends" in examples/speculative/README.md for what the remote
# backend checks and supports. Otherwise identical to qwen3_0.6b_dspark.yaml.

recipe: TrainDSparkRecipe

dist_env:
  backend: nccl
  timeout_minutes: 30

distributed:
  strategy: fsdp2            # fsdp2 (default, shards the draft per block) | ddp
  defer_fsdp_grad_sync: true

# Read by serve_dspark_target only.
target_server:
  host: 0.0.0.0              # bind address; 0.0.0.0 accepts clients from other nodes
  port: 8001                 # HTTP control plane

recipe_args:
  target_model_name_or_path: Qwen/Qwen3-0.6B

  # --- remote target backend ---
  target_model_backend: remote        # colocated (default) | remote
  remote_urls: ["http://127.0.0.1:8001"]  # one URL per serve_dspark_target server, used round-robin
  # remote_timeout: 120               # per-request HTTP timeout in seconds
  # remote_max_retries: 3             # retries on connection errors (wire data plane only)

  train_data_path: /path/to/perfectblend_qwen3-0.6b_regen.jsonl   # regenerate responses with the target first
  val_data_path: null
  output_dir: ./outputs/dspark_qwen3_0.6b_remote
  seq_length: 4096
  micro_batch_size: 1
  grad_accumulation_steps: 8
  num_workers: 4
  num_epochs: 10

  # --- draft backbone (parallel) ---
  draft_num_hidden_layers: 5
  block_size: 7
  num_anchors: 512
  mask_token_id: 151669
  target_layer_ids: [1, 7, 14, 21, 26]  # the server captures these; the trainer checks they match
  freeze_embeddings: true             # the draft's embed_tokens and lm_head are fetched from the server
  attention_backend: flex_attention

  # --- serial Markov head (semi-autoregressive) ---
  markov_rank: 256
  markov_head_type: vanilla

  # --- confidence head (scheduled verification) ---
  confidence_head_alpha: 1.0
  confidence_head_with_markov: true

  # --- objective: L = ce_alpha * L_ce + l1_alpha * L_tv + conf_alpha * L_conf ---
  ce_loss_alpha: 0.1
  l1_loss_alpha: 0.9
  loss_decay_gamma: 4.0

  trust_remote_code: false
  shuffle_seed: 42
  log_every_steps: 10
  max_grad_norm: 1.0

optimizer:
  lr: 6.0e-4
  betas: [0.9, 0.95]
  weight_decay: 0.0
  warmup_ratio: 0.04
  min_lr_ratio: 0.1

checkpoint:
  enabled: true
  checkpoint_dir: ./outputs/dspark_qwen3_0.6b_remote/checkpoints
  model_save_format: safetensors
  save_consolidated: final

ci:
  cluster_tag: h100
