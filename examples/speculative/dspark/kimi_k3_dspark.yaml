# DSpark training for the text backbone of a frozen Kimi K3 target.
#
# The 896 target experts are sharded with expert parallelism. The trainable draft
# is a small dense K3 MLA stack: it keeps Q-LoRA, compressed KV, output gating,
# RMSNorm, and SiTU while dropping KDA, MoE, and the attention-residual mixer.

recipe: TrainDSparkRecipe

dist_env:
  backend: nccl
  timeout_minutes: 120

wandb:
  enable: false
  project: kimi-k3-dspark
  group: perfectblend
  tags: [dspark, kimi-k3, mla, hybridep]

distributed:
  strategy: fsdp2
  defer_fsdp_grad_sync: true
  tp_size: 1
  cp_size: 1
  pp_size: 1
  ep_size: 64
  activation_checkpointing: false
  moe:
    reshard_after_forward: true
    wrap_outer_model: false

recipe_args:
  target_model_name_or_path: moonshotai/Kimi-K3
  # Or a local checkout of the same checkpoint:
  # target_model_name_or_path: /path/to/Kimi-K3
  train_data_path: /path/to/open-perfectblend-direct-clean   # <-- messages-format SFT data
  output_dir: ./outputs/dspark_kimi_k3_perfectblend
  seq_length: 4096
  micro_batch_size: 1
  grad_accumulation_steps: 8
  num_workers: 2
  num_epochs: 10
  ckpt_every_steps: 500
  save_checkpoint_every_epoch: true

  draft_num_hidden_layers: 3
  block_size: 5
  num_anchors: 512
  mask_token_id: 163605
  target_layer_ids: [90, 91, 92]
  freeze_embeddings: true

  # Frozen-target backend knobs; these repeat build_kimi_k3_backend's defaults and are
  # spelled out here because they are the fields most often retuned per cluster.
  target_attn_backend: eager
  target_dispatcher: hybridep
  target_experts: torch_mm
  target_enable_fsdp_optimizations: true

  markov_rank: 256
  markov_head_type: vanilla
  confidence_head_alpha: 1.0
  confidence_head_with_markov: true
  ce_loss_alpha: 0.1
  l1_loss_alpha: 0.9
  loss_decay_gamma: 4.0

  trust_remote_code: false
  shuffle_seed: 42
  log_every_steps: 10
  max_grad_norm: 1.0

optimizer:
  lr: 6.0e-4
  betas: [0.9, 0.95]
  weight_decay: 0.0
  warmup_ratio: 0.04
  min_lr_ratio: 0.1

checkpoint:
  enabled: true
  checkpoint_dir: ./outputs/dspark_kimi_k3_perfectblend/checkpoints
  model_save_format: safetensors
  save_consolidated: final
  dequantize_base_checkpoint: true
