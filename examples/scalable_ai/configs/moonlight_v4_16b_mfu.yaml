# Moonlight-V4-16B-A3B (DeepSeek-V4 architecture at Moonlight scale, https://huggingface.co/akoumpa/Moonlight-V4-16B-A3B)
# MFU-tuned throughput benchmark: everything moonlight_v4_16b_tilelang_deepep.yaml does, plus the three changes a
# kernel trace of the eager path identified (12 layers, 8x H100, micro-batch 2):
#   1. TileLang sparse attention. The eager path materialises the full [B, H, S, S] score matrix and masks it, so a
#      sliding-window layer executes ~16x the attention FLOPs the model actually needs. Measured 1.35x end to end.
#   2. compile_hc. The mHC mixer runs twice per layer and casts the whole [B, S, hc_mult, hidden] stream stack to
#      fp32 in HBM each time; elementwise kernels were 38-47% of GPU time across ~15k launches per step.
#   3. bf16 for the two read-bound fp32 matmuls the trace singled out: the mHC mixer projection
#      (60 ms per step at ~210 GB/s, for 0.3% of the model FLOPs) and the 163,840-row output
#      projection (50 ms). The mixer projection then moved to a fused Triton kernel (hc_proj_kernel)
#      because cuBLAS cannot parallelise a 24-column output: it ran at 108 GB/s, ~3% of peak.
#   4. bf16 gradient reduction. FSDP2 defaults to reduce_dtype float32, which made the gradient ReduceScatter the
#      single largest kernel in the trace (90 ms, 18% of the step). The fp32 modules (mHC, sinks, lm_head) keep
#      fp32 reduction regardless: their FSDP units carry param_dtype float32.
# Requires an H100/GB200-class GPU and the `tilelang`, `tile_kernels` and `deep_ep` packages. Requires an H100/GB200-class GPU (the vendored TileLang kernels need
# ~150-230 KB of shared memory per block), plus the `tilelang`, `tile_kernels` (Sinkhorn) and `deep_ep` packages.
# moonlight_v4_16b_torch.yaml is the same benchmark on portable backends.
#
#   torchrun --nproc-per-node 8 nemo_automodel/recipes/llm/benchmark.py --config examples/scalable_ai/configs/moonlight_v4_16b_mfu.yaml
#
# Random init, mock data: no checkpoint is loaded. `num_hash_layers: 0` is a benchmark-only override so that every
# layer uses (fake-balanced) learned routing.

recipe: BenchmarkingRecipeForNextTokenPrediction

seed: 1234

benchmark:
  warmup_steps: 10
  peak_tflops: 989  # H100 dense BF16 peak; set 2500 for GB200
  nsys_start: -1
  nsys_end: -1
  nsys_ranks: []
  num_nodes: 1

step_scheduler:
  gc_every_steps: 10
  global_batch_size: 256
  local_batch_size: 4
  ckpt_every_steps: 1000
  val_every_steps: 1000
  num_epochs: 1
  max_steps: 30

distributed:
  strategy: fsdp2
  # Gradients reduce in bf16 instead of the fp32 default; parameters and the optimizer stay as they were.
  # Trades a little gradient precision for ~half the ReduceScatter traffic. Drop this block to restore fp32.
  mp_policy:
    _target_: torch.distributed.fsdp.MixedPrecisionPolicy
    param_dtype: bfloat16
    reduce_dtype: bfloat16
    output_dtype: bfloat16
    cast_forward_inputs: true
  tp_size: 1
  cp_size: 1
  pp_size: 1
  ep_size: 8
  sequence_parallel: false
  activation_checkpointing: false
  moe:
    reshard_after_forward: false
    wrap_outer_model: false

dist_env:
  backend: nccl
  timeout_minutes: 10

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_config
  config:
    _target_: nemo_automodel.components.models.deepseek_v4.config.DeepseekV4Config.from_pretrained
    pretrained_model_name_or_path: akoumpa/Moonlight-V4-16B-A3B
    num_hash_layers: 0
    use_cache: false
  trust_remote_code: false
  load_base_model: false
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: tilelang       # TileLang sparse attention + indexer + Sinkhorn (Hopper); 'eager' = dense masked attention
    linear: torch
    rms_norm: torch_fp32
    rope_fusion: false
    experts: gmm         # grouped_gemm.ops.gmm; 'torch' is the per-expert loop (~1.16x slower end to end)
    dispatcher: deepep   # or hybridep
    compile_hc: true     # torch.compile the mHC mixer / collapse / expand cores
    hc_proj_bf16: true   # mHC mixer projection in bf16 (norm, gates and Sinkhorn stay fp32)
    # hc_proj_kernel: the fused Triton norm+projection kernel. Measured at this shape: 0.482 s and
    # 41.3 GB against 0.477 s and 44.3 GB for the bf16 cuBLAS path above. Slightly slower, 3 GB
    # leaner -- so it is off by default here and worth enabling only when memory is the constraint.
    hc_proj_kernel: false
    lm_head_bf16: true   # output projection in bf16 instead of the released model's fp32
    gate_precision: float32
    fake_balanced_gate: true
    enable_hf_state_dict_adapter: false
    enable_fsdp_optimizations: true

checkpoint:
  enabled: false

loss_fn:
  # FusedLinearCrossEntropy also works once lm_head_bf16 is set (it needs one dtype) and cuts peak memory
  # from 44 GB to 35 GB by never materialising the [tokens, 163840] logits -- but it measured slower here
  # (0.580 s vs 0.514 s at micro-batch 4): its backward kernel costs more than the logits traffic it saves.
  # Swap it in when memory, not step time, is the binding constraint.
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy
  fp32_upcast: false

dataset:
  _target_: nemo_automodel.components.datasets.llm.mock_iterable_dataset.MockIterableDataset
  seq_len: 2048
  num_samples: 100000

dataloader:
  batch_size: null  # Dataset already yields batches
  _target_: torch.utils.data.DataLoader
  num_workers: 0

optimizer:
  _target_: torch.optim.Adam
  betas:
  - 0.9
  - 0.999
  eps: 1e-8
  lr: 0.0001
  weight_decay: 0
  foreach: false
