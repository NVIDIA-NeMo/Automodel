# From-scratch pre-training of Moonlight-V4-16B-A3B (16.5B total / 3.0B active) on FineWeb-edu, one 8x H100 node.
#
#   bash examples/scalable_ai/pretrain.sh          # inside the NeMo Automodel container, see the script header
#   automodel examples/scalable_ai/configs/pretrain_moonlight_v4_16b.yaml --nproc-per-node 8   # without the wrapper
#
# No checkpoint is loaded; the native DeepSeek-V4 implementation initialises everything from the config, including
# the hash-routed first layer's token table and the mHC mixers. Data: NanogptDataset shards written by
# examples/scalable_ai/prepare_fineweb.py with the tokenizer bundled in the model repo (Moonshot's, 163,840 ids,
# BOS 163584). Moonlight itself trained with Muon (Automodel: optimizer MuonConfig, needs the `dion` package);
# AdamW below uses Moonlight's peak learning rate. 700 steps x 256 x 2048 = 367M tokens, ~3 h on 8x H100 with the
# TileLang + DeepEP backends at micro-batch 1 (micro-batch 2 peaks at 69 GB in the first step and OOMs when the bf16 Adam
# states are allocated). Checkpoints resume automatically (latest is picked up when the job restarts); the loss goes
# to Weights & Biases (WANDB_API_KEY or ~/.netrc, otherwise offline).

recipe: TrainFinetuneRecipeForNextTokenPrediction

step_scheduler:
  global_batch_size: 256         # 256 x 2048 = 524k tokens per optimizer step
  local_batch_size: 1            # keep equal to dataloader.batch_size below; 2 fits the forward but OOMs once the Adam states exist
  ckpt_every_steps: 200
  val_every_steps: 100
  num_epochs: 1
  max_steps: 700

dist_env:
  backend: nccl
  timeout_minutes: 15

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 1111
  ranked: true

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_config
  config:
    _target_: nemo_automodel.components.models.deepseek_v4.config.DeepseekV4Config.from_pretrained
    pretrained_model_name_or_path: akoumpa/Moonlight-V4-16B-A3B   # pretrain.sh points this at the local copy
    use_cache: false
  trust_remote_code: false
  load_base_model: false
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: tilelang       # Hopper-class GPUs; use 'eager' elsewhere (dense masked attention, same math at <= 4K tokens)
    linear: torch
    rms_norm: torch_fp32
    rope_fusion: false
    experts: torch_mm
    dispatcher: deepep   # or hybridep / torch (pretrain.sh falls back to torch after repeated DeepEP failures)
    gate_precision: float32
    fake_balanced_gate: false
    enable_hf_state_dict_adapter: false
    enable_fsdp_optimizations: true

checkpoint:
  enabled: true
  checkpoint_dir: /workspace/checkpoints/moonlight_v4_16b   # ~165 GB per checkpoint (bf16 weights + fp32 Adam states)
  model_save_format: torch_save
  save_consolidated: false
  max_recent_checkpoints: 2

distributed:
  strategy: fsdp2
  tp_size: 1
  cp_size: 1
  pp_size: 1
  dp_size: 8
  ep_size: 8
  moe:
    # DeepSeek-V4's fp32 tensors (attention sinks, compressor position biases, mHC mixers) are separate FSDP2 units;
    # keep them unsharded between forward and backward.
    reshard_after_forward: false
    wrap_outer_model: false

loss_fn:
  # lm_head is kept in fp32 (as in the released V4 checkpoints); the fused linear cross-entropy requires one dtype.
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy

clip_grad_norm:
  max_norm: 1.0

dataset:
  _target_: nemo_automodel.components.datasets.llm.nanogpt_dataset.NanogptDataset
  file_pattern: /workspace/data/fineweb_edu_moonshot/fineweb_train_*.bin   # 16 shards: files are dealt round-robin to the 8 ranks
  seq_len: 2048
  shuffle_files: true
  align_to_bos: false
  bos_token: 163584

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  # The recipe passes no batch size to the DataLoader for IterableDatasets (local_batch_size only sets the
  # accumulation count), so without this line every micro-batch is a single sequence.
  batch_size: 1
  shuffle: false
  collate_fn: nemo_automodel.components.datasets.utils.default_collater

validation_dataset:
  # NanogptDataset is an infinite stream; FiniteNanogptDataset (examples/scalable_ai/finite_nanogpt.py, on
  # PYTHONPATH via pretrain.sh) stops after max_samples sequences per rank. One 8M-token shard, split by position.
  _target_: finite_nanogpt.FiniteNanogptDataset
  file_pattern: /workspace/data/fineweb_edu_moonshot/fineweb_val_0000.bin
  max_samples: 32                 # 32 x 2048 tokens per rank per validation
  seq_len: 2048
  shuffle_files: false
  align_to_bos: false
  bos_token: 163584

validation_dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  batch_size: 1
  shuffle: false
  collate_fn: nemo_automodel.components.datasets.utils.default_collater

optimizer:
  _target_: torch.optim.AdamW
  betas: [0.9, 0.95]
  eps: 1e-8
  lr: 4.2e-4
  weight_decay: 0.1

lr_scheduler:
  lr_decay_style: cosine
  lr_warmup_steps: 100
  min_lr: 4.2e-5

wandb:
  project: moonlight-v4
  name: moonlight-v4-16b-a3b-pretrain-8xh100
  # mode is left to WANDB_MODE (pretrain.sh passes --wandb.mode offline when no credentials are available)
