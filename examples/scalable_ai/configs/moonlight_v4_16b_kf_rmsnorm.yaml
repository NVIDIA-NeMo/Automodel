# End-to-end A/B twin of moonlight_v4_16b_torch.yaml. The ONLY difference is
# `backend.rms_norm`: torch_fp32 (baseline) -> kf_triton_h2048 (Kernel Factory candidate).
# Everything else, including the model, the parallelism and the data, is held fixed so the
# step-time delta is attributable to the norm kernel.
#
#   # baseline
#   torchrun --nproc-per-node 8 nemo_automodel/recipes/llm/benchmark.py \
#     --config examples/scalable_ai/configs/moonlight_v4_16b_torch.yaml
#   # candidate
#   torchrun --nproc-per-node 8 nemo_automodel/recipes/llm/benchmark.py \
#     --config examples/scalable_ai/configs/moonlight_v4_16b_kf_rmsnorm.yaml
#
# kf_triton_h2048 only accepts hidden=2048, eps=1e-6, bf16. Moonlight-V4's block and final
# norms match; its q/kv, compressor and indexer norms are pinned to torch_fp32 in the model
# and are unaffected. See examples/scalable_ai/kernel_factory/moonlight-rmsnorm/README.md.

recipe: BenchmarkingRecipeForNextTokenPrediction

seed: 1234

benchmark:
  warmup_steps: 10
  peak_tflops: 989  # H100 dense BF16 peak; set 2500 for GB200
  nsys_start: -1
  nsys_end: -1
  nsys_ranks: []
  num_nodes: 1

step_scheduler:
  gc_every_steps: 10
  global_batch_size: 256
  local_batch_size: 4
  ckpt_every_steps: 1000
  val_every_steps: 1000
  num_epochs: 1
  max_steps: 30

distributed:
  strategy: fsdp2
  tp_size: 1
  cp_size: 1
  pp_size: 1
  ep_size: 8
  sequence_parallel: false
  activation_checkpointing: false
  moe:
    reshard_after_forward: false
    wrap_outer_model: false

dist_env:
  backend: nccl
  timeout_minutes: 10

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_config
  config:
    _target_: nemo_automodel.components.models.deepseek_v4.config.DeepseekV4Config.from_pretrained
    pretrained_model_name_or_path: akoumpa/Moonlight-V4-16B-A3B
    num_hash_layers: 0
    use_cache: false
  trust_remote_code: false
  load_base_model: false
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: eager
    linear: torch
    rms_norm: kf_triton_h2048  # <- the only change from moonlight_v4_16b_torch.yaml
    rope_fusion: false
    experts: torch_mm
    dispatcher: torch
    gate_precision: float32
    fake_balanced_gate: true
    enable_hf_state_dict_adapter: false
    enable_fsdp_optimizations: true

checkpoint:
  enabled: false

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy
  fp32_upcast: false

dataset:
  _target_: nemo_automodel.components.datasets.llm.mock_iterable_dataset.MockIterableDataset
  seq_len: 2048
  num_samples: 100000

dataloader:
  batch_size: null  # Dataset already yields batches
  _target_: torch.utils.data.DataLoader
  num_workers: 0

optimizer:
  _target_: torch.optim.Adam
  betas:
  - 0.9
  - 0.999
  eps: 1e-8
  lr: 0.0001
  weight_decay: 0
  foreach: false
