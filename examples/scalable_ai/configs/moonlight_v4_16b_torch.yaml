# Moonlight-V4-16B-A3B (DeepSeek-V4 architecture at Moonlight scale, https://huggingface.co/akoumpa/Moonlight-V4-16B-A3B)
# throughput benchmark with NeMo Automodel's native DeepSeek-V4 implementation and portable backends
# (eager attention, torch._grouped_mm experts, torch token dispatcher). Runs on any CUDA GPU; see
# moonlight_v4_16b_tilelang_deepep.yaml for the Hopper-class kernel path.
#
#   torchrun --nproc-per-node 8 nemo_automodel/recipes/llm/benchmark.py --config examples/scalable_ai/configs/moonlight_v4_16b_torch.yaml
#
# Random init, mock data: no checkpoint is loaded. `num_hash_layers: 0` is a benchmark-only override: the hash-routed
# first layer's token table is zero-initialised when a model is built from a config, which would send every token to
# expert 0; with learned routing (and fake_balanced_gate) the expert load stays balanced.

recipe: BenchmarkingRecipeForNextTokenPrediction

seed: 1234

benchmark:
  warmup_steps: 10
  peak_tflops: 989  # H100 dense BF16 peak; set 2500 for GB200
  nsys_start: -1
  nsys_end: -1
  nsys_ranks: []
  num_nodes: 1

step_scheduler:
  gc_every_steps: 10
  global_batch_size: 256
  local_batch_size: 4
  ckpt_every_steps: 1000
  val_every_steps: 1000
  num_epochs: 1
  max_steps: 30

distributed:
  strategy: fsdp2
  tp_size: 1
  cp_size: 1
  pp_size: 1
  ep_size: 8
  sequence_parallel: false
  activation_checkpointing: false
  moe:
    # DeepSeek-V4's fp32 tensors (attention sinks, compressor position biases, mHC mixers, lm_head) are separate
    # FSDP2 units; keep them unsharded between forward and backward.
    reshard_after_forward: false
    wrap_outer_model: false

dist_env:
  backend: nccl
  timeout_minutes: 10

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_config
  config:
    _target_: nemo_automodel.components.models.deepseek_v4.config.DeepseekV4Config.from_pretrained
    pretrained_model_name_or_path: akoumpa/Moonlight-V4-16B-A3B
    num_hash_layers: 0
    use_cache: false
  trust_remote_code: false
  load_base_model: false
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: eager          # DeepSeek-V4 attention has its own sparse path; 'eager' = dense masked attention with sinks
    linear: torch
    rms_norm: torch_fp32
    rope_fusion: false
    experts: torch_mm    # torch._grouped_mm; use 'gmm' (grouped_gemm) or 'te' when installed
    dispatcher: torch
    gate_precision: float32
    fake_balanced_gate: true
    enable_hf_state_dict_adapter: false
    enable_fsdp_optimizations: true

checkpoint:
  enabled: false

loss_fn:
  # The model keeps lm_head in fp32 (as the released V4 does); FusedLinearCrossEntropy needs one dtype, so use the
  # logits-based loss.
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy
  fp32_upcast: false

dataset:
  _target_: nemo_automodel.components.datasets.llm.mock_iterable_dataset.MockIterableDataset
  seq_len: 2048
  num_samples: 100000

dataloader:
  batch_size: null  # Dataset already yields batches
  _target_: torch.utils.data.DataLoader
  num_workers: 0

optimizer:
  _target_: torch.optim.Adam
  betas:
  - 0.9
  - 0.999
  eps: 1e-8
  lr: 0.0001
  weight_decay: 0
  foreach: false
