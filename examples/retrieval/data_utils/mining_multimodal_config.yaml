# Override the checkpoint, processor, input and output paths when launching:
# uv run torchrun --nproc_per_node=1 examples/retrieval/data_utils/mine_hard_negatives.py \
#   --config examples/retrieval/data_utils/mining_multimodal_config.yaml \
#   --mining.model_name_or_path /path/to/checkpoint \
#   --mining.multimodal_encoder.processor_name_or_path /path/to/checkpoint \
#   --mining.train_qa_file_path /path/to/input.json \
#   --mining.train_file_output_path /path/to/output.json

dist_env:
  backend: nccl
  timeout_minutes: 30

mining:
  model_name_or_path: null
  train_qa_file_path: null
  train_file_output_path: null

  multimodal_encoder:
    _target_: nemo_automodel.components.models.ministral_bidirectional.mining.Mistral3MultimodalMiningEncoderConfig
    processor_name_or_path: null
    q_max_length: 512
    p_max_length: 4096
    query_prefix: "query:"
    passage_prefix: "passage:"
    image_longest_edge: 1284
    use_text_in_document: true
    use_images: true

  load_embeddings_from_cache: false
  query_embedding_batch_size: 4
  document_embedding_batch_size: 4
  corpus_chunk_size: 256
  mining_batch_size: 128
  hard_negatives_to_mine: 20
  hard_neg_margin: 0.95
  hard_neg_margin_type: perc
  use_negatives_from_file: false
