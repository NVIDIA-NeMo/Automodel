  shuffle: true
  num_workers: 4

optimizer:
  _target_: transformer_engine.pytorch.optimizers.fused_adam.FusedAdam
  lr: 1.0e-5
  distill_projection_lr: 1.0e-5
  # Optional absolute LR overrides for trainable student submodules.
  # These are converted to lr_mult relative to optimizer.lr. Frozen modules ignore
  # their LR override because they have no trainable parameters.
  # vision_tower_lr: 1.0e-6
  # multi_modal_projector_lr: 1.0e-5
  # language_model_lr: 3.0e-5
  weight_decay: 0.01
  adam_w_mode: true
  bias_correction: true
  master_weights: true

lr_scheduler:
  lr_warmup_steps: 0
  lr_decay_style: linear

