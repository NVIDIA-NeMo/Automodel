# Round3 VLM embedding distillation from the continued-distill round2 checkpoint.

recipe: EmbeddingDistillRecipe

seed: 42

temperature: 0.02
nce_loss_weight: 0.0
distill_loss_weight: 1.0
mse_loss_weight: 1.0
normalized_mse_loss_weight: 0.0
score_loss_weight: 0.0
