# Stage 1 experiment:
#   1B VL student, supervised by a frozen bidirectional 3B VLM teacher on
#   query and document/image-side embeddings. Submit script appends submit time
#   to checkpoint_dir and wandb.name.

recipe: EmbeddingDistillRecipe

seed: 42

temperature: 0.02
nce_loss_weight: 0.0
distill_loss_weight: 1.0
mse_loss_weight: 1.0
normalized_mse_loss_weight: 0.0
log_modality_loss: true

step_scheduler:
  global_batch_size: 128
  local_batch_size: 2
  ckpt_every_steps: 500
  val_every_steps: 500
  num_epochs: 1
  log_remote_every_steps: 10

dist_env:
  backend: nccl
  timeout_minutes: 15

model:
  _target_: nemo_automodel._transformers.retrieval.RetrieverStudentWithProjection.build
  pretrained_model_name_or_path: /lustre/fsw/portfolios/datascience/projects/datascience_nemo_retriever/users/jiaruic/model_checkpoints/Ministral-3-1B-Instruct-2512-BF16_llm_replaced_nemotron_3_embed_1B
  teacher_hidden_size: 3072
  trust_remote_code: true
  pooling: avg
  l2_normalize: true
  use_liger_kernel: true
  use_sdpa_patching: true
  dtype: bfloat16
  attn_implementation: flash_attention_2

teacher_model:
  _target_: nemo_automodel._transformers.retrieval.RetrieverTeacherEmbeddingEncoder.build
  pretrained_model_name_or_path: /lustre/fsw/portfolios/datascience/users/gmoreira/model_checkpoints/ministral3_3b_vl/ministral3_3b_ac_all_fsdp2_lr2e6_llm_replaced-20260710/epoch_0_step_2047/model/consolidated
  trust_remote_code: true
  pooling: avg
  l2_normalize: true
  use_liger_kernel: true
  use_sdpa_patching: true
  dtype: bfloat16
  attn_implementation: flash_attention_2

freeze_config:
  freeze_vision_tower: true
  freeze_language_model: true

tokenizer:
  _target_: nemo_automodel.components.models.ministral_bidirectional.processor.Mistral3BiEncoderProcessor.from_pretrained
  pretrained_model_name_or_path: /lustre/fsw/portfolios/datascience/projects/datascience_nemo_retriever/users/jiaruic/model_checkpoints/Ministral-3-1B-Instruct-2512-BF16_llm_replaced_nemotron_3_embed_1B
  q_max_length: 512
  p_max_length: 4096
  query_prefix: "query:"
  passage_prefix: "passage:"
  pad_to_multiple_of: 8
  image_longest_edge: 1284

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  dataset:
    _target_: nemo_automodel.components.datasets.llm.make_retrieval_dataset
    model_type: bi_encoder
    data_dir_list:
      - path: /lustre/fsw/portfolios/datascience/projects/datascience_rapids_research/retriever_models_research/01_datasets/03_training_datasets/arxiv_qa_smolvlm_iteration1_mined_data_9949.json
        num_samples: 9949
      - path: /lustre/fsw/portfolios/datascience/projects/datascience_rapids_research/retriever_models_research/01_datasets/03_training_datasets/tatdqa_smolvlm_iteration1_mined_data_13188.json
        num_samples: 13188
      - path: /lustre/fsw/portfolios/datascience/projects/datascience_rapids_research/retriever_models_research/01_datasets/03_training_datasets/docvqa_smolvlm_iteration2_mined_data_39302.json
        num_samples: 39302
      - path: /lustre/fsw/portfolios/datascience/projects/datascience_rapids_research/retriever_models_research/01_datasets/03_training_datasets/infovqa_smolvlm_iteration2_mined_data_10038.json
        num_samples: 10038
      - path: /lustre/fsw/portfolios/datascience/projects/datascience_rapids_research/retriever_models_research/01_datasets/03_training_datasets/wiki-ss-nq_smolvlm-iteration1_only-iamge-for-mining_mined_data_only-iamge-for-mining_44002.json
        num_samples: 44002
      - path: /lustre/fsw/portfolios/datascience/projects/datascience_rapids_research/retriever_models_research/01_datasets/03_training_datasets/docmatix_100k_smolvlm_iteration1_mined_data_100k.json
        num_samples: 100000
      - path: /lustre/fsw/portfolios/datascience/projects/datascience_rapids_research/retriever_models_research/01_datasets/03_training_datasets/pdf_synthetic_mine_among_all_colpali_45718.json
        num_samples: 45718
    data_type: train
    n_passages: 4
    seed: 42
    do_shuffle: true
  collate_fn:
    _target_: nemo_automodel.components.datasets.llm.ProcessorMethodCollator
    collator_fn_name: process_queries_documents_biencoder
  shuffle: true
  num_workers: 4

optimizer:
  _target_: transformer_engine.pytorch.optimizers.fused_adam.FusedAdam
  lr: 1.0e-4
  distill_projection_lr: 1.0e-3
  weight_decay: 0.01
  adam_w_mode: true
  bias_correction: true
  master_weights: true

lr_scheduler:
  lr_warmup_steps: 100
  lr_decay_style: linear

checkpoint:
  enabled: true
  checkpoint_dir: /lustre/fsw/portfolios/datascience/projects/datascience_nemo_retriever/users/jiaruic/model_checkpoints/ministral3_1b_vl/ministral3_1b_all_fsdp2_base_lr1e4_distillproj_lr1e3_connector_vlm_teacher_distill_from_gmoreira_3b_ac_projection_warmup100
  model_save_format: safetensors
  save_consolidated: final

distributed:
  strategy: fsdp2
  dp_size: none
  tp_size: 1
  cp_size: 1
  activation_checkpointing: true
  activation_checkpointing_scope: all
  reshard_after_forward: false
  enable_fsdp2_prefetch: false

wandb:
  project: Inform-simlm-embedding
  entity: nvidia-merlin
  name: ministral3_1b_vl_stage1_connector_vlm_teacher_distill_from_gmoreira_3b_ac_projection_base_lr1e4_distillproj_lr1e3_warmup100
  enable: true
