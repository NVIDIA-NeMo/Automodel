# Refer to README.md for the text-stage starting checkpoint and data preparation.
recipe: TrainCrossEncoderRecipe
seed: 42
temperature: 0.02

dist_env:
  backend: nccl
  timeout_minutes: 30

model:
  _target_: nemo_automodel.NeMoAutoModelCrossEncoder.from_pretrained
  pretrained_model_name_or_path: &model_id <path/to/text-trained-rerank-8b>
  num_labels: 1
  pooling: avg
  is_causal: false
  # Scale the training loss only at recipe level.
  temperature: 1.0
  # Preserve the checkpoint's trained head when loading into AutoModel.
  key_mapping:
    '^language_model\.score\.weight$': score.weight
  # FusedAdam keeps FP32 master weights for BF16 model parameters.
  torch_dtype: bfloat16
  attn_implementation: flash_attention_2
  use_liger_kernel: true
  use_sdpa_patching: true

# Full-model multimodal training, following the representative cross-encoder config.
freeze_config:
  freeze_vision_tower: false
  freeze_language_model: false

tokenizer:
  _target_: nemo_automodel.components.models.ministral_bidirectional.processor.Mistral3BiEncoderProcessor.from_pretrained
  pretrained_model_name_or_path: *model_id
  rerank_max_length: 3072
  use_prompt_template: true
  export_as_stock_processor: false
  pad_to_multiple_of: 8
  image_longest_edge: 1120
  do_pad: true

dataset:
  _target_: nemo_automodel.components.datasets.llm.retrieval_dataset.RetrievalDatasetConfig
  data_dir_list: <path/to/train.json>
  model_type: cross_encoder
  n_passages: 4
  do_shuffle: true
  use_text_in_document: true

dataloader:
  collate_fn:
    _target_: nemo_automodel.components.datasets.llm.ProcessorMethodCollator
    collator_fn_name: process_queries_documents_crossencoder
  shuffle: true
  num_workers: 4

step_scheduler:
  global_batch_size: 256
  local_batch_size: 1
  num_epochs: 1
  ckpt_every_steps: 400

optimizer:
  _target_: transformer_engine.pytorch.optimizers.fused_adam.FusedAdam
  lr: 5.0e-6
  weight_decay: 0.01
  adam_w_mode: true
  bias_correction: true
  master_weights: true

lr_scheduler:
  lr_warmup_steps: 200
  lr_decay_style: cosine

distributed:
  strategy: fsdp2
  activation_checkpointing: true
  reshard_after_forward: true

checkpoint:
  checkpoint_dir: outputs/nemotron_3_5_rerank_8b
  model_save_format: safetensors
  save_consolidated: final

ci:
  cluster_tag: h100
