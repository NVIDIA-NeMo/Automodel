# Refer to README.md for the required starting checkpoint and data preparation.
recipe: TrainBiEncoderRecipe
seed: 42
temperature: 0.02

dist_env:
  backend: nccl
  timeout_minutes: 15

model:
  _target_: nemo_automodel.NeMoAutoModelBiEncoder.from_pretrained
  pretrained_model_name_or_path: &model_id <path/to/initialized-embed-8b>
  pooling: avg
  l2_normalize: true
  is_causal: false
  # FusedAdam keeps FP32 master weights for BF16 model parameters.
  torch_dtype: bfloat16
  attn_implementation: flash_attention_2
  use_liger_kernel: true
  use_sdpa_patching: true

freeze_config:
  freeze_vision_tower: false
  freeze_language_model: true

tokenizer:
  _target_: nemo_automodel.components.models.ministral_bidirectional.processor.Mistral3BiEncoderProcessor.from_pretrained
  pretrained_model_name_or_path: *model_id
  q_max_length: 512
  p_max_length: 4096
  query_prefix: "query:"
  passage_prefix: "passage:"
  pad_to_multiple_of: 8
  image_longest_edge: 1120
  do_pad: true

dataset:
  _target_: nemo_automodel.components.datasets.llm.retrieval_dataset.RetrievalDatasetConfig
  data_dir_list: <path/to/train.json>
  model_type: bi_encoder
  n_passages: 4
  do_shuffle: true
  use_text_in_document: true

dataloader:
  collate_fn:
    _target_: nemo_automodel.components.datasets.llm.ProcessorMethodCollator
    collator_fn_name: process_queries_documents_biencoder
  shuffle: true
  num_workers: 4

step_scheduler:
  global_batch_size: 128
  local_batch_size: 1
  num_epochs: 1
  ckpt_every_steps: 1000

optimizer:
  _target_: transformer_engine.pytorch.optimizers.fused_adam.FusedAdam
  lr: 1.0e-5
  weight_decay: 0.01
  adam_w_mode: true
  bias_correction: true
  master_weights: true

lr_scheduler:
  lr_warmup_steps: 100
  lr_decay_style: linear

distributed:
  strategy: fsdp2
  activation_checkpointing: true
  reshard_after_forward: true

checkpoint:
  checkpoint_dir: outputs/nemotron_3_5_embed_8b
  model_save_format: safetensors
  save_consolidated: final
  max_recent_checkpoints: 2

ci:
  cluster_tag: h100
