# Ministral-8B cross-encoder pre-training with preprocessed inline-Parquet retrieval data.
# Each dataset path must be a directory containing inline retrieval Parquet shards.

recipe: TrainCrossEncoderRecipe

seed: 42

step_scheduler:
  global_batch_size: 1024
  local_batch_size: 4
  ckpt_every_steps: 430
  val_every_steps: 2000
  num_epochs: 1
  log_remote_every_steps: 100

dist_env:
  backend: nccl
  timeout_minutes: 30

model:
  _target_: nemo_automodel.NeMoAutoModelCrossEncoder.from_pretrained
  pretrained_model_name_or_path: /lustre/fsw/portfolios/datascience/projects/datascience_rapids_research/retriever_models_research/nemotron_4_embed_vl/Ministral-3-8B-Instruct-2512-combined
  trust_remote_code: true
  num_labels: 1
  temperature: 0.02
  pooling: avg
  use_liger_kernel: true
  use_sdpa_patching: true
  torch_dtype: bfloat16
  attn_implementation: flash_attention_2

freeze_config:
  freeze_vision_tower: true
  freeze_multimodal_projector: true
  freeze_language_model: false

tokenizer:
  _target_: nemo_automodel.components.models.ministral_bidirectional.processor.Mistral3BiEncoderProcessor.from_pretrained
