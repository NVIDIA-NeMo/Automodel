# To run this recipe:
#   automodel examples/retrieval/cross_encoder/ministral3_ranker_image.yaml --nproc-per-node 8
# Adjust --nproc-per-node to the number of GPUs available on your machine.

recipe: TrainCrossEncoderRecipe

seed: 42

step_scheduler:
  global_batch_size: 128
  local_batch_size: 2
  ckpt_every_steps: 1000
  val_every_steps: 500
  num_epochs: 1
  log_remote_every_steps: 10

dist_env:
  backend: nccl
  timeout_minutes: 30

model:
  _target_: nemo_automodel.NeMoAutoModelCrossEncoder.from_pretrained
  pretrained_model_name_or_path: mistralai/Ministral-3-3B-Instruct-2512-BF16
  trust_remote_code: true
  num_labels: 1
  temperature: 0.02
  pooling: avg
  use_liger_kernel: true
  use_sdpa_patching: true
  torch_dtype: bfloat16
  attn_implementation: flash_attention_2

tokenizer:
  _target_: nemo_automodel.components.models.ministral_bidirectional.processor.Mistral3BiEncoderProcessor.from_pretrained
  pretrained_model_name_or_path: mistralai/Ministral-3-3B-Instruct-2512-BF16
  rerank_max_length: 4096
  use_prompt_template: true
  export_as_stock_processor: false
  pad_to_multiple_of: 8
  image_longest_edge: 1540

dataset:
  _target_: nemo_automodel.components.datasets.llm.retrieval_dataset.RetrievalDatasetConfig
  model_type: cross_encoder
  data_dir_list:
    - path: /lustre/fsw/portfolios/datascience/projects/datascience_rapids_research/retriever_models_research/01_datasets/03_training_datasets/docvqa_smolvlm_iteration2_mined_data_39302.json
      num_samples: 20000
    - path: /lustre/fsw/portfolios/datascience/projects/datascience_rapids_research/retriever_models_research/01_datasets/03_training_datasets/tatdqa_smolvlm_iteration1_mined_data_13188.json
      num_samples: 10000
    - path: /lustre/fsw/portfolios/datascience/projects/datascience_rapids_research/retriever_models_research/01_datasets/03_training_datasets/arxiv_qa_smolvlm_iteration1_mined_data_9949.json
      num_samples: 9000
    - path: /lustre/fsw/portfolios/datascience/projects/datascience_rapids_research/retriever_models_research/01_datasets/03_training_datasets/colpali_train_mined_filtered_docvqa_IVQA_68855_synthetic_prompt_1_remined.json
      num_samples: 30000
    - path: /lustre/fsw/portfolios/llmservice/users/ronaya/synthetic_query_generation/mined/infovqa_top05_nanovl_ronay3_8k_fixed_mined.json
      num_samples: 8000
    - path: /lustre/fsw/portfolios/llmservice/users/ronaya/synthetic_query_generation/mined/vdr_en_top05_nanovl_ronay3_42k_fixed_mined.json
      num_samples: 40000
  data_type: train
  n_passages: 4
  seed: 42
  do_shuffle: true

dataloader:
  collate_fn:
    _target_: nemo_automodel.components.datasets.llm.ProcessorMethodCollator
    collator_fn_name: process_queries_documents_crossencoder
  shuffle: true
  num_workers: 4

# Optional LoRA configuration.
# peft:
#   _target_: nemo_automodel.components._peft.lora.PeftConfig
#   target_modules:
#     - "*.q_proj"
#     - "*.k_proj"
#     - "*.v_proj"
#     - "*.o_proj"
#     - "*.gate_proj"
#     - "*.up_proj"
#     - "*.down_proj"
#   exclude_modules: []
#   match_all_linear: false
#   dim: 16
#   alpha: 32
#   use_triton: false

optimizer:
  _target_: transformer_engine.pytorch.optimizers.fused_adam.FusedAdam
  lr: 2e-6
  weight_decay: 0.01
  adam_w_mode: true
  bias_correction: true
  master_weights: true

lr_scheduler:
  lr_warmup_steps: 100
  lr_decay_style: cosine

checkpoint:
  enabled: true
  checkpoint_dir: <root_path>/ministral3_reranker_lr2e6_gbs256_cosine_t002_tpn4_le_1540_0729
  model_save_format: safetensors
  save_consolidated: final

distributed:
  strategy: fsdp2
  dp_size: none
  tp_size: 1
  cp_size: 1
  activation_checkpointing: true
  activation_checkpointing_scope: all
  reshard_after_forward: false

wandb:
  project: inform-simlm-reranking
  entity: nvidia-merlin
  name: ministral3_reranker_lr2e6_gbs256_cosine_t002_tpn4_le_1540_0729
  enable: true
