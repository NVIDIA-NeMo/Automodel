# Joint image + text cross-encoder fine-tuning for Ministral3 1B (single stage).
# To run (from the repo root):
#   sbatch -J ministral3_1B_reranker_image_text_768k_lr5e6_gbs256_t002_le1284 \
#     examples/retrieval/cross_encoder/nemotron_vl_multinode_reranker.sh examples/retrieval/cross_encoder/ministral3_image_text_ranker_768k.yaml

recipe: TrainCrossEncoderRecipe

seed: 42

step_scheduler:
  global_batch_size: 256
  local_batch_size: 4
  ckpt_every_steps: 400
  val_every_steps: 500
  num_epochs: 1
  log_remote_every_steps: 10

dist_env:
  backend: nccl
  timeout_minutes: 30

model:
  _target_: nemo_automodel.NeMoAutoModelCrossEncoder.from_pretrained
  pretrained_model_name_or_path: /lustre/fsw/portfolios/llmservice/users/ronaya/model_checkpoints/Ministral-3-1B-Instruct-2512-BF16_llm_replaced_nemotron_3_embed_1B
  trust_remote_code: true
  num_labels: 1
  temperature: 0.02
  pooling: avg
  use_liger_kernel: true
  use_sdpa_patching: true
  torch_dtype: bfloat16
  attn_implementation: flash_attention_2

tokenizer:
  _target_: nemo_automodel.components.models.ministral_bidirectional.processor.Mistral3BiEncoderProcessor.from_pretrained
  pretrained_model_name_or_path: /lustre/fsw/portfolios/llmservice/users/ronaya/model_checkpoints/Ministral-3-1B-Instruct-2512-BF16_llm_replaced_nemotron_3_embed_1B
  rerank_max_length: 4096
  use_prompt_template: true
  export_as_stock_processor: false
  pad_to_multiple_of: 8
  image_longest_edge: 1284

dataset:
  _target_: nemo_automodel.components.datasets.llm.retrieval_dataset.RetrievalDatasetConfig
  model_type: cross_encoder
