# Llama-3.2-1B bi-encoder training with preprocessed inline-Parquet retrieval data.
# Each entry in dataloader.dataset.data_dir_list should be an output directory
# produced by scripts/yauhen/prepare_retrieval_inline_parquet.py.

recipe: TrainBiEncoderRecipe

seed: 42

temperature: 0.02 # TODO: 0.04

# 488 steps for 1M samples

step_scheduler:
  global_batch_size: 2048
  local_batch_size: 16
  ckpt_every_steps: 3020
  val_every_steps: 1000
  log_remote_every_steps: 10
  num_epochs: 1
  max_steps: null

dist_env:
  backend: nccl
  timeout_minutes: 30

model:
  _target_: nemo_automodel.NeMoAutoModelBiEncoder.from_pretrained
  pretrained_model_name_or_path: meta-llama/Llama-3.2-1B
  trust_remote_code: true
  pooling: avg
  l2_normalize: true
  use_liger_kernel: true
  use_sdpa_patching: true
  torch_dtype: bfloat16
  attn_implementation: flash_attention_2
  do_distributed_inbatch_negative: false

tokenizer:
  _target_: nemo_automodel.NeMoAutoTokenizer.from_pretrained
  pretrained_model_name_or_path: meta-llama/Llama-3.2-1B
  add_eos_token: false

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  dataset:
    _target_: nemo_automodel.components.datasets.llm.retrieval_dataset_inline.make_retrieval_dataset
    model_type: bi_encoder
    data_dir_list:
      - /lustre/fsw/portfolios/llmservice/users/ybabakhin/data/rteb/multilingual_wiki_ccnews_5hn_withMoreDS_more_reddit_s2orc_allLang_11M_qwen3_8B_0_95_perc_posdocs_only_inline_nneg4_no_triviaqa_exact_repaired
      - /lustre/fsw/portfolios/llmservice/users/ybabakhin/data/rteb/paq_remined_origcorpus_qwen3_8B_0_95_perc_20260523_inline_nneg4
      - /lustre/fsw/portfolios/llmservice/users/ybabakhin/data/rteb/mlqa_ar_remined_origcorpus_qwen3_8B_0_95_perc_20260523_inline_nneg4
      - /lustre/fsw/portfolios/llmservice/users/ybabakhin/data/rteb/mlqa_de_remined_origcorpus_qwen3_8B_0_95_perc_20260523_inline_nneg4
      - /lustre/fsw/portfolios/llmservice/users/ybabakhin/data/rteb/mlqa_es_remined_origcorpus_qwen3_8B_0_95_perc_20260523_inline_nneg4
      - /lustre/fsw/portfolios/llmservice/users/ybabakhin/data/rteb/mlqa_hi_remined_origcorpus_qwen3_8B_0_95_perc_20260523_inline_nneg4
      - /lustre/fsw/portfolios/llmservice/users/ybabakhin/data/rteb/mlqa_zh_remined_origcorpus_qwen3_8B_0_95_perc_20260523_inline_nneg4
    cache_dir: /lustre/fsw/portfolios/llmservice/users/ybabakhin/data/rteb/hf_cache/llama3_2_1b_inline_multi_ds
    data_type: train
    n_passages: 3
    seed: 42
    do_shuffle: true
    max_train_samples: null
    use_dataset_instruction: false
  collate_fn:
    _target_: nemo_automodel.components.datasets.llm.BiEncoderCollator
    q_max_len: 512
    p_max_len: 512
    query_prefix: "query:"
    passage_prefix: "passage:"
    padding: true
    pad_to_multiple_of: 8
    use_dataset_instruction: false
  shuffle: true
  num_workers: 8
  drop_last: true
  pin_memory: true

validation_dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  dataset:
    _target_: nemo_automodel.components.datasets.llm.make_retrieval_dataset
    data_dir_list:
      - /lustre/fsw/portfolios/llmservice/users/ybabakhin/data/rteb/rteb_quick_a_i_l_a_casedocs_benchmark_20260525_qwen3_8B_nneg32_0_95_perc.json
      - /lustre/fsw/portfolios/llmservice/users/ybabakhin/data/rteb/rteb_quick_a_i_l_a_statutes_benchmark_20260525_qwen3_8B_nneg32_0_95_perc.json
      - /lustre/fsw/portfolios/llmservice/users/ybabakhin/data/rteb/rteb_quick_legal_summarization_benchmark_20260525_qwen3_8B_nneg32_0_95_perc.json
      - /lustre/fsw/portfolios/llmservice/users/ybabakhin/data/rteb/rteb_quick_legal_qu_a_d_benchmark_20260525_qwen3_8B_nneg32_0_95_perc.json
      - /lustre/fsw/portfolios/llmservice/users/ybabakhin/data/rteb/rteb_quick_finance_bench_retrieval_benchmark_20260525_qwen3_8B_nneg32_0_95_perc.json
      - /lustre/fsw/portfolios/llmservice/users/ybabakhin/data/rteb/rteb_quick_h_c3_finance_retrieval_benchmark_20260525_qwen3_8B_nneg32_0_95_perc.json
      - /lustre/fsw/portfolios/llmservice/users/ybabakhin/data/rteb/rteb_quick_fin_q_a_retrieval_benchmark_20260525_qwen3_8B_nneg32_0_95_perc.json
      - /lustre/fsw/portfolios/llmservice/users/ybabakhin/data/rteb/rteb_quick_apps_retrieval_benchmark_20260525_qwen3_8B_nneg32_0_95_perc.json
      - /lustre/fsw/portfolios/llmservice/users/ybabakhin/data/rteb/rteb_quick_d_s1000_retrieval_benchmark_20260525_qwen3_8B_nneg32_0_95_perc.json
      - /lustre/fsw/portfolios/llmservice/users/ybabakhin/data/rteb/rteb_quick_human_eval_retrieval_benchmark_20260525_qwen3_8B_nneg32_0_95_perc.json
      - /lustre/fsw/portfolios/llmservice/users/ybabakhin/data/rteb/rteb_quick_m_b_p_p_retrieval_benchmark_20260525_qwen3_8B_nneg32_0_95_perc.json
      - /lustre/fsw/portfolios/llmservice/users/ybabakhin/data/rteb/rteb_quick_wiki_s_q_l_retrieval_benchmark_20260525_qwen3_8B_nneg32_0_95_perc.json
      - /lustre/fsw/portfolios/llmservice/users/ybabakhin/data/rteb/rteb_quick_fresh_stack_retrieval_benchmark_20260525_qwen3_8B_nneg32_0_95_perc.json
      - /lustre/fsw/portfolios/llmservice/users/ybabakhin/data/rteb/rteb_quick_chat_doctor_retrieval_benchmark_20260525_qwen3_8B_nneg32_0_95_perc.json
    model_type: bi_encoder
    data_type: eval
    n_passages: 11
    seed: 42
    do_shuffle: false
    use_dataset_instruction: false
  collate_fn:
    _target_: nemo_automodel.components.datasets.llm.BiEncoderCollator
    q_max_len: 512
    p_max_len: 512
    query_prefix: "query:"
    passage_prefix: "passage:"
    padding: true
    pad_to_multiple_of: 8
    use_dataset_instruction: false
  batch_size: 1
  shuffle: false
  num_workers: 8
  drop_last: false
  pin_memory: true

# LoRA/PEFT configuration
# Uncomment and configure for LoRA/PEFT
# peft:
#   _target_: nemo_automodel.components._peft.lora.PeftConfig
#   target_modules:
#     - q_proj
#     - k_proj
#     - v_proj
#     - o_proj
#     - gate_proj
#     - up_proj
#     - down_proj
#   exclude_modules: []
#   match_all_linear: True
#   dim: 16
#   alpha: 32
#   use_triton: true

optimizer:
  _target_: transformer_engine.pytorch.optimizers.fused_adam.FusedAdam
  lr: 5.0e-6 # TODO: lr
  betas:
    - 0.9
    - 0.999
  eps: 1.0e-8
  weight_decay: 0.01
  adam_w_mode: true
  bias_correction: true
  master_weights: true

lr_scheduler:
  lr_warmup_steps: 100
  lr_decay_style: linear

checkpoint:
  enabled: true
  checkpoint_dir: ./output/llama3_2_1b_inline_parquet_multi_ds
  model_save_format: safetensors
  save_consolidated: true

distributed:
  strategy: fsdp2
  dp_size: none
  tp_size: 1
  cp_size: 1
  sequence_parallel: false

wandb:
  project: rteb-text-embedding
  entity: nvidia-merlin
  name: llama3_2_1b_inline_parquet_multi_ds


