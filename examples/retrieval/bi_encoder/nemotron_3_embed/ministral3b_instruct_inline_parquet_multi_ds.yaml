# Ministral-3B bi-encoder training with preprocessed inline-Parquet retrieval data.
# Each entry in dataloader.dataset.data_dir_list should be an output directory
# produced by scripts/yauhen/prepare_retrieval_inline_parquet.py.

recipe: TrainBiEncoderRecipe

seed: 42

temperature: 0.02

# 488 steps for 1M samples

step_scheduler:
  global_batch_size: 1024
  local_batch_size: 8
  ckpt_every_steps: 1500
  val_every_steps: 2000
  log_remote_every_steps: 10
  num_epochs: 1
  max_steps: null

dist_env:
  backend: nccl
  timeout_minutes: 30

model:
  _target_: nemo_automodel.NeMoAutoModelBiEncoder.from_pretrained
  pretrained_model_name_or_path: mistralai/Ministral-3-3B-Instruct-2512
  trust_remote_code: true
  extract_submodel: language_model
  pooling: avg
  l2_normalize: true
  use_liger_kernel: true
  use_sdpa_patching: true
  torch_dtype: bfloat16
  attn_implementation: flash_attention_2
  do_distributed_inbatch_negative: true

tokenizer:
  _target_: nemo_automodel.NeMoAutoTokenizer.from_pretrained
  tokenizer_backend: tokenizers
  fix_mistral_regex: true
  split_special_tokens: true
  add_bos_token: true
  add_eos_token: false
  pretrained_model_name_or_path: mistralai/Ministral-3-3B-Instruct-2512
  padding_side: left

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  dataset:
    _target_: nemo_automodel.components.datasets.llm.retrieval_dataset_inline.make_retrieval_dataset
    model_type: bi_encoder
    data_dir_list:
