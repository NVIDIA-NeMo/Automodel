# python examples/retrieval/bi_encoder/finetune.py --config examples/retrieval/bi_encoder/ministral3b_instruct_release_new_baseline.yaml
# Or with torchrun for multi-GPU:
# torchrun --nproc-per-node=8 examples/retrieval/bi_encoder/finetune.py --config examples/retrieval/bi_encoder/ministral3b_instruct_release_new_baseline.yaml


recipe: TrainBiEncoderRecipe

seed: 42

temperature: 0.02

step_scheduler:
  global_batch_size: 128
  local_batch_size: 2
  ckpt_every_steps: 10000
  val_every_steps: 1000
  log_remote_every_steps: 10
  num_epochs: 1
  max_steps: null

dist_env:
  backend: nccl
  timeout_minutes: 30

model:
  _target_: nemo_automodel.NeMoAutoModelBiEncoder.from_pretrained
  pretrained_model_name_or_path: mistralai/Ministral-3-3B-Instruct-2512
  trust_remote_code: true
  extract_submodel: language_model
  pooling: avg
  l2_normalize: true
  use_liger_kernel: false
  use_sdpa_patching: false
  torch_dtype: bfloat16
  attn_implementation: flash_attention_2

tokenizer:
  _target_: nemo_automodel.NeMoAutoTokenizer.from_pretrained
  tokenizer_backend: tokenizers
  fix_mistral_regex: true
  split_special_tokens: true
  add_bos_token: true
  add_eos_token: false
  pretrained_model_name_or_path: mistralai/Ministral-3-3B-Instruct-2512
  padding_side: left

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
