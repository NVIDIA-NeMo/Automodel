recipe: TrainBiEncoderRecipe

seed: 42

temperature: 0.02

step_scheduler:
  global_batch_size: 128
  local_batch_size: 2
  ckpt_every_steps: 500
  val_every_steps: 500
  num_epochs: 1
  log_remote_every_steps: 10

dist_env:
  backend: nccl
  timeout_minutes: 15

model:
  _target_: nemo_automodel.NeMoAutoModelBiEncoder.from_pretrained
  #pretrained_model_name_or_path: mistralai/Ministral-3-3B-Instruct-2512-BF16
  #pretrained_model_name_or_path: /lustre/fsw/portfolios/datascience/users/gmoreira/models/Ministral-3-3B-Instruct-2512-BF16
  #pretrained_model_name_or_path: /lustre/fsw/portfolios/datascience/users/gmoreira/models/Ministral-3-1B-Instruct-2512-BF16_llm_replaced_nemotron_3_embed_1B
  pretrained_model_name_or_path: /lustre/fsw/portfolios/datascience/users/gmoreira/model_checkpoints/ministral3_1b_vl/ministral3_1b_all_fsdp2_lr3e4_only_projector_round2_20260721_v1/epoch_0_step_2047/model/consolidated
  trust_remote_code: true
  pooling: avg
  l2_normalize: true
  use_liger_kernel: true
  use_sdpa_patching: true
  dtype: bfloat16
  attn_implementation: flash_attention_2


#freeze_config:
#  freeze_vision_tower: true
#  freeze_language_model: true


tokenizer:
