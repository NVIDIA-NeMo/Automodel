optimizer:
  _target_: transformer_engine.pytorch.optimizers.fused_adam.FusedAdam
  lr: 1.0e-5
  weight_decay: 0.01
  adam_w_mode: true
  bias_correction: true
  master_weights: true

lr_scheduler:
  lr_warmup_steps: 0
  lr_decay_style: linear

checkpoint:
  enabled: true
  checkpoint_dir: .outputs/ministral3_1b_all_fsdp2_lr1e5_stage2_image_text_20260728_v3
  model_save_format: safetensors
  save_consolidated: final
  #restore_from: /lustre/fsw/portfolios/datascience/users/gmoreira/model_checkpoints/ministral3_3b_vl/ministral3_3b_fp8_ac_all_fsdp2_lr2e6-20260713/epoch_0_step_1856

distributed:
  strategy: fsdp2
  dp_size: none
  tp_size: 1
  cp_size: 1
  activation_checkpointing: true
  activation_checkpointing_scope: all
  reshard_after_forward: false
  enable_fsdp2_prefetch: false

