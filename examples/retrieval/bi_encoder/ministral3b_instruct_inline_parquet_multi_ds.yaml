# Ministral-3B bi-encoder training with preprocessed inline-Parquet retrieval data.
# Each entry in dataloader.dataset.data_dir_list should be an output directory
# produced by scripts/yauhen/prepare_retrieval_inline_parquet.py.

recipe: TrainBiEncoderRecipe

seed: 42

temperature: 0.04

step_scheduler:
  global_batch_size: 128
  local_batch_size: 4
  ckpt_every_steps: 5000
  val_every_steps: 1000
  log_remote_every_steps: 10
  num_epochs: 1
  max_steps: null

dist_env:
  backend: nccl
  timeout_minutes: 30

model:
  _target_: nemo_automodel.NeMoAutoModelBiEncoder.from_pretrained
  pretrained_model_name_or_path: mistralai/Ministral-3-3B-Instruct-2512
  trust_remote_code: true
  extract_submodel: language_model
  pooling: last
  l2_normalize: true
  use_liger_kernel: false
  use_sdpa_patching: false
  torch_dtype: bfloat16
  attn_implementation: eager

tokenizer:
  _target_: transformers.AutoTokenizer.from_pretrained
  pretrained_model_name_or_path: mistralai/Ministral-3-3B-Instruct-2512
  padding_side: left

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  dataset:
    _target_: nemo_automodel.components.datasets.llm.retrieval_dataset_inline.make_retrieval_dataset
    model_type: bi_encoder
    data_dir_list:
      - /lustre/fsw/portfolios/llmservice/users/ybabakhin/data/rteb/nq_inline_nneg4
    cache_dir: /lustre/fsw/portfolios/llmservice/users/ybabakhin/data/rteb/hf_cache/ministral3_3b_inline_multi_ds
    data_type: train
    n_passages: 5
    seed: 42
    do_shuffle: false
    max_train_samples: null
    use_dataset_instruction: false
  collate_fn:
    _target_: nemo_automodel.components.datasets.llm.BiEncoderCollator
    q_max_len: 512
    p_max_len: 512
    query_prefix: "query:"
    passage_prefix: "passage:"
    padding: true
    pad_to_multiple_of: 8
    use_dataset_instruction: false
  shuffle: true
  num_workers: 8
  drop_last: true
  pin_memory: true

validation_dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  dataset:
    _target_: nemo_automodel.components.datasets.llm.make_retrieval_dataset
    data_dir_list:
      - /lustre/fsw/portfolios/llmservice/users/ybabakhin/data/TextQA_train/miracl_train_en_llama3_1b_4m_512len_eval.json
    model_type: bi_encoder
    data_type: eval
    n_passages: 5
    seed: 42
    do_shuffle: false
    use_dataset_instruction: false
  collate_fn:
    _target_: nemo_automodel.components.datasets.llm.BiEncoderCollator
    q_max_len: 512
    p_max_len: 512
    query_prefix: "query:"
    passage_prefix: "passage:"
    padding: true
    pad_to_multiple_of: 8
    use_dataset_instruction: false
  shuffle: false
  num_workers: 8
  drop_last: false
  pin_memory: true

optimizer:
  _target_: transformer_engine.pytorch.optimizers.fused_adam.FusedAdam
  lr: 2.0e-6
  weight_decay: 0.01
  adam_w_mode: true
  bias_correction: true
  master_weights: true

lr_scheduler:
  lr_warmup_steps: 100
  lr_decay_style: linear

checkpoint:
  enabled: true
  checkpoint_dir: ./output/ministral3_3b_inline_parquet_multi_ds
  model_save_format: safetensors
  save_consolidated: true

distributed:
  strategy: fsdp2
  dp_size: none
  tp_size: 1
  cp_size: 1
  sequence_parallel: false

wandb:
  project: rteb-text-embedding
  entity: nvidia-merlin
  name: ministral3_3b_inline_parquet_multi_ds
