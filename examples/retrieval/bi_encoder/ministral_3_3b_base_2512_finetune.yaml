# Fine-tuning example; validate training and memory on your hardware.
# Run from the repository root:
#   uv run automodel examples/retrieval/bi_encoder/ministral_3_3b_base_2512_finetune.yaml --nproc-per-node 8
# Checkpoint configuration inspected at Hugging Face revision: 6f9c4b12a95b139af68670a6713616b757923735

recipe: TrainBiEncoderRecipe
seed: 42
temperature: 0.02
step_scheduler:
  global_batch_size: 8
  local_batch_size: 1
  ckpt_every_steps: 50
  val_every_steps: 50
  num_epochs: 1
  max_steps: 100
dist_env:
  backend: nccl
  timeout_minutes: 5
model:
  _target_: nemo_automodel.NeMoAutoModelBiEncoder.from_pretrained
  pretrained_model_name_or_path: mistralai/Ministral-3-3B-Base-2512
  trust_remote_code: true
  pooling: avg
  l2_normalize: true
  is_causal: false
  use_liger_kernel: false
  use_sdpa_patching: true
  attn_implementation: eager
  extract_submodel: language_model
  dtype: float32
tokenizer:
  _target_: nemo_automodel.NeMoAutoTokenizer.from_pretrained
  pretrained_model_name_or_path: mistralai/Ministral-3-3B-Base-2512
  padding_side: left
  tokenizer_backend: tokenizers
  fix_mistral_regex: true
  split_special_tokens: true
  add_bos_token: true
  add_eos_token: false
dataset:
  _target_: nemo_automodel.components.datasets.llm.retrieval_dataset.RetrievalDatasetConfig
  model_type: bi_encoder
  data_dir_list:
  - hf://nvidia/embed-nemotron-dataset-v1/FEVER
  - hf://nvidia/embed-nemotron-dataset-v1/SyntheticClassificationData
  data_type: train
  n_passages: 5
  seed: 42
  do_shuffle: true
dataloader:
  collate_fn:
    _target_: nemo_automodel.components.datasets.llm.BiEncoderCollator
    q_max_len: 512
    p_max_len: 512
    query_prefix: 'query:'
    passage_prefix: 'passage:'
    pad_to_multiple_of: 8
  shuffle: true
  num_workers: 0
optimizer:
  _target_: torch.optim.AdamW
  lr: 2.0e-06
  weight_decay: 0.01
lr_scheduler:
  lr_warmup_steps: 10
  lr_decay_style: linear
checkpoint:
  enabled: true
  checkpoint_dir: checkpoints/ministral_3_3b_base_2512
  model_save_format: safetensors
  save_consolidated: true
distributed:
  strategy: fsdp2
  dp_size: none
  tp_size: 1
  cp_size: 1
  sequence_parallel: false

ci:
  recipe_owner: akoumpa
  time: "00:20:00"
  nodes: 1
