# Hy4-flash synthetic training benchmark: 131,072-token sequences of random token ids (one document per sequence),
# randomly initialized BF16 weights. 8 nodes x 8 H100 80GB; EP64, CP16, TP1, PP1 (DP4); one sequence per data-parallel
# replica and step, split over 16 context-parallel ranks.
# Parameters stay unsharded after the forward. Context parallelism takes one packed row per rank, so the local batch
# size is 1.
# Launch requirements (NCCL_PXN_DISABLE=1 on multi-node InfiniBand H100 systems, JIT cache placement): see the
# Hy4-flash model card, docs/model-coverage/llm/tencent/hy4-flash.mdx.

recipe: BenchmarkingRecipeForNextTokenPrediction
seed: 1234
benchmark:
  json_output_path: training_logs/hy4_flash_128k_cp16_ep64_h100.json
  nsys_start: -1
  nsys_end: -1
  nsys_ranks: []
  num_nodes: 8
  peak_tflops: 989
  warmup_steps: 6
step_scheduler:
  global_batch_size: 4
  local_batch_size: 1
  max_steps: 20
  num_epochs: 1
  ckpt_every_steps: 1000
  val_every_steps: 1000
  gc_every_steps: 100
  save_checkpoint_every_epoch: false
dist_env:
  backend: nccl
  timeout_minutes: 60
model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_config
  config:
    # Architecture from the official checkpoint; weights are randomly initialized BF16 (load_base_model: false).
    _target_: nemo_automodel.components.models.hy_v4_flash.config.HY4FlashConfig.from_pretrained
    pretrained_model_name_or_path: tencent/Hy4-flash
    revision: eccd3123eec73f2040f4c9ed0de1883593470510  # pragma: allowlist secret (public model commit SHA)
  load_base_model: false
  torch_dtype: bfloat16
  trust_remote_code: false
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: cudnn
    linear: torch
    rms_norm: torch
    experts: torch_mm
    dispatcher: hybridep
    gate_precision: float32
    rope_fusion: false
    shared_expert_overlap: true
    compile_router_weight: true
    compile_hc: true
    compile_norm: true  # rounds once where the reference rounds twice in BF16; see the model card
    dispatcher_equal_token_counts: true
    fake_balanced_gate: true  # balanced routing: removes routing imbalance, not a measurement of learned routing
    fake_gate_noise: 0.0
    enable_hf_state_dict_adapter: false
    enable_fsdp_optimizations: true
distributed:
  strategy: fsdp2
  tp_size: 1
  cp_size: 16
  pp_size: 1
  ep_size: 64
  sequence_parallel: false
  activation_checkpointing: true
  defer_fsdp_grad_sync: false
  reshard_after_forward: false
  moe:
    reshard_after_forward: false
    wrap_outer_model: true
    lm_head_precision: float32
    ignore_router_for_ac: true
checkpoint:
  enabled: false
loss_fn:
  _target_: nemo_automodel.components.loss.linear_ce.FusedLinearCrossEntropy
  ignore_index: -100
  impl: torch_compile
dataset:
  _target_: nemo_automodel.components.datasets.llm.mock_iterable_dataset.MockIterableDataset
  include_position_ids: false
  num_samples: 100000
  seq_len: 131072
  vocab_size: 120000
dataloader:
  _target_: torch.utils.data.DataLoader
  batch_size: null
  num_workers: 0
optimizer:
  _target_: transformer_engine.pytorch.optimizers.fused_adam.FusedAdam
  betas: [0.9, 0.95]
  eps: 1.0e-08
  lr: 1.0e-05
  weight_decay: 0.1
  adam_w_mode: true
  bias_correction: true
  master_weights: true
  store_param_remainders: true
  exp_avg_dtype: torch.bfloat16
  exp_avg_sq_dtype: torch.bfloat16
lr_scheduler:
  lr_decay_style: constant
  lr_warmup_steps: 0
  min_lr: 0.0
prewarm:
  comm_groups: true
wandb:
  enable: false
ci:
  nemo_ci_schedule: skipped
  cluster_tag: h100
  recipe_owner: HuiyingLi
  nodes: 8
  time: "00:45:00"
  nproc_per_node: 8
  env_vars:
    NCCL_PXN_DISABLE: "1"
