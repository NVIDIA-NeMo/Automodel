# Benchmarking config for Qwen3 MoE 30B (A3B) in BF16 on GB200: TE attention, Linear and RMSNorm,
# TE GroupedLinear experts without FP8, and the HybridEP dispatcher. BF16 counterpart of the H100
# recipe qwen3_moe_30b_te_deepep.yaml and of qwen3_moe_30b_te_mxfp8_gb200.yaml at the same
# GBS 512 / seq 4096 / EP8 operating point, so the three performance-summary rows compare directly.
#
# Parallelism: 2 nodes x 4 GB200, ep_size=8 == world, tp=pp=cp=1, dp_size=8; lbs=16 gives
# 512 / (8 * 16) = 4 gradient-accumulation micro-batches. peak_tflops=2500 is the GB200 BF16
# dense peak (the H100 recipe uses 989).
#
# Routing knobs that only hold for the benchmark's deterministic balanced gate (fake_balanced_gate
# with fake_gate_noise 0 and fixed-shape mock batches): benchmark_static_routing caches the
# per-microbatch routing metadata, dispatcher_equal_token_counts skips HybridEP's per-dispatch
# EP-group max all-reduce and host sync, and compile_router_weight fuses the fp32 router-weight
# multiply. Do not copy them into a recipe with a learned gate or variable-length inputs.
#
# ep_size == world leaves the TE expert parameters as plain tensors next to DTensor parameters,
# so optimizer.foreach=false keeps Adam from batching both kinds in one _foreach_lerp_ call.
#
# Measured on 8 GB200 with the 26.10 container: 9.505 s/step, 25.38% MFU at peak 2500
# (634 TFLOPs/GPU), 107 GB peak memory, 10 warmup and 20 measured steps.
# Measured without gain at this shape and left off: dispatcher_recompute_cache=combine (same step
# time, +12 GB), HybridEP permute fusion and compact routing (+3% step time), te_grouped_tensor
# (+0.5%), and FusedLinearCrossEntropy (+27% step time, -44 GB).

recipe: BenchmarkingRecipeForNextTokenPrediction

seed: 1234

benchmark:
  warmup_steps: 10
  peak_tflops: 2500  # GB200 BF16 dense peak TFLOPs
  nsys_start: -1
  nsys_end: -1
  nsys_ranks: []
  num_nodes: 2

step_scheduler:
  gc_every_steps: 10
  global_batch_size: 512
  local_batch_size: 16
  ckpt_every_steps: 1000
  val_every_steps: 1000
  num_epochs: 1
  max_steps: 30

distributed:
  strategy: fsdp2
  tp_size: 1
  cp_size: 1
  pp_size: 1
  ep_size: 8

  sequence_parallel: false
  activation_checkpointing: true

  pipeline:
    pp_schedule: interleaved1f1b
    pp_microbatch_size: 2
    round_virtual_stages_to_pp_multiple: down
    scale_grads_in_schedule: false
    patch_inner_model: false
    patch_causal_lm_model: false
    layers_per_stage: 2

dist_env:
  backend: nccl
  timeout_minutes: 10

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_config
  config:
    _target_: nemo_automodel.NeMoAutoConfig.from_pretrained
    pretrained_model_name_or_path: Qwen/Qwen3-30B-A3B
  trust_remote_code: true
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: te
    linear: te
    rms_norm: te
    rope_fusion: true
    experts: te  # TE GroupedLinear in BF16 (no te_fp8 block)
    dispatcher: hybridep  # GB200: deepep fails EP-buffer init ('invalid resource handle')
    fake_balanced_gate: true
    enable_hf_state_dict_adapter: true
    enable_fsdp_optimizations: true
    compile_router_weight: true
    dispatcher_equal_token_counts: true  # benchmark only: balanced gate, fixed-shape batches
    benchmark_static_routing: true  # benchmark only: requires fake_balanced_gate, noise 0

checkpoint:
  enabled: false

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy
  fp32_upcast: false

dataset:
  _target_: nemo_automodel.components.datasets.llm.mock_iterable_dataset.MockIterableDataset
  seq_len: 4096
  num_samples: 100000

dataloader:
  batch_size: null  # Dataset already yields batches
  _target_: torch.utils.data.DataLoader
  num_workers: 0

optimizer:
  _target_: torch.optim.Adam
  betas:
  - 0.9
  - 0.999
  eps: 1e-8
  lr: 0.0001
  weight_decay: 0
  foreach: false  # ep==world: TE expert params are plain tensors, the rest DTensor; per-param Adam


ci:
  time: "00:40:00"
  nodes: 2
  cluster_tag: gb200
  ep_size: 8
