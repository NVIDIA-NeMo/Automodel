title: qwen3_30b_a3b
summary: >
  Qwen3-30B-A3B has completed bounded RedPajama2 pretraining and a direct
  middle-checkpoint resume on 16 H100 GPUs using the Megatron Bridge convergence
  contract. Timing and throughput from those real-data runs are functional
  observations, not tuned performance results. SFT, 128K CoderForge SFT, PEFT,
  vLLM checkpoint loading, and the canonical performance recipe remain to be
  verified.

