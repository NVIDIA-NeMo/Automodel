# Full-size Kimi-K3 (93 layers / 896 experts, 2.78T total / 104B active)
# throughput benchmark on 64 nodes x 4 GB200 (256 GPUs): EP32 x PP8, DP32.
#
# Measured with this exact configuration (64 nodes, 12 iterations, recipe
# summary = mean over the 9 iterations after 3 warm-up iterations):
# 392.4 tok/s/GPU at 41.8 s/iteration, Average MFU 10.9% on the recipe's
# config-derived FLOPs basis (also 10.9% on tok/s/GPU * 6 * 104e9 / 2.25e15,
# the GB200 bf16 dense peak). Peak memory 129.3 GiB per GPU. Measured
# with the model initialized by this PR's fix (earlier figures for this file
# came from an uninitialized model and were higher). Run the file through
# nemo_automodel/recipes/llm/benchmark.py --config <this file> to get the
# per-iteration MFU and the Average MFU summary.
#
# Benchmark regime notes:
# - Random init + fake_balanced_gate (uniform static routing): the standard
#   upper-bound yardstick; a random-init learned gate routes degenerately.
# - Mock fixed-1024-token rows keep tokens/step constant so MFU is
#   deterministic and comparable across clusters.
# - prewarm avoids the step-0 lazy-NCCL-init OOM (pp_microbatch_size=2) and
#   the fla/cuBLAS cold-start stall; compile_situ fuses the fp32 SiTU and
#   attention-residual chains; compile_norm fuses the fp32 RMSNorm chain (the
#   remaining per-token launch tax at this scale); benchmark_static_routing
#   removes per-microbatch host syncs on routing metadata (only sound with
#   fake_balanced_gate, enforced at config validation);
#   enable_fsdp2_prefetch overlaps FSDP all-gathers that are otherwise
#   fully exposed.
#
#   To run on 64 GB200 NVL72 nodes:
#   automodel examples/llm_benchmark/kimi/kimi_k3_gb200.yaml --nnodes 64 --nproc-per-node 4

recipe: BenchmarkingRecipeForNextTokenPrediction

benchmark:
  warmup_steps: 3
  peak_tflops: 2250   # GB200 bf16 dense peak
  nsys_start: -1
  nsys_end: -1
  nsys_ranks: []
  num_nodes: 64

step_scheduler:
  global_batch_size: 4096
  local_batch_size: 128
  ckpt_every_steps: 1000
  val_every_steps: 1000
  max_steps: 12
  num_epochs: 1

dist_env:
  backend: nccl
  timeout_minutes: 120

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 1234
  ranked: true

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_config
  config:
    _target_: nemo_automodel.components.models.kimi_k3.config.KimiK3TextConfig
    architectures: [KimiK3ForCausalLM]
    dtype: bfloat16
  torch_dtype: bfloat16
  trust_remote_code: false
  kda_mode: chunk
  use_liger_kernel: false
  use_sdpa_patching: false
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: eager
    linear: torch
    rms_norm: torch_fp32
    experts: te
    dispatcher: hybridep
    dispatcher_num_sms: 32
    rope_fusion: false
    fake_balanced_gate: true   # benchmark only — see header
    fake_gate_noise: 0.0
    compile_situ: true
    compile_norm: true
    benchmark_static_routing: true   # requires fake_balanced_gate, noise 0.0
    enable_hf_state_dict_adapter: true
    enable_fsdp_optimizations: true

checkpoint:
  enabled: false

distributed:
  strategy: fsdp2
  tp_size: 1
  cp_size: 1
  pp_size: 8
  ep_size: 32
  sequence_parallel: false
  activation_checkpointing: true
  enable_fsdp2_prefetch: true
  pipeline:
    pp_schedule: 1f1b
    pp_microbatch_size: 2
    scale_grads_in_schedule: false
    patch_inner_model: false
    patch_causal_lm_model: false
  moe:
    reshard_after_forward: false
    wrap_outer_model: false

loss_fn:
  _target_: nemo_automodel.components.loss.linear_ce.FusedLinearCrossEntropy

dataset:
  _target_: nemo_automodel.components.datasets.llm.mock_iterable_dataset.MockIterableDataset
  vocab_size: 10000
  seq_len: 1024
  num_samples: 1000000
  exclude_token_ids: [0]   # KimiK3TextConfig.pad_token_id: the padding row is zero, keep it out of random data

dataloader:
  _target_: torch.utils.data.DataLoader
  batch_size: null  # Dataset already yields batches
  num_workers: 0

optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-5
  weight_decay: 0.0
  betas: [0.9, 0.95]
  eps: 1.0e-8

prewarm:
  comm_groups: true
  fla_gdn_autotune: true
  cublas_backward: true

wandb:
  enable: false

clip_grad_norm:
  max_norm: 1.0

ci:
  recipe_owner: huiyingl
  nodes: 64
  cluster_tag: gb200
  time: "01:00:00"
