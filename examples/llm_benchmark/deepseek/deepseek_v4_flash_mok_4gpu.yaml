# DeepSeek-V4-Flash full-width, four-layer random-init MoK benchmark on one
# 4xGB200 node. Every layer retains the published 256-expert, H=4096,
# routed-I=2048, top-6 MoE shape. This mock pretraining run does not load a
# checkpoint.
#
# Build the sibling checkout once with `MOK_ARCH=SM100`, then run from AutoModel:
#   PYTHONPATH=../mixture-of-kittens:$PYTHONPATH \
#     automodel examples/llm_benchmark/deepseek/deepseek_v4_flash_mok_4gpu.yaml --nproc-per-node 4

recipe: BenchmarkingRecipeForNextTokenPrediction

seed: 1234

benchmark:
  warmup_steps: 5
  peak_tflops: 2500
  nsys_start: -1
  nsys_end: -1
  nsys_ranks: []
  num_nodes: 1
  json_output_path: training_logs/deepseek_v4_flash_mok_4gpu.json

step_scheduler:
  gc_every_steps: 10
  global_batch_size: 4
  local_batch_size: 1
  ckpt_every_steps: 1000
  val_every_steps: 1000
  num_epochs: 1
  max_steps: 20

distributed:
  strategy: fsdp2
  tp_size: 1
  cp_size: 1
  pp_size: 1
  ep_size: 4
  sequence_parallel: false
  activation_checkpointing: true
  moe:
    reshard_after_forward: false
    wrap_outer_model: false

dist_env:
  backend: nccl
  timeout_minutes: 20

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_config
  config:
    _target_: nemo_automodel.components.models.deepseek_v4.config.DeepseekV4Config
    architectures: [DeepseekV4ForCausalLM]
    num_hidden_layers: 4
    num_nextn_predict_layers: 0
    use_cache: false
    rope_scaling:
      beta_fast: 32
      beta_slow: 1
      factor: 16
      original_max_position_embeddings: 65536
      type: yarn
    compress_ratios: [0, 0, 4, 128]
  trust_remote_code: false
  load_base_model: false
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: torch
    linear: torch
    rms_norm: torch_fp32
    rope_fusion: false
    experts: torch_mm  # Ignored by MoK; retained for parity with HybridEP recipes.
    dispatcher: mok
    gate_precision: float32
    fake_balanced_gate: false
    enable_hf_state_dict_adapter: false
    enable_fsdp_optimizations: true
    mok:
      fwd_num_comm_sms: 24
      bwd_num_comm_sms: 28
      minibatch_size: 4096
      macrobatch_size: 131072
      schedule_capacity_multiplier: 0.5
      all_gather_top_experts_chunk_bytes: 2048

checkpoint:
  enabled: false

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy
  fp32_upcast: false

dataset:
  _target_: nemo_automodel.components.datasets.llm.mock_iterable_dataset.MockIterableDataset
  vocab_size: 129280
  seq_len: 4096
  num_samples: 100000

dataloader:
  batch_size: null
  _target_: torch.utils.data.DataLoader
  num_workers: 0

optimizer:
  _target_: torch.optim.AdamW
  betas: [0.9, 0.95]
  eps: 1.0e-5
  lr: 1.0e-5
  weight_decay: 0.1
  foreach: false

lr_scheduler:
  lr_decay_style: constant
  lr_warmup_steps: 0
  min_lr: 0.0
