# Full 43-layer Flash mock benchmark: 8 nodes x 8 H100; PP2 / EP32 / 4K.
# Uses the unmodified repository benchmark loop, including forward/backward
# and optimizer.step, without the production recipe grad-norm/clipping path.
# FakeBalancedGate (noise 0); MTP and indexer auxiliary training disabled.
# Original chunked CE and PP output collection are used.
# Selected backend settings validated with the original repository benchmark.
# 20 iterations, 6 warmup.
# MFU denominator: 989 BF16 dense TFLOP/s per GPU; exclude AC recomputation.

recipe: BenchmarkingRecipeForNextTokenPrediction

benchmark:
  json_output_path: training_logs/deepseek_v4_flash_h100_optimized.json
  nsys_start: -1
  nsys_end: -1
  nsys_ranks: []
  num_nodes: 8
  peak_tflops: 989
  warmup_steps: 6
checkpoint:
  enabled: false
dataloader:
  _target_: torch.utils.data.DataLoader
  batch_size: null
  num_workers: 0
dataset:
  _target_: nemo_automodel.components.datasets.llm.mock_iterable_dataset.MockIterableDataset
  include_position_ids: false
  num_samples: 100000
  seq_len: 4096
  vocab_size: 129280
dist_env:
  backend: nccl
  timeout_minutes: 30
distributed:
  activation_checkpointing: true
  cp_size: 1
  defer_fsdp_grad_sync: false
  ep_size: 32
  moe:
    mp_policy:
      _target_: torch.distributed.fsdp.MixedPrecisionPolicy
      cast_forward_inputs: false
      output_dtype: null
      param_dtype: bfloat16
      reduce_dtype: bfloat16
    reshard_after_forward: false
    wrap_outer_model: false
  pp_size: 2
  sequence_parallel: false
  strategy: fsdp2
  tp_size: 1
  pipeline:
    pp_schedule: 1f1b
    pp_microbatch_size: 1
    pp_recv_buffer_pool: true
    pp_recv_buffer_pool_slack: 0
    dtype: bfloat16
    patch_inner_model: false
    patch_causal_lm_model: false
loss_fn:
  _target_: nemo_automodel.components.loss.chunked_ce.ChunkedCrossEntropy
  chunk_len: 512
lr_scheduler:
  lr_decay_style: constant
  lr_warmup_steps: 0
  min_lr: 0.0
model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_config
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: cudnn
    benchmark_static_routing: false
    compile_hc: true
    dispatcher: hybridep
    dispatcher_async_dispatch: true
    dispatcher_capacity_factor: null
    dispatcher_equal_token_counts: true
    dispatcher_hybridep_compact_routing: true
    dispatcher_hybridep_permute_fusion: true
    dispatcher_recompute_cache: moe_tail
    enable_fsdp_optimizations: true
    enable_hf_state_dict_adapter: false
    experts: torch_mm
    fake_balanced_gate: true
    fake_gate_noise: 0.0
    gate_precision: float32
    linear: torch
    rms_norm: torch_fp32
    rope: triton
    rope_fusion: false
    shared_expert_overlap: true
  config:
    # Load architecture from the official checkpoint; keep mock BF16 weights.
    _target_: nemo_automodel.components.models.deepseek_v4.config.DeepseekV4Config.from_pretrained
    pretrained_model_name_or_path: deepseek-ai/DeepSeek-V4-Flash
    revision: 60d8d70770c6776ff598c94bb586a859a38244f1  # pragma: allowlist secret (public model commit SHA)
    # Checkpoint quantization describes stored weights, not this BF16 benchmark.
    quantization_config: null
    num_nextn_predict_layers: 0
    use_cache: false
    group_compressor_fsdp_units: true
    group_fp32_fsdp_units: true
    reuse_sparse_selection_on_recompute: true
    fuse_qnorm_rope: true
  load_base_model: false
  torch_dtype: bfloat16
  trust_remote_code: false
optimizer:
  _target_: transformer_engine.pytorch.optimizers.FusedAdam
  betas:
  - 0.9
  - 0.95
  eps: 1.0e-08
  exp_avg_dtype: torch.bfloat16
  exp_avg_sq_dtype: torch.bfloat16
  lr: 1.0e-05
  master_weights: true
  store_param_remainders: true
  weight_decay: 0.1
# Initialize PP and parameter communication groups through the existing prewarm.
prewarm:
  comm_groups: true
seed: 1234
step_scheduler:
  ckpt_every_steps: 1000
  gc_every_steps: 100
  global_batch_size: 512
  local_batch_size: 16
  max_steps: 20
  num_epochs: 1
  save_checkpoint_every_epoch: false
  val_every_steps: 1000
wandb:
  enable: false
ci:
  cluster_tag: h100
  nodes: 8
  nproc_per_node: 8
  recipe_owner: HuiyingLi
  time: 01:00:00
