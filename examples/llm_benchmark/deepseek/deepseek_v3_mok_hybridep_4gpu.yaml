# Matched BF16 baseline for deepseek_v3_mok_4gpu.yaml on one 4xGB200 node.
# Only the dispatcher changes between the pair: HybridEP + grouped_gemm here,
# versus MoK's fused dispatch/shared+routed-SwiGLU megakernel in the MoK recipe.
#
# Run from the AutoModel checkout:
#   automodel examples/llm_benchmark/deepseek/deepseek_v3_mok_hybridep_4gpu.yaml --nproc-per-node 4

recipe: BenchmarkingRecipeForNextTokenPrediction

seed: 1234

benchmark:
  warmup_steps: 5
  peak_tflops: 2500
  nsys_start: -1
  nsys_end: -1
  nsys_ranks: []
  num_nodes: 1
  json_output_path: training_logs/deepseek_v3_mok_hybridep_4gpu.json

step_scheduler:
  gc_every_steps: 10
  global_batch_size: 4
  local_batch_size: 1
  ckpt_every_steps: 1000
  val_every_steps: 1000
  num_epochs: 1
  max_steps: 20

distributed:
  strategy: fsdp2
  tp_size: 1
  cp_size: 1
  pp_size: 1
  ep_size: 4
  sequence_parallel: false
  activation_checkpointing: false

dist_env:
  backend: nccl
  timeout_minutes: 10

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_config
  config:
    _target_: transformers.models.deepseek_v3.configuration_deepseek_v3.DeepseekV3Config
    architectures: [DeepseekV3ForCausalLM]
    vocab_size: 8192
    hidden_size: 4096
    intermediate_size: 11008
    moe_intermediate_size: 1024
    num_hidden_layers: 4
    num_attention_heads: 32
    num_key_value_heads: 32
    n_shared_experts: 1
    n_routed_experts: 64
    num_experts_per_tok: 8
    n_group: 1
    topk_group: 1
    first_k_dense_replace: 0
    routed_scaling_factor: 1.0
    norm_topk_prob: true
    kv_lora_rank: 512
    q_lora_rank: null
    qk_nope_head_dim: 128
    qk_rope_head_dim: 64
    v_head_dim: 128
    max_position_embeddings: 4096
    rms_norm_eps: 1.0e-6
    rope_interleave: true
    attention_bias: false
    attention_dropout: 0.0
    dtype: bfloat16
    use_cache: false
  trust_remote_code: false
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: sdpa
    linear: torch
    rms_norm: torch_fp32
    rope_fusion: false
    experts: gmm
    dispatcher: hybridep
    fake_balanced_gate: true
    enable_hf_state_dict_adapter: false
    enable_fsdp_optimizations: true
  torch_dtype: bfloat16

checkpoint:
  enabled: false

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy
  fp32_upcast: false

dataset:
  _target_: nemo_automodel.components.datasets.llm.mock_iterable_dataset.MockIterableDataset
  vocab_size: 8192
  seq_len: 4096
  num_samples: 100000

dataloader:
  batch_size: null
  _target_: torch.utils.data.DataLoader
  num_workers: 0

optimizer:
  _target_: torch.optim.Adam
  betas: [0.9, 0.999]
  eps: 1.0e-8
  lr: 1.0e-4
  weight_decay: 0
  foreach: false
