# Benchmarking config for GLM-4.7 LoRA

# To run this recipe:
#   automodel examples/llm_benchmark/glm/glm47_lora.yaml --nproc-per-node 8
# Adjust --nproc-per-node to the number of GPUs available on your machine.

recipe: BenchmarkingRecipeForNextTokenPrediction

seed: 1234
benchmark:
  warmup_steps: 10
  peak_tflops: 989
  nsys_start: -1
  nsys_end: -1
  nsys_ranks: []
  num_nodes: 8
step_scheduler:
  gc_every_steps: 10
  global_batch_size: 512
  local_batch_size: 4
  ckpt_every_steps: 1000
  val_every_steps: 1000
  num_epochs: 1
  max_steps: 30
distributed:
  strategy: fsdp2
  tp_size: 1
  cp_size: 1
  pp_size: 2
  ep_size: 32
  sequence_parallel: false
  activation_checkpointing: true
  pipeline:
    pp_schedule: interleaved1f1b
    pp_microbatch_size: 1
    round_virtual_stages_to_pp_multiple: up
    scale_grads_in_schedule: false
    patch_inner_model: false
    patch_causal_lm_model: false
    layers_per_stage: 2
    module_fqns_per_model_part:
      - ["model.embed_tokens", "model.audio_encoder", "model.audio_model", "model.audio_projector", "model.audio_tower", "model.embed_vision", "model.image_encoder", "model.mm_projector", "model.multi_modal_projector", "model.multimodal_projector", "model.vision_encoder", "model.vision_model", "model.vision_projector", "model.vision_tower", "model.visual", "model.vit_large_projector", "model.layers.0", "model.layers.1", "model.layers.2", "model.rotary_emb"]
      - ["model.layers.3", "model.rotary_emb"]
      - ["model.layers.4", "model.layers.5", "model.layers.6", "model.rotary_emb"]
      - ["model.layers.7", "model.rotary_emb"]
      - ["model.layers.8", "model.layers.9", "model.layers.10", "model.rotary_emb"]
      - ["model.layers.11", "model.rotary_emb"]
      - ["model.layers.12", "model.layers.13", "model.layers.14", "model.rotary_emb"]
      - ["model.layers.15", "model.rotary_emb"]
      - ["model.layers.16", "model.layers.17", "model.layers.18", "model.rotary_emb"]
      - ["model.layers.19", "model.rotary_emb"]
      - ["model.layers.20", "model.layers.21", "model.layers.22", "model.rotary_emb"]
      - ["model.layers.23", "model.rotary_emb"]
      - ["model.layers.24", "model.layers.25", "model.layers.26", "model.rotary_emb"]
      - ["model.layers.27", "model.rotary_emb"]
      - ["model.layers.28", "model.layers.29", "model.layers.30", "model.rotary_emb"]
      - ["model.layers.31", "model.rotary_emb"]
      - ["model.layers.32", "model.layers.33", "model.layers.34", "model.rotary_emb"]
      - ["model.layers.35", "model.rotary_emb"]
      - ["model.layers.36", "model.layers.37", "model.layers.38", "model.rotary_emb"]
      - ["model.layers.39", "model.rotary_emb"]
      - ["model.layers.40", "model.layers.41", "model.layers.42", "model.rotary_emb"]
      - ["model.layers.43", "model.rotary_emb"]
      - ["model.layers.44", "model.layers.45", "model.layers.46", "model.rotary_emb"]
      - ["model.layers.47", "model.rotary_emb"]
      - ["model.layers.48", "model.layers.49", "model.rotary_emb"]
      - ["model.layers.50", "model.layers.51", "model.rotary_emb"]
      - ["model.layers.52", "model.layers.53", "model.rotary_emb"]
      - ["model.layers.54", "model.layers.55", "model.rotary_emb"]
      - ["model.layers.56", "model.layers.57", "model.rotary_emb"]
      - ["model.layers.58", "model.layers.59", "model.rotary_emb"]
      - ["model.layers.60", "model.layers.61", "model.rotary_emb"]
      - ["model.layers.62", "model.layers.63", "model.rotary_emb"]
      - ["model.layers.64", "model.layers.65", "model.rotary_emb"]
      - ["model.layers.66", "model.layers.67", "model.rotary_emb"]
      - ["model.layers.68", "model.layers.69", "model.rotary_emb"]
      - ["model.layers.70", "model.layers.71", "model.rotary_emb"]
      - ["model.layers.72", "model.layers.73", "model.rotary_emb"]
      - ["model.layers.74", "model.layers.75", "model.rotary_emb"]
      - ["model.layers.76", "model.layers.77", "model.rotary_emb"]
      - ["model.layers.78", "model.layers.79", "model.rotary_emb"]
      - ["model.layers.80", "model.layers.81", "model.rotary_emb"]
      - ["model.layers.82", "model.layers.83", "model.rotary_emb"]
      - ["model.layers.84", "model.layers.85", "model.rotary_emb"]
      - ["model.layers.86", "model.layers.87", "model.rotary_emb"]
      - ["model.layers.88", "model.layers.89", "model.rotary_emb"]
      - ["model.layers.90", "model.layers.91", "model.norm", "lm_head", "model.rotary_emb"]
  moe:
    reshard_after_forward: false
    wrap_outer_model: false
dist_env:
  backend: nccl
  timeout_minutes: 10
model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_config
  config:
    _target_: transformers.AutoConfig.from_pretrained
    pretrained_model_name_or_path: zai-org/GLM-4.7
  trust_remote_code: true
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: te
    linear: te
    rms_norm: te
    rope_fusion: true
    experts: gmm
    dispatcher: hybridep
    dispatcher_num_sms: 16
    fake_balanced_gate: true
    enable_hf_state_dict_adapter: true
    enable_fsdp_optimizations: true
peft:
  _target_: nemo_automodel.components._peft.lora.PeftConfig
  target_modules: ["*"]
  dim: 32
  alpha: 32
  dropout: 0.0
  moe_rank_scaling: true
checkpoint:
  enabled: false
loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy
  fp32_upcast: false
dataset:
  _target_: nemo_automodel.components.datasets.llm.mock_iterable_dataset.MockIterableDataset
  seq_len: 4096
  num_samples: 100000
dataloader:
  batch_size: null
  _target_: torch.utils.data.DataLoader
  num_workers: 0
optimizer:
  _target_: torch.optim.Adam
  betas: [0.9, 0.999]
  eps: 1e-8
  lr: 0.0001
  weight_decay: 0

ci:
  time: "00:30:00"
  nodes: 8
