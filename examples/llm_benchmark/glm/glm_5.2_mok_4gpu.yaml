# GLM-5.2 full-width, reduced-depth MoK benchmark on one 4xGB200 node. The
# first three layers preserve GLM-5.2's dense prefix and the next four use its
# full 256-expert MoE shape.
#
# Build the sibling checkout once with `MOK_ARCH=SM100`, then run from AutoModel:
#   PYTHONPATH=../mixture-of-kittens:$PYTHONPATH \
#     automodel examples/llm_benchmark/glm/glm_5.2_mok_4gpu.yaml --nproc-per-node 4

recipe: BenchmarkingRecipeForNextTokenPrediction

seed: 1234

benchmark:
  warmup_steps: 5
  peak_tflops: 2500
  nsys_start: -1
  nsys_end: -1
  nsys_ranks: []
  num_nodes: 1
  json_output_path: training_logs/glm_5.2_mok_4gpu.json

step_scheduler:
  gc_every_steps: 10
  global_batch_size: 4
  local_batch_size: 1
  ckpt_every_steps: 1000
  val_every_steps: 1000
  num_epochs: 1
  max_steps: 20

distributed:
  strategy: fsdp2
  tp_size: 1
  cp_size: 1
  pp_size: 1
  ep_size: 4
  sequence_parallel: false
  activation_checkpointing: false

dist_env:
  backend: nccl
  timeout_minutes: 10

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_config
  config:
    _target_: nemo_automodel.components.models.glm_moe_dsa.config.GlmMoeDsaConfig
    architectures: [GlmMoeDsaForCausalLM]
    vocab_size: 8192
    hidden_size: 6144
    intermediate_size: 12288
    moe_intermediate_size: 2048
    num_hidden_layers: 7
    num_attention_heads: 64
    num_key_value_heads: 64
    n_shared_experts: 1
    n_routed_experts: 256
    num_experts_per_tok: 8
    n_group: 1
    topk_group: 1
    routed_scaling_factor: 2.5
    norm_topk_prob: true
    mlp_layer_types: [dense, dense, dense, sparse, sparse, sparse, sparse]
    kv_lora_rank: 512
    q_lora_rank: 2048
    qk_nope_head_dim: 192
    qk_rope_head_dim: 64
    v_head_dim: 256
    index_topk: 2048
    index_head_dim: 128
    index_n_heads: 32
    indexer_types: [full, full, full, shared, shared, shared, full]
    max_position_embeddings: 4096
    rms_norm_eps: 1.0e-5
    rope_parameters:
      rope_theta: 8000000
      rope_type: default
    attention_bias: false
    attention_dropout: 0.0
    dtype: bfloat16
    use_cache: false
  trust_remote_code: false
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: sdpa
    linear: torch
    rms_norm: torch_fp32
    rope_fusion: false
    experts: gmm  # Ignored by MoK; retained for parity with HybridEP recipes.
    dispatcher: mok
    fake_balanced_gate: true
    enable_hf_state_dict_adapter: false
    enable_fsdp_optimizations: true
    mok:
      fwd_num_comm_sms: 40
      bwd_num_comm_sms: 28
      minibatch_size: 4096
      macrobatch_size: 131072
      schedule_capacity_multiplier: 0.5
      all_gather_top_experts_chunk_bytes: 2048
  torch_dtype: bfloat16

checkpoint:
  enabled: false

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy
  fp32_upcast: false

dataset:
  _target_: nemo_automodel.components.datasets.llm.mock_iterable_dataset.MockIterableDataset
  vocab_size: 8192
  seq_len: 4096
  num_samples: 100000

dataloader:
  batch_size: null
  _target_: torch.utils.data.DataLoader
  num_workers: 0

optimizer:
  _target_: torch.optim.Adam
  betas: [0.9, 0.999]
  eps: 1.0e-8
  lr: 1.0e-4
  weight_decay: 0
  foreach: false
