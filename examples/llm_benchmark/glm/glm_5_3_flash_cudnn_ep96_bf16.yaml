#
# GLM-5.3-Flash text-backbone benchmark: all 45 decoder layers, released widths,
# 288 experts (top 8 + one shared), 12 nodes x 8 H100 80GB, EP96 / CP1.
# Random initialization and mock text; this does not validate checkpoint loading.
# The frozen vision tower is instantiated but is not executed without image inputs.
# BF16 computation uses FP32 master weights and Adam moments; no fake router.
# The theoretical peak is H100 SXM BF16 dense (989 TFLOPs/s), not sparse/FP8.
# Model FLOPs exclude recomputation, indexer masked work, and distributed repeats.
#
# Run with torchrun <distributed arguments>
# nemo_automodel/recipes/llm/benchmark.py --config <this file> under the
# cluster batch launcher. Nsight capture is enabled for rank 0 on steps 3 and 4;
# wrap the launcher with nsys profile --capture-range=cudaProfilerApi and retain
# CUDA/NVTX tracing. Allow steps 5-6 for asynchronous profile export to settle;
# measure steps 7-16, after capture and export.
# The benchmark loop times forward/backward + optimizer, excluding zero_grad
# and reporting; it does not execute clipping, LR scheduling, or router updates.
# Use the per-step global Max iter time for comparisons (the current JSON
# average is rank 0). W&B is opt-in; set wandb.enable=true for recorded runs.

