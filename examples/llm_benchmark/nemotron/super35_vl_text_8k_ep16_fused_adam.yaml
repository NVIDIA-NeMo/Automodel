# Super 3.5 VL text-only mock benchmark: 4 nodes x 4 GB200, one NVLink domain.
# Native entry: nemo_automodel/recipes/llm/benchmark.py
# Required environment: PYTORCH_ALLOC_CONF=expandable_segments:True
# To enable online W&B, set wandb.enable: true and provide authentication.
recipe: BenchmarkingRecipeForNextTokenPrediction
seed: 1234
step_scheduler:
  global_batch_size: 128
  local_batch_size: 8
  max_steps: 15
  num_epochs: 30
  ckpt_every_steps: 1000
  val_every_steps: 1000
  gc_every_steps: 10
dist_env:
  backend: nccl
  timeout_minutes: 10
rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 42
  ranked: true
model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_config
  config:
    _target_: transformers.AutoConfig.from_pretrained
    pretrained_model_name_or_path: /lustre/fsw/portfolios/coreai/users/huiyingl/super35_perf_hsg_20260915/model_full
    trust_remote_code: true
  dtype: bfloat16
  num_nextn_predict_layers: 0
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: te
    linear: te
    rms_norm: te
    experts: te
    dispatcher: hybridep
    fake_balanced_gate: true
    enable_hf_state_dict_adapter: true
distributed:
  strategy: fsdp2
  tp_size: 1
  cp_size: 1
  pp_size: 1
  ep_size: 16
  sequence_parallel: false
  activation_checkpointing: true
  reshard_after_forward: true
  moe:
    reshard_after_forward: true
  multimodal:
    frozen_sharding: replicate
freeze_config:
  freeze_vision_tower: true
  freeze_audio_tower: true
  freeze_language_model: false
loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy
  fp32_upcast: false
dataset:
  _target_: nemo_automodel.components.datasets.llm.mock_iterable_dataset.MockIterableDataset
  seq_len: 8192
  num_samples: 100000
dataloader:
  _target_: torch.utils.data.DataLoader
  batch_size: null
  num_workers: 0
optimizer:
  _target_: torch.optim.Adam
  lr: 0.0001
  betas:
  - 0.9
  - 0.999
  eps: 1.0e-08
  weight_decay: 0
  foreach: false
  param_group_overrides:
  - pattern: (?:^|\.)experts\.(?:gate_up_linear|down_linear)\.
    lr_mult: 1
    wd_mult: 1
  fused: true
checkpoint:
  enabled: false
wandb:
  enable: false
  entity: Nemo-automodel
  project: huiyingl_workspace
  mode: online
  name: super35-vl-text-8k-ep16-fused-adam
benchmark:
  flops_scope: text  # Text-only mock input; vision FLOPs are excluded.
  warmup_steps: 5
  peak_tflops: 2500
  nsys_start: -1
  nsys_end: -1
  nsys_ranks: []
  num_nodes: 4
  json_output_path: training_logs/super35_vl_text_8k_ep16_fused_adam.json

ci:
  recipe_owner: HuiyingLi
  time: "00:15:00"
  nodes: 4
  nproc_per_node: 4
  env_vars:
    PYTORCH_ALLOC_CONF: expandable_segments:True
