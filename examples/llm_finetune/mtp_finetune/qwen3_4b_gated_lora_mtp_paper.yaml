# Section 2.5's objective with Section 3's k=8, rank=128, AdamW, flat 2e-4 LR,
# 5,000-step warmup and 50,000 updates. One GPU accumulates the effective batch
# of eight. Qwen3-4B, Dolly, and sequence length 512 are validation adaptations,
# not a reproduction of the paper's models, data, hardware, or speedups.
# automodel examples/llm_finetune/mtp_finetune/qwen3_4b_gated_lora_mtp_paper.yaml --nproc-per-node 1

recipe: TrainFinetuneRecipeForNextTokenPrediction
seed: 42

step_scheduler:
  global_batch_size: 8
  local_batch_size: 1
  max_steps: 50000
  ckpt_every_steps: 1000
  val_every_steps: 1000

dist_env:
  backend: nccl
  timeout_minutes: 5

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: Qwen/Qwen3-4B
  torch_dtype: bf16
  attn_implementation: flex_attention

peft:
  _target_: nemo_automodel.components._peft.lora.PeftConfig
  target_modules: '*_proj'
  dim: 128
  alpha: 128
  use_triton: false

gated_mtp:
  mask_token_ids: [151700, 151701, 151702, 151703, 151704, 151705, 151706, 151707]
  objective: paper

distributed:
  strategy: fsdp2
  tp_size: 1
  cp_size: 1

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy

dataset:
  _target_: nemo_automodel.components.datasets.llm.column_mapped_text_instruction_dataset.ColumnMappedTextInstructionDataset
  path_or_dataset_id: databricks/databricks-dolly-15k
  split: "train[:14500]"
  column_mapping:
    context: context
    question: instruction
    answer: response
  seq_length: 512
  answer_only_loss_mask: true
  padding: max_length
  truncation: longest_first

validation_dataset:
  _target_: nemo_automodel.components.datasets.llm.column_mapped_text_instruction_dataset.ColumnMappedTextInstructionDataset
  path_or_dataset_id: databricks/databricks-dolly-15k
  split: "train[14500:14800]"
  column_mapping:
    context: context
    question: instruction
    answer: response
  seq_length: 512
  answer_only_loss_mask: true
  padding: max_length
  truncation: longest_first

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.default_collater
  shuffle: true

validation_dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.default_collater

optimizer:
  _target_: torch.optim.AdamW
  lr: 2.0e-4
  betas: [0.9, 0.999]
  eps: 1.0e-8
  weight_decay: 0.01

lr_scheduler:
  init_lr: 0.0
  lr_warmup_steps: 5000
  lr_decay_style: constant

checkpoint:
  enabled: true
  checkpoint_dir: checkpoints_gated_mtp_paper/
  model_save_format: safetensors
  save_consolidated: true

ci:
  nemo_ci_schedule: skipped
  cluster_tag: h100
  recipe_owner: kashif
  time: "00:30:00"
  nodes: 1
