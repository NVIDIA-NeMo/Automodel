# To run this recipe:
#   automodel examples/llm_finetune/moonlight/moonlight_16b_te.yaml --nproc-per-node 8
# Adjust --nproc-per-node to the number of GPUs available on your machine.

recipe: TrainFinetuneRecipeForNextTokenPrediction

step_scheduler:
  global_batch_size: 256  #PR4637: 512
  local_batch_size: 4  #PR4637: 32
  ckpt_every_steps: 500
  val_every_steps: 500  # will run every x number of gradient steps
  num_epochs: 2
  gc_every_steps: 10

dist_env:
  backend: nccl
  timeout_minutes: 10

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 1111
  ranked: true

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: moonshotai/Moonlight-16B-A3B
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: te
    linear: te
    rms_norm: te  #PR4637: torch_fp32
    rope_fusion: false  # Use unfused RoPE for packed THD inputs, matching the existing packed recipes.
    experts: torch_mm  #PR4637: te
    dispatcher: deepep
    fake_balanced_gate: false
    enable_hf_state_dict_adapter: true
    enable_fsdp_optimizations: true
checkpoint:
  enabled: false
  checkpoint_dir: checkpoints/
  model_save_format: safetensors # torch_save or safetensors
  save_consolidated: final

distributed:
  strategy: fsdp2
  tp_size: 1
  cp_size: 1
  pp_size: 1
  ep_size: 8
  sequence_parallel: false
  pipeline:
    pp_schedule: interleaved1f1b
    pp_microbatch_size: 4
    round_virtual_stages_to_pp_multiple: up
    scale_grads_in_schedule: false
    patch_inner_model: false
    patch_causal_lm_model: false
    layers_per_stage: 2
  moe:
    reshard_after_forward: false
loss_fn:
  fp32_upcast: false
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy

dataset:
  _target_: nemo_automodel.components.datasets.llm.squad.make_squad_dataset  #PR4637: nemo_automodel.components.datasets.llm.hellaswag.HellaSwag
  tokenizer:
    _target_: nemo_automodel._transformers.auto_tokenizer.NeMoAutoTokenizer.from_pretrained
    pretrained_model_name_or_path: moonshotai/Moonlight-16B-A3B
    trust_remote_code: true
  dataset_name: rajpurkar/squad  #PR4637: path_or_dataset: rowan/hellaswag
  split: train

  padding: false
packed_sequence:
  # Set packed_sequence_size > 0 to run with packed sequences
  packed_sequence_size: 2048  #PR4637: 0

  packing_strategy: thd
dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.packed_sequence_thd_collater  #PR4637: nemo_automodel.components.datasets.utils.default_collater
  shuffle: true

  drop_last: true
validation_dataset:
  _target_: nemo_automodel.components.datasets.llm.squad.make_squad_dataset  #PR4637: nemo_automodel.components.datasets.llm.hellaswag.HellaSwag
  tokenizer:
    _target_: nemo_automodel._transformers.auto_tokenizer.NeMoAutoTokenizer.from_pretrained
    pretrained_model_name_or_path: moonshotai/Moonlight-16B-A3B
    trust_remote_code: true
  dataset_name: rajpurkar/squad  #PR4637: path_or_dataset: rowan/hellaswag
  split: validation
  limit_dataset_samples: 64

  padding: false
validation_dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.packed_sequence_thd_collater  #PR4637: nemo_automodel.components.datasets.utils.default_collater

optimizer:
  _target_: torch.optim.Adam
  betas: [0.9, 0.999]
  eps: 1e-5
  lr: 1.0e-4
  weight_decay: 0
  # min_lr: 1.0e-5
  # foreach=false is required when using TE GroupedLinear with FSDP
  # because TE weights are regular tensors while FSDP wraps other params as DTensor
  foreach: false

# Uncomment and configure for W&B logging
# wandb:
#   project: automodel-fsdp-moe-opt
#   entity: Nemo-automodel
#   name: moonlight-16b-te-grouped-linear
#   dir: /tmp/wandb

ci:
  nemo_ci_schedule: nightly,release
  cluster_tag: h100
  recipe_owner: akoumpa  #PR4637: hemildesai
  node_multiplier: true
  perf_testing:
    fake_balanced_gate: true
    schedule: nightly
  nodes: 1
  time: 00:40:00
