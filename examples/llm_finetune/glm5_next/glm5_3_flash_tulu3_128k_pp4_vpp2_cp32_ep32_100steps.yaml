# DFW Tulu3 128K full-run configuration, migrated from job 20062078.
# 16 nodes x 8 H100 80GB; BF16; PP4/VPP2, CP32, EP32, TP1, DP1.
# Global/local batch is 8; the pipeline microbatch is 1.
# Historical run: 100 steps at source f7db5c18de363fc287daff8073a55d27eba0c980.
# W&B: https://wandb.ai/Nemo-automodel/glm53flash-cp-tulu3-20261011/runs/gb0ymwxg
#
# The removed fixed input-capacity option is omitted. Keep HybridEP's default
# input-size collective/padding and blocking dispatch; equal EP input lengths
# are not assumed. Training values match the frozen run YAML; W&B logging is
# opt-in for this example.
# The migrated configuration has not been rerun as a full model.
#
# Paths preserve the original DFW bind mount:
# /lustre/fsw/portfolios/coreai/users/huiyingl -> /workspace.
# The historical launcher also bound LOCAL_RANK before model construction and
# installed a version-pinned PyTorch PP completed-send cleanup. That launcher
# and its source/data manifests remain in the original workspace bundle:
# snapshots/verified/full-tulu3-cp32-hidden-gather-batched30m-v2-20261012/.
# This YAML does not install the external PyTorch patch.
#
# Frozen data: allenai/tulu-3-sft-mixture at
# b14afda60f1bbebe55d5d2fa1e4df5042f97f8be, 180000 eligible documents.
# Documents were shuffled before NEAT packing with seed 20261011; packs were
# shuffled with seed 20261012. Preserve their stored order (shuffle: false).
# The data is already packed to 131072 tokens; packed_sequence_size: 0 prevents
# packing it again. Use the same frozen tokens, labels, masks and boundaries.

