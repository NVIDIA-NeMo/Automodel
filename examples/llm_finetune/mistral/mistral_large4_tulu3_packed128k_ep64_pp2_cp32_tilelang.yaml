#
# Mistral Large 4 SFT on Tulu3 with 131072-token packed THD sequences.
# 32 GB200 nodes / 128 GPUs: EP64 / PP2 / CP32 / TP1 / DP2 / expert shard1.
# GBS8 = DP2 x LBS4 x GA1; PP microbatch1; 1F1B with two 36-layer stages.
#
# Prepare the packs with prepare_tulu3_packed.py in this directory and set
# dataset.dataset_path to its output. Labels are assistant-only; documents and
# packs are shuffled with seed 1234.
#
# Attention uses backend.attn=tilelang (sparse MLA); the DSA indexer is frozen.
# FusedAdam keeps BF16 model and moments with FP32 master weights. Logit cap is 30.

recipe: TrainFinetuneRecipeForNextTokenPrediction
seed: 1234
step_scheduler:
  global_batch_size: 8
  local_batch_size: 4
  ckpt_every_steps: 5
  val_every_steps: 1000
  gc_every_steps: 5
  num_epochs: null
  max_steps: 50
  log_remote_every_steps: 1
  save_checkpoint_every_epoch: false
  validate_on_checkpoint: false
dist_env:
  backend: nccl
  timeout_minutes: 60
model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: mistralai/Mistral-Large-4-1T-A52B
  architectures: [MistralLarge4ForCausalLM]
  dtype: bfloat16
  attn_implementation: sdpa
  use_liger_kernel: false
  use_sdpa_patching: false
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: tilelang
    linear: torch
    rms_norm: torch_fp32
    rope: torch
    rope_fusion: false
    experts: torch_mm
    dispatcher: hybridep
    gate_precision: float32
    enable_hf_state_dict_adapter: true
    enable_fsdp_optimizations: false
  fp8_indexer: false
  fp8_kv_cache: false
distributed:
  strategy: fsdp2
  dp_size: none
  tp_size: 1
  cp_size: 32
  pp_size: 2
  ep_size: 64
  sequence_parallel: false
  activation_checkpointing: true
  reshard_after_forward: true
  defer_fsdp_grad_sync: false
  moe:
    reshard_after_forward: true
    wrap_outer_model: true
    ignore_router_for_ac: true
  pipeline:
    pp_schedule: 1f1b
    pp_microbatch_size: 1
    layers_per_stage: 36
    scale_grads_in_schedule: false
    patch_inner_model: false
    patch_causal_lm_model: false
    pp_seq_len: 131072
    pp_recv_buffer_pool: false
checkpoint:
  enabled: true
  checkpoint_dir: checkpoints/mistral-large4-tulu3-packed128k-tilelang-ep64pp2cp32
  is_peft: false
  dequantize_base_checkpoint: true
  load_metadata_with_gloo: true
  model_save_format: safetensors
  save_consolidated: false
  is_async: false
  cpu_offload: true
  max_recent_checkpoints: 2
  restore_from: LATEST
loss_fn:
  _target_: nemo_automodel.components.loss.linear_ce.FusedLinearCrossEntropy
  reduction: sum
  impl: cce
  logit_softcapping: 30.0
dataset:
  _target_: datasets.load_from_disk
  dataset_path: data/mistral_large4_tulu3_packed128k/train
  tokenizer:
    _target_: nemo_automodel.NeMoAutoTokenizer.from_pretrained
    pretrained_model_name_or_path: mistralai/Mistral-Large-4-1T-A52B
    mode: finetuning
    padding_side: right
packed_sequence:
  packed_sequence_size: 131072
  packing_strategy: thd
  prepacked: true
  pad_to_multiple_of: 64
dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  batch_size: 4
  num_workers: 0
  pin_memory: true
  drop_last: true
  shuffle: false
  collate_fn: nemo_automodel.components.datasets.utils.packed_sequence_thd_collater
validation_dataset: none
validation_dataloader: none
optimizer:
  _target_: transformer_engine.pytorch.optimizers.FusedAdam
  lr: 5.0e-06
  betas:
  - 0.9
  - 0.95
  eps: 1.0e-08
  weight_decay: 0.1
  adam_w_mode: true
  master_weights: true
  master_weight_dtype: float32
  store_param_remainders: true
  exp_avg_dtype: bfloat16
  exp_avg_sq_dtype: bfloat16
lr_scheduler:
  lr_decay_style: constant
clip_grad_norm:
  max_norm: 1.0
  backend: triton
wandb:
  enable: false
  entity: nvidia
  project: automodel
  name: mistral-large4-tulu3-packed128k-tilelang-ep64pp2cp32-128gpu
  group: mistral-large4-real-tulu3
  resume: allow
  mode: online
  dir: logs/mistral-large4-tulu3-packed128k-tilelang-ep64pp2cp32-128gpu/wandb
  tags:
  - mistral-large4
  - full-sft
  - tulu3
  - packed128k
  - tilelang
  - hybridep
  - ep64
  - pp2
  - cp32
  - 1f1b
  - 128-gpu
  - expert-shard1

ci:
  recipe_owner: snowmanwwg
  cluster_tag: gb200
  nodes: 32
  time: "04:00:00"
  env_vars:
    SBATCH_SEGMENT_SIZE: "16"
    PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
