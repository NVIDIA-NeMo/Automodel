# LoRA fine-tuning of the 43-layer main decoder of ERNIE-5.5-Flash-Base-BF16 on Tulu-3 packed
# to 131072 tokens with context parallelism: 100 updates of one packed row each.
# Target topology: 2 nodes x 4 GB200 GPUs, WORLD=8, CP=8, EP=8, TP=PP=1. A row is split into 8
# contiguous shards of 16384 tokens, one per rank. The expert-parallel axis spans the same 8
# ranks, one expert group per rank, as in ernie5_5_flash_squad_ep_lora.yaml.
#
# Data: Tulu-3 is shuffled with shuffle_seed before packing, and a document longer than
# 131072 tokens is truncated. The packer starts every document at a multiple of 128 tokens
# (pad_to_multiple_of), the window of the compressed attention (HCA) layers, so that a packed
# row needs no further padding inside the model. The released tokenizer has no chat template;
# tulu3_chat_template.jinja renders the Tulu format and supervises the assistant turns.
#
# Attention never crosses a document boundary. The HCA layers attend to the 128-token window
# and to the compressed keys of the query's own document; a rank receives the last 127 keys
# of the preceding rank and the compressed keys of all ranks. The dynamic sparse attention
# (DSA) layers select and attend within the query's document over the latent keys of the
# whole row, which every rank gathers. Both run on the cuDNN sparse-attention kernels, which
# require nvidia-cudnn-frontend[cutedsl] and FlashMLA; validated on SM100-class GPUs (GB200)
# only.
#
# Memory: activation checkpointing recomputes every decoder layer in backward, and the dense
# weights are resharded after each layer has used them (moe.reshard_after_forward). With
# both, 16384 tokens per rank fit one GB200 next to the frozen weights: a GPU peaked at
# 162 GiB allocated in the validated run.
#
# The LoRA targets, the HybridEP notes, the unsupported settings other than packing and
# context parallelism, and the notes on the model, the tokenizer and the Hub cache are those
# of ernie5_5_flash_squad_ep_lora.yaml.
#
# To run this recipe, from the repository root, on each of the 2 nodes with 4 GPUs, with
# NODE_RANK set to 0 and 1 and MASTER_ADDR set to the first node:
#   uv run torchrun --nnodes=2 --nproc-per-node=4 --node-rank=$NODE_RANK \
#     --master-addr=$MASTER_ADDR --master-port=29500 \
#     -m nemo_automodel.cli.app examples/llm_finetune/ernie5_5/ernie5_5_flash_tulu3_packed128k_cp8_lora.yaml

recipe: TrainFinetuneRecipeForNextTokenPrediction

seed: 1234

step_scheduler:
  # One packed row of 131072 tokens per update, split over the 8 context-parallel ranks.
  global_batch_size: 1
  local_batch_size: 1
  ckpt_every_steps: 1000
  save_checkpoint_every_epoch: false
  val_every_steps: 1000
  num_epochs: 1
  max_steps: 100

dist_env:
  backend: nccl
  timeout_minutes: 60

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: baidu/ERNIE-5.5-Flash-Base-BF16
  revision: 68d19ee51c032344fa0a8018e7dc21b2668a55c4  # pragma: allowlist secret (public model commit SHA)
  trust_remote_code: false
  dtype: bfloat16
  # The released config declares one MTP block (num_nextn_predict_layers: 1) that this model
  # does not construct; this override selects the 43 decoder layers.
  num_nextn_predict_layers: 0
  use_liger_kernel: false
  use_sdpa_patching: false
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    # cuDNN sparse attention for the DSA layers and for the HCA layers of packed rows.
    attn: cudnn
    # HybridEP exchanges routed-expert tokens in BF16; other BackendConfig fields keep their defaults.
    linear: torch
    experts: torch_mm
    dispatcher: hybridep

peft:
  _target_: nemo_automodel.components._peft.lora.PeftConfig
  target_modules:
    - "model.layers.*.attention.wq_a"
    - "model.layers.*.attention.wq_b"
    - "model.layers.*.attention.wkv"
    - "model.layers.*.attention.wo_b"
    - "model.layers.*.attention.gate_proj"
    - "model.layers.*.attention.q_a_proj"
    - "model.layers.*.attention.q_b_proj"
    - "model.layers.*.attention.kv_a_proj_with_mqa"
    - "model.layers.*.attention.o_proj"
    - "model.layers.*.moe.experts"
    - "model.layers.*.mlp.gate_proj"
    - "model.layers.*.mlp.up_proj"
    - "model.layers.*.mlp.down_proj"
    - "model.layers.*.moe.shared_experts.gate_proj"
    - "model.layers.*.moe.shared_experts.up_proj"
    - "model.layers.*.moe.shared_experts.down_proj"
  dim: 8
  alpha: 32

distributed:
  strategy: fsdp2
  tp_size: 1
  pp_size: 1
  # Every rank holds one contiguous shard of 131072 / 8 = 16384 tokens.
  cp_size: 8
  # The expert-parallel axis spans the context-parallel ranks: one expert group per rank.
  ep_size: 8
  activation_checkpointing: true
  mp_policy:
    _target_: torch.distributed.fsdp.MixedPrecisionPolicy
    param_dtype: null
    reduce_dtype: float32
    output_dtype: null
    cast_forward_inputs: false
  moe:
    # Keeps the 31 GiB of dense weights sharded outside the layer that uses them.
    reshard_after_forward: true
    wrap_outer_model: true

checkpoint:
  enabled: false
  save_consolidated: false
  checkpoint_dir: checkpoints/ernie5_5_flash_tulu3_packed128k_cp8_lora/
  # Plans the loading of the weights over a CPU process group, as ernie5_5_flash_squad_ep_lora.yaml does.
  load_metadata_with_gloo: true

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy

dataset:
  _target_: nemo_automodel.components.datasets.llm.chat_dataset.ChatDataset
  path_or_dataset_id: allenai/tulu-3-sft-mixture
  split: train
  shuffle_seed: 1234
  seq_length: 131072
  truncation: true
  padding: false
  chat_template: examples/llm_finetune/ernie5_5/tulu3_chat_template.jinja
  tokenizer:
    _target_: transformers.AutoTokenizer.from_pretrained
    pretrained_model_name_or_path: baidu/ERNIE-5.5-Flash-Base-BF16
    revision: 68d19ee51c032344fa0a8018e7dc21b2668a55c4  # pragma: allowlist secret (public model commit SHA)
    trust_remote_code: false

packed_sequence:
  packing_strategy: thd
  packed_sequence_size: 131072
  # Every document starts at a multiple of the HCA compression window.
  pad_to_multiple_of: 128
  # 100 updates of one packed row, plus a small margin, without tokenizing the whole mixture.
  max_packs: 104
  num_proc: 1

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  batch_size: 1
  num_workers: 0
  drop_last: true
  shuffle: false
  collate_fn: nemo_automodel.components.datasets.utils.packed_sequence_thd_collater

validation_dataset: none
validation_dataloader: none

optimizer:
  _target_: transformer_engine.pytorch.optimizers.fused_adam.FusedAdam
  betas: [0.9, 0.999]
  eps: 1.0e-8
  lr: 1.0e-5
  weight_decay: 0.01
  adam_w_mode: true
  bias_correction: true
  master_weights: true
  master_weight_dtype: torch.float32
  store_param_remainders: true
  exp_avg_dtype: torch.bfloat16
  exp_avg_sq_dtype: torch.bfloat16

clip_grad_norm:
  max_norm: 1.0

ci:
  nemo_ci_schedule: skipped
  cluster_tag: gb200
  recipe_owner: HuiyingLi
  nodes: 2
  time: "02:00:00"
  nproc_per_node: 4
