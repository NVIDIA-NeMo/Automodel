# LFM3-1.7B full-parameter SFT on Tulu-3 packed to 131072 tokens, on one node with 8 GPUs.
#
# Tulu-3 is shuffled with shuffle_seed before packing. Every THD row holds whole documents (one
# longer than the row is cut to fit); positions restart at each document, and attention and the
# short convolutions stay inside it.
# CP8 gives each GPU a contiguous shard of 16384 tokens. A shard fetches only the part of its
# first document that earlier GPUs hold.
#
# To run this recipe:
#   automodel examples/llm_finetune/lfm3/lfm3_1p7b_tulu3_packed128k_cp8.yaml --nproc-per-node 8

recipe: TrainFinetuneRecipeForNextTokenPrediction

seed: 1234

step_scheduler:
  global_batch_size: 4
  local_batch_size: 1
  ckpt_every_steps: 1000
  val_every_steps: 1000
  max_steps: 100

dist_env:
  backend: nccl
  timeout_minutes: 30

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 1234
  ranked: true

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: LiquidAI/LFM3-1.7B
  dtype: bfloat16  # bf16 resident params; fp32 master weights live in TE FusedAdam
  attn_implementation: flash_attention_4

checkpoint:
  enabled: false
  checkpoint_dir: checkpoints/lfm3_1p7b_tulu3_packed128k_cp8/
  model_save_format: safetensors
  save_consolidated: false

distributed:
  strategy: fsdp2
  dp_size: none
  tp_size: 1
  cp_size: 8
  sequence_parallel: false

loss_fn:
  _target_: nemo_automodel.components.loss.linear_ce.FusedLinearCrossEntropy

dataset:
  _target_: nemo_automodel.components.datasets.llm.chat_dataset.ChatDataset
  path_or_dataset_id: allenai/tulu-3-sft-mixture
  split: train
  shuffle_seed: 1234
  seq_length: 131072
  truncation: true
  padding: false

packed_sequence:
  packing_strategy: thd
  packed_sequence_size: 131072
  # 100 optimizer steps x 4 packs, plus a small margin, without tokenizing the whole mixture up front.
  max_packs: 404
  num_proc: 1

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  batch_size: 1
  # Reading a 131072-token row takes about a fifth of a step; two workers do it in the background.
  num_workers: 2
  drop_last: true
  shuffle: false
  collate_fn: nemo_automodel.components.datasets.utils.packed_sequence_thd_collater

validation_dataset: none
validation_dataloader: none

optimizer:
  _target_: transformer_engine.pytorch.optimizers.fused_adam.FusedAdam
  betas: [0.9, 0.999]
  eps: 1e-8
  lr: 1.0e-5
  weight_decay: 0
  adam_w_mode: true
  bias_correction: true
  master_weights: true
  master_weight_dtype: torch.float32
  store_param_remainders: true
  exp_avg_dtype: torch.float32
  exp_avg_sq_dtype: torch.float32

lr_scheduler:
  lr_decay_style: constant

# Uncomment and configure for W&B logging
# wandb:
#   project: <your_wandb_project>
#   entity: <your_wandb_entity>
#   name: <your_wandb_exp_name>
#   save_dir: <your_wandb_save_dir>

ci:
  nemo_ci_schedule: skipped
  cluster_tag: h100
  recipe_owner: HuiyingLi
