# Four-layer, single-node DeepSeek-V4-Flash true-FP8 validation.
#
#   PYTHONPATH=/path/to/tilelang:$PYTHONPATH \
#   DSV4_MODEL_PATH=/path/to/DeepSeek-V4-Flash-Base \
#     automodel \
#       examples/llm_finetune/deepseek_v4/deepseek_v4_flash_true_fp8_4layer.yaml \
#       --nproc-per-node 8
#
# This follows the vLLM 0.21 DSV4 FP8 boundary:
#   * TE 128x128 block FP8 for projections, indexer wq_b, routed experts,
#     shared experts, and grouped wo_a;
#   * vLLM fp8_ds_mla group-64 UE8M0 for the first 448 MLA KV channels,
#     with the final 64 RoPE channels kept in BF16;
#   * post-RoPE indexer Q and indexer K use per-row E4M3 with power-of-two
#     FP32 descales.

recipe: TrainFinetuneRecipeForNextTokenPrediction

seed: 1234

step_scheduler:
  global_batch_size: 8
  local_batch_size: 1
  ckpt_every_steps: 1000
  val_every_steps: 1000
  gc_every_steps: 1
  num_epochs: 1
  max_steps: 4

distributed:
  strategy: fsdp2
  tp_size: 1
  cp_size: 1
  pp_size: 1
  ep_size: 8
  sequence_parallel: false
  activation_checkpointing: true
  moe:
    ignore_router_for_ac: true
    reshard_after_forward: false
    wrap_outer_model: false

dist_env:
  backend: nccl
  timeout_minutes: 30

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_config
  config:
    _target_: nemo_automodel.components.models.deepseek_v4.config.DeepseekV4Config.from_pretrained
    pretrained_model_name_or_path: ${oc.env:DSV4_MODEL_PATH,deepseek-ai/DeepSeek-V4-Flash-Base}
    name_or_path: ${oc.env:DSV4_MODEL_PATH,deepseek-ai/DeepSeek-V4-Flash-Base}
    num_hidden_layers: 4
    num_nextn_predict_layers: 0
    kv_cache_dtype: fp8_ds_mla
    fp8_row_parallel_size: 8
  trust_remote_code: false
  load_base_model: true
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: tilelang
    linear: te
    rms_norm: torch_fp32
    rope_fusion: false
    dispatcher: hybridep
    experts: te
    te_fp8:
      _target_: nemo_automodel.components.models.common.utils.TEFp8Config
      recipe: block
    enable_hf_state_dict_adapter: true
    enable_fsdp_optimizations: true

checkpoint:
  enabled: false
  dequantize_base_checkpoint: true

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy

dataset:
  _target_: nemo_automodel.components.datasets.llm.hellaswag.HellaSwag
  path_or_dataset: rowan/hellaswag
  split: train
  pad_to_max_length: false
  tokenizer:
    _target_: transformers.AutoTokenizer.from_pretrained
    pretrained_model_name_or_path: ${oc.env:DSV4_MODEL_PATH,deepseek-ai/DeepSeek-V4-Flash-Base}

packed_sequence:
  packed_sequence_size: 512

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.packed_sequence_thd_collater
  shuffle: true

optimizer:
  _target_: torch.optim.AdamW
  betas: [0.9, 0.95]
  eps: 1e-8
  lr: 1e-5
  weight_decay: 0.1
  # TE GroupedLinear expert parameters are regular tensors while the rest of
  # the FSDP model is DTensor-backed.
  foreach: false
