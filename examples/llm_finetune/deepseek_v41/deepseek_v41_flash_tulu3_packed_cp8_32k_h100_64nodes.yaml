# H100-80GB port of deepseek_v41_flash_tulu3_packed_cp8_32k.yaml: 64 nodes x 8 H100,
# WORLD=512, EP64 (ep_shard=8), CP8, GBS 64 / LBS 1 -> dp=64, one microbatch per update.
#
# Why 64 nodes: each CP rank holds a 4096-token shard of a 32k pack. At 32 nodes the first
# update fits (~55 GiB) but the optimizer state created after it (~17.5 GB per rank at
# dp=32) plus activations exceed 80 GB in the second update, with GBS 64 and with GBS 32
# alike; at 64 nodes the run settles at 62.5 GiB.
# distributed.moe.reshard_after_forward: false is the work-around for issue #3958 (the
# recipe already uses defer_fsdp_grad_sync: false); drop it once PR #3961 is merged.
# Checkpoint saving is enabled as in the GB200 recipe: one torch_save checkpoint of this
# model is ~8.2 TB (model 1.4 TB + optimizer 6.9 TB, one shard per rank) and takes ~2.5
# minutes to write; reaching max_steps also triggers a final save regardless of
# ckpt_every_steps, so budget storage accordingly. Restore via checkpoint.restore_from LATEST
# was verified to continue the loss curve.
# Launch requirements: NCCL_PXN_DISABLE=1 (or NCCL_NET_PLUGIN=none NCCL_NET=IB) and node-local JIT caches, see the model-coverage page.
# Data: DS41_DATA_ROOT prepared by prepare_tulu3_data.py (packed_sequence_size 32768,
# pad_to_multiple_of 2, cp_size 1).
# Measured (100 updates): train loss 0.8144 -> 0.5951, validation 0.5853 / 0.5778.

recipe: TrainFinetuneRecipeForNextTokenPrediction
seed: 1234

step_scheduler:
  global_batch_size: 64
  local_batch_size: 1
  ckpt_every_steps: 100
  validate_on_checkpoint: false
  preemption_signal: SIGUSR1
  save_checkpoint_every_epoch: false
  val_every_steps: 50
  gc_every_steps: 10
  num_epochs: 1
  max_steps: 100

dist_env:
  backend: nccl
  timeout_minutes: 120

prewarm:
  cublas_backward: true
  comm_groups: true

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_config
  config:
    _target_: nemo_automodel.components.models.deepseek_v41.config.DeepseekV41Config.from_pretrained
    pretrained_model_name_or_path: ${DS41_CHECKPOINT}
    name_or_path: ${DS41_CHECKPOINT}
    revision: df42c109f1defefcbfcedbe7d905718a12266e40  # pragma: allowlist secret (public model commit SHA)
    vision_config:
      _target_: nemo_automodel.components.models.deepseek_v41.config.DeepseekV41VisionConfig
      num_hidden_layers: 0
  trust_remote_code: false
  load_base_model: true
  torch_dtype: bfloat16
  use_liger_kernel: false
  use_sdpa_patching: false
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: tilelang
    linear: torch
    rms_norm: te
    experts: torch_mm
    dispatcher: hybridep
    gate_precision: float32
    rope_fusion: false
    fake_balanced_gate: false
    enable_hf_state_dict_adapter: true
    enable_fsdp_optimizations: true

distributed:
  strategy: fsdp2
  tp_size: 1
  pp_size: 1
  cp_size: 8
  ep_size: 64
  defer_fsdp_grad_sync: false
  sequence_parallel: false
  activation_checkpointing: true
  moe:
    reshard_after_forward: false
    wrap_outer_model: true
    lm_head_precision: float32
    # Single-pass mHC carries FP32 coefficients alongside BF16 residuals.
    # Preserve each module's explicit casts across FSDP boundaries.
    mp_policy:
      _target_: torch.distributed.fsdp.MixedPrecisionPolicy
      param_dtype: bfloat16
      reduce_dtype: float32
      output_dtype: null
      cast_forward_inputs: false

checkpoint:
  enabled: true
  checkpoint_dir: ../checkpoints/deepseek_v41_flash_tulu3_packed_cp8_32k_h100_64nodes
  model_save_format: torch_save
  cpu_offload: true
  max_recent_checkpoints: 1
  save_consolidated: false
  dequantize_base_checkpoint: true

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy

dataset:
  _target_: datasets.load_from_disk
  dataset_path: ${DS41_DATA_ROOT}/train

packed_sequence:
  packed_sequence_size: 32768
  packing_strategy: thd
  prepacked: true
  pad_to_multiple_of: 2

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn:
    _target_: nemo_automodel.components.datasets.utils.packed_sequence_thd_collater
  shuffle: true
  num_workers: 4

validation_dataset:
  _target_: datasets.load_from_disk
  dataset_path: ${DS41_DATA_ROOT}/validation

validation_dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn:
    _target_: nemo_automodel.components.datasets.utils.packed_sequence_thd_collater
  shuffle: false
  drop_last: true
  num_workers: 4

optimizer:
  _target_: transformer_engine.pytorch.optimizers.fused_adam.FusedAdam
  betas: [0.9, 0.95]
  eps: 1.0e-8
  lr: 1.0e-5
  weight_decay: 0.1
  adam_w_mode: true
  bias_correction: true
  master_weights: true
  master_weight_dtype: torch.float32
  store_param_remainders: true
  exp_avg_dtype: torch.bfloat16
  exp_avg_sq_dtype: torch.bfloat16

lr_scheduler:
  lr_warmup_steps: 10
  lr_decay_steps: 100
  lr_decay_style: cosine
  min_lr: 1.0e-6

clip_grad_norm:
  max_norm: 1.0
  backend: triton

wandb:
  enable: false
  project: deepseek-v41
  name: ds41-tulu3-32k-packed-cp8-h100-64x8
  mode: online
  dir: ../logs/wandb

ci:
  recipe_owner: linmuchuiyang
  nodes: 64
  time: "01:00:00"
  nproc_per_node: 8
  cluster_tag: h100
  env_vars:
    NCCL_PXN_DISABLE: "1"
