# DeepSeek-V4.1-Flash (763B) LoRA on VR200 (hecate: 4 GPUs per node, 280 GiB per GPU).
# EP12 on 3 nodes holds ~118 GiB of frozen bf16 weights per GPU. Dequantizing the FP8/FP4
# checkpoint adds ~88 GiB while loading (2 nodes ran out of memory there); training with 8K
# packs on 4 nodes peaked at 115 GiB, so 24K packs.
recipe: TrainFinetuneRecipeForNextTokenPrediction
seed: 1234

step_scheduler:
  global_batch_size: 12
  local_batch_size: 1
  ckpt_every_steps: 1000
  val_every_steps: 1000
  gc_every_steps: 10
  num_epochs: 1
  max_steps: 20

dist_env:
  backend: nccl
  timeout_minutes: 60

prewarm:
  cublas_backward: true
  comm_groups: true

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_config
  config:
    _target_: nemo_automodel.components.models.deepseek_v41.config.DeepseekV41Config.from_pretrained
    pretrained_model_name_or_path: deepseek-ai/DeepSeek-V4.1-Flash
    name_or_path: deepseek-ai/DeepSeek-V4.1-Flash
    vision_config:
      _target_: nemo_automodel.components.models.deepseek_v41.config.DeepseekV41VisionConfig
      num_hidden_layers: 0
  trust_remote_code: false
  load_base_model: true
  torch_dtype: bfloat16
  use_liger_kernel: false
  use_sdpa_patching: false
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: tilelang
    linear: torch
    rms_norm: te
    experts: torch_mm
    dispatcher: hybridep
    gate_precision: float32
    rope_fusion: false
    fake_balanced_gate: false
    enable_hf_state_dict_adapter: true
    enable_fsdp_optimizations: true

peft:
  _target_: nemo_automodel.components._peft.lora.PeftConfig
  target_modules:
    - "model.layers.*.attn.wq_a"
    - "model.layers.*.attn.wq_b"
    - "model.layers.*.attn.wkv"
    - "model.layers.*.attn.wo_b"
    - "model.layers.*.ffn.experts"
  dim: 8
  alpha: 32
  use_triton: true

distributed:
  strategy: fsdp2
  tp_size: 1
  pp_size: 1
  cp_size: 1
  ep_size: 12
  defer_fsdp_grad_sync: false
  sequence_parallel: false
  activation_checkpointing: true
  moe:
    reshard_after_forward: true
    wrap_outer_model: true
    lm_head_precision: float32
    mp_policy:
      _target_: torch.distributed.fsdp.MixedPrecisionPolicy
      param_dtype: bfloat16
      reduce_dtype: float32
      output_dtype: null
      cast_forward_inputs: false

checkpoint:
  enabled: false
  dequantize_base_checkpoint: true

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy

dataset:
  _target_: nemo_automodel.components.datasets.llm.chat_dataset.ChatDataset
  path_or_dataset_id: allenai/tulu-3-sft-mixture
  split: train[:20000]
  shuffle_seed: 42
  seq_length: 4096
  padding: false
  truncation: true
  chat_template: examples/llm_finetune/deepseek_v41/tulu3_chat_template.jinja
  tokenizer:
    _target_: transformers.AutoTokenizer.from_pretrained
    pretrained_model_name_or_path: deepseek-ai/DeepSeek-V4.1-Flash
    trust_remote_code: false

packed_sequence:
  packed_sequence_size: 24576
  packing_strategy: thd
  num_proc: 8

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn:
    _target_: nemo_automodel.components.datasets.utils.packed_sequence_thd_collater
  shuffle: true
  num_workers: 4

optimizer:
  _target_: transformer_engine.pytorch.optimizers.fused_adam.FusedAdam
  betas: [0.9, 0.95]
  eps: 1.0e-8
  lr: 1.0e-4
  weight_decay: 0.1
  adam_w_mode: true
  bias_correction: true
  master_weights: true
  master_weight_dtype: torch.float32
  store_param_remainders: true
  exp_avg_dtype: torch.bfloat16
  exp_avg_sq_dtype: torch.bfloat16

clip_grad_norm:
  max_norm: 1.0

ci:
  nemo_ci_schedule: release
  cluster_tag: vrnvl72
  recipe_owner: akoumpa
  nodes: 3
  nproc_per_node: 4
  time: "00:30:00"
  max_steps: 20
  env_vars:
    PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
