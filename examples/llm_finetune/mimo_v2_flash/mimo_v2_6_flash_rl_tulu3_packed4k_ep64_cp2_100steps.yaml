# Full-parameter MiMo-V2.6-Flash-RL fine-tuning on Tulu3 with packed 4096-token
# THD sequences.
#
# Hardware target: 8 nodes x 8 H100 GPUs. EP64 spans the DP32 x CP2 mesh, and
# LBS2 x DP32 gives GBS64 with one microstep per optimizer step.

recipe: TrainFinetuneRecipeForNextTokenPrediction
seed: 1234

step_scheduler:
  global_batch_size: 64
  local_batch_size: 2
  ckpt_every_steps: 1000
  save_checkpoint_every_epoch: false
  val_every_steps: 1000
  log_remote_every_steps: 1
  gc_every_steps: 5
  num_epochs: 1
  max_steps: 100

dist_env:
  backend: nccl
  timeout_minutes: 120

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 1234
  ranked: true
  deterministic: true

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_config
  config:
    _target_: nemo_automodel.components.models.mimo_v2_flash.config.MiMoV2Config.from_pretrained
    pretrained_model_name_or_path: XiaomiMiMo/MiMo-V2.6-Flash-RL
    name_or_path: XiaomiMiMo/MiMo-V2.6-Flash-RL
    use_cache: false
    output_hidden_states: true
    num_nextn_predict_layers: 0
  trust_remote_code: false
  load_base_model: true
  torch_dtype: bfloat16
  use_liger_kernel: false
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: te
    linear: torch
    rms_norm: torch_fp32
    experts: torch_mm
    dispatcher: hybridep
    rope_fusion: false
    gate_precision: float32
    fake_balanced_gate: false
    enable_hf_state_dict_adapter: true
    enable_fsdp_optimizations: true

checkpoint:
  enabled: false
  checkpoint_dir: checkpoints/mimo_v2_6_flash_rl_tulu3_packed4k_ep64_cp2_100steps/
  model_save_format: safetensors
  save_consolidated: false
  dequantize_base_checkpoint: true

distributed:
  strategy: fsdp2
  dp_size: none
  tp_size: 1
  cp_size: 2
  pp_size: 1
  ep_size: 64
  sequence_parallel: false
  activation_checkpointing: true
  reshard_after_forward: true
  defer_fsdp_grad_sync: false
  moe:
    reshard_after_forward: true
    wrap_outer_model: true
    ignore_router_for_ac: true

loss_fn:
  _target_: nemo_automodel.components.loss.linear_ce.FusedLinearCrossEntropy

dataset:
  _target_: nemo_automodel.components.datasets.llm.chat_dataset.ChatDataset
  path_or_dataset_id: allenai/tulu-3-sft-mixture
  split: train
  seq_length: 4096
  truncation: true
  padding: false
  chat_template: examples/llm_finetune/qwen/qwen3_tulu3_chat_template.jinja
  shuffle_seed: 1234

packed_sequence:
  packing_strategy: thd
  packed_sequence_size: 4096
  pad_to_multiple_of: 4
  max_packs: 6400
  num_proc: 1

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.packed_sequence_thd_collater
  num_workers: 4
  persistent_workers: true
  pin_memory: true
  prefetch_factor: 2
  shuffle: false
  drop_last: true

validation_dataset: none
validation_dataloader: none

optimizer:
  _target_: torch.optim.AdamW
  betas: [0.9, 0.95]
  eps: 1.0e-8
  lr: 5.0e-6
  weight_decay: 0.1

lr_scheduler:
  lr_decay_style: constant

clip_grad_norm:
  max_norm: 1.0

