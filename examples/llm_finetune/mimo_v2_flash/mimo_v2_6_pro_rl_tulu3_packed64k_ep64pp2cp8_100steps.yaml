#   tags: [mimo-v2.6-pro, gb200, sft, tulu3, packed64k, ep64, pp2, cp8]
#   mode: online
#   dir: logs/mimo_v2_6_pro_rl_tulu3_packed64k_ep64pp2cp8_100steps/wandb

ci:
  recipe_owner: huiyingl
  nodes: 32
  nproc_per_node: 4
  cluster_tag: gb200
  time: "01:00:00"
  max_steps: 5
  local_batch_size: 2
  env_vars:
    PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
    USE_MNNVL: "1"
    NVTE_FUSED_ATTN: "1"
    NVTE_FLASH_ATTN: "0"
    NVTE_UNFUSED_ATTN: "0"
