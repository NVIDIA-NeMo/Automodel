# single node 8xh200
# To run this recipe:
#   automodel examples/llm_finetune/llama3_3/llama_3_3_70b_instruct_squad_peft.yaml --nproc-per-node 8
# Adjust --nproc-per-node to the number of GPUs available on your machine.

recipe: TrainFinetuneRecipeForNextTokenPrediction

step_scheduler:
  global_batch_size: 32
  local_batch_size: 4
  ckpt_every_steps: 50
  val_every_steps: 1000
  max_steps: 100

dist_env:
  backend: nccl
  timeout_minutes: 1

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 1111
  ranked: true

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: meta-llama/Llama-3.3-70B-Instruct
  torch_dtype: bf16
  trust_remote_code: true

checkpoint:
  enabled: true
  checkpoint_dir: checkpoints/
  model_save_format: safetensors
  save_consolidated: false


peft:
  _target_: nemo_automodel.components._peft.lora.PeftConfig
  target_modules: '*_proj'
  dim: 8
  alpha: 32
  use_triton: True


distributed:
  strategy: fsdp2
  dp_size: none
  tp_size: 4
  cp_size: 1
  pp_size: 1

  sequence_parallel: false

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy

# SQuAD instruction tuning dataset (5% train split for quick runs)
dataset:
  _target_: nemo_automodel.components.datasets.llm.squad.make_squad_dataset
  dataset_name: rajpurkar/squad
  split: train

packed_sequence:
  packed_sequence_size: 0

# StatefulDataLoader with default collate
dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.default_collater
  shuffle: true

validation_dataset:
  _target_: nemo_automodel.components.datasets.llm.squad.make_squad_dataset
  dataset_name: rajpurkar/squad
  split: validation

validation_dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.default_collater

optimizer:
  _target_: torch.optim.Adam
  betas: [0.9, 0.999]
  eps: 1e-8
  lr: 1.0e-5
  weight_decay: 0

lr_scheduler:
  lr_decay_style: cosine
  min_lr: 1.0e-6

ci:
  cluster_tag: h100
  recipe_owner: akoumpa
  time: "00:30:00"
  # Synthetic performance settings migrated from examples/llm_benchmark/llama3_3/llama_3_3_70b_instruct_squad_peft_pp.yaml.
  # Reset changed components before setting leaves; "none" is the CLI null token.
  perf_testing:
    schedule: nightly
    time: 00:15:00
    config_overrides:
      recipe: BenchmarkingRecipeForNextTokenPrediction
      step_scheduler: none
      step_scheduler.gc_every_steps: 10
      step_scheduler.global_batch_size: 32
      step_scheduler.local_batch_size: 2
      step_scheduler.ckpt_every_steps: 50
      step_scheduler.val_every_steps: 1000
      step_scheduler.max_steps: 10
      checkpoint: none
      checkpoint.enabled: false
      checkpoint.checkpoint_dir: checkpoints/
      checkpoint.model_save_format: safetensors
      checkpoint.save_consolidated: false
      peft: none
      peft._target_: nemo_automodel.components._peft.lora.PeftConfig
      peft.target_modules: '*_proj'
      peft.dim: 16
      peft.alpha: 32
      peft.use_triton: true
      distributed: none
      distributed.strategy: fsdp2
      distributed.dp_size: none
      distributed.tp_size: 4
      distributed.cp_size: 1
      distributed.pp_size: 2
      distributed.sequence_parallel: false
      distributed.activation_checkpointing: true
      distributed.pipeline.pp_schedule: interleaved1f1b
      distributed.pipeline.pp_microbatch_size: 1
      distributed.pipeline.layers_per_stage: 4
      distributed.pipeline.scale_grads_in_schedule: false
      distributed.pipeline.round_virtual_stages_to_pp_multiple: up
      distributed.pipeline.dtype: bf16
      dataset: none
      dataset._target_: nemo_automodel.components.datasets.llm.mock_iterable_dataset.MockIterableDataset
      dataset.vocab_size: 100
      dataset.seq_len: 4096
      dataset.num_samples: 1000000
      packed_sequence: none
      dataloader: none
      dataloader._target_: torch.utils.data.DataLoader
      dataloader.batch_size: none
      validation_dataset: none
      validation_dataloader: none
      seed: 42
      benchmark: none
      benchmark.warmup_steps: 5
      benchmark.peak_tflops: 989
      benchmark.nsys_start: -1
      benchmark.nsys_end: -1
      benchmark.nsys_ranks: '[]'
      ci.nodes: 1
