# LoRA fine-tuning on SQuAD with the former benchmark parallel layout.

# To run this recipe:
#   automodel examples/llm_finetune/llama3_3/llama_3_3_70b_instruct_squad_tp2_peft.yaml --nproc-per-node 8
# Use --benchmark to apply ci.perf_testing controls to this training recipe.
# For multi-node runs, use the Slurm launcher with the node count in ci.nodes.

recipe: TrainFinetuneRecipeForNextTokenPrediction

seed: 42

step_scheduler:
  global_batch_size: 32
  local_batch_size: 2
  ckpt_every_steps: 50
  val_every_steps: 1000
  max_steps: 10

dist_env:
  backend: nccl
  timeout_minutes: 10

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 1111
  ranked: true

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: meta-llama/Llama-3.3-70B-Instruct
  torch_dtype: bf16

peft:
  _target_: nemo_automodel.components._peft.lora.PeftConfig
  target_modules: '*_proj'
  dim: 16
  alpha: 32
  use_triton: true

checkpoint:
  enabled: false
  checkpoint_dir: checkpoints/
  model_save_format: safetensors
  save_consolidated: false

distributed:
  strategy: fsdp2
  dp_size: null
  tp_size: 2
  cp_size: 1

  sequence_parallel: true
  activation_checkpointing: true
  enable_async_tensor_parallel: true
  enable_fsdp2_prefetch: true
  enable_compile: true
  defer_fsdp_grad_sync: false

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy

# Pack real SQuAD examples into rows of the original 4,096-token workload shape.
dataset:
  _target_: nemo_automodel.components.datasets.llm.squad.make_squad_dataset
  dataset_name: rajpurkar/squad
  split: train
  padding: false

packed_sequence:
  # local_batch_size counts packed rows, not individual documents.
  packed_sequence_size: 4096
  packing_strategy: neat

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.neat_packed_collater
  shuffle: true
  drop_last: true

optimizer:
  _target_: torch.optim.Adam
  betas: [0.9, 0.999]
  eps: 1e-8
  lr: 1.0e-5
  weight_decay: 0

lr_scheduler:
  lr_decay_style: cosine
  min_lr: 1.0e-6

ci:
  nemo_ci_schedule: release
  cluster_tag: h100
  recipe_owner: ZhiyuLi-Nvidia
  nodes: 1
  time: "00:30:00"
  perf_testing:
    schedule: nightly
