# GB200 real-data training variant; runtime tuning migrated from
# examples/llm_benchmark/kimi/kimi_k3_gb200_2k.yaml
# Run with --nproc-per-node 4 and --nnodes 64. GPU validation is pending.
recipe: TrainFinetuneRecipeForNextTokenPrediction

step_scheduler:
  global_batch_size: 4096
  local_batch_size: 128
  ckpt_every_steps: 100
  val_every_steps: 100
  max_steps: 100
  num_epochs: 1

  gc_every_steps: 10
dist_env:
  backend: nccl
  timeout_minutes: 120

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 1234
  ranked: true

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: moonshotai/Kimi-K3
  torch_dtype: bfloat16
  trust_remote_code: false
  config:
    architectures: [KimiK3ForCausalLM]
    kda_conv_backend: cuda
    kda_chunk_impl: fused
    situ_backend: triton_fast_math
    attn_res_triton: true
  kda_mode: chunk
  use_liger_kernel: false
  use_sdpa_patching: false
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: te   # TE attention: cuDNN fused attention on the MLA layers
    linear: torch
    rms_norm: torch_fp32
    experts: torch_mm   # torch._grouped_mm: one kernel per grouped GEMM
    dispatcher: hybridep
    dispatcher_num_sms: 32
    rope_fusion: false
    fake_balanced_gate: false  # benchmark only — see kimi_k3_gb200.yaml header
    fake_gate_noise: 0.0
    compile_situ: true
    compile_norm: true
    compile_router_weight: true   # fp32 router-weight compile island (#3894)
    benchmark_static_routing: false  # requires fake_balanced_gate, noise 0.0
    enable_hf_state_dict_adapter: true
    enable_fsdp_optimizations: true

checkpoint:
  enabled: false
  checkpoint_dir: checkpoints/kimi_k3_hellaswag
  model_save_format: safetensors
  save_consolidated: false
  dequantize_base_checkpoint: true

distributed:
  strategy: fsdp2
  tp_size: 1
  cp_size: 1
  pp_size: 8
  ep_size: 32
  sequence_parallel: false
  activation_checkpointing: true
  enable_fsdp2_prefetch: true
  pipeline:
    pp_schedule: 1f1b
    pp_microbatch_size: 4   # 32 microbatches of 8192 tokens — see header
    scale_grads_in_schedule: false
    patch_inner_model: false
    patch_causal_lm_model: false
    pp_recv_buffer_pool: true   # required for this shape — see header
  moe:
    reshard_after_forward: false
    wrap_outer_model: false

loss_fn:
  _target_: nemo_automodel.components.loss.linear_ce.FusedLinearCrossEntropy
  impl: torch_compile

dataset:
  _target_: nemo_automodel.components.datasets.llm.squad.make_squad_dataset
  dataset_name: rajpurkar/squad
  split: train
  limit_dataset_samples: 25600
  padding: false
  tokenizer:
    _target_: nemo_automodel.NeMoAutoTokenizer.from_pretrained
    pretrained_model_name_or_path: moonshotai/Kimi-K3
    trust_remote_code: false

packed_sequence:
  packed_sequence_size: 0

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.default_collater
  shuffle: true

validation_dataset:
  _target_: nemo_automodel.components.datasets.llm.squad.make_squad_dataset
  dataset_name: rajpurkar/squad
  split: validation
  limit_dataset_samples: 256
  padding: false
  tokenizer:
    _target_: nemo_automodel.NeMoAutoTokenizer.from_pretrained
    pretrained_model_name_or_path: moonshotai/Kimi-K3
    trust_remote_code: false

validation_dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.default_collater
  batch_size: 8

optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-5
  weight_decay: 0.0
  betas: [0.9, 0.95]
  eps: 1.0e-8

  fused: true
wandb:
  enable: false
  project: kimi-k3-sft
  name: kimi_k3_hellaswag_ep32_pp8
  dir: wandb

clip_grad_norm:
  max_norm: 1.0

prewarm:
  pipeline_stage_compile: true   # all PP stages compile concurrently before the loop (#3893); startup only
  comm_groups: true
  fla_gdn_autotune: true
  cublas_backward: true

ci:
  nemo_ci_schedule: skipped
  recipe_owner: huiyingl
  nodes: 64
  cluster_tag: gb200
  time: "01:00:00"
  nproc_per_node: 4
  perf_testing:
    fake_balanced_gate: true
    schedule: weekly
  env_vars:
    # Keep each EP32 group within one NVLink block: 8 nodes x 4 GPUs.
    SBATCH_SEGMENT_SIZE: "8"
