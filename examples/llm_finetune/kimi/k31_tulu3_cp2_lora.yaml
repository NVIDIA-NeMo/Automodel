# Kimi K3.1 text-only CP2 LoRA, 16 GB200 nodes x 4 GPUs, EP64.
# Each row is one document (no packing). Deterministic document shuffle seed: 1234.
# Padding short documents to 4096 does not exercise sparse selection: validation must
# include an individual document with more than 2048 valid tokens.
# The discrete indexer remains frozen; LoRA targets exclude its projections.
# Four-layer validation does not certify the full 93-layer topology.

recipe: TrainFinetuneRecipeForNextTokenPrediction
step_scheduler:
  global_batch_size: 32
  local_batch_size: 1
  ckpt_every_steps: 100
  val_every_steps: 100
  max_steps: 100
  num_epochs: 1
dist_env:
  backend: nccl
  timeout_minutes: 120
rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 1234
  ranked: true
model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: moonshotai/Kimi-K3.1-Pro
  trust_remote_code: false
  config:
    architectures:
    - KimiK3ForCausalLM
  kda_mode: chunk
  use_liger_kernel: false
  use_sdpa_patching: false
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: cudnn
    linear: torch
    rms_norm: torch_fp32
    experts: torch_mm
    dispatcher: torch
    rope_fusion: false
    fake_balanced_gate: false
    enable_hf_state_dict_adapter: true
    enable_fsdp_optimizations: true
  revision: 6d0a0202956796543364d666ab19c6ad1a494ee1
  dtype: bfloat16
checkpoint:
  enabled: false
  checkpoint_dir: checkpoints/kimi_k31_tulu3_cp2_lora
  model_save_format: safetensors
  save_consolidated: false
  dequantize_base_checkpoint: true
distributed:
  strategy: fsdp2
  tp_size: 1
  cp_size: 2
  pp_size: 1
  ep_size: 64
  sequence_parallel: false
  activation_checkpointing: true
  reshard_after_forward: true
  moe:
    reshard_after_forward: true
    wrap_outer_model: true
loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy
dataset:
  _target_: nemo_automodel.components.datasets.llm.chat_dataset.ChatDataset
  path_or_dataset_id: allenai/tulu-3-sft-mixture
  split: train
  seq_length: 4096
  padding: max_length
  truncation: true
  shuffle_seed: 1234
packed_sequence:
  packed_sequence_size: 0
dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn:
    _target_: nemo_automodel.components.datasets.utils.default_collater
    pad_seq_len_divisible: 2
  num_workers: 2
  shuffle: false
validation_dataset: null
validation_dataloader: null
optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-05
  weight_decay: 0.0
  betas:
  - 0.9
  - 0.95
  eps: 1.0e-08
wandb:
  enable: false
clip_grad_norm:
  max_norm: 1.0
prewarm:
  comm_groups: true
peft:
  _target_: nemo_automodel.components._peft.lora.PeftConfig
  dim: 8
  alpha: 16
  dropout: 0.0
  target_modules:
  - '*.self_attn.q_a_proj'
  - '*.self_attn.q_b_proj'
  - '*.self_attn.kv_a_proj_with_mqa'
  - '*.self_attn.kv_b_proj'
  - '*.self_attn.o_proj'
  - '*.self_attn.g_proj'
ci:
  recipe_owner: huiyingl
  nodes: 16
  cluster_tag: gb200
  time: 01:00:00
  env_vars:
    SBATCH_SEGMENT_SIZE: '16'
