# Long-context Kimi Linear fine-tuning: 32k packed sequences split across a
# context-parallel group of 2, with EP=8 over the same 8 GPUs.
#
# Kimi Linear shards the sequence into contiguous per-rank slices (KDA's recurrent
# state is passed rank to rank by FLA, MLA gathers the compressed KV latent), and
# document boundaries from the packed collater are honored by both layer types.
#
# To run this recipe:
#   HF_HOME=$PWD/.hf_cache automodel examples/llm_finetune/kimi/kimi_linear_48b_a3b_longcontext_cp2.yaml --nproc-per-node 8

recipe: TrainFinetuneRecipeForNextTokenPrediction

step_scheduler:
  global_batch_size: 4
  local_batch_size: 1
  ckpt_every_steps: 100
  val_every_steps: 20
  log_remote_every_steps: 1
  loss_average_window_steps: 5
  gc_every_steps: 5
  num_epochs: 1
  max_steps: 100

dist_env:
  backend: nccl
  timeout_minutes: 30

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 20260721
  ranked: true

# The published checkpoint shares its model_type with the Kimi K3 text backbone, so the
# config class is named explicitly (see docs/model-coverage/llm/moonshotai/kimi-linear.mdx).
model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_config
  config:
    _target_: nemo_automodel.components.models.kimi_linear.config.KimiLinear48BConfig.from_pretrained
    pretrained_model_name_or_path: moonshotai/Kimi-Linear-48B-A3B-Instruct
    name_or_path: moonshotai/Kimi-Linear-48B-A3B-Instruct
    kda_mode: chunk
    kda_unpad_inputs: false
    kda_use_fused_gate: true
    kda_use_qk_l2norm_in_kernel: true
  trust_remote_code: true
  torch_dtype: bfloat16
  load_base_model: true
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: eager
    linear: torch
    rms_norm: torch_fp32
    experts: torch
    dispatcher: torch
    gate_precision: float32
    fake_balanced_gate: false
    enable_hf_state_dict_adapter: true
    enable_fsdp_optimizations: true

checkpoint:
  enabled: false
  checkpoint_dir: checkpoints/kimi_linear_48b_a3b_longcontext_cp2
  model_save_format: safetensors
  save_consolidated: false

distributed:
  strategy: fsdp2
  tp_size: 1
  cp_size: 2                 # 32k tokens -> 16k per rank
  pp_size: 1
  ep_size: 8                 # EP and CP overlap on the device mesh
  sequence_parallel: false
  activation_checkpointing: true
  moe:
    reshard_after_forward: true
    wrap_outer_model: false

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy

dataset:
  _target_: nemo_automodel.components.datasets.llm.hellaswag.HellaSwag
  path_or_dataset: rowan/hellaswag
  split: train
  pad_to_max_length: false
  tokenizer:
    _target_: transformers.AutoTokenizer.from_pretrained
    pretrained_model_name_or_path: moonshotai/Kimi-Linear-48B-A3B-Instruct
    trust_remote_code: true

packed_sequence:
  packed_sequence_size: 32768

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.packed_sequence_thd_collater
  shuffle: true
  num_workers: 2

validation_dataset:
  _target_: nemo_automodel.components.datasets.llm.hellaswag.HellaSwag
  path_or_dataset: rowan/hellaswag
  split: validation
  num_samples_limit: 64
  pad_to_max_length: false
  tokenizer:
    _target_: transformers.AutoTokenizer.from_pretrained
    pretrained_model_name_or_path: moonshotai/Kimi-Linear-48B-A3B-Instruct
    trust_remote_code: true

validation_dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.packed_sequence_thd_collater
  shuffle: false
  drop_last: true
  num_workers: 2

optimizer:
  _target_: torch.optim.AdamW
  betas: [0.9, 0.95]
  eps: 1e-8
  lr: 1.0e-5
  weight_decay: 0.01

wandb:
  enable: false
  project: automodel-kimi-linear
  name: kimi_linear_48b_a3b_longcontext_cp2
  mode: online
  dir: result/wandb

ci:
  recipe_owner: khazic
  nodes: 1
  time: "01:00:00"
