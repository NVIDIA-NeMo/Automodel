# To run this recipe:
#   automodel examples/llm_finetune/qwen/qwen3_0p6b_squad_gradient_sketch.yaml --nproc-per-node 8
# Adjust --nproc-per-node to the number of GPUs available on your machine.
#
# Qwen3-0.6B SFT on SQuAD with the gradient_sketch optimizer (rank-256 sketches of the
# attention and MLP projections, RowAdam update, AdamW for every other parameter).
# Parameters are kept in fp32; the sketch state adds one fp32 second moment per output row
# instead of two dense Adam moments. See docs/guides/gradient-sketch.mdx.

recipe: TrainFinetuneRecipeForNextTokenPrediction

step_scheduler:
  global_batch_size: 64
  local_batch_size: 8
  ckpt_every_steps: 100
  val_every_steps: 50  # will run every x number of gradient steps
  max_steps: 300

dist_env:
  backend: nccl
  timeout_minutes: 10

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 1111
  ranked: true

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: Qwen/Qwen3-0.6B
  torch_dtype: float32

checkpoint:
  enabled: true
  checkpoint_dir: checkpoints/
  model_save_format: safetensors
  save_consolidated: true

distributed:
  strategy: fsdp2
  dp_size: none
  tp_size: 1
  cp_size: 1

  sequence_parallel: false

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy

dataset:
  _target_: nemo_automodel.components.datasets.llm.squad.make_squad_dataset
  dataset_name: rajpurkar/squad
  split: train

packed_sequence:
  packed_sequence_size: 0

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.default_collater
  shuffle: false

validation_dataset:
  _target_: nemo_automodel.components.datasets.llm.squad.make_squad_dataset
  dataset_name: rajpurkar/squad
  split: validation
  limit_dataset_samples: 512

validation_dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.default_collater

optimizer:
  _target_: nemo_automodel.components.optim.optimizer.GradientSketchConfig
  rank: 256
  seed: 42
  native:
    _target_: nemo_automodel.components.optim.optimizer.AdamWConfig
    lr: 1.0e-5
    weight_decay: 0.0

# Uncomment and configure for W&B logging
# wandb:
#   project: <your_wandb_project>
#   entity: <your_wandb_entity>
#   name: <your_wandb_exp_name>
#   dir: <your_wandb_save_dir>

ci:
  nemo_ci_schedule: skipped
  cluster_tag: h100
  recipe_owner: HuiyingLi
  time: "00:20:00"
  nodes: 1
  nproc_per_node: 8
