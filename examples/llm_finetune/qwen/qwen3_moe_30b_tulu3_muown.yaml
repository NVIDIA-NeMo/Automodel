# Requires the existing optional Dion dependency: uv sync --extra dev
# Run on 8 GPUs:
# automodel examples/llm_finetune/qwen/qwen3_moe_30b_tulu3_muown.yaml --nproc-per-node 8
# Full 48-layer training; real Tulu3 data, EP8, non-packed 4K, LBS1, GA1.
recipe: TrainFinetuneRecipeForNextTokenPrediction

step_scheduler:
  global_batch_size: 8
  local_batch_size: 1
  max_steps: 30
  ckpt_every_steps: 1000
  val_every_steps: 1000
  gc_every_steps: 10

dist_env:
  backend: nccl
  timeout_minutes: 30

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 1111
  ranked: true

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: Qwen/Qwen3-30B-A3B
  # Keep master parameters and Muown states in FP32; FSDP computes in BF16.
  torch_dtype: float32
  output_hidden_states: false
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: te
    linear: te
    rms_norm: torch_fp32
    experts: torch_mm
    dispatcher: deepep
    fake_balanced_gate: false
    enable_hf_state_dict_adapter: true
    enable_fsdp_optimizations: true

distributed:
  strategy: fsdp2
  tp_size: 1
  cp_size: 1
  pp_size: 1
  ep_size: 8
  sequence_parallel: false
  activation_checkpointing: true
  reshard_after_forward: true
  moe:
    reshard_after_forward: true

checkpoint:
  enabled: false
  checkpoint_dir: checkpoints/qwen3_moe_30b_muown

# Chunked CE supports the FP32 head with BF16 hidden states.
loss_fn:
  _target_: nemo_automodel.components.loss.chunked_ce.ChunkedCrossEntropy
  chunk_len: 128

dataset:
  _target_: nemo_automodel.components.datasets.llm.chat_dataset.ChatDataset
  path_or_dataset_id: allenai/tulu-3-sft-mixture
  split: train
  truncation: true
  seq_length: 4096
  padding: max_length
  shuffle_seed: 42
  chat_template: examples/convergence/tulu3/models/qwen3-moe-30b/chat_template.jinja

packed_sequence:
  packed_sequence_size: 0

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn:
    _target_: nemo_automodel.components.datasets.utils.default_collater
    pad_seq_len_divisible: 8
  shuffle: true

optimizer:
  _target_: nemo_automodel.components.optim.optimizer.MuownConfig
  lr: 3.0e-4
  mu: 0.95
  nesterov: true
  betas: [0.9, 0.95]
  epsilon: 1.0e-8
  ns_steps: 5
  ns_epsilon: 1.0e-7
  weight_decay: 0.0
  # Embeddings, output head, normalization weights and biases use AdamW.
  scalar_opt: adamw
  scalar_lr: 3.0e-5
  embed_lr: 3.0e-5
  lm_head_lr: 3.0e-5
  scalar_betas: [0.9, 0.95]
  scalar_eps: 1.0e-8

