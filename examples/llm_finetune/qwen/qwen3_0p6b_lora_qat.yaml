# Two-step pretrained smoke test, not a random-init 256-token-vocabulary model.
# YAML block_size lists are normalized by WeightQuantizationConfig.
# Run from the repository root with exactly one GPU; see ../README_qat.md.
recipe: TrainFinetuneRecipeForNextTokenPrediction

seed: 42

step_scheduler:
  global_batch_size: 1
  local_batch_size: 1
  max_steps: 2
  num_epochs: 1

dist_env:
  backend: nccl
  timeout_minutes: 10

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: Qwen/Qwen3-0.6B
  dtype: bfloat16
  force_hf: true
  attn_implementation: sdpa

peft:
  _target_: nemo_automodel.components._peft.lora.PeftConfig
  target_modules: ['*.q_proj', '*.v_proj']
  dim: 4
  alpha: 8
  dropout: 0.0
  use_dora: false
  use_triton: false
  use_memory_efficient_lora: false

qat:
  enabled: true
  fake_quant_after_n_steps: 0
  qat_config:
    _target_: nemo_automodel.components.quantization.qat.QATConfig
    # QAT selectors are independent of PEFT selectors.
    target_modules: ['*.q_proj', '*.v_proj']
    weight:
      format: fp8
      block_size: [32, 32]

# FSDP2's single-rank path skips sharding. Do not increase the world size.
distributed:
  strategy: fsdp2
  dp_size: none
  tp_size: 1
  cp_size: 1
  sequence_parallel: false
  activation_checkpointing: false

compile:
  enabled: false

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy

dataset:
  _target_: nemo_automodel.components.datasets.llm.squad.make_squad_dataset
  dataset_name: rajpurkar/squad
  split: train
  limit_dataset_samples: 64
  seq_length: 512
  truncation: true
  tokenizer:
    _target_: nemo_automodel.NeMoAutoTokenizer.from_pretrained
    pretrained_model_name_or_path: Qwen/Qwen3-0.6B
    # Retain the answer at the end of long prompt/completion examples.
    truncation_side: left

packed_sequence:
  packed_sequence_size: 0

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.default_collater
  shuffle: false
  num_workers: 0

optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-5
  weight_decay: 0.0

# Ordinary recipe checkpoints are not packed LoRA-QAT reference exports.
checkpoint:
  enabled: false

ci:
  recipe_owner: hasuoshenyun
  time: "00:15:00"
  nodes: 1
  # This reference smoke requires exactly one rank, regardless of cluster defaults.
  nproc_per_node: 1
  node_multiplier: false
  max_steps: 2
  local_batch_size: 1
  env_vars:
    REQUIRE_FINITE_METRICS: "true"