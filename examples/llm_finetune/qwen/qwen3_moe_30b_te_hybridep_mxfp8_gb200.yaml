#
# Qwen3-30B-A3B real-data GB200 training with HybridEP and TE MXFP8 experts.
# Runtime tuning is migrated from llm_benchmark/qwen/qwen3_moe_30b_te_mxfp8_gb200.yaml.
# Existing SQuAD data, packing, pretrained loading, and training hyperparameters are retained.
# Unfused RoPE is retained because fused RoPE has documented NaN gradients on THD inputs.
# MXFP8 requires Blackwell hardware; run on two GB200 nodes with four GPUs per node.
#   automodel examples/llm_finetune/qwen/qwen3_moe_30b_te_hybridep_mxfp8_gb200.yaml --nnodes 2 --nproc-per-node 4

recipe: TrainFinetuneRecipeForNextTokenPrediction

step_scheduler:
  global_batch_size: 512  #PR4637: 32
  local_batch_size: 16  #PR4637: 4
  ckpt_every_steps: 500
  num_epochs: 2

  gc_every_steps: 10
dist_env:
  backend: nccl
  timeout_minutes: 10

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 1111
  ranked: true

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: Qwen/Qwen3-30B-A3B
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: te
    linear: te
    rms_norm: te  #PR4637: torch_fp32
    rope_fusion: false
    experts: te
    dispatcher: hybridep  # GB200: deepep fails EP-buffer init ('invalid resource handle')
    fake_balanced_gate: false
    enable_hf_state_dict_adapter: true
    enable_fsdp_optimizations: true
    te_fp8:
      recipe: mxfp8

checkpoint:
  enabled: false
  checkpoint_dir: checkpoints/
  model_save_format: torch_save # torch_save or safetensors
  save_consolidated: false # saves the model in a consolidated safetensors format. Requires model_save_format to be safetensors.

distributed:
  strategy: fsdp2
  tp_size: 1
  cp_size: 1
  pp_size: 1
  ep_size: 8

  sequence_parallel: false
  activation_checkpointing: true

  pipeline:
    pp_schedule: interleaved1f1b
    pp_microbatch_size: 2  #PR4637: 4
    round_virtual_stages_to_pp_multiple: down
    scale_grads_in_schedule: false
    patch_inner_model: false
    patch_causal_lm_model: false
    layers_per_stage: 2

loss_fn:
  fp32_upcast: false
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy

dataset:
  _target_: nemo_automodel.components.datasets.llm.squad.make_squad_dataset  #PR4637: nemo_automodel.components.datasets.llm.hellaswag.HellaSwag
  dataset_name: rajpurkar/squad  #PR4637: path_or_dataset: rowan/hellaswag
  split: train
  padding: false  #PR4637: pad_to_max_length: false

packed_sequence:
  # Set packed_sequence_size > 0 to run with packed sequences
  packed_sequence_size: 4096  #PR4637: 1024

  packing_strategy: thd
dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.packed_sequence_thd_collater
  shuffle: true

  drop_last: true
validation_dataset:
  _target_: nemo_automodel.components.datasets.llm.squad.make_squad_dataset  #PR4637: nemo_automodel.components.datasets.llm.hellaswag.HellaSwag
  dataset_name: rajpurkar/squad  #PR4637: path_or_dataset: rowan/hellaswag
  split: validation
  padding: false  #PR4637: pad_to_max_length: false

validation_dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.packed_sequence_thd_collater

optimizer:
  _target_: torch.optim.Adam
  betas: [0.9, 0.999]
  eps: 1e-7
  lr: 1.0e-4
  weight_decay: 0
  foreach: false
  # min_lr: 1.0e-5

# # Uncomment and configure for W&B logging
# wandb:
#   project: <your_wandb_project>
#   entity: <your_wandb_entity>
#   name: <your_wandb_exp_name>
#   save_dir: <your_wandb_save_dir>

ci:
  nemo_ci_schedule: release
  cluster_tag: gb200
  nodes: 2
  recipe_owner: akoumpa  #PR4637: hemildesai
  nproc_per_node: 4
  perf_testing:
    fake_balanced_gate: true
    schedule: nightly
  time: "00:40:00"
