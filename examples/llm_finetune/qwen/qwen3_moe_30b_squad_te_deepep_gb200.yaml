# GB200 real-data training variant; runtime tuning migrated from
# examples/llm_benchmark/qwen/qwen3_moe_30b_te_deepep_gb200.yaml
# Run with --nproc-per-node 4 and --nnodes 2. GPU validation is pending.
recipe: TrainFinetuneRecipeForNextTokenPrediction

step_scheduler:
  global_batch_size: 512
  local_batch_size: 16
  ckpt_every_steps: 500
  val_every_steps: 100  # will run every x number of gradient steps
  num_epochs: 2
  # max_steps: 5

  gc_every_steps: 10
dist_env:
  backend: nccl
  timeout_minutes: 10

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 1111
  ranked: true

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: Qwen/Qwen3-30B-A3B
  trust_remote_code: true
  torch_dtype: bfloat16
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: te
    linear: te
    rms_norm: te
    rope_fusion: false # THD fused RoPE has documented NaN gradients; use the existing packed-recipe setting.
    experts: te  # TE GroupedLinear bf16 (no fp8) — fastest retained bf16 backend (te 26.27% > torch_mm 25.45%)
    dispatcher: hybridep  # GB200: deepep fails EP-buffer init ('invalid resource handle')
    fake_balanced_gate: false
    enable_hf_state_dict_adapter: true
    enable_fsdp_optimizations: true

checkpoint:
  enabled: true
  checkpoint_dir: /tmp/checkpoints/
  model_save_format: safetensors # torch_save or safetensors
  save_consolidated: final

distributed:
  strategy: fsdp2
  tp_size: 1
  cp_size: 1
  pp_size: 1
  ep_size: 8

  sequence_parallel: false
  activation_checkpointing: true

  pipeline:
    pp_schedule: interleaved1f1b
    pp_microbatch_size: 2
    round_virtual_stages_to_pp_multiple: down
    scale_grads_in_schedule: false
    patch_inner_model: false
    patch_causal_lm_model: false
    layers_per_stage: 2

loss_fn:
  fp32_upcast: false
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy

dataset:
  _target_: nemo_automodel.components.datasets.llm.squad.make_squad_dataset
  dataset_name: rajpurkar/squad
  split: train

  padding: false
packed_sequence:
  # Set packed_sequence_size > 0 to run with packed sequences
  packed_sequence_size: 4096

  packing_strategy: thd
dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.packed_sequence_thd_collater
  shuffle: true

  drop_last: true
validation_dataset:
  _target_: nemo_automodel.components.datasets.llm.squad.make_squad_dataset
  dataset_name: rajpurkar/squad
  split: validation
  limit_dataset_samples: 64

  padding: false
validation_dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.packed_sequence_thd_collater
  batch_size: 8

optimizer:
  _target_: torch.optim.Adam
  betas: [0.9, 0.95]
  eps: 1e-7
  lr: 1.0e-4
  weight_decay: 0.0
  # min_lr: 1.0e-5

# Uncomment and configure for W&B logging
# wandb:
#   project: <your_wandb_project>
#   entity: <your_wandb_entity>
#   name: <your_wandb_exp_name>
#   save_dir: <your_wandb_save_dir>

  foreach: false
ci:
  nemo_ci_schedule: skipped
  cluster_tag: gb200
  recipe_owner: akoumpa
  node_multiplier: true
  # The full 2K source/reload matrix completes inside 20 minutes, but the
  # default native-resume phase needs additional setup and continuation time.
  time: "00:40:00"
  vllm_deploy: true
  vllm_smoke_test: true
  checkpoint_robustness:
    # Long-context mean, p95, and cosine metrics fit the shared standard profile.
    # Max KL remains diagnostic rather than using the former per-model max-only overrides.
    tokenizer_name: Qwen/Qwen3-30B-A3B
    # Match the other Qwen3-MoE references and avoid the real-device fallback
    # selected by trust_remote_code when no HF device map is provided.
    trust_remote_code: true
    hf_device_map_auto: true
    dataset.limit_dataset_samples: 500
  perf_testing:
    fake_balanced_gate: true
    schedule: nightly
  nodes: 2
  nproc_per_node: 4
