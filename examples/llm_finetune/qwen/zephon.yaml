# Fine-tune on Alpaca Cleaned using the model chat template and assistant supervision.
# Run: uv run automodel examples/llm_finetune/qwen/zephon.yaml --nproc-per-node 8
# Training reference: examples/llm_finetune/qwen/qwen3_0p6b_hellaswag.yaml
# Streaming step cap: 1 * ceil(39905 / 64) = 624.
# This retains the reference update budget, not its epoch boundaries on the different source.
# Packing window: examples/llm_finetune/qwen/qwen3_0p6b_packed_cp2.yaml; CP and its TE backend are not enabled here.
recipe: TrainFinetuneRecipeForNextTokenPrediction
rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 1111
  ranked: true
step_scheduler:
  global_batch_size: 64
  local_batch_size: 8
  ckpt_every_steps: 200
  val_every_steps: 100
  num_epochs: 1
  max_steps: 624  # Adjust for your dataset and training budget.
model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: Qwen/Qwen3-0.6B
dataset:
  _target_: nemo_automodel.components.datasets.zephon.ZephonInstructionDatasetConfig
  column_mapping:
    context: input
    question: instruction
    answer: output
  use_hf_chat_template: true
  zephon:
    sources:
    - name: instructions
      path: hf://yahma/alpaca-cleaned/train
    packing:
      seq_len: 1024
      pack_algorithm: best_fit
    checkpoint:
      run_id: zephon-qwen3-sft
distributed:
  strategy: fsdp2
  dp_size: none
  tp_size: 1
  cp_size: 1
  sequence_parallel: false
loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy
optimizer:
  _target_: torch.optim.Adam
  betas:
  - 0.9
  - 0.999
  eps: 1e-8
  lr: 1.0e-05
  weight_decay: 0
checkpoint:
  enabled: true
  checkpoint_dir: checkpoints/zephon-qwen3-sft
  model_save_format: torch_save
  save_consolidated: false
dist_env:
  backend: nccl
  timeout_minutes: 1
ci:
  cluster_tag: h100
  recipe_owner: MaxiBoether
  time: 00:30:00
  nodes: 1
  nproc_per_node: 8
