# LoRA SFT of Beam-1.0-501B-A23B on the Tulu-3 SFT mixture on one node of eight 141 GB GPUs (H200).
# EP8 + FSDP2, packed THD sequences of 2048 tokens, GBS 64 packs (~131k tokens per step), r32 / alpha 64 on the
# attention and dense-MLP projections and on the routed experts. The base weights stay bf16; the router weight and
# its correction bias stay fp32 (Beam's fp32 router contract) and are frozen with the base model.
#
# Measured on 8x H200: 100 steps, validation loss 0.527 -> 0.495, ~5,750 tokens/s.
# Peak memory is ~130 GiB per GPU, so this recipe does not fit 80 GB GPUs at EP8. enable_fsdp_optimizations stays
# off: with gradient accumulation it keeps every layer's gathered parameters resident through the backward, and the
# first backward runs out of memory. reshard_after_forward stays on for the same reason.
#
# Launch from the repository root:
#   uv run automodel --nproc-per-node=8 examples/llm_finetune/beam/beam_1_0_501b_a23b_tulu3_lora_ep8.yaml
recipe: TrainFinetuneRecipeForNextTokenPrediction

step_scheduler:
  global_batch_size: 64
  local_batch_size: 1
  ckpt_every_steps: 50
  val_every_steps: 10
  num_epochs: 1
  max_steps: 100

dist_env:
  backend: nccl
  timeout_minutes: 60

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 42
  ranked: true

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: reflection/Beam-1.0-501B-A23B
  torch_dtype: bfloat16
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: te
    linear: torch
    rms_norm: torch_fp32
    experts: torch_mm
    dispatcher: hybridep
    rope_fusion: false
    enable_hf_state_dict_adapter: true
    enable_fsdp_optimizations: false

peft:
  _target_: nemo_automodel.components._peft.lora.PeftConfig
  target_modules:
    - "*_proj"
    - "*.experts"
  dim: 32
  alpha: 64
  dropout: 0.0
  use_triton: false

checkpoint:
  enabled: true
  checkpoint_dir: checkpoints/beam_1_0_501b_a23b_tulu3_lora_ep8
  model_save_format: safetensors
  save_consolidated: false

distributed:
  strategy: fsdp2
  tp_size: 1
  cp_size: 1
  pp_size: 1
  ep_size: 8
  sequence_parallel: false
  activation_checkpointing: true
  reshard_after_forward: true

clip_grad_norm:
  max_norm: 1.0

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy

dataset:
  _target_: nemo_automodel.components.datasets.llm.chat_dataset.ChatDataset
  path_or_dataset_id: allenai/tulu-3-sft-mixture
  split: train[:100000]
  shuffle_seed: 42
  truncation: true
  seq_length: 2048
  padding: false
  tokenizer:
    _target_: transformers.AutoTokenizer.from_pretrained
    pretrained_model_name_or_path: reflection/Beam-1.0-501B-A23B

validation_dataset:
  _target_: nemo_automodel.components.datasets.llm.chat_dataset.ChatDataset
  path_or_dataset_id: allenai/tulu-3-sft-mixture
  split: train[100000:100256]
  shuffle_seed: 42
  truncation: true
  seq_length: 2048
  padding: false
  tokenizer:
    _target_: transformers.AutoTokenizer.from_pretrained
    pretrained_model_name_or_path: reflection/Beam-1.0-501B-A23B

packed_sequence:
  packed_sequence_size: 2048
  max_packs: 6500

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.packed_sequence_thd_collater
  shuffle: true
  drop_last: false
  num_workers: 0
  pin_memory: false

validation_dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.packed_sequence_thd_collater
  shuffle: false
  drop_last: false
  num_workers: 0
  pin_memory: false

optimizer:
  _target_: torch.optim.AdamW
  betas: [0.9, 0.95]
  eps: 1.0e-8
  lr: 1.0e-4
  weight_decay: 0.0

lr_scheduler:
  lr_warmup_steps: 0
  lr_decay_style: constant

ci:
  recipe_owner: mreso
  nodes: 2
  time: "01:00:00"
  nproc_per_node: 4
  cluster_tag: gb200
  max_steps: 20
