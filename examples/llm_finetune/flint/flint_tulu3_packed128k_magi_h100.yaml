#
# Long-context text execution target on one 8x H100 node with MagiAttention.
# Override --dataset.path_or_dataset_id with the chat data.
# Chat data is shuffled with the dataset seed, then packed on the fly into 128K
# THD rows that keep document boundaries, shifted targets and position metadata.
# Eight H100 GPUs: TP1/PP1/CP8/EP8, inferred DP1, LBS1/GBS2, GA2. Magi shards
# the sequence, so CP is not limited by the key/value head count as TE CP is;
# without PP the dataloader must yield one packed row per step.
# BF16 resident bulk with FP32 protected head/sinks and FusedAdam FP32 masters.
# CE-only explicit aux coefficient0;128K is within source maxpositions262144.
recipe: TrainFinetuneRecipeForNextTokenPrediction
seed: 1234
step_scheduler:
  global_batch_size: 2
  local_batch_size: 1
  max_steps: 100
  num_epochs: null
  ckpt_every_steps: 100
  val_every_steps: 1000
  gc_every_steps: 5
  log_remote_every_steps: 1
dist_env:
  backend: nccl
  timeout_minutes: 30
model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: RecursiveSI/flint
  dtype: bfloat16
  config:
    router_aux_loss_coef: 0.0
    residual_dtype: fp32
  attn_implementation: sdpa
  use_liger_kernel: false
  use_sdpa_patching: false
  trust_remote_code: false
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: magi
    linear: torch
    rms_norm: torch_fp32
    rope_fusion: false
    experts: torch_mm
    dispatcher: hybridep
    gate_precision: null
    enable_fsdp_optimizations: false
distributed:
  strategy: fsdp2
  tp_size: 1
  cp_size: 8
  pp_size: 1
  ep_size: 8
  activation_checkpointing: true
  reshard_after_forward: true
  defer_fsdp_grad_sync: false
  mp_policy:
    _target_: torch.distributed.fsdp.MixedPrecisionPolicy
    param_dtype: bfloat16
    reduce_dtype: float32
    output_dtype: bfloat16
    cast_forward_inputs: false
  moe:
    reshard_after_forward: true
    wrap_outer_model: true
    ignore_router_for_ac: true
loss_fn:
  _target_: nemo_automodel.components.loss.chunked_ce.ChunkedCrossEntropy
  chunk_len: 256
  compile: true
  reduction: sum
dataset:
  _target_: nemo_automodel.components.datasets.llm.chat_dataset.ChatDataset
  path_or_dataset_id: data/tulu3_sft.jsonl
  seq_length: 131072
  truncation: true
  padding: do_not_pad
  shuffle_seed: 1234
packed_sequence:
  packed_sequence_size: 131072
  packing_strategy: thd
  prepacked: false
  pad_to_multiple_of: 64
  max_packs: null
dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  batch_size: 1
  num_workers: 0
  pin_memory: true
  drop_last: true
  shuffle: true
  collate_fn: nemo_automodel.components.datasets.utils.packed_sequence_thd_collater
optimizer:
  _target_: transformer_engine.pytorch.optimizers.FusedAdam
  lr: 5.0e-06
  betas:
  - 0.9
  - 0.95
  eps: 1.0e-08
  weight_decay: 0.1
  adam_w_mode: true
  master_weights: true
  master_weight_dtype: float32
  store_param_remainders: true
  exp_avg_dtype: bfloat16
  exp_avg_sq_dtype: bfloat16
lr_scheduler:
  lr_decay_style: constant
clip_grad_norm:
  max_norm: 1.0
checkpoint:
  enabled: true
  checkpoint_dir: checkpoints/flint_tulu3_packed128k_magi_h100
  model_save_format: safetensors
  save_consolidated: final
  is_async: false
  cpu_offload: false
  v4_compatible: false
  restore_from: null
compile:
  enabled: false
wandb:
  enable: false

ci:
  # Excluded from automatic GPU CI; requires user-provided training data.
  deprecated: true
  cluster_tag: h100
  recipe_owner: snowmanwwg
  time: "02:00:00"
  nodes: 1
