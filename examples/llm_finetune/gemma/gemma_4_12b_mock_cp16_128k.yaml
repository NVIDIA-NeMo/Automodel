# Gemma4 Unified 12B with 128K-token sequences under context parallelism (cp_size=16) on two 8-GPU nodes.
# Each rank keeps a contiguous 8K-token slice, the same shard length as the single-node 64K recipe (a 16K
# shard per rank exceeds 80 GB per GPU); the sliding-window layers run Flex and the head_dim=512
# full-attention ring chunks run the FFPA kernel (install the `ffpa` extra: uv sync --extra ffpa).
# The data is the built-in synthetic LLM mock (one 128K-token sample per row), so the recipe is
# self-contained and measures memory and throughput, not convergence.
#
# To run, on each of the two nodes (node 0 is the rendezvous master):
#   torchrun --nnodes 2 --node-rank <0|1> --master-addr <node-0 address> --master-port 29500 --nproc-per-node 8 \
#     examples/llm_finetune/finetune.py --config examples/llm_finetune/gemma/gemma_4_12b_mock_cp16_128k.yaml

recipe: TrainFinetuneRecipeForNextTokenPrediction

step_scheduler:
  global_batch_size: 2
  local_batch_size: 1
  max_steps: 20

dist_env:
  backend: nccl
  timeout_minutes: 30

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 1111
  ranked: true

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: google/gemma-4-12B
  torch_dtype: bf16
  # The CP ring attention runs in place of SDPA.
  attn_implementation: sdpa
  text_config:
    cp_full_attn_backend: ffpa

checkpoint:
  enabled: false

distributed:
  strategy: fsdp2
  dp_size: none
  tp_size: 1
  cp_size: 16  # 131072 / 16 = 8192 tokens per rank, over two nodes
  pp_size: 1
  sequence_parallel: false
  activation_checkpointing: true
  # dp is 1, so the two micro-batches accumulate on every rank. Deferring the reduce-scatter keeps the
  # first micro-batch's unsharded gradients alive and runs out of memory next to the FP32 optimizer state.
  defer_fsdp_grad_sync: false

# Fused linear CE: at 8K tokens per rank the materialized 262K-vocab logits alone need 4 GiB in bf16 plus
# 8 GiB for the fp32 upcast, which does not fit next to the activations on an 80 GB GPU.
loss_fn:
  _target_: nemo_automodel.components.loss.linear_ce.FusedLinearCrossEntropy
  logit_softcapping: 30.0  # Gemma4's final_logit_softcapping

dataset:
  _target_: nemo_automodel.components.datasets.llm.mock.build_unpacked_dataset
  num_sentences: 64
  mean_len: 131071  # plus the trailing EOS: 131072 tokens, divisible by 2 * cp_size
  std_len: 0
  vocab_size: 100
  max_sentence_len: 131071
  seed: 0

packed_sequence:
  packed_sequence_size: 0

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn:
    _target_: nemo_automodel.components.datasets.utils.default_collater
    pad_seq_len_divisible: 16
  shuffle: false

# TE FusedAdam keeps an FP32 master copy and FP32 moments next to the BF16 model weights.
optimizer:
  _target_: transformer_engine.pytorch.optimizers.fused_adam.FusedAdam
  betas: [0.9, 0.95]
  eps: 1.0e-8
  lr: 1.0e-5
  weight_decay: 0.01
  adam_w_mode: true
  bias_correction: true
  master_weights: true
  master_weight_dtype: torch.float32
  store_param_remainders: false
  exp_avg_dtype: torch.float32
  exp_avg_sq_dtype: torch.float32

ci:
  cluster_tag: h100
  recipe_owner: khazic
  time: "00:40:00"
  # cp_size(16) = 16 GPUs => 2 nodes (8 GPUs/node).
  nodes: 2
  nproc_per_node: 8
