#
# Inkling 2 Small with 4-bit expert GEMMs. Transformer Engine experts quantize weights and activations to NVFP4
# for the forward and the backward GEMMs; the last eight layers, whose released experts are MXFP8, run in MXFP8.
# All experts are trained, with expert parallelism over the 32 GPUs of eight GB300 nodes.
#
# To keep the backward GEMMs in MXFP8 and scale activations per token, add to te_nvfp4:
#   backward: mxfp8, row_scaled_activation: true, four_over_six: activations, random_hadamard_transform: false
# That variant reaches the same loss and takes about a third longer per step.
recipe: TrainFinetuneRecipeForNextTokenPrediction
seed: 1234
step_scheduler:
  global_batch_size: 32
  local_batch_size: 1
  ckpt_every_steps: 1000
  val_every_steps: 1000
  gc_every_steps: 5
  num_epochs: null
  max_steps: 50
  log_remote_every_steps: 1
  save_checkpoint_every_epoch: false
  validate_on_checkpoint: false
dist_env:
  backend: nccl
  timeout_minutes: 60
model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: thinkingmachines/Inkling-2-Small
  config:
    architectures: [Inkling2ForCausalLM]
  dtype: bfloat16
  use_liger_kernel: false
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: flex
    linear: torch
    rms_norm: torch
    experts: te
    dispatcher: hybridep
    gate_precision: float32
    fake_balanced_gate: false
    enable_hf_state_dict_adapter: true
    enable_fsdp_optimizations: true
    te_nvfp4:
      # One block scale per 16 values of a weight row, the layout of the released NVFP4 experts.
      weight_blocks_2d: false
      mxfp8_fqns:
      - layers.40.
      - layers.41.
      - layers.42.
      - layers.43.
      - layers.44.
      - layers.45.
      - layers.46.
      - layers.47.
  use_sdpa_patching: false
distributed:
  strategy: fsdp2
  dp_size: none
  tp_size: 1
  cp_size: 1
  pp_size: 1
  ep_size: 32
  sequence_parallel: false
  activation_checkpointing: true
  reshard_after_forward: true
  moe:
    reshard_after_forward: true
    wrap_outer_model: true
    ignore_router_for_ac: true
checkpoint:
  enabled: false
  checkpoint_dir: checkpoints/inkling2_tulu3_packed4k_nvfp4_ep32
  load_metadata_with_gloo: true
  dequantize_base_checkpoint: true
loss_fn:
  _target_: nemo_automodel.components.models.inkling2.loss.Inkling2FusedLinearCrossEntropy
  unpadded_vocab_size: 200058
  reduction: sum
  logit_softcapping: 30.0
dataset:
  _target_: nemo_automodel.components.datasets.llm.chat_dataset.ChatDataset
  path_or_dataset_id: allenai/tulu-3-sft-mixture
  split: train
  shuffle_seed: 1234
  seq_length: 4096
  truncation: true
  padding: false
  chat_template: examples/llm_finetune/inkling2/inkling2_chat_template.jinja
  tokenizer:
    pretrained_model_name_or_path: thinkingmachines/Inkling-2-Small
    pad_token: "<|content_model_end_sampling|>"
    eos_token: "<|content_model_end_sampling|>"
packed_sequence:
  packed_sequence_size: 4096
  packing_strategy: thd
  # 50 optimizer steps x 32 packs, plus a small margin, without tokenizing the
  # whole mixture up front.
  max_packs: 1664
  pad_to_multiple_of: 64
dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  batch_size: 1
  num_workers: 0
  pin_memory: true
  drop_last: true
  shuffle: false
  collate_fn: nemo_automodel.components.datasets.utils.packed_sequence_thd_collater
optimizer:
  _target_: transformer_engine.pytorch.optimizers.FusedAdam
  lr: 5.0e-06
  betas:
  - 0.9
  - 0.95
  eps: 1.0e-08
  weight_decay: 0.1
  adam_w_mode: true
  master_weights: true
  master_weight_dtype: float32
  store_param_remainders: true
  exp_avg_dtype: bfloat16
  exp_avg_sq_dtype: bfloat16
lr_scheduler:
  lr_decay_style: constant
clip_grad_norm:
  max_norm: 1.0
  backend: triton
wandb:
  enable: false
  project: inkling2
  name: inkling2_tulu3_packed4k_nvfp4_ep32
  mode: online
  dir: logs/inkling2_tulu3_packed4k_nvfp4_ep32/wandb
ci:
  nemo_ci_schedule: skipped
  recipe_owner: HuiyingLi
  nodes: 8
  nproc_per_node: 4
  cluster_tag: gb300
  time: 01:00:00
  max_steps: 2
