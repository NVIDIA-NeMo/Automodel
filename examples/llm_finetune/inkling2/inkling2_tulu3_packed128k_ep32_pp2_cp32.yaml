recipe: TrainFinetuneRecipeForNextTokenPrediction
seed: 1234
step_scheduler:
  global_batch_size: 8
  local_batch_size: 8
  ckpt_every_steps: 1000
  val_every_steps: 1000
  gc_every_steps: 5
  num_epochs: null
  max_steps: 50
  log_remote_every_steps: 1
  save_checkpoint_every_epoch: false
  validate_on_checkpoint: false
dist_env:
  backend: nccl
  timeout_minutes: 15
model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: thinkingmachines/Inkling-2-Small
  config:
    architectures: [Inkling2ForCausalLM]
  dtype: bfloat16
  use_liger_kernel: false
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: flex
    linear: torch
    rms_norm: torch
    experts: torch_mm
    dispatcher: torch
    gate_precision: float32
    fake_balanced_gate: false
    enable_hf_state_dict_adapter: true
    enable_fsdp_optimizations: true
  use_sdpa_patching: false
distributed:
  strategy: fsdp2
  dp_size: none
  tp_size: 1
  cp_size: 32
  pp_size: 2
  ep_size: 32
  sequence_parallel: false
  activation_checkpointing: true
  reshard_after_forward: true
  defer_fsdp_grad_sync: false
  moe:
    reshard_after_forward: true
    wrap_outer_model: true
    ignore_router_for_ac: true
  pipeline:
    pp_schedule: interleaved1f1b
    pp_microbatch_size: 1
    layers_per_stage: 12
    pp_recv_buffer_pool: false
    scale_grads_in_schedule: false
    patch_inner_model: false
    patch_causal_lm_model: false
checkpoint:
  enabled: false
  checkpoint_dir: checkpoints/inkling2_tulu3_packed128k_ep32_pp2_cp32
  load_metadata_with_gloo: true
  dequantize_base_checkpoint: true
loss_fn:
  _target_: nemo_automodel.components.models.inkling2.loss.Inkling2FusedLinearCrossEntropy
  unpadded_vocab_size: 200058
  reduction: sum
  logit_softcapping: 30.0
dataset:
  _target_: datasets.load_from_disk
  dataset_path: data/inkling2_tulu3_packed128k/train
packed_sequence:
  packed_sequence_size: 131072
  packing_strategy: thd
  prepacked: true
  pad_to_multiple_of: 64
dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  batch_size: 8
  num_workers: 0
  pin_memory: true
  drop_last: true
  shuffle: false
  collate_fn: nemo_automodel.components.datasets.utils.packed_sequence_thd_collater
optimizer:
  _target_: transformer_engine.pytorch.optimizers.FusedAdam
  lr: 5.0e-06
  betas:
  - 0.9
  - 0.95
  eps: 1.0e-08
  weight_decay: 0.1
  adam_w_mode: true
  master_weights: true
  master_weight_dtype: float32
  store_param_remainders: true
  exp_avg_dtype: bfloat16
  exp_avg_sq_dtype: bfloat16
lr_scheduler:
  lr_decay_style: constant
clip_grad_norm:
  max_norm: 1.0
  backend: triton
wandb:
  enable: false
  project: inkling2
  name: inkling2_tulu3_packed128k_ep32_pp2_cp32
  mode: online
  dir: logs/inkling2_tulu3_packed128k_ep32_pp2_cp32/wandb
ci:
  nemo_ci_schedule: release
  recipe_owner: snowmanwwg
  nodes: 16
  nproc_per_node: 4
  cluster_tag: gb200
  time: 02:00:00
  max_steps: 2
