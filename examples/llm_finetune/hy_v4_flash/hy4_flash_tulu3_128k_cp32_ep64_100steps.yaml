# Hy4-flash SFT on Tulu-3 with 128K-token packed sequences.
# 16 nodes x 8 H100 80GB; BF16; CP32, EP64, TP1, PP1 (DP4). Global and local batch are 4 packs: with DP4 each
# data-parallel replica trains one 128K pack per step and every pack is split over 32 context-parallel ranks.
# Tulu-3 conversations are shuffled with a fixed seed (shuffle_seed) BEFORE packing, then packed in order into THD
# sequences of 131072 tokens; the packs keep that order (dataloader shuffle: false), so all CP/parallelism
# configurations can reuse the same frozen packs. Packed documents never attend to each other.
# Launch requirement on multi-node InfiniBand H100 systems: export NCCL_PXN_DISABLE=1 (or NCCL_NET_PLUGIN=none
# NCCL_NET=IB with PXN kept), as for DeepSeek-V4.1-Flash. With the container's default network plugin and PXN both
# active, the Engram row-owner ID all-to-all receives corrupted IDs from ranks on another node and the recipe stops in
# the shared table's received-ID check (issue #3959). ``ci.env_vars`` below sets it for CI.
# Point the JIT caches (HYBRID_EP_CACHE_DIR, TRITON_CACHE_DIR) at node-local storage, as on the DeepSeek-V4.1-Flash
# model-coverage page.

recipe: TrainFinetuneRecipeForNextTokenPrediction
seed: 1234
nvtx: false
step_scheduler:
  global_batch_size: 4
  local_batch_size: 1
  max_steps: 100
  num_epochs: 1
  ckpt_every_steps: 1000
  val_every_steps: 1000
  gc_every_steps: 1000
  log_remote_every_steps: 1
dist_env:
  backend: nccl
  timeout_minutes: 60
model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: tencent/Hy4-flash
  revision: eccd3123eec73f2040f4c9ed0de1883593470510  # pragma: allowlist secret (public model commit SHA)
  torch_dtype: bfloat16
  trust_remote_code: false
  use_liger_kernel: false
  use_sdpa_patching: false
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: cudnn
    linear: torch
    rms_norm: torch
    experts: torch_mm
    dispatcher: hybridep
    gate_precision: float32
    rope_fusion: false
    shared_expert_overlap: true
    compile_router_weight: true
    compile_hc: true  # hyper-connection cores compiled once per static shape; the first step takes minutes longer
    compile_norm: true
    dispatcher_equal_token_counts: true  # packed CP synchronises physical lengths across EP ranks
    fake_balanced_gate: false
    enable_hf_state_dict_adapter: true
    enable_fsdp_optimizations: true
  text_config:
    output_hidden_states: true
distributed:
  strategy: fsdp2
  tp_size: 1
  cp_size: 32
  pp_size: 1
  ep_size: 64
  sequence_parallel: false
  activation_checkpointing: true
  enable_compile: false
  reshard_after_forward: true
  moe:
    reshard_after_forward: true
    wrap_outer_model: true
    lm_head_precision: float32
    ignore_router_for_ac: true
freeze_config:
  freeze_vision_tower: true
  freeze_language_model: false
checkpoint:
  enabled: false
  checkpoint_dir: checkpoints/hy4_flash_tulu3_128k_cp32_ep64_100steps/
loss_fn:
  _target_: nemo_automodel.components.loss.linear_ce.FusedLinearCrossEntropy
  ignore_index: -100
  impl: torch_compile
dataset:
  _target_: nemo_automodel.components.datasets.llm.chat_dataset.ChatDataset
  path_or_dataset_id: allenai/tulu-3-sft-mixture
  split: train
  shuffle_seed: 1234
  seq_length: 131072
  truncation: true
  padding: do_not_pad
  chat_template: examples/llm_finetune/hy_v4_flash/hy4_flash_training_chat_template.jinja
packed_sequence:
  packed_sequence_size: 131072
  packing_strategy: thd
  pad_to_multiple_of: 64
  max_packs: 400  # max_steps * global_batch_size
  num_proc: 1
dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  batch_size: 1
  num_workers: 0
  shuffle: false
  drop_last: true
  pin_memory: true
  collate_fn: nemo_automodel.components.datasets.utils.packed_sequence_thd_collater
optimizer:
  _target_: transformer_engine.pytorch.optimizers.fused_adam.FusedAdam
  betas: [0.9, 0.95]
  eps: 1.0e-08
  lr: 5.0e-06
  weight_decay: 0.1
  adam_w_mode: true
  bias_correction: true
  master_weights: true
  store_param_remainders: true
  exp_avg_dtype: torch.bfloat16
  exp_avg_sq_dtype: torch.bfloat16
wandb:
  enable: false
  entity: Nemo-automodel
  project: hy4_flash
  name: hy4_flash_tulu3_128k_cp32_ep64_100steps
  dir: logs/hy4_flash_tulu3_128k_cp32_ep64_100steps/wandb
  tags: [hy4-flash, tulu3, packed128k, cp32, ep64]
moe_metrics:
  enabled: true
  mode: brief
clip_grad_norm:
  backend: te  # avoids gradient-sized temporaries for the Engram owner shards
  max_norm: 1.0
lr_scheduler:
  lr_decay_style: constant
  lr_warmup_steps: 10
  lr_decay_steps: 100
  wd_incr_steps: 100
mfu:
  peak_tflops: 989
validation_dataset: null
validation_dataloader: null
ci:
  nemo_ci_schedule: release
  cluster_tag: h100
  recipe_owner: HuiyingLi
  nodes: 16
  time: "01:00:00"
  max_steps: 2
  nproc_per_node: 8
  env_vars:
    NCCL_PXN_DISABLE: "1"
