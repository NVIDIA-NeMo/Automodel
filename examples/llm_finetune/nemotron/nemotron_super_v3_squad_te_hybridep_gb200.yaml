# GB200 real-data training variant; runtime tuning migrated from
# examples/llm_benchmark/nemotron/nemotron_super_v3_te_hybridep_8k_ep16_gb200.yaml
# Run with --nproc-per-node 4 and --nnodes 4. GPU validation is pending.
recipe: TrainFinetuneRecipeForNextTokenPrediction

step_scheduler:
  num_epochs: 1
  global_batch_size: 128
  local_batch_size: 2
  ckpt_every_steps: 100
  val_every_steps: 100  # will run every x number of gradient steps

  gc_every_steps: 10
dist_env:
  backend: nccl
  timeout_minutes: 1

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 1111
  ranked: true

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-BF16  # pragma: allowlist secret -- Public Hugging Face model ID.
  # Match the pretraining counterpart, which disables MTP. Set to 1 to train
  # the checkpoint's MTP layer with the auxiliary loss below.
  num_nextn_predict_layers: 0
  mtp_loss_scaling_factor: 0.1

  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: te
    linear: te
    rms_norm: te
    experts: te
    dispatcher: hybridep
    fake_balanced_gate: false
    enable_hf_state_dict_adapter: true
  dtype: bfloat16
checkpoint:
  enabled: true
  checkpoint_dir: checkpoints/
  model_save_format: safetensors
  save_consolidated: final

distributed:
  strategy: fsdp2
  tp_size: 1
  cp_size: 1
  pp_size: 1
  ep_size: 16
  sequence_parallel: false
  activation_checkpointing: true
  reshard_after_forward: true
  moe:
    reshard_after_forward: true
loss_fn:
  fp32_upcast: false
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy

dataset:
  _target_: nemo_automodel.components.datasets.llm.squad.make_squad_dataset
  dataset_name: rajpurkar/squad
  split: train

  padding: false
packed_sequence:
  packed_sequence_size: 8192

  packing_strategy: thd
dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.packed_sequence_thd_collater
  shuffle: true

  drop_last: true
validation_dataset:
  _target_: nemo_automodel.components.datasets.llm.squad.make_squad_dataset
  dataset_name: rajpurkar/squad
  split: validation
  limit_dataset_samples: 64

  padding: false
validation_dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.packed_sequence_thd_collater

optimizer:
  _target_: torch.optim.Adam
  betas:
  - 0.9
  - 0.999
  eps: 1e-8
  lr: 1.0e-05
  weight_decay: 0
  fused: true
  foreach: false
  param_group_overrides:
  - pattern: (?:^|\.)experts\.(?:gate_up_linear|down_linear)\.
    lr_mult: 1
    wd_mult: 1

lr_scheduler:
  lr_decay_style: cosine
  min_lr: 1.0e-6

# wandb:
#   project: <your_wandb_project>
#   entity: <your_wandb_entity>
#   name: <your_wandb_exp_name>
#   save_dir: <your_wandb_save_dir>

ci:
  nemo_ci_schedule: skipped
  cluster_tag: gb200
  nodes: 4
  vllm_deploy: true
  vllm_smoke_test: true
  vllm_deploy_gpus: 8  # the 120B BF16 model requires TP=8 for vLLM deployment
  vllm_enable_expert_parallel: true  # shard MoE experts across the vLLM TP group
  recipe_owner: adil-a
  time: "00:40:00"
  known_issue_id: AM-156
  checkpoint_robustness:
    experts_implementation: grouped_mm
    trust_remote_code: true
    tokenizer_name: nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-BF16  # pragma: allowlist secret -- Public Hugging Face model ID.
    hf_device_map_auto: true
    step_scheduler.global_batch_size: 64
    dataset.limit_dataset_samples: 500
    validation_dataset.limit_dataset_samples: 500
  perf_testing:
    fake_balanced_gate: true
    schedule: nightly
  nproc_per_node: 4
  env_vars:
    PYTORCH_ALLOC_CONF: expandable_segments:True
