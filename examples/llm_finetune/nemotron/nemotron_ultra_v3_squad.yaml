  # Synthetic performance settings migrated from examples/llm_benchmark/nemotron/nemotron_ultra_v3_te_deepep.yaml.
  # Reset changed components before setting leaves; "none" is the CLI null token.
  perf_testing:
    schedule: weekly
    time: 00:45:00
    config_overrides:
      recipe: BenchmarkingRecipeForNextTokenPrediction
      step_scheduler: none
      step_scheduler.gc_every_steps: 10
      step_scheduler.global_batch_size: 128
      step_scheduler.local_batch_size: 1
      step_scheduler.ckpt_every_steps: 1000
      step_scheduler.val_every_steps: 1000
      step_scheduler.num_epochs: 1
      step_scheduler.max_steps: 12
      dist_env: none
      dist_env.backend: nccl
      dist_env.timeout_minutes: 30
      rng: none
      model: none
      model._target_: nemo_automodel.NeMoAutoModelForCausalLM.from_config
      model.config._target_: nemo_automodel.NeMoAutoConfig.from_pretrained
      model.config.pretrained_model_name_or_path: nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-BF16
      model.config.trust_remote_code: true
      model.trust_remote_code: true
      model.num_nextn_predict_layers: 2
      model.mtp_use_repeated_layer: true
      model.mtp_loss_scaling_factor: 0.1
      model.output_hidden_states: true
      model.backend._target_: nemo_automodel.components.models.common.BackendConfig
      model.backend.attn: te
      model.backend.linear: te
      model.backend.rms_norm: te
      model.backend.experts: torch_mm
      model.backend.dispatcher: hybridep
      model.backend.fake_balanced_gate: true
      model.backend.enable_fsdp_optimizations: false
      checkpoint: none
      checkpoint.enabled: false
      distributed: none
      distributed.strategy: fsdp2
      distributed.tp_size: 1
      distributed.cp_size: 1
      distributed.pp_size: 1
      distributed.ep_size: 64
      distributed.activation_checkpointing: true
      distributed.moe.reshard_after_forward: true
      distributed.moe.wrap_outer_model: false
      dataset: none
      dataset._target_: nemo_automodel.components.datasets.llm.mock_iterable_dataset.MockIterableDataset
      dataset.seq_len: 4096
      dataset.num_samples: 100000
      packed_sequence: none
      dataloader: none
      dataloader.batch_size: none
      dataloader._target_: torch.utils.data.DataLoader
      dataloader.num_workers: 0
      validation_dataset: none
      validation_dataloader: none
      optimizer: none
      optimizer._target_: torch.optim.Adam
      optimizer.betas: '[0.9, 0.999]'
      optimizer.eps: 1e-8
      optimizer.lr: 0.0001
      optimizer.weight_decay: 0
      lr_scheduler: none
      seed: 1234
      benchmark: none
      benchmark.warmup_steps: 2
      benchmark.peak_tflops: 989
      benchmark.nsys_start: -1
      benchmark.nsys_end: -1
      benchmark.nsys_ranks: '[]'
      benchmark.num_nodes: 16
      ci.nodes: 16
      ci.env_vars: none
