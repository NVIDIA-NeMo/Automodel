# Full 52-layer Nemotron 3.5 Lightning SFT on Tulu3, with MTP disabled.
# FP32 master weights/AdamW moments, BF16 compute, FSDP2 and EP8 on 8 GPUs.
# Both CP arms use identical 8K packs: document spans are aligned to 4 tokens.
# global_batch_size counts packs; 800 packs give 100 steps at global batch 8.
#
# CP1:
#   automodel examples/llm_finetune/nemotron/nemotron_nano_v3_5_lightning_tulu3_packed_cp.yaml --nproc-per-node 8
# CP2: add --distributed.cp_size 2.
# For 4K, override both --dataset.seq_length 4096 and --packed_sequence.packed_sequence_size 4096.
# Enable experiment tracking with --wandb.enable true and give each arm a unique --wandb.name.

recipe: TrainFinetuneRecipeForNextTokenPrediction
step_scheduler:
  global_batch_size: 8
  local_batch_size: 1
  ckpt_every_steps: 1000
  val_every_steps: 1000
  max_steps: 100
  num_epochs: 1
dist_env:
  backend: nccl
  timeout_minutes: 10
rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 1111
  ranked: false
model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16
  dtype: float32
  num_nextn_predict_layers: 0
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: te
    linear: te
    rms_norm: te
    experts: torch_mm
    dispatcher: deepep
    fake_balanced_gate: false
  output_hidden_states: true
checkpoint:
  enabled: false
  checkpoint_dir: checkpoints/nemotron_lightning_tulu3_packed_cp
distributed:
  strategy: fsdp2
  dp_size: none
  tp_size: 1
  cp_size: 1
  ep_size: 8
  sequence_parallel: false
  activation_checkpointing: true
  mp_policy:
    _target_: torch.distributed.fsdp.MixedPrecisionPolicy
    param_dtype: bfloat16
    reduce_dtype: float32
    output_dtype: bfloat16
  defer_fsdp_grad_sync: false
  moe:
    reshard_after_forward: true
loss_fn:
  _target_: nemo_automodel.components.loss.linear_ce.FusedLinearCrossEntropy
  impl: cce
dataset:
  _target_: nemo_automodel.components.datasets.llm.chat_dataset.ChatDataset
  path_or_dataset_id: allenai/tulu-3-sft-mixture
  split: train
  seq_length: 8192
  truncation: true
  padding: do_not_pad
  shuffle_seed: 42
  chat_template: examples/llm_finetune/nemotron/nemotron_lightning_tulu3_chat_template.jinja
packed_sequence:
  packed_sequence_size: 8192
  pad_to_multiple_of: 4
  max_packs: 800
dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.packed_sequence_thd_collater
  shuffle: false
  num_workers: 0
optimizer:
  _target_: torch.optim.AdamW
  betas:
  - 0.9
  - 0.95
  eps: 1.0e-08
  lr: 1.0e-05
  weight_decay: 0.1
  foreach: false
lr_scheduler:
  lr_decay_style: cosine
  lr_warmup_steps: 10
  min_lr: 1.0e-06
compile:
  enabled: false
wandb:
  enable: false
  project: nemotron-lightning-cp
  name: lightning-tulu3-packed-cp1
  dir: wandb
