# To run this recipe:
#   automodel examples/llm_finetune/glm/glm_4.7_te_deepep.yaml --nproc-per-node 8
# Adjust --nproc-per-node to the number of GPUs available on your machine.

recipe: TrainFinetuneRecipeForNextTokenPrediction

step_scheduler:
  global_batch_size: 512
  local_batch_size: 8
  ckpt_every_steps: 500
  val_every_steps: 100  # will run every x number of gradient steps
  num_epochs: 2

dist_env:
  backend: nccl
  timeout_minutes: 10

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 1111
  ranked: true

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: zai-org/GLM-4.7
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    dispatcher: hybridep

checkpoint:
  enabled: false
  checkpoint_dir: /tmp/checkpoints/
  model_save_format: safetensors # torch_save or safetensors
  save_consolidated: final

distributed:
  strategy: fsdp2
  tp_size: 1
  cp_size: 1
  pp_size: 4
  ep_size: 32

  sequence_parallel: false

  pipeline:
    pp_schedule: interleaved1f1b
    pp_microbatch_size: 1
    round_virtual_stages_to_pp_multiple: up
    scale_grads_in_schedule: false
    patch_inner_model: false
    patch_causal_lm_model: false
    layers_per_stage: 2

  moe:
    wrap_outer_model: false

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy

dataset:
  _target_: nemo_automodel.components.datasets.llm.hellaswag.HellaSwag
  path_or_dataset: rowan/hellaswag
  split: train

packed_sequence:
  # Set packed_sequence_size > 0 to run with packed sequences
  packed_sequence_size: 0
  split_across_pack: false

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn:
    _target_: nemo_automodel.components.datasets.utils.default_collater
    pad_seq_len_divisible: 160
  shuffle: true
  drop_last: true

validation_dataset:
  _target_: nemo_automodel.components.datasets.llm.hellaswag.HellaSwag
  path_or_dataset: rowan/hellaswag
  split: validation
  num_samples_limit: 64

validation_dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn:
    _target_: nemo_automodel.components.datasets.utils.default_collater
    pad_seq_len_divisible: 160
  batch_size: 8
  drop_last: true

optimizer:
  _target_: torch.optim.Adam
  betas: [0.9, 0.999]
  eps: 1e-8
  lr: 1.0e-5
  weight_decay: 0.0

# Uncomment and configure for W&B logging
# wandb:
#   project: <your_wandb_project>
#   entity: <your_wandb_entity>
#   name: <your_wandb_exp_name>
#   save_dir: <your_wandb_save_dir>

ci:
  cluster_tag: h100
  recipe_owner: hemildesai
  nodes: 16
  time: "01:00:00"
  env_vars:
    PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
  # Synthetic performance settings migrated from examples/llm_benchmark/glm/glm_4.7_te_deepep.yaml.
  # Reset changed components before setting leaves; "none" is the CLI null token.
  perf_testing:
    schedule: weekly
    time: 00:45:00
    config_overrides:
      recipe: BenchmarkingRecipeForNextTokenPrediction
      step_scheduler: none
      step_scheduler.gc_every_steps: 10
      step_scheduler.global_batch_size: 2048
      step_scheduler.local_batch_size: 4
      step_scheduler.ckpt_every_steps: 1000
      step_scheduler.val_every_steps: 1000
      step_scheduler.num_epochs: 1
      step_scheduler.max_steps: 30
      rng: none
      model: none
      model._target_: nemo_automodel.NeMoAutoModelForCausalLM.from_config
      model.config._target_: nemo_automodel.NeMoAutoConfig.from_pretrained
      model.config.pretrained_model_name_or_path: zai-org/GLM-4.7
      model.trust_remote_code: true
      model.backend._target_: nemo_automodel.components.models.common.BackendConfig
      model.backend.attn: te
      model.backend.linear: te
      model.backend.rms_norm: te
      model.backend.rope_fusion: true
      model.backend.experts: torch_mm
      model.backend.dispatcher: hybridep
      model.backend.compile_router_weight: true
      model.backend.fake_balanced_gate: true
      model.backend.enable_hf_state_dict_adapter: true
      model.backend.enable_fsdp_optimizations: true
      checkpoint: none
      checkpoint.enabled: false
      distributed: none
      distributed.strategy: fsdp2
      distributed.tp_size: 1
      distributed.cp_size: 1
      distributed.pp_size: 4
      distributed.ep_size: 32
      distributed.sequence_parallel: false
      distributed.activation_checkpointing: true
      distributed.pipeline.pp_schedule: interleaved1f1b
      distributed.pipeline.pp_microbatch_size: 1
      distributed.pipeline.round_virtual_stages_to_pp_multiple: up
      distributed.pipeline.scale_grads_in_schedule: false
      distributed.pipeline.patch_inner_model: false
      distributed.pipeline.patch_causal_lm_model: false
      distributed.pipeline.layers_per_stage: 2
      distributed.moe.reshard_after_forward: true
      distributed.moe.wrap_outer_model: false
      loss_fn: none
      loss_fn._target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy
      loss_fn.fp32_upcast: false
      dataset: none
      dataset._target_: nemo_automodel.components.datasets.llm.mock_iterable_dataset.MockIterableDataset
      dataset.seq_len: 4096
      dataset.num_samples: 100000
      packed_sequence: none
      dataloader: none
      dataloader.batch_size: none
      dataloader._target_: torch.utils.data.DataLoader
      dataloader.num_workers: 0
      validation_dataset: none
      validation_dataloader: none
      optimizer: none
      optimizer._target_: torch.optim.Adam
      optimizer.betas: '[0.9, 0.999]'
      optimizer.eps: 1e-8
      optimizer.lr: 0.0001
      optimizer.weight_decay: 0
      seed: 1234
      benchmark: none
      benchmark.warmup_steps: 10
      benchmark.peak_tflops: 989
      benchmark.nsys_start: -1
      benchmark.nsys_end: -1
      benchmark.nsys_ranks: '[]'
      benchmark.num_nodes: 32
      ci.nodes: 32
