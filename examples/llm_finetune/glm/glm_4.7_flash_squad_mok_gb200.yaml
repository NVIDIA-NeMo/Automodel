# GB200 real-data training variant; runtime tuning migrated from
# examples/llm_benchmark/glm/glm_4.7_flash_mok_4gpu.yaml
# Run with --nproc-per-node 4 and --nnodes 1. GPU validation is pending.
recipe: TrainFinetuneRecipeForNextTokenPrediction

step_scheduler:
  global_batch_size: 4
  local_batch_size: 1
  ckpt_every_steps: 500
  num_epochs: 2

  gc_every_steps: 10
dist_env:
  backend: nccl
  timeout_minutes: 10

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 1111
  ranked: true

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: zai-org/GLM-4.7-Flash
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: te
    linear: te
    rms_norm: te
    rope_fusion: false # Use unfused RoPE for packed THD inputs, matching the existing packed recipes.
    experts: torch_mm  # Ignored by MoK; retained for parity with HybridEP recipes.
    dispatcher: mok
    gate_precision: float32
    fake_balanced_gate: false
    enable_hf_state_dict_adapter: true
    enable_fsdp_optimizations: true
    mok:
      fwd_num_comm_sms: 40
      bwd_num_comm_sms: 28
      minibatch_size: 4096
      macrobatch_size: 131072
      schedule_capacity_multiplier: 1.5
      all_gather_top_experts_chunk_bytes: 2048

  torch_dtype: bfloat16
checkpoint:
  enabled: false
  checkpoint_dir: /tmp/checkpoints/
  model_save_format: safetensors # torch_save or safetensors
  save_consolidated: final

distributed:
  strategy: fsdp2
  tp_size: 1
  cp_size: 1
  pp_size: 1
  ep_size: 4
  sequence_parallel: false
  activation_checkpointing: true
  moe:
    reshard_after_forward: false
    wrap_outer_model: false

loss_fn:
  fp32_upcast: false
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy

dataset:
  _target_: nemo_automodel.components.datasets.llm.squad.make_squad_dataset
  dataset_name: rajpurkar/squad
  split: train

  padding: false
packed_sequence:
  # Set packed_sequence_size > 0 to run with packed sequences
  packed_sequence_size: 4096

  packing_strategy: thd
dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.packed_sequence_thd_collater
  shuffle: true

  drop_last: true
validation_dataset:
  _target_: nemo_automodel.components.datasets.llm.squad.make_squad_dataset
  dataset_name: rajpurkar/squad
  split: validation
  limit_dataset_samples: 64

  padding: false
validation_dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.packed_sequence_thd_collater
  batch_size: 8

optimizer:
  _target_: torch.optim.Adam
  betas: [0.9, 0.999]
  eps: 1e-8
  lr: 1.0e-5
  # min_lr: 1.0e-5

# # Uncomment and configure for W&B logging
# wandb:
#   project: <your_wandb_project>
#   entity: <your_wandb_entity>
#   name: <your_wandb_exp_name>
#   save_dir: <your_wandb_save_dir>

  foreach: false
ci:
  nemo_ci_schedule: skipped
  cluster_tag: gb200
  recipe_owner: akoumpa
  nodes: 1
  time: "00:40:00"
  checkpoint_robustness:
    # The released checkpoint is near a numerically critical point: small
    # kernel-order and rounding differences are amplified through its routed
    # layers. Even vanilla HF reaches mean KL ~0.15 when the same first 512
    # tokens are evaluated at different total sequence lengths. At 2K, a small
    # late-token tail dominates the aggregate divergence, while weights load
    # exactly and same-implementation repeat/reload and native resume are exact.
    # Keep the full 2K metrics and router evidence, but gate its first 128-token
    # prefix with the shared relaxed profile so measured long-context numerical
    # instability is not mistaken for a cross-framework correctness regression.
    tokenizer_name: zai-org/GLM-4.7-Flash
    hf_device_map_auto: true
    cross_framework_gate_sequence_length: 128
    capture_router_diagnostics: true
    parity_tolerance_profile_overrides:
      source_load: relaxed
      hf_reload: relaxed
    dataset.limit_dataset_samples: 500
    validation_dataset.limit_dataset_samples: 500
  perf_testing:
    schedule: nightly
  nproc_per_node: 4
