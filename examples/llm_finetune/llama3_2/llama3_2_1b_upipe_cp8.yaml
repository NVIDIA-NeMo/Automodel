# Untied Ulysses ("UPipe") context parallelism at cp_size=8.
#
# Run with:
#   automodel examples/llm_finetune/llama3_2/llama3_2_1b_upipe_cp8.yaml --nproc-per-node 8
#
# UPipe fuses the QKV projection, RoPE and attention into a single op that runs
# in n_heads/cp_size sequential stages, so only cp_size query heads are
# projected at a time. Peak QKV activation memory therefore drops by roughly
# n_heads/cp_size (8x here) relative to standard Ulysses, which is what makes
# very long sequences fit.
#
# Requirements it enforces at startup, and why:
#   * cp_size must divide num_key_value_heads (8 for Llama-3.2-1B), so each rank
#     owns whole KV heads. cp_size therefore tops out at 8 for this model.
#   * rope_fusion: false and rope: torch -- UPipe applies RoPE in its own kernel.
#   * tp_size: 1 -- the fused op reads q/k/v_proj.weight directly, which under
#     tensor parallelism is a sharded DTensor it cannot consume.
#   * No PEFT, no packed (THD) sequences, no KV cache; right padding only.
#   * flash-attn must be installed.
#
# At cp_size 1 UPipe lies dormant and the ordinary SDPA path runs, so this
# config degrades gracefully on a single GPU.

recipe: TrainFinetuneRecipeForNextTokenPrediction

step_scheduler:
  global_batch_size: 8
  local_batch_size: 1
  max_steps: 20
  ckpt_every_steps: 100
  val_every_steps: 20

dist_env:
  backend: nccl
  timeout_minutes: 20

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 1111
  ranked: true

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: meta-llama/Llama-3.2-1B
  torch_dtype: bf16
  attn_implementation: sdpa  # used only at cp_size 1, where UPipe is dormant
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: upipe
    linear: torch
    rms_norm: torch_fp32
    rope: torch
    rope_fusion: false
    compile_attn: false

checkpoint:
  enabled: false
  checkpoint_dir: checkpoints/
  model_save_format: safetensors
  save_consolidated: false

distributed:
  strategy: fsdp2
  tp_size: 1
  cp_size: 8
  pp_size: 1
  ep_size: 1
  sequence_parallel: false
  # UPipe runs collectives inside its forward, so recompute doubles all-to-all
  # traffic. Correct either way, but off by default here.
  activation_checkpointing: false

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy

dataset:
  _target_: nemo_automodel.components.datasets.llm.squad.make_squad_dataset
  dataset_name: rajpurkar/squad
  split: train
  # A uniform, CP-divisible length, right-padded. Raise it to exercise the
  # memory win UPipe exists for; 2048 just keeps the example quick.
  seq_length: 2048
  padding: max_length
  truncation: true

# UPipe cannot read the document boundaries packing relies on.
packed_sequence:
  packed_sequence_size: 0

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn:
    _target_: nemo_automodel.components.datasets.utils.default_collater
  shuffle: true

validation_dataset:
  _target_: nemo_automodel.components.datasets.llm.squad.make_squad_dataset
  dataset_name: rajpurkar/squad
  split: validation
  seq_length: 2048
  padding: max_length
  truncation: true
  limit_dataset_samples: 64

validation_dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn:
    _target_: nemo_automodel.components.datasets.utils.default_collater

optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-5
  betas: [0.9, 0.999]
  eps: 1.0e-8
  weight_decay: 0.0

ci:
  recipe_owner: rghadia
  time: "00:20:00"
  nodes: 1
  nproc_per_node: 8
