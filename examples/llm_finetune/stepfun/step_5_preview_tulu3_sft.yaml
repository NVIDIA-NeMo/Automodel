# Full-parameter SFT of the Step 5 Preview language backbone on Tulu3.
# 16 H100 nodes x 8 GPUs: PP4 x DP32, with EP32 inside each pipeline stage.
# NEAT packs samples (truncated at 4,096 tokens) into 8,192-token rows.
# 352 routed experts per MoE layer give eleven local experts per rank.
# Runtime tuning is migrated from
# examples/llm_benchmark/step/step_5_preview_full92_mock_h100.yaml.
#
# To run this recipe:
#   automodel examples/llm_finetune/stepfun/step_5_preview_tulu3_sft.yaml --nproc-per-node 8

recipe: TrainFinetuneRecipeForNextTokenPrediction
seed: 42

step_scheduler:
  global_batch_size: 768  #PR4637: 44
  local_batch_size: 24  #PR4637: 1
  ckpt_every_steps: 1000
  val_every_steps: 1000
  max_steps: 100
  gc_every_steps: 5

dist_env:
  backend: nccl
  timeout_minutes: 20

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: stepfun-ai/Step-5-Preview-BF16
  torch_dtype: bfloat16
  backend:
    _target_: nemo_automodel.components.models.step5.configuration.Step5BackendConfig  #PR4637: nemo_automodel.components.models.common.BackendConfig
    attn: fa4
    benchmark_static_routing: false
    compile_norm: true
    compile_router_weight: true
    csa_forward_full_blocks: true
    dispatcher: hybridep
    dispatcher_hybridep_compact_routing: false
    dispatcher_hybridep_permute_fusion: false
    enable_fsdp_optimizations: true
    enable_hf_state_dict_adapter: true
    experts: torch_mm
    fake_balanced_gate: false
    fake_gate_noise: 0.0
    gate_precision: float32
    linear: te
    rms_norm: torch_fp32
    swa_varlen: true
    csa_backward_full_blocks: true
checkpoint:
  enabled: false
  checkpoint_dir: checkpoints/step_5_preview_tulu3_sft

distributed:
  activation_checkpointing: true
  cp_size: 1
  defer_fsdp_grad_sync: false
  dp_size: 32
  enable_fsdp2_prefetch: false
  ep_size: 32  #PR4637: 44
  moe:
    ignore_router_for_ac: true
    mp_policy:
      _target_: torch.distributed.fsdp.MixedPrecisionPolicy
      cast_forward_inputs: false
      output_dtype:
      param_dtype: bfloat16
      reduce_dtype: float32
    reshard_after_forward: true
    wrap_outer_model: true
  pipeline:
    pp_microbatch_size: 1
    pp_schedule: 1f1b
    pp_seq_len: 8192
    scale_grads_in_schedule: false
  pp_size: 4  #PR4637: 1
  reshard_after_forward: true
  sequence_parallel: false
  strategy: fsdp2
  tp_size: 1
loss_fn:
  _target_: nemo_automodel.components.loss.linear_ce.FusedLinearCrossEntropy

dataset:
  _target_: nemo_automodel.components.datasets.llm.chat_dataset.ChatDataset
  path_or_dataset_id: allenai/tulu-3-sft-mixture
  split: train
  shuffle_seed: 42
  seq_length: 4096
  truncation: true
  padding: false
  tokenizer:
    _target_: transformers.AutoTokenizer.from_pretrained
    pretrained_model_name_or_path: stepfun-ai/Step-5-Preview-BF16

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.neat_packed_collater  #PR4637: {_target_: nemo_automodel.components.datasets.utils.default_collater, pad_seq_len_divisible: 4096}
  shuffle: false
  drop_last: true
  num_workers: 2

optimizer:
  _target_: transformer_engine.pytorch.optimizers.FusedAdam
  betas: [0.9, 0.95]
  eps: 1.0e-8
  lr: 1.0e-5
  weight_decay: 0.1
  master_weights: true
  store_param_remainders: true
  exp_avg_dtype: torch.bfloat16
  exp_avg_sq_dtype: torch.bfloat16

# wandb:
#   project: <your_wandb_project>
#   entity: <your_wandb_entity>
#   name: <your_wandb_exp_name>
#   dir: <your_wandb_save_dir>

packed_sequence:
  packed_sequence_size: 8192
  packing_strategy: neat
ci:
  nemo_ci_schedule: release
  recipe_owner: HuiyingLi
  nodes: 16  #PR4637: 11
  cluster_tag: h100  #PR4637: gb200
  time: "01:00:00"
  perf_testing:
    fake_balanced_gate: true
    schedule: weekly
