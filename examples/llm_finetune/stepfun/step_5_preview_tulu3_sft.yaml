# Full-parameter SFT of the Step 5 Preview language backbone on Tulu3.
# 11 GB200 nodes x 4 GPUs: EP44 / DP44, one 4,096-token sequence per GPU.
# 352 routed experts per MoE layer give eight local experts per rank.
#
# To run this recipe:
#   automodel examples/llm_finetune/stepfun/step_5_preview_tulu3_sft.yaml --nproc-per-node 4

recipe: TrainFinetuneRecipeForNextTokenPrediction
seed: 42

step_scheduler:
  global_batch_size: 44
  local_batch_size: 1
  ckpt_every_steps: 1000
  val_every_steps: 1000
  max_steps: 100

dist_env:
  backend: nccl
  timeout_minutes: 20

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: stepfun-ai/Step-5-Preview-BF16
  torch_dtype: bfloat16
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: fa4
    linear: te
    rms_norm: torch_fp32
    experts: torch_mm
    dispatcher: hybridep
    compile_router_weight: true
    gate_precision: float32
    enable_hf_state_dict_adapter: true
    enable_fsdp_optimizations: true

checkpoint:
  enabled: false
  checkpoint_dir: checkpoints/step_5_preview_tulu3_sft

distributed:
  strategy: fsdp2
  tp_size: 1
  cp_size: 1
  pp_size: 1
  ep_size: 44
  sequence_parallel: false
  activation_checkpointing: true
  reshard_after_forward: true
  defer_fsdp_grad_sync: false
  moe:
    wrap_outer_model: true
    reshard_after_forward: true
    ignore_router_for_ac: true
    mp_policy:
      _target_: torch.distributed.fsdp.MixedPrecisionPolicy
      param_dtype: bfloat16
      reduce_dtype: float32
      output_dtype: null
      cast_forward_inputs: false

loss_fn:
  _target_: nemo_automodel.components.loss.linear_ce.FusedLinearCrossEntropy

dataset:
  _target_: nemo_automodel.components.datasets.llm.chat_dataset.ChatDataset
  path_or_dataset_id: allenai/tulu-3-sft-mixture
  split: train
  shuffle_seed: 42
  seq_length: 4096
  truncation: true
  padding: false
  tokenizer:
    _target_: transformers.AutoTokenizer.from_pretrained
    pretrained_model_name_or_path: stepfun-ai/Step-5-Preview-BF16

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn:
    _target_: nemo_automodel.components.datasets.utils.default_collater
    pad_seq_len_divisible: 4096
  shuffle: false
  drop_last: true
  num_workers: 2

optimizer:
  _target_: transformer_engine.pytorch.optimizers.FusedAdam
  betas: [0.9, 0.95]
  eps: 1.0e-8
  lr: 1.0e-5
  weight_decay: 0.1
  master_weights: true
  store_param_remainders: true
  exp_avg_dtype: torch.bfloat16
  exp_avg_sq_dtype: torch.bfloat16

# wandb:
#   project: <your_wandb_project>
#   entity: <your_wandb_entity>
#   name: <your_wandb_exp_name>
#   dir: <your_wandb_save_dir>

ci:
  recipe_owner: HuiyingLi
  nodes: 11
  cluster_tag: gb200
  time: "01:00:00"
  # Synthetic performance settings migrated from examples/llm_benchmark/step/step_5_preview_full92_mock_h100.yaml.
  # Reset changed components before setting leaves; "none" is the CLI null token.
  perf_testing:
    schedule: weekly
    time: 00:40:00
    config_overrides:
      recipe: BenchmarkingRecipeForNextTokenPrediction
      step_scheduler: none
      step_scheduler.ckpt_every_steps: 1000
      step_scheduler.gc_every_steps: 5
      step_scheduler.global_batch_size: 768
      step_scheduler.local_batch_size: 24
      step_scheduler.log_remote_every_steps: 1
      step_scheduler.max_steps: 17
      step_scheduler.num_epochs: 1
      step_scheduler.save_checkpoint_every_epoch: false
      step_scheduler.val_every_steps: 1000
      model: none
      model._target_: nemo_automodel.NeMoAutoModelForCausalLM.from_config
      model.backend._target_: nemo_automodel.components.models.step5.configuration.Step5BackendConfig
      model.backend.attn: fa4
      model.backend.benchmark_static_routing: true
      model.backend.compile_norm: true
      model.backend.compile_router_weight: true
      model.backend.csa_forward_full_blocks: true
      model.backend.dispatcher: hybridep
      model.backend.dispatcher_hybridep_compact_routing: false
      model.backend.dispatcher_hybridep_permute_fusion: false
      model.backend.enable_fsdp_optimizations: true
      model.backend.enable_hf_state_dict_adapter: true
      model.backend.experts: torch_mm
      model.backend.fake_balanced_gate: true
      model.backend.fake_gate_noise: 0.0
      model.backend.gate_precision: float32
      model.backend.linear: te
      model.backend.rms_norm: torch_fp32
      model.backend.swa_varlen: true
      model.backend.csa_backward_full_blocks: true
      model.config._target_: nemo_automodel.components.models.step5.configuration.Step5Config.from_pretrained
      model.config.pretrained_model_name_or_path: stepfun-ai/Step-5-Preview-BF16
      model.config.num_nextn_predict_layers: 0
      model.torch_dtype: bfloat16
      checkpoint: none
      checkpoint.checkpoint_dir: outputs/step5-full92-mock-h100/checkpoints
      checkpoint.enabled: false
      distributed: none
      distributed.activation_checkpointing: true
      distributed.cp_size: 1
      distributed.defer_fsdp_grad_sync: false
      distributed.dp_size: 32
      distributed.enable_fsdp2_prefetch: false
      distributed.ep_size: 32
      distributed.moe.ignore_router_for_ac: true
      distributed.moe.mp_policy._target_: torch.distributed.fsdp.MixedPrecisionPolicy
      distributed.moe.mp_policy.cast_forward_inputs: false
      distributed.moe.mp_policy.output_dtype: none
      distributed.moe.mp_policy.param_dtype: bfloat16
      distributed.moe.mp_policy.reduce_dtype: float32
      distributed.moe.reshard_after_forward: true
      distributed.moe.wrap_outer_model: true
      distributed.pipeline.pp_microbatch_size: 1
      distributed.pipeline.pp_schedule: 1f1b
      distributed.pipeline.pp_seq_len: 8192
      distributed.pipeline.scale_grads_in_schedule: false
      distributed.pp_size: 4
      distributed.reshard_after_forward: true
      distributed.sequence_parallel: false
      distributed.strategy: fsdp2
      distributed.tp_size: 1
      dataset: none
      dataset._target_: nemo_automodel.components.datasets.llm.mock_iterable_dataset.MockIterableDataset
      dataset.batch_size: 24
      dataset.exclude_token_ids: '[1]'
      dataset.num_samples: 100000
      dataset.seq_len: 8192
      dataset.tokenizer._target_: transformers.PreTrainedTokenizerFast.from_pretrained
      dataset.tokenizer.pretrained_model_name_or_path: stepfun-ai/Step-5-Preview-BF16
      dataset.vocab_size: 128896
      dataloader: none
      dataloader._target_: torch.utils.data.DataLoader
      dataloader.batch_size: none
      dataloader.num_workers: 0
      benchmark: none
      benchmark.flops_scope: model
      benchmark.json_output_path: outputs/step5-full92-mock-h100/benchmark.json
      benchmark.nsys_end: -1
      benchmark.nsys_ranks: '[]'
      benchmark.nsys_start: -1
      benchmark.peak_tflops: 989
      benchmark.warmup_steps: 7
      clip_grad_norm: none
      clip_grad_norm.max_norm: 1.0
      lr_scheduler: none
      lr_scheduler.lr_decay_style: constant
      rng: none
      rng._target_: nemo_automodel.components.training.rng.StatefulRNG
      rng.ranked: true
      rng.seed: 42
      wandb: none
      wandb.enable: false
      ci.nodes: 16
      ci.cluster_tag: h100
