# LoRA fine-tuning example; validate training and memory on your hardware.
# Run from the repository root:
#   uv run automodel examples/llm_finetune/deepseek_ai/deepseek_llm_7b_chat_squad_peft.yaml --nproc-per-node 8
# Checkpoint configuration inspected at Hugging Face revision: afbda8b347ec881666061fa67447046fc5164ec8

recipe: TrainFinetuneRecipeForNextTokenPrediction
step_scheduler:
  global_batch_size: 8
  local_batch_size: 1
  max_steps: 100
  val_every_steps: 50
  ckpt_every_steps: 50
dist_env:
  backend: nccl
  timeout_minutes: 30
rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 42
  ranked: true
model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: deepseek-ai/deepseek-llm-7b-chat
  dtype: bfloat16
  trust_remote_code: false
peft:
  _target_: nemo_automodel.components._peft.lora.PeftConfig
  exclude_modules:
  - "*router*"
  - "*.gate"
  - '*lm_head*'
  - '*embed_out*'
  dim: 8
  alpha: 32
  use_triton: false
distributed:
  strategy: fsdp2
  dp_size: none
  tp_size: 1
  cp_size: 1
  sequence_parallel: false
  activation_checkpointing: true
loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy
dataset:
  _target_: nemo_automodel.components.datasets.llm.squad.make_squad_dataset
  dataset_name: rajpurkar/squad
  split: train
  limit_dataset_samples: 1024
  seq_length: 512
  truncation: true
dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn:
    _target_: nemo_automodel.components.datasets.utils.default_collater
  shuffle: true
validation_dataset:
  _target_: nemo_automodel.components.datasets.llm.squad.make_squad_dataset
  dataset_name: rajpurkar/squad
  split: validation
  limit_dataset_samples: 64
  seq_length: 512
  truncation: true
validation_dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn:
    _target_: nemo_automodel.components.datasets.utils.default_collater
optimizer:
  _target_: torch.optim.AdamW
  lr: 0.0001
  betas:
  - 0.9
  - 0.999
  eps: 1.0e-08
  weight_decay: 0.01
checkpoint:
  enabled: true
  checkpoint_dir: checkpoints/deepseek_llm_7b_chat
  model_save_format: safetensors
  save_consolidated: false

ci:
  recipe_owner: akoumpa
  time: "00:20:00"
  nodes: 1
