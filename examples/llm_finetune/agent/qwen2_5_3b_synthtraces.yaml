# Multi-turn coding-agent SFT on the OpenAI-format Pi traces in
# https://huggingface.co/datasets/julien-c/synthtraces.
#
# To run this recipe:
#   automodel examples/llm_finetune/agent/qwen2_5_3b_synthtraces.yaml --nproc-per-node 8

recipe: TrainFinetuneRecipeForNextTokenPrediction

ci:
  recipe_owner: khazic
  nodes: 1
  time: "01:00:00"

step_scheduler:
  global_batch_size: 32
  local_batch_size: 1
  ckpt_every_steps: 500
  val_every_steps: 500
  max_steps: 2000

dist_env:
  backend: nccl
  timeout_minutes: 10

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 1111
  ranked: true

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: Qwen/Qwen2.5-3B
  attn_implementation: sdpa
  output_hidden_states: true

compile:
  enabled: false
  mode: "default"
  fullgraph: false
  dynamic: true
  backend: null

clip_grad_norm:
  max_norm: 1.0

distributed:
  strategy: fsdp2
  dp_size: none
  cp_size: 1
  sequence_parallel: false

loss_fn:
  _target_: nemo_automodel.components.loss.linear_ce.FusedLinearCrossEntropy

dataset:
  _target_: nemo_automodel.components.datasets.llm.agent_chat.make_agent_chat_dataset
  dataset_name: julien-c/synthtraces
  # Raw files are Pi event streams. Hugging Face publishes parsed session rows
  # in this generated revision.
  revision: refs/convert/parquet
  filter_no_assistant: true
  filter_overlong: true
  trim_incomplete_last_turn: true
  split: train[64:]
  chat_template: examples/llm_finetune/agent/qwen2_5_synthtraces_chat_template.jinja
  seq_length: 8192
  truncation: true
  truncate_history: true
  tokenizer:
    pretrained_model_name_or_path: Qwen/Qwen2.5-3B
    truncation_side: left

packed_sequence:
  packed_sequence_size: 0

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.default_collater
  shuffle: true

validation_dataset:
  _target_: nemo_automodel.components.datasets.llm.agent_chat.make_agent_chat_dataset
  dataset_name: julien-c/synthtraces
  revision: refs/convert/parquet
  filter_no_assistant: true
  filter_overlong: true
  trim_incomplete_last_turn: true
  split: train[:64]
  chat_template: examples/llm_finetune/agent/qwen2_5_synthtraces_chat_template.jinja
  seq_length: 8192
  truncation: true
  truncate_history: true
  tokenizer:
    pretrained_model_name_or_path: Qwen/Qwen2.5-3B
    truncation_side: left

validation_dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.default_collater

optimizer:
  _target_: torch.optim.AdamW
  betas: [0.9, 0.95]
  eps: 1.0e-8
  lr: 1.0e-5
  weight_decay: 0.01

lr_scheduler:
  lr_decay_style: cosine
  min_lr: 1.0e-6

nvtx: false
