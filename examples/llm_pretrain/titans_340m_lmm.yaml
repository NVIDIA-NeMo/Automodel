# Titans 340M/360M-class memory-only LMM: 15B FineWeb-Edu tokens.
# The proceedings appendix says 24 blocks, but that produces 507,620,608
# parameters in this implementation. Sixteen blocks produce 360,303,104,
# matching the paper's Figure 7 "360M" label; see titans_reproduction.md.
recipe: TrainFinetuneRecipeForNextTokenPrediction
seed: 1111

step_scheduler:
  global_batch_size: 128
  local_batch_size: 1
  ckpt_every_steps: 250
  val_every_steps: 250
  log_remote_every_steps: 10
  num_epochs: 1
  max_steps: 28610

dist_env:
  backend: nccl
  timeout_minutes: 60

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 1111
  ranked: true

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_config
  config:
    _target_: nemo_automodel.components.models.titans.config.TitansConfig
    architectures: [TitansForCausalLM]
    vocab_size: 32000
    hidden_size: 1024
    num_hidden_layers: 16
    num_attention_heads: 16
    head_dim: 64
    intermediate_size: 4096
    hidden_act: silu
    max_position_embeddings: 4096
    rms_norm_eps: 1.0e-6
    momentum: true
    forget: true
    mem_depth: 2
    memory_expansion_factor: 4
    memory_residual_norm: true
    qkv_conv_kernel_size: 4
    chunk_size: 16
    deep_memory_backend: titans_pytorch
    memory_batch_size: 4224
    num_persistent_memory_tokens: 128
    tie_word_embeddings: false
    initializer_range: 0.02
    torch_dtype: float32
    pad_token_id: 0
    bos_token_id: 1
    eos_token_id: 2

dataset:
  _target_: nemo_automodel.components.datasets.llm.nanogpt_dataset.NanogptDataset
  file_pattern: "${TITANS_DATA_ROOT}/train/fineweb_edu_*.bin"
  seq_len: 4096
  shuffle_files: true
  align_to_bos: true
  bos_token: 1

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  shuffle: false
  collate_fn: nemo_automodel.components.datasets.utils.default_collater

validation_dataset:
  _target_: nemo_automodel.components.datasets.llm.nanogpt_dataset.NanogptDataset
  file_pattern: "${TITANS_DATA_ROOT}/validation/fineweb_edu_*.bin"
  seq_len: 4096
  shuffle_files: false
  align_to_bos: false
  bos_token: 1
  repeat: false

validation_dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  shuffle: false
  collate_fn: nemo_automodel.components.datasets.utils.default_collater

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy

optimizer:
  _target_: torch.optim.AdamW
  lr: 1.5e-3
  betas: [0.9, 0.95]
  weight_decay: 0.1

lr_scheduler:
  lr_decay_style: cosine
  lr_warmup_steps: 286
  min_lr: 0.0

distributed:
  strategy: fsdp2
  dp_size: none
  tp_size: 1
  cp_size: 1
  pp_size: 1
  activation_checkpointing: true

checkpoint:
  enabled: true
  checkpoint_dir: "${TITANS_CHECKPOINT_ROOT}"
  model_save_format: safetensors
  save_consolidated: false
  is_async: true
