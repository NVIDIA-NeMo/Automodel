# Real-text pretraining counterpart of examples/llm_benchmark/kimi/kimi_k3_gb200_2k.yaml
# Fixed-length causal chunks; runtime tuning is canonical. GPU validation is pending.

recipe: TrainFinetuneRecipeForNextTokenPrediction
step_scheduler:
  global_batch_size: 4096
  local_batch_size: 128
  ckpt_every_steps: 1000
  val_every_steps: null
  max_steps: 1000
  num_epochs: null
  gc_every_steps: 10
dist_env:
  backend: nccl
  timeout_minutes: 120
rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 1234
  ranked: true
model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_config
  config:
    _target_: nemo_automodel.components.models.kimi_k3.config.KimiK3TextConfig
    architectures:
    - KimiK3ForCausalLM
    dtype: bfloat16
    kda_conv_backend: cuda
    kda_chunk_impl: fused
    situ_backend: triton_fast_math
    attn_res_triton: true
  torch_dtype: bfloat16
  trust_remote_code: false
  kda_mode: chunk
  use_liger_kernel: false
  use_sdpa_patching: false
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: te
    linear: torch
    rms_norm: torch_fp32
    experts: torch_mm
    dispatcher: hybridep
    dispatcher_num_sms: 32
    rope_fusion: false
    fake_balanced_gate: false
    fake_gate_noise: 0.0
    compile_situ: true
    compile_norm: true
    compile_router_weight: true
    benchmark_static_routing: false
    enable_hf_state_dict_adapter: true
    enable_fsdp_optimizations: true
checkpoint:
  enabled: false
distributed:
  strategy: fsdp2
  tp_size: 1
  cp_size: 1
  pp_size: 8
  ep_size: 32
  sequence_parallel: false
  activation_checkpointing: true
  enable_fsdp2_prefetch: true
  pipeline:
    pp_schedule: 1f1b
    pp_microbatch_size: 4
    scale_grads_in_schedule: false
    patch_inner_model: false
    patch_causal_lm_model: false
    pp_recv_buffer_pool: true
  moe:
    reshard_after_forward: false
    wrap_outer_model: false
loss_fn:
  _target_: nemo_automodel.components.loss.linear_ce.FusedLinearCrossEntropy
  impl: torch_compile
dataset:
  _target_: nemo_automodel.components.datasets.llm.streaming_text.StreamingTextConfig
  path: HuggingFaceFW/fineweb-edu
  name: sample-10BT
  revision: 87f09149ef4734204d70ed1d046ddc9ca3f2b8f9  # pragma: allowlist secret -- Public FineWeb-Edu dataset revision.
  seq_length: 2048
  tokenizer:
    _target_: nemo_automodel.NeMoAutoTokenizer.from_pretrained
    pretrained_model_name_or_path: moonshotai/Kimi-K3
    trust_remote_code: false
dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: torch.utils.data.default_collate
  num_workers: 4
  pin_memory: true
optimizer:
  _target_: torch.optim.AdamW
  fused: true
  lr: 1.0e-05
  weight_decay: 0.0
  betas:
  - 0.9
  - 0.95
  eps: 1.0e-08
prewarm:
  pipeline_stage_compile: true
  comm_groups: true
  fla_gdn_autotune: true
  cublas_backward: true
wandb:
  enable: false
clip_grad_norm:
  max_norm: 1.0
ci:
  recipe_owner: huiyingl
  nodes: 64
  cluster_tag: gb200
  time: 01:00:00
  env_vars:
    SBATCH_SEGMENT_SIZE: '8'
  nproc_per_node: 4
  perf_testing:
    schedule: weekly
    fake_balanced_gate: true
