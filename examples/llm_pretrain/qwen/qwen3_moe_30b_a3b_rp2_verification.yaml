# Qwen3-30B-A3B functional pretrain/resume verification. The convergence
# contract matches the Megatron Bridge qwen3_30b_a3b_convergence_v2 cohort.
# Mount the RP2 head_01 index, tokenizer, cache, and output directories at the
# portable /work paths below before launching this two-node, 16-GPU recipe.

recipe: TrainFinetuneRecipeForNextTokenPrediction

seed: 1234

step_scheduler:
  global_batch_size: 1024
  local_batch_size: 1
  ckpt_every_steps: 50
  save_checkpoint_every_epoch: false
  val_every_steps: null
  log_remote_every_steps: 1
  loss_average_window_steps: 10
  gc_every_steps: 100
  num_epochs: 1
  max_steps: 100

dist_env:
  backend: nccl
  timeout_minutes: 30

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_config
  torch_dtype: bfloat16
  output_hidden_states: true
  config:
    _target_: transformers.AutoConfig.from_pretrained
    pretrained_model_name_or_path: Qwen/Qwen3-30B-A3B
    revision: ad44e777bcd18fa416d9da3bd8f70d33ebb85d39
  trust_remote_code: true
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: te
    linear: te
    rms_norm: te
    rope_fusion: true
    experts: te
    dispatcher: hybridep
    fake_balanced_gate: false
    enable_hf_state_dict_adapter: true
    enable_fsdp_optimizations: true

checkpoint:
  enabled: true
  checkpoint_dir: /work/output/checkpoints
  model_save_format: torch_save
  save_consolidated: false
  is_async: false

distributed:
  strategy: fsdp2
  tp_size: 1
  cp_size: 1
  pp_size: 1
  ep_size: 16
  sequence_parallel: false
  activation_checkpointing: false
  moe:
    reshard_after_forward: false

loss_fn:
  _target_: nemo_automodel.components.loss.linear_ce.FusedLinearCrossEntropy

dataset:
  _target_: nemo_automodel.components.datasets.llm.megatron_dataset.MegatronPretraining
  paths: /work/data/rp2/index/head_01_text_document
  index_mapping_dir: /work/cache/qwen3-30b-a3b/rp2
  # RP2 is already tokenized. Only these native SentencePiece metadata fields
  # are consumed by the Megatron GPT dataset builder.
  tokenizer:
    _target_: types.SimpleNamespace
    name_or_path: /work/data/rp2/tokenizer/tokenizer.model
    vocab_size: 32000
    pad_token_id: 0
    unk_token_id: 1
    bos_token_id: 2
    eos_token_id: 3
  seq_length: 4096
  create_attention_mask: false
  seed: 1234
  split: "9999:8:2"
  num_dataset_builder_threads: 1
  num_train_samples: 102400
  splits_to_build: train

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: torch.utils.data.default_collate
  dataloader_type: single
  num_workers: 8
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2

optimizer:
  _target_: nemo_automodel.components.optim.optimizer.FusedAdamConfig
  lr: 0.0003
  weight_decay: 0.1
  betas: [0.9, 0.95]
  eps: 1.0e-8
  adam_w_mode: true
  bias_correction: true
  master_weights: true
  master_weight_dtype: float32

lr_scheduler:
  lr_warmup_steps: 40
  lr_decay_steps: 100
  lr_decay_style: cosine
  init_lr: 0.0
  max_lr: 0.0003
  min_lr: 0.00003
  start_wd: 0.033
  end_wd: 0.033
  wd_incr_steps: 100
  wd_incr_style: constant
  use_checkpoint_opt_param_scheduler: false
  override_opt_param_scheduler: true

clip_grad_norm:
  max_norm: 1.0
