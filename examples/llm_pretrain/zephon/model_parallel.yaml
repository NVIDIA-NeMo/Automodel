# Run from the repository root after prepare_tiny.py. Requires four CUDA GPUs (TP2 × PP2).
recipe: TrainFinetuneRecipeForNextTokenPrediction
seed: 42
step_scheduler:
  global_batch_size: 4
  local_batch_size: 2
  max_steps: 1000
  ckpt_every_steps: 20
  preemption_signal: null
model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_config
  config:
    _target_: transformers.LlamaConfig
    vocab_size: 64
    hidden_size: 64
    intermediate_size: 128
    num_hidden_layers: 2
    num_attention_heads: 4
    num_key_value_heads: 2
    max_position_embeddings: 128
    bos_token_id: null
    eos_token_id: 1
    pad_token_id: 1
  dtype: float32
  attn_implementation: sdpa
  use_liger_kernel: false
dataset:
  _target_: nemo_automodel.components.datasets.zephon.ZephonTextSourceConfig
  tokenize_special_tokens: eos
  tokenizer:
    pretrained_model_name_or_path: work/zephon-tiny/tokenizer
dataloader:
  _target_: nemo_automodel.components.datasets.zephon.ZephonDataloaderConfig
  zephon:
    sources:
    - name: text
      path: work/zephon-tiny/corpus
      fmt: jsonl
    packing:
      seq_len: 63
    source:
      chunk_size: 32
      stop_after_passes: 1
    checkpoint:
      aggregate_store: torch://
      run_id: zephon-model-parallel
distributed:
  strategy: fsdp2
  dp_size: none
  tp_size: 2
  pp_size: 2
  cp_size: 1
  sequence_parallel: false
  pipeline:
    pp_schedule: gpipe
    pp_microbatch_size: 1
    scale_grads_in_schedule: false
loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy
  reduction: sum
optimizer:
  _target_: torch.optim.AdamW
  lr: 0.001
checkpoint:
  enabled: true
  checkpoint_dir: checkpoints/zephon-model-parallel
dist_env:
  backend: nccl

ci:
  cluster_tag: h100
