# Inkling 2 Mini on one GB200 node (4 GPUs, EP4): fixed-length 4096-token pretraining workload with random
# initialization and balanced routing; run with --benchmark. Measured 14,156 tokens/s/GPU, 17.7 % MFU,
# 100 GiB per GPU.
recipe: TrainFinetuneRecipeForNextTokenPrediction
step_scheduler:
  global_batch_size: 32
  local_batch_size: 8
  ckpt_every_steps: 1000
  val_every_steps: null
  gc_every_steps: 10
  max_steps: 1000
  num_epochs: null
dist_env:
  backend: nccl
  timeout_minutes: 60
rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 1234
  ranked: true
model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_config
  config:
    _target_: nemo_automodel.NeMoAutoConfig.from_pretrained
    pretrained_model_name_or_path: thinkingmachines/Inkling-2-Mini
    architectures: [Inkling2ForCausalLM]
    reuse_attention_on_recompute: true
  use_liger_kernel: false
  use_sdpa_patching: false
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: triton
    linear: torch
    rms_norm: torch
    experts: torch_mm
    dispatcher: hybridep
    gate_precision: float32
    fake_balanced_gate: false
    fake_gate_noise: 0.0
    # The dispatcher kernels run alone on the GPU and move one row at a time: they gain from more SMs up
    # to about 64. Permute fusion stays off, because the fused combine gathers the expert rows of a token
    # one by one (1.7 ms a call against 0.9 ms for the separate unpermute and combine kernels).
    dispatcher_num_sms: 64
    enable_hf_state_dict_adapter: true
    enable_fsdp_optimizations: true
    compile_norm: true
    dispatcher_recompute_cache: moe_tail
    dispatcher_equal_token_counts: true
checkpoint:
  enabled: false
distributed:
  strategy: fsdp2
  dp_size: none
  tp_size: 1
  cp_size: 1
  pp_size: 1
  ep_size: 4
  sequence_parallel: false
  activation_checkpointing: true
  reshard_after_forward: false
  defer_fsdp_grad_sync: false
  moe:
    reshard_after_forward: false
    wrap_outer_model: true
    ignore_router_for_ac: true
loss_fn:
  _target_: nemo_automodel.components.models.inkling2.loss.Inkling2ChunkedLinearCrossEntropy
  unpadded_vocab_size: 200058
  reduction: sum
  logit_softcapping: 30.0
dataset:
  _target_: nemo_automodel.components.datasets.llm.mock_iterable_dataset.MockIterableDatasetConfig
  vocab_size: 200058
  seq_len: 4096
  include_position_ids: false
  exclude_token_ids: [0]
dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.default_collater
  num_workers: 4
  pin_memory: true
optimizer:
  _target_: transformer_engine.pytorch.optimizers.FusedAdam
  lr: 1.0e-05
  betas:
  - 0.9
  - 0.95
  eps: 1.0e-08
  weight_decay: 0.1
  adam_w_mode: true
  master_weights: true
  master_weight_dtype: float32
  store_param_remainders: true
  exp_avg_dtype: bfloat16
  exp_avg_sq_dtype: bfloat16
lr_scheduler:
  lr_decay_style: constant
clip_grad_norm:
  max_norm: 1.0
  backend: triton
wandb:
  enable: false
ci:
  nemo_ci_schedule: skipped
  recipe_owner: HuiyingLi
  nodes: 1
  nproc_per_node: 4
  cluster_tag: gb200
  time: 01:00:00
  env_vars:
    PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  perf_testing:
    schedule: weekly
    fake_balanced_gate: true  # random weights route unevenly
