# Inkling 2 Small on 16 GB200 nodes x 4 GPUs (EP64, one NVLink domain): fixed-length 4096-token pretraining
# workload with random initialization and balanced routing; run with --benchmark. Measured 4497 tokens/s/GPU,
# 20.1 % MFU, 138 GiB per GPU (the same configuration spreads by about 3 % across node sets).
recipe: TrainFinetuneRecipeForNextTokenPrediction
step_scheduler:
  global_batch_size: 256
  local_batch_size: 4
  ckpt_every_steps: 1000
  val_every_steps: null
  gc_every_steps: 10
  max_steps: 1000
  num_epochs: null
dist_env:
  backend: nccl
  timeout_minutes: 60
rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 1234
  ranked: true
model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_config
  config:
    _target_: nemo_automodel.NeMoAutoConfig.from_pretrained
    pretrained_model_name_or_path: thinkingmachines/Inkling-2-Small
    architectures:
    - Inkling2ForCausalLM
    reuse_attention_on_recompute: true
  use_liger_kernel: false
  use_sdpa_patching: false
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: triton
    linear: torch
    rms_norm: torch
    experts: torch_mm
    dispatcher: hybridep
    gate_precision: float32
    fake_balanced_gate: true  # benchmark only: random weights route unevenly
    fake_gate_noise: 0.0
    enable_hf_state_dict_adapter: true
    enable_fsdp_optimizations: true
    compile_norm: true
    dispatcher_recompute_cache: moe_tail
    dispatcher_equal_token_counts: true
    # The dispatcher kernels run alone on the GPU and move one row at a time: they gain from more SMs.
    # Permute fusion stays off, because the fused combine gathers the expert rows of a token one by one.
    dispatcher_num_sms: 64
    dispatcher_hybridep_compact_routing: true
checkpoint:
  enabled: false
distributed:
  strategy: fsdp2
  dp_size: none
  tp_size: 1
  cp_size: 1
  pp_size: 1
  ep_size: 64
  sequence_parallel: false
  activation_checkpointing: true
  reshard_after_forward: false
  enable_fsdp2_prefetch: true
  defer_fsdp_grad_sync: false
  moe:
    reshard_after_forward: false
    wrap_outer_model: true
    ignore_router_for_ac: true
loss_fn:
  _target_: nemo_automodel.components.models.inkling2.loss.Inkling2ChunkedLinearCrossEntropy
  unpadded_vocab_size: 200058
  reduction: sum
  logit_softcapping: 30.0
dataset:
  _target_: nemo_automodel.components.datasets.llm.mock_iterable_dataset.MockIterableDatasetConfig
  vocab_size: 200058
  seq_len: 4096
  include_position_ids: false
  exclude_token_ids:
  - 0
dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.default_collater
  num_workers: 4
  pin_memory: true
optimizer:
  _target_: transformer_engine.pytorch.optimizers.FusedAdam
  lr: 1.0e-05
  betas:
  - 0.9
  - 0.95
  eps: 1.0e-08
  weight_decay: 0.1
  adam_w_mode: true
  master_weights: true
  master_weight_dtype: float32
  store_param_remainders: true
  exp_avg_dtype: bfloat16
  exp_avg_sq_dtype: bfloat16
lr_scheduler:
  lr_decay_style: constant
clip_grad_norm:
  max_norm: 1.0
  backend: triton
wandb:
  enable: false
ci:
  nemo_ci_schedule: skipped
  recipe_owner: HuiyingLi
  nodes: 16
  nproc_per_node: 4
  cluster_tag: gb200
  time: 00:40:00
  env_vars:
    PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    SBATCH_SEGMENT_SIZE: '16'
  perf_testing:
    schedule: weekly
