# GB200 DeepSeek V3 pretraining variant. Runtime tuning migrated from
# examples/llm_benchmark/deepseek/deepseek_v3_sdpa_compile_gb200.yaml.
# Set the real FineWeb data and index-mapping paths in both dataset sections.
# Performance scheduling remains disabled until those cluster-specific paths are supplied.
recipe: TrainFinetuneRecipeForNextTokenPrediction
step_scheduler:
  global_batch_size: 128
  local_batch_size: 2
  ckpt_every_steps: 500
  val_every_steps: 100
  num_epochs: 1
  max_steps: 9500
  gc_every_steps: 10
dist_env:
  backend: nccl
  timeout_minutes: 10
rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 1111
  ranked: true
model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_config
  config:
    _target_: nemo_automodel.NeMoAutoConfig.from_pretrained
    pretrained_model_name_or_path: deepseek-ai/DeepSeek-V3
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: sdpa
    linear: torch
    rms_norm: torch
    rope_fusion: false
    compile_attn: true
    experts: te
    dispatcher: hybridep
    fake_balanced_gate: false
    enable_hf_state_dict_adapter: false
    enable_fsdp_optimizations: true
  trust_remote_code: true
checkpoint:
  enabled: true
  checkpoint_dir: checkpoints/
  model_save_format: torch_save
  save_consolidated: false
distributed:
  strategy: fsdp2
  tp_size: 1
  cp_size: 1
  pp_size: 1
  ep_size: 64
  sequence_parallel: false
  activation_checkpointing: true
loss_fn:
  _target_: nemo_automodel.components.loss.linear_ce.FusedLinearCrossEntropy
dataset:
  _target_: nemo_automodel.components.datasets.llm.megatron_dataset.MegatronPretraining
  paths: /path/to/fineweb_edu/processed_data_*_text_document*
  index_mapping_dir: /path/to/fineweb_edu/mapping_dir
  tokenizer:
    _target_: nemo_automodel._transformers.auto_tokenizer.NeMoAutoTokenizer.from_pretrained
    pretrained_model_name_or_path: deepseek-ai/DeepSeek-V3
    trust_remote_code: true
  seq_length: 1024
  split: 0.99, 0.01, 0.00
  splits_to_build: train
dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: torch.utils.data.default_collate
  dataloader_type: single
validation_dataset:
  _target_: nemo_automodel.components.datasets.llm.megatron_dataset.MegatronPretraining
  paths: /path/to/fineweb_edu/processed_data_*_text_document*
  index_mapping_dir: /path/to/fineweb_edu/mapping_dir
  tokenizer:
    _target_: nemo_automodel._transformers.auto_tokenizer.NeMoAutoTokenizer.from_pretrained
    pretrained_model_name_or_path: deepseek-ai/DeepSeek-V3
    trust_remote_code: true
  seq_length: 1024
  split: 0.99, 0.01, 0.00
  splits_to_build: validation
  num_val_samples: 1024
validation_dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: torch.utils.data.default_collate
  dataloader_type: single
optimizer:
  _target_: torch.optim.AdamW
  betas:
  - 0.9
  - 0.95
  eps: 1.0e-05
  lr: 0.00042
  weight_decay: 0.1
  foreach: false
lr_scheduler:
  lr_decay_style: cosine
  lr_warmup_steps: 500
  min_lr: 0.0
ci:
  cluster_tag: gb200
  nodes: 16
  nproc_per_node: 4
  recipe_owner: hemildesai
  time: 04:00:00
  perf_testing:
    schedule: disabled
  env_vars:
    RDZV_TIMEOUT: '900'
