# Synthetic pretraining counterpart of examples/llm_benchmark/deepseek/deepseek_v4_flash_mok_32gpu.yaml
# Fixed-length mock tokens; runtime tuning is canonical. GPU validation is pending.

recipe: TrainFinetuneRecipeForNextTokenPrediction
step_scheduler:
  gc_every_steps: 10
  global_batch_size: 32
  local_batch_size: 1
  ckpt_every_steps: 1000
  val_every_steps: null
  num_epochs: null
  max_steps: 1000
distributed:
  strategy: fsdp2
  tp_size: 1
  cp_size: 1
  pp_size: 1
  ep_size: 32
  sequence_parallel: false
  activation_checkpointing: true
  moe:
    reshard_after_forward: false
    wrap_outer_model: false
dist_env:
  backend: nccl
  timeout_minutes: 30
model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_config
  config:
    _target_: nemo_automodel.components.models.deepseek_v4.config.DeepseekV4Config
    architectures:
    - DeepseekV4ForCausalLM
    num_hidden_layers: 43
    num_nextn_predict_layers: 0
    use_cache: false
    rope_scaling:
      beta_fast: 32
      beta_slow: 1
      factor: 16
      original_max_position_embeddings: 65536
      type: yarn
    compress_ratios:
    - 0
    - 0
    - 4
    - 128
    - 4
    - 128
    - 4
    - 128
    - 4
    - 128
    - 4
    - 128
    - 4
    - 128
    - 4
    - 128
    - 4
    - 128
    - 4
    - 128
    - 4
    - 128
    - 4
    - 128
    - 4
    - 128
    - 4
    - 128
    - 4
    - 128
    - 4
    - 128
    - 4
    - 128
    - 4
    - 128
    - 4
    - 128
    - 4
    - 128
    - 4
    - 128
    - 4
  trust_remote_code: false
  load_base_model: false
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: torch
    linear: torch
    rms_norm: torch_fp32
    rope_fusion: false
    experts: torch_mm
    dispatcher: mok
    gate_precision: float32
    fake_balanced_gate: false
    enable_hf_state_dict_adapter: false
    enable_fsdp_optimizations: true
    mok:
      fwd_num_comm_sms: 40
      bwd_num_comm_sms: 28
      minibatch_size: 4096
      macrobatch_size: 131072
      schedule_capacity_multiplier: 0.5
      all_gather_top_experts_chunk_bytes: 2048
checkpoint:
  enabled: false
loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy
  fp32_upcast: false
dataset:
  _target_: nemo_automodel.components.datasets.llm.mock_iterable_dataset.MockIterableDatasetConfig
  vocab_size: 129280
  seq_len: 1024
  include_position_ids: false
  exclude_token_ids: [0]
dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.default_collater
  num_workers: 4
  pin_memory: true
optimizer:
  _target_: torch.optim.AdamW
  betas:
  - 0.9
  - 0.95
  eps: 1.0e-05
  lr: 0.0001
  weight_decay: 0.1
  foreach: false
lr_scheduler:
  lr_decay_style: constant
  lr_warmup_steps: 0
  min_lr: 0.0
rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 1234
  ranked: true
ci:
  nemo_ci_schedule: skipped
  recipe_owner: HuiyingLi
  time: 00:45:00
  nodes: 8
  nproc_per_node: 4
  cluster_tag: gb200
  perf_testing:
    schedule: nightly
