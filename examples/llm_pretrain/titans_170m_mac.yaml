# Titans Memory-as-Context (MAC), using the public titans-pytorch topology.
#
# Operational choices pinned from the NeurIPS paper and public implementation:
#   - 512 ordinary tokens per local-attention segment
#   - 256 learned long-term-memory tokens appended to every segment
#   - 128 per-layer persistent-memory KV tokens visible to every segment
#   - 16-token neural-memory chunks
#
# The paper does not publish all MAC tensor-flow details. This recipe is an
# implementation-parity run against the public reference and must not be labeled
# an exact paper reproduction until its learning curves are validated.
#
# 128 sequences * 4096 tokens = 524,288 tokens per optimizer step.
# 28,610 steps process 14,999,879,680 ordinary training tokens (~15B).

recipe: TrainFinetuneRecipeForNextTokenPrediction
seed: 1111

step_scheduler:
  global_batch_size: 128
  local_batch_size: 1
  ckpt_every_steps: 250
  val_every_steps: 250
  log_remote_every_steps: 10
  num_epochs: 1
  max_steps: 28610

dist_env:
  backend: nccl
  timeout_minutes: 30

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 1111
  ranked: true

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_config
  config:
    _target_: nemo_automodel.components.models.titans.config.TitansConfig
    architectures: [TitansForCausalLM]
    vocab_size: 32000
    hidden_size: 768
    num_hidden_layers: 12
    num_attention_heads: 16
    head_dim: 48
    intermediate_size: 3072
    hidden_act: silu
    max_position_embeddings: 4096
    rms_norm_eps: 1.0e-6
    architecture_variant: mac
    attention_segment_size: 512
    num_longterm_memory_tokens: 256
    num_persistent_memory_tokens: 128
    momentum: true
    forget: true
    mem_depth: 2
    memory_expansion_factor: 4
    memory_residual_norm: true
    qkv_conv_kernel_size: 4
    chunk_size: 16
    deep_memory_backend: titans_pytorch
    # 4096 ordinary + 8*256 long-term tokens = 6144 augmented tokens.
    memory_batch_size: 6144
    tie_word_embeddings: false
    initializer_range: 0.02
    torch_dtype: float32
    pad_token_id: 0
    bos_token_id: 1
    eos_token_id: 2

dataset:
  _target_: nemo_automodel.components.datasets.llm.nanogpt_dataset.NanogptDataset
  file_pattern: "${TITANS_DATA_ROOT}/train/fineweb_edu_*.bin"
  seq_len: 4096
  shuffle_files: true
  align_to_bos: true
  bos_token: 1

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  shuffle: false
  collate_fn: nemo_automodel.components.datasets.utils.default_collater

validation_dataset:
  _target_: nemo_automodel.components.datasets.llm.nanogpt_dataset.NanogptDataset
  file_pattern: "${TITANS_DATA_ROOT}/validation/fineweb_edu_*.bin"
  seq_len: 4096
  shuffle_files: false
  align_to_bos: false
  bos_token: 1
  repeat: false

validation_dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  shuffle: false
  collate_fn: nemo_automodel.components.datasets.utils.default_collater

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy

optimizer:
  _target_: torch.optim.AdamW
  lr: 3.0e-3
  betas: [0.9, 0.95]
  weight_decay: 0.1

lr_scheduler:
  lr_decay_style: cosine
  lr_warmup_steps: 286
  min_lr: 0.0

distributed:
  strategy: fsdp2
  dp_size: none
  tp_size: 1
  cp_size: 1
  pp_size: 1
  activation_checkpointing: true

checkpoint:
  enabled: true
  checkpoint_dir: "${TITANS_CHECKPOINT_ROOT}"
  model_save_format: safetensors
  save_consolidated: false
  is_async: true

