# Real-text pretraining counterpart of examples/llm_benchmark/llama3_3/custom_llama3_1_70b_pretrain_benchmark_8nodes.yaml
# Fixed-length causal chunks; runtime tuning is canonical. GPU validation is pending.

recipe: TrainFinetuneRecipeForNextTokenPrediction
step_scheduler:
  global_batch_size: 128
  local_batch_size: 1
  ckpt_every_steps: 2000
  num_epochs: null
  max_steps: 1000
  val_every_steps: null
dist_env:
  backend: nccl
  timeout_minutes: 60
model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: meta-llama/Llama-3.1-70B
  torch_dtype: bf16
  trust_remote_code: true
  attn_implementation: sdpa
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    rms_norm: torch_fp32
checkpoint:
  enabled: false
dataset:
  _target_: nemo_automodel.components.datasets.llm.streaming_text.StreamingTextConfig
  path: HuggingFaceFW/fineweb-edu
  name: sample-10BT
  revision: 87f09149ef4734204d70ed1d046ddc9ca3f2b8f9
  seq_length: 8192
  tokenizer:
    _target_: nemo_automodel.NeMoAutoTokenizer.from_pretrained
    pretrained_model_name_or_path: meta-llama/Llama-3.1-70B
    trust_remote_code: true
dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: torch.utils.data.default_collate
  num_workers: 4
  pin_memory: true
loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy
optimizer:
  _target_: transformer_engine.pytorch.optimizers.FusedAdam
  lr: 0.0002
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.1
  adam_w_mode: true
distributed:
  strategy: fsdp2
  dp_size: null
  tp_size: 1
  cp_size: 2
  pp_size: 1
  sequence_parallel: false
  activation_checkpointing: true
  enable_async_tensor_parallel: false
  enable_fsdp2_prefetch: true
  enable_compile: true
  reshard_after_forward: true
  patch_is_packed_sequence: true
  defer_fsdp_grad_sync: false
rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 42
  ranked: true
ci:
  deprecated: true
  cluster_tag: h100
  nodes: 8
  time: 00:30:00
  env_vars:
    PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  recipe_owner: akoumpa
  nproc_per_node: 8
  perf_testing:
    schedule: disabled
