# Synthetic pretraining counterpart of examples/llm_benchmark/step/step_5_preview_full92_mock_h100.yaml
# Fixed-length mock tokens; runtime tuning is canonical. GPU validation is pending.

recipe: TrainFinetuneRecipeForNextTokenPrediction
checkpoint:
  checkpoint_dir: outputs/step5-full92-mock-h100/checkpoints
  enabled: false
clip_grad_norm:
  max_norm: 1.0
dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.default_collater
  num_workers: 4
  pin_memory: true
dataset:
  _target_: nemo_automodel.components.datasets.llm.mock_iterable_dataset.MockIterableDatasetConfig
  vocab_size: 128896
  seq_len: 8192
  include_position_ids: false
  exclude_token_ids: [0]
dist_env:
  backend: nccl
  timeout_minutes: 20
distributed:
  activation_checkpointing: true
  cp_size: 1
  defer_fsdp_grad_sync: false
  dp_size: 32
  enable_fsdp2_prefetch: false
  ep_size: 32
  moe:
    ignore_router_for_ac: true
    mp_policy:
      _target_: torch.distributed.fsdp.MixedPrecisionPolicy
      cast_forward_inputs: false
      output_dtype: null
      param_dtype: bfloat16
      reduce_dtype: float32
    reshard_after_forward: true
    wrap_outer_model: true
  pipeline:
    pp_microbatch_size: 1
    pp_schedule: 1f1b
    pp_seq_len: 8192
    scale_grads_in_schedule: false
  pp_size: 4
  reshard_after_forward: true
  sequence_parallel: false
  strategy: fsdp2
  tp_size: 1
loss_fn:
  _target_: nemo_automodel.components.loss.linear_ce.FusedLinearCrossEntropy
lr_scheduler:
  lr_decay_style: constant
model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_config
  backend:
    _target_: nemo_automodel.components.models.step5.configuration.Step5BackendConfig
    attn: fa4
    benchmark_static_routing: false
    compile_norm: true
    compile_router_weight: true
    csa_forward_full_blocks: true
    dispatcher: hybridep
    dispatcher_hybridep_compact_routing: false
    dispatcher_hybridep_permute_fusion: false
    enable_fsdp_optimizations: true
    enable_hf_state_dict_adapter: true
    experts: torch_mm
    fake_balanced_gate: false
    fake_gate_noise: 0.0
    gate_precision: float32
    linear: te
    rms_norm: torch_fp32
    swa_varlen: true
    csa_backward_full_blocks: true
  config:
    _target_: nemo_automodel.components.models.step5.configuration.Step5Config.from_pretrained
    pretrained_model_name_or_path: stepfun-ai/Step-5-Preview-BF16
    num_nextn_predict_layers: 0
  torch_dtype: bfloat16
optimizer:
  _target_: transformer_engine.pytorch.optimizers.FusedAdam
  betas:
  - 0.9
  - 0.95
  eps: 1.0e-08
  exp_avg_dtype: torch.bfloat16
  exp_avg_sq_dtype: torch.bfloat16
  lr: 1.0e-05
  master_weights: true
  store_param_remainders: true
  weight_decay: 0.1
rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  ranked: true
  seed: 42
step_scheduler:
  ckpt_every_steps: 1000
  gc_every_steps: 5
  global_batch_size: 768
  local_batch_size: 24
  log_remote_every_steps: 1
  max_steps: 1000
  num_epochs: null
  save_checkpoint_every_epoch: false
  val_every_steps: null
wandb:
  enable: false
ci:
  nemo_ci_schedule: skipped
  recipe_owner: HuiyingLi
  nodes: 16
  cluster_tag: h100
  time: 00:40:00
  nproc_per_node: 8
  perf_testing:
    schedule: weekly
    fake_balanced_gate: true
