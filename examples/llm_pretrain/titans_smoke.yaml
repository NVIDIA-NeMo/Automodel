# End-to-end preflight for the Titans reproduction pipeline.
#
# From the repository root:
#   python tools/make_titans_smoke_data.py \
#     --output-dir examples/llm_pretrain/data/titans_smoke
#   automodel examples/llm_pretrain/titans_smoke.yaml \
#     --nproc-per-node 1

recipe: TrainFinetuneRecipeForNextTokenPrediction
seed: 1111

step_scheduler:
  global_batch_size: 1
  local_batch_size: 1
  ckpt_every_steps: 1
  val_every_steps: 1
  log_remote_every_steps: 1
  num_epochs: 1
  max_steps: 2

dist_env:
  backend: nccl
  timeout_minutes: 10

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 1111
  ranked: true

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_config
  config:
    _target_: nemo_automodel.components.models.titans.config.TitansConfig
    architectures: [TitansForCausalLM]
    vocab_size: 512
    hidden_size: 128
    num_hidden_layers: 2
    num_attention_heads: 4
    head_dim: 32
    intermediate_size: 512
    hidden_act: silu
    max_position_embeddings: 128
    rms_norm_eps: 1.0e-6
    momentum: true
    forget: true
    mem_depth: 2
    memory_expansion_factor: 4
    memory_residual_norm: true
    qkv_conv_kernel_size: 4
    chunk_size: 16
    deep_memory_backend: titans_pytorch
    memory_batch_size: 128
    tie_word_embeddings: false
    initializer_range: 0.02
    torch_dtype: bfloat16
    pad_token_id: 0
    bos_token_id: 1
    eos_token_id: 2

dataset:
  _target_: nemo_automodel.components.datasets.llm.nanogpt_dataset.NanogptDataset
  file_pattern: "examples/llm_pretrain/data/titans_smoke/train/*.bin"
  seq_len: 128
  shuffle_files: false
  align_to_bos: true
  bos_token: 1
  repeat: true

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  shuffle: false
  collate_fn: nemo_automodel.components.datasets.utils.default_collater

validation_dataset:
  _target_: nemo_automodel.components.datasets.llm.nanogpt_dataset.NanogptDataset
  file_pattern: "examples/llm_pretrain/data/titans_smoke/validation/*.bin"
  seq_len: 128
  shuffle_files: false
  align_to_bos: true
  bos_token: 1
  repeat: false

validation_dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  shuffle: false
  collate_fn: nemo_automodel.components.datasets.utils.default_collater

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy

optimizer:
  _target_: torch.optim.AdamW
  lr: 3.0e-4
  betas: [0.9, 0.95]
  weight_decay: 0.1

distributed:
  strategy: fsdp2
  dp_size: none
  tp_size: 1
  cp_size: 1
  pp_size: 1
  sequence_parallel: false
  activation_checkpointing: false

checkpoint:
  enabled: true
  checkpoint_dir: "examples/llm_pretrain/outputs/titans_smoke"
  model_save_format: safetensors
  save_consolidated: false
  is_async: false
