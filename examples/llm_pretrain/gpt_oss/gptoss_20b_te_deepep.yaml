# Real-text pretraining counterpart of examples/llm_benchmark/gpt_oss/gptoss_20b_te_deepep.yaml
# Fixed-length causal chunks; runtime tuning is canonical. GPU validation is pending.

recipe: TrainFinetuneRecipeForNextTokenPrediction
step_scheduler:
  gc_every_steps: 10
  global_batch_size: 256
  local_batch_size: 2
  ckpt_every_steps: 1000
  val_every_steps: null
  num_epochs: null
  max_steps: 1000
distributed:
  strategy: fsdp2
  tp_size: 1
  cp_size: 1
  pp_size: 1
  ep_size: 8
  sequence_parallel: false
  pipeline:
    pp_schedule: interleaved1f1b
    pp_microbatch_size: 2
    round_virtual_stages_to_pp_multiple: down
    scale_grads_in_schedule: false
    patch_inner_model: false
    patch_causal_lm_model: false
    layers_per_stage: 2
dist_env:
  backend: nccl
  timeout_minutes: 10
model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_config
  output_hidden_states: true
  config:
    _target_: nemo_automodel.NeMoAutoConfig.from_pretrained
    pretrained_model_name_or_path: openai/gpt-oss-20b
  trust_remote_code: true
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: flex
    linear: te
    rms_norm: te
    rope_fusion: true
    experts: torch_mm
    dispatcher: deepep
    fake_balanced_gate: false
    enable_hf_state_dict_adapter: false
checkpoint:
  enabled: false
loss_fn:
  _target_: nemo_automodel.components.loss.linear_ce.FusedLinearCrossEntropy
  impl: torch_compile
dataset:
  _target_: nemo_automodel.components.datasets.llm.streaming_text.StreamingTextConfig
  path: HuggingFaceFW/fineweb-edu
  name: sample-10BT
  revision: 87f09149ef4734204d70ed1d046ddc9ca3f2b8f9
  seq_length: 4096
  tokenizer:
    _target_: nemo_automodel.NeMoAutoTokenizer.from_pretrained
    pretrained_model_name_or_path: openai/gpt-oss-20b
    trust_remote_code: true
dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: torch.utils.data.default_collate
  num_workers: 4
  pin_memory: true
optimizer:
  _target_: torch.optim.Adam
  betas:
  - 0.9
  - 0.999
  eps: 1e-8
  lr: 0.0001
  weight_decay: 0
rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 1234
  ranked: true
ci:
  cluster_tag: h100
  time: 00:15:00
  nodes: 1
  recipe_owner: akoumpa
  nproc_per_node: 8
  perf_testing:
    schedule: nightly
    fake_balanced_gate: true
