# Full pretrained GLM-5.2 100-step FineWeb run on 16x4 GB200 GPUs.
# Point dataset.file_pattern at NanoGPT-format FineWeb shards before launching.
#
# Per-node command for a 16-node launcher, MoK MXFP8 (default):
#   automodel examples/llm_pretrain/glm/glm_5.2_mok_mxfp8_fineweb_8k.yaml --nproc-per-node 4
#
# Matched HybridEP BF16 baseline:
#   automodel examples/llm_pretrain/glm/glm_5.2_mok_mxfp8_fineweb_8k.yaml --nproc-per-node 4 \
#     --model.backend.dispatcher=hybridep --model.backend.mok.precision=bf16 \
#     --wandb.name=glm-5.2-hep-bf16-fineweb-8k

recipe: TrainFinetuneRecipeForNextTokenPrediction

seed: 1234

step_scheduler:
  gc_every_steps: 10
  global_batch_size: 64
  local_batch_size: 1
  ckpt_every_steps: 1000
  val_every_steps: 1000
  num_epochs: 1
  max_steps: 100

distributed:
  strategy: fsdp2
  tp_size: 1
  cp_size: 1
  pp_size: 1
  ep_size: 64
  sequence_parallel: false
  activation_checkpointing: true
  moe:
    ignore_router_for_ac: true
    reshard_after_forward: true
    wrap_outer_model: false

dist_env:
  backend: nccl
  timeout_minutes: 30

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_config
  config:
    _target_: nemo_automodel.components.models.glm_moe_dsa.config.GlmMoeDsaConfig.from_pretrained
    pretrained_model_name_or_path: zai-org/GLM-5.2
    name_or_path: zai-org/GLM-5.2
    use_cache: false
  trust_remote_code: false
  load_base_model: true
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: cudnn
    linear: torch
    rms_norm: torch_fp32
    rope_fusion: false
    experts: torch_mm
    dispatcher: mok
    dispatcher_num_sms: 20
    gate_precision: float32
    fake_balanced_gate: false
    enable_hf_state_dict_adapter: true
    enable_fsdp_optimizations: true
    mok:
      precision: mxfp8
      fwd_num_comm_sms: 24
      bwd_num_comm_sms: 28
      minibatch_size: 4096
      macrobatch_size: 131072
      schedule_capacity_multiplier: 0.5
      all_gather_top_experts_chunk_bytes: 2048

checkpoint:
  enabled: false
  dequantize_base_checkpoint: true

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy
  fp32_upcast: true

dataset:
  _target_: nemo_automodel.components.datasets.llm.nanogpt_dataset.NanogptDataset
  file_pattern: /path/to/fineweb_train_*.bin  # REPLACE THIS
  seq_len: 8192
  shuffle_files: false
  align_to_bos: false

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  shuffle: false
  collate_fn: nemo_automodel.components.datasets.utils.default_collater
  num_workers: 0

optimizer:
  _target_: torch.optim.AdamW
  betas: [0.9, 0.95]
  eps: 1.0e-8
  lr: 1.0e-5
  weight_decay: 0.1
  foreach: false

lr_scheduler:
  lr_decay_style: constant
  lr_warmup_steps: 0
  min_lr: 0.0

moe_metrics:
  enabled: true
  mode: brief
  top_k_experts: 0

wandb:
  enable: false
  entity: ${oc.env:WANDB_ENTITY,Nemo-automodel}
  project: ${oc.env:WANDB_PROJECT,mok}
  name: glm-5.2-mok-mxfp8-fineweb-8k
  group: mxfp8-core-convergence100-glm52-fineweb-8k
  mode: online
  dir: training_logs/wandb

ci:
  recipe_owner: HuiyingLi
  time: "00:30:00"
  nodes: 1
  cluster_tag: gb200
  env_vars:
    REQUIRE_FINITE_METRICS: "true"
  nightly:
    step_scheduler.global_batch_size: 4
    step_scheduler.local_batch_size: 1
    step_scheduler.max_steps: 4
    model.load_base_model: false
    model.config.num_hidden_layers: 4
    model.backend.enable_hf_state_dict_adapter: false
    distributed.activation_checkpointing: false
    distributed.ep_size: 4
    checkpoint.enabled: false
    dataset:
      _target_: nemo_automodel.components.datasets.llm.mock_iterable_dataset.MockIterableDataset
      vocab_size: 1024
      seq_len: 1024
      num_samples: 16
      batch_size: 1
    dataloader:
      _target_: torch.utils.data.DataLoader
      batch_size: null
      num_workers: 0
