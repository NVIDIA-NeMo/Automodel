# Synthetic pretraining counterpart of examples/llm_benchmark/glm/glm_4.7_flash_mok_4gpu.yaml
# Fixed-length mock tokens; runtime tuning is canonical. GPU validation is pending.

recipe: TrainFinetuneRecipeForNextTokenPrediction
step_scheduler:
  gc_every_steps: 10
  global_batch_size: 4
  local_batch_size: 1
  ckpt_every_steps: 1000
  val_every_steps: null
  num_epochs: null
  max_steps: 1000
distributed:
  strategy: fsdp2
  tp_size: 1
  cp_size: 1
  pp_size: 1
  ep_size: 4
  sequence_parallel: false
  activation_checkpointing: true
  moe:
    reshard_after_forward: false
    wrap_outer_model: false
dist_env:
  backend: nccl
  timeout_minutes: 10
model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_config
  config:
    _target_: transformers.models.glm4_moe_lite.configuration_glm4_moe_lite.Glm4MoeLiteConfig
    architectures:
    - Glm4MoeLiteForCausalLM
    vocab_size: 154880
    hidden_size: 2048
    intermediate_size: 10240
    moe_intermediate_size: 1536
    num_hidden_layers: 47
    num_attention_heads: 20
    num_key_value_heads: 20
    first_k_dense_replace: 1
    n_routed_experts: 64
    n_shared_experts: 1
    num_experts_per_tok: 4
    n_group: 1
    topk_group: 1
    topk_method: noaux_tc
    routed_scaling_factor: 1.8
    norm_topk_prob: true
    q_lora_rank: 768
    kv_lora_rank: 512
    qk_nope_head_dim: 192
    qk_rope_head_dim: 64
    v_head_dim: 256
    max_position_embeddings: 202752
    rope_theta: 1000000
    partial_rotary_factor: 1.0
    rms_norm_eps: 1.0e-05
    attention_bias: false
    attention_dropout: 0.0
    tie_word_embeddings: false
    num_nextn_predict_layers: 1
    dtype: bfloat16
    use_cache: false
  trust_remote_code: false
  torch_dtype: bfloat16
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: te
    linear: te
    rms_norm: te
    rope_fusion: true
    experts: torch_mm
    dispatcher: mok
    gate_precision: float32
    fake_balanced_gate: false
    enable_hf_state_dict_adapter: false
    enable_fsdp_optimizations: true
    mok:
      fwd_num_comm_sms: 40
      bwd_num_comm_sms: 28
      minibatch_size: 4096
      macrobatch_size: 131072
      schedule_capacity_multiplier: 1.5
      all_gather_top_experts_chunk_bytes: 2048
checkpoint:
  enabled: false
loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy
  fp32_upcast: false
dataset:
  _target_: nemo_automodel.components.datasets.llm.mock_iterable_dataset.MockIterableDatasetConfig
  vocab_size: 154880
  seq_len: 4096
  include_position_ids: false
  exclude_token_ids: [0, 154820]
dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.default_collater
  num_workers: 4
  pin_memory: true
optimizer:
  _target_: torch.optim.Adam
  betas:
  - 0.9
  - 0.999
  eps: 1.0e-08
  lr: 0.0001
  weight_decay: 0
  foreach: false
rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 1234
  ranked: true
ci:
  nemo_ci_schedule: skipped
  recipe_owner: HuiyingLi
  time: 00:25:00
  nodes: 1
  nproc_per_node: 4
  cluster_tag: gb200
  perf_testing:
    schedule: nightly
