# Supply unshifted packs made with this model tokenizer; see /datasets/zephon in the docs.
# Run: uv run automodel examples/llm_pretrain/llama3_2/zephon_prepacked.yaml --nproc-per-node 8
# Training reference: examples/llm_finetune/llama3_2/llama3_2_1b_squad.yaml
# Streaming step cap: 1 * ceil(87599 / 64) = 1369.
# This retains the reference update budget, not its epoch boundaries on the different source.
# Packing window: examples/llm_finetune/llama3_2/llama3_2_1b_packed_cp2.yaml; CP and its TE backend are not enabled here.
recipe: TrainFinetuneRecipeForNextTokenPrediction
rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 1111
  ranked: true
step_scheduler:
  global_batch_size: 64
  local_batch_size: 8
  ckpt_every_steps: 1000
  val_every_steps: 10
  num_epochs: 1
  max_steps: 1369  # Adjust for your dataset and training budget.
model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: meta-llama/Llama-3.2-1B
dataset:
  _target_: nemo_automodel.components.datasets.zephon.ZephonPretokenizedTextDatasetConfig
  zephon:
    sources:
    - name: packs
      path: work/zephon-prepacked/llama3_2
    packing:
      seq_len: 1024
      pack_algorithm: null
    checkpoint:
      run_id: zephon-llama3_2-prepacked
distributed:
  strategy: fsdp2
  dp_size: none
  tp_size: 1
  cp_size: 1
loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy
optimizer:
  _target_: torch.optim.Adam
  betas:
  - 0.9
  - 0.999
  eps: 1e-8
  lr: 1.0e-05
  weight_decay: 0
lr_scheduler:
  lr_decay_style: cosine
  min_lr: 1.0e-06
checkpoint:
  checkpoint_dir: checkpoints/zephon-llama3_2-prepacked
dist_env:
  backend: nccl
  timeout_minutes: 1
ci:
  cluster_tag: h100
  recipe_owner: MaxiBoether
  time: 00:30:00
  nodes: 1
  nproc_per_node: 8
