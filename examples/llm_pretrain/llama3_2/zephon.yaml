# Continue pretraining on TinyStories with online tokenization and packing.
# Run: uv run automodel examples/llm_pretrain/llama3_2/zephon.yaml --nproc-per-node 1
recipe: TrainFinetuneRecipeForNextTokenPrediction
seed: 42
step_scheduler:
  global_batch_size: 4
  local_batch_size: 1
  max_steps: 100
  ckpt_every_steps: 20
model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: meta-llama/Llama-3.2-1B
  dtype: float32
  attn_implementation: sdpa
dataset:
  _target_: nemo_automodel.components.datasets.zephon.ZephonTextDatasetConfig
  tokenize_special_tokens: eos
  zephon:
    sources:
    - name: stories
      path: hf://roneneldan/TinyStories/train
    packing:
      seq_len: 2048
    checkpoint:
      run_id: zephon-llama3_2-text
distributed:
  strategy: fsdp2
optimizer:
  _target_: torch.optim.AdamW
  lr: 0.00001
loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy
checkpoint:
  enabled: true
  checkpoint_dir: checkpoints/zephon-llama3_2-text
dist_env:
  backend: nccl
ci:
  cluster_tag: h100
  recipe_owner: MaxiBoether
  time: "00:30:00"
  nodes: 1
  nproc_per_node: 1
