# Real-text pretraining counterpart of examples/llm_benchmark/nemotron/nemotron_super_v3_te_deepep.yaml
# Fixed-length causal chunks; runtime tuning is canonical. GPU validation is pending.

recipe: TrainFinetuneRecipeForNextTokenPrediction
step_scheduler:
  gc_every_steps: 10
  global_batch_size: 512
  local_batch_size: 2
  ckpt_every_steps: 1000
  val_every_steps: null
  num_epochs: null
  max_steps: 1000
distributed:
  strategy: fsdp2
  tp_size: 1
  cp_size: 1
  pp_size: 1
  ep_size: 64
  activation_checkpointing: true
  moe:
    reshard_after_forward: true
dist_env:
  backend: nccl
  timeout_minutes: 10
model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_config
  config:
    _target_: nemo_automodel.NeMoAutoConfig.from_pretrained
    pretrained_model_name_or_path: nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-BF16
    trust_remote_code: true
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    linear: te
    rms_norm: te
    experts: torch_mm
    dispatcher: hybridep
    fake_balanced_gate: false
    enable_hf_state_dict_adapter: true
checkpoint:
  enabled: false
loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy
  fp32_upcast: false
dataset:
  _target_: nemo_automodel.components.datasets.llm.streaming_text.StreamingTextConfig
  path: HuggingFaceFW/fineweb-edu
  name: sample-10BT
  revision: 87f09149ef4734204d70ed1d046ddc9ca3f2b8f9
  seq_length: 4096
  tokenizer:
    _target_: nemo_automodel.NeMoAutoTokenizer.from_pretrained
    pretrained_model_name_or_path: nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-BF16
    trust_remote_code: false
dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: torch.utils.data.default_collate
  num_workers: 4
  pin_memory: true
optimizer:
  _target_: torch.optim.Adam
  betas:
  - 0.9
  - 0.999
  eps: 1e-8
  lr: 0.0001
  weight_decay: 0
rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 1234
  ranked: true
ci:
  cluster_tag: h100
  time: 00:15:00
  nodes: 8
  recipe_owner: akoumpa
  nproc_per_node: 8
  perf_testing:
    schedule: nightly
    fake_balanced_gate: true
