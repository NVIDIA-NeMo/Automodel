# Titans Memory-as-Layer (MAL), using proceedings equations 22--24.
# Persistent memory is prepended once; each block applies neural memory followed
# sequentially by causal attention over the paper's 2K training window.

recipe: TrainFinetuneRecipeForNextTokenPrediction
seed: 1111

step_scheduler:
  global_batch_size: 256
  local_batch_size: 1
  ckpt_every_steps: 250
  val_every_steps: 250
  log_remote_every_steps: 10
  num_epochs: 1
  max_steps: 28610

dist_env: {backend: nccl, timeout_minutes: 30}
rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 1111
  ranked: true

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_config
  config:
    _target_: nemo_automodel.components.models.titans.config.TitansConfig
    architectures: [TitansForCausalLM]
    vocab_size: 32000
    hidden_size: 768
    num_hidden_layers: 12
    num_attention_heads: 16
    head_dim: 48
    intermediate_size: 3072
    hidden_act: silu
    max_position_embeddings: 2176
    rms_norm_eps: 1.0e-6
    architecture_variant: mal
    num_persistent_memory_tokens: 128
    momentum: true
    forget: true
    mem_depth: 2
    memory_expansion_factor: 4
    memory_residual_norm: true
    qkv_conv_kernel_size: 4
    chunk_size: 16
    deep_memory_backend: titans_pytorch
    memory_batch_size: 2176
    tie_word_embeddings: false
    initializer_range: 0.02
    torch_dtype: float32
    pad_token_id: 0
    bos_token_id: 1
    eos_token_id: 2

dataset:
  _target_: nemo_automodel.components.datasets.llm.nanogpt_dataset.NanogptDataset
  file_pattern: "${TITANS_DATA_ROOT}/train/fineweb_edu_*.bin"
  seq_len: 2048
  shuffle_files: true
  align_to_bos: true
  bos_token: 1
dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  shuffle: false
  collate_fn: nemo_automodel.components.datasets.utils.default_collater
validation_dataset:
  _target_: nemo_automodel.components.datasets.llm.nanogpt_dataset.NanogptDataset
  file_pattern: "${TITANS_DATA_ROOT}/validation/fineweb_edu_*.bin"
  seq_len: 2048
  shuffle_files: false
  align_to_bos: false
  bos_token: 1
  repeat: false
validation_dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  shuffle: false
  collate_fn: nemo_automodel.components.datasets.utils.default_collater

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy
optimizer:
  _target_: torch.optim.AdamW
  lr: 3.0e-3
  betas: [0.9, 0.95]
  weight_decay: 0.1
lr_scheduler:
  lr_decay_style: cosine
  lr_warmup_steps: 286
  min_lr: 0.0
distributed:
  strategy: fsdp2
  dp_size: none
  tp_size: 1
  cp_size: 1
  pp_size: 1
  activation_checkpointing: true
checkpoint:
  enabled: true
  checkpoint_dir: "${TITANS_CHECKPOINT_ROOT}"
  model_save_format: safetensors
  save_consolidated: false
  is_async: true
