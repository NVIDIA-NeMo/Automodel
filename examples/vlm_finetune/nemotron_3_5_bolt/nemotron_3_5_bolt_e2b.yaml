# Fine-tune Nemotron 3.5 Bolt E2B using the registered dense Gemma 4 path.
# For a local checkpoint, override --model.pretrained_model_name_or_path.
# The processor is loaded from the same location by the VLM recipe.
# Run from the repository root:
#   uv run automodel examples/vlm_finetune/nemotron_3_5_bolt/nemotron_3_5_bolt_e2b.yaml --nproc-per-node 8

recipe: FinetuneRecipeForVLM

step_scheduler:
  global_batch_size: 8
  local_batch_size: 1
  ckpt_every_steps: 500
  val_every_steps: 500
  num_epochs: 2

dist_env:
  backend: nccl
  timeout_minutes: 10

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 42
  ranked: true

model:
  _target_: nemo_automodel.NeMoAutoModelForImageTextToText.from_pretrained
  pretrained_model_name_or_path: nvidia/NVIDIA-Nemotron-3.5-Bolt-E2B-BF16
  dtype: float32
  use_liger_kernel: false
  use_sdpa_patching: false
  attn_implementation: eager
  # The Gemma 4 wrapper preserves KV sharing during checkpoint recomputation.
  text_config:
    use_cache: false

processor:
  padding_side: right

checkpoint:
  enabled: true
  checkpoint_dir: vlm_checkpoints/nemotron_3_5_bolt_e2b/
  model_save_format: safetensors
  save_consolidated: true

distributed:
  strategy: fsdp2
  dp_size: none
  tp_size: 1
  cp_size: 1
  sequence_parallel: false
  activation_checkpointing: true
  mp_policy:
    _target_: torch.distributed.fsdp.MixedPrecisionPolicy
    param_dtype: bfloat16
    reduce_dtype: float32
    output_dtype: bfloat16

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy

dataset:
  _target_: nemo_automodel.components.datasets.vlm.datasets.make_medpix_dataset
  path_or_dataset: mmoukouba/MedPix-VQA
  split: train[:1000]
  chat_template: examples/vlm_finetune/nemotron_3_5_bolt/nemotron_3_5_bolt_e2b_chat_template.jinja

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  num_workers: 0
  pin_memory: true
  collate_fn:
    _target_: nemo_automodel.components.datasets.vlm.collate_fns.default_collate_fn
    max_length: 2048

validation_dataset:
  _target_: nemo_automodel.components.datasets.vlm.datasets.make_medpix_dataset
  path_or_dataset: mmoukouba/MedPix-VQA
  split: validation[:500]
  chat_template: examples/vlm_finetune/nemotron_3_5_bolt/nemotron_3_5_bolt_e2b_chat_template.jinja

validation_dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  num_workers: 0
  collate_fn:
    _target_: nemo_automodel.components.datasets.vlm.collate_fns.default_collate_fn
    max_length: 2048

optimizer:
  _target_: torch.optim.AdamW
  lr: 1e-5
  weight_decay: 0.01
  betas: [0.9, 0.95]

freeze_config:
  freeze_vision_tower: true
  freeze_audio_tower: true
  freeze_language_model: false

wandb:
  enable: false

ci:
  # Enable scheduled CI after the checkpoint is available to CI workers.
  nemo_ci_schedule: skipped
  cluster_tag: h100
  recipe_owner: huiyingl
  nodes: 1
  nproc_per_node: 8
  time: "00:20:00"
  max_steps: 2
