# NVIDIA Nemotron 3.5 Bolt (74B) text-only full SFT with 262144-token THD packs,
# through AutoModel's native MoE path. Bolt counterpart of
# nemotron_3_5_super_vl/nemotron_3_5_super_vl_tulu3_packed_256k_cp8_ep16_gb200.yaml.
#
# Target: 32 GPUs (4 nodes x 8 GPUs).
# world = TP1 * CP8 * PP1 * DP4 = 32; EP8 keeps each expert-parallel group
# inside one node.
# CP8 gives 32768 token slots per rank, including padding. Packed documents
# retain separate attention/Mamba boundaries.
# GBS=8 and local batch=1 give 2 microbatches per rank per optimizer step.
# Uses compiled fused linear cross entropy and FP32 Adam moments.
# Activation checkpointing, both reshard_after_forward settings, and immediate
# gradient synchronization bound memory use. master_weights and
# store_param_remainders retain FP32 master-weight precision with BF16 parameters.
#
# Bolt's routed-expert count differs between layers, so the HybridEP manager
# must not be shared across layers: keep dispatcher_share_token_dispatcher
# false. The default (true) is rejected at start-up for this model.
#
# Set PYTORCH_ALLOC_CONF=expandable_segments:True in the launch environment.
#
# Run (4 nodes):
#   automodel examples/vlm_finetune/nemotron_3_5_bolt/nemotron_3_5_bolt_tulu3_packed_256k_cp8_ep8.yaml --nproc-per-node 8 --nnodes 4

recipe: FinetuneRecipeForVLM

step_scheduler:
  global_batch_size: 8
  local_batch_size: 1
  ckpt_every_steps: 100000
  val_every_steps: 100000
  max_steps: 100
  gc_every_steps: 10
  validate_on_checkpoint: false

dist_env:
  backend: nccl
  timeout_minutes: 60

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 1234
  ranked: true

model:
  _target_: nemo_automodel.NeMoAutoModelForImageTextToText.from_pretrained
  pretrained_model_name_or_path: nvidia/NVIDIA-Nemotron-3.5-Bolt-74B-A9B-BF16
  trust_remote_code: true
  num_nextn_predict_layers: 0
  torch_dtype: torch.bfloat16
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    dispatcher: hybridep
    # Per-layer expert counts need one HybridEP manager per layer (see header).
    dispatcher_share_token_dispatcher: false
    # 262144 / CP8: allocate the HybridEP buffer once instead of growing it.
    dispatcher_hybridep_max_tokens_per_rank: 32768
    experts: torch_mm
    attn: te
    linear: te
    rms_norm: torch_fp32
    rope_fusion: false
    fake_balanced_gate: false
    enable_hf_state_dict_adapter: true

processor:
  _target_: transformers.AutoProcessor.from_pretrained
  pretrained_model_name_or_path: nvidia/NVIDIA-Nemotron-3.5-Bolt-74B-A9B-BF16
  trust_remote_code: true

checkpoint:
  enabled: false

distributed:
  strategy: fsdp2
  tp_size: 1
  cp_size: 8
  # Reduce and shard gradients after every microbatch to bound accumulation memory.
  defer_fsdp_grad_sync: false
  pp_size: 1
  ep_size: 8
  sequence_parallel: false
  activation_checkpointing: true
  reshard_after_forward: true
  moe:
    reshard_after_forward: true

freeze_config:
  freeze_vision_tower: true
  freeze_audio_tower: true
  freeze_language_model: false

loss_fn:
  _target_: nemo_automodel.components.loss.linear_ce.FusedLinearCrossEntropy
  impl: torch_compile

dataset:
  _target_: nemo_automodel.components.datasets.vlm.datasets.make_tulu3_dataset
  path_or_dataset: allenai/tulu-3-sft-mixture
  split: train
  # Truncate over-long samples instead of substituting a random other sample
  # (keeps every rank of a CP/TP group on identical packs).
  truncate: true
  # Tulu-3 is text-only; do not inject a fake image into every sample.
  inject_fake_images: false

# THD packing: 262144 slots per row; CP8 leaves 32768 slots per rank.
# packing_format: thd is required for this hybrid Mamba+MoE backbone.
packed_sequence:
  pretokenize: true
  packing_format: thd
  max_length: 262144
  pack_size: 262144
  collate_max_length: 262144
  packing_ratio: 0.9
  drop_long_samples: true

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  num_workers: 4
  persistent_workers: true
  drop_last: true
  shuffle: true

optimizer:
  _target_: transformer_engine.pytorch.optimizers.fused_adam.FusedAdam
  betas: [0.9, 0.95]
  eps: 1e-8
  lr: 1.0e-5
  weight_decay: 0.01
  master_weights: true
  store_param_remainders: true
  exp_avg_dtype: torch.float32
  exp_avg_sq_dtype: torch.float32

lr_scheduler:
  lr_decay_style: constant

wandb:
  enable: false
  project: nemo_automodel
  name: nemotron_3_5_bolt_tulu3_packed_256k_cp8_ep8

ci:
  nemo_ci_schedule: skipped
  recipe_owner: mormio
  cluster_tag: b200
  nodes: 4
  time: "01:00:00"
  max_steps: 2
