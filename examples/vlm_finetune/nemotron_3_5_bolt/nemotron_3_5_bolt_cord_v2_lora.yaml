# Single-GB300 BF16 LoRA fine-tuning for NVIDIA Nemotron 3.5 Bolt on CORD-v2.
#
# This deliberately uses the Hugging Face remote implementation through
# force_hf instead of AutoModel's native MoE path. Every parallelism axis,
# including expert parallelism, remains at one.
#
# Routed experts are intentionally absent from target_modules: adapting every
# per-expert Linear would make the adapter and optimizer unnecessarily large.
# Mamba out_proj is also excluded because the fused HF training kernel consumes
# out_proj.weight directly instead of calling the wrapped module's forward.
#
# Run on exactly one GB300 GPU:
#   CUDA_VISIBLE_DEVICES=0 automodel \
#     examples/vlm_finetune/nemotron_3_5_bolt/nemotron_3_5_bolt_cord_v2_lora.yaml \
#     --nproc-per-node 1

recipe: FinetuneRecipeForVLM

step_scheduler:
  global_batch_size: 1
  local_batch_size: 1
  ckpt_every_steps: 20
  val_every_steps: 20
  max_steps: 100

dist_env:
  backend: nccl
  timeout_minutes: 30

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 42
  ranked: true

model:
  _target_: nemo_automodel.NeMoAutoModelForImageTextToText.from_pretrained
  pretrained_model_name_or_path: nvidia/NVIDIA-Nemotron-3.5-Bolt-74B-A9B-BF16
  force_hf: true
  trust_remote_code: true
  torch_dtype: torch.bfloat16
  # The remote FA2 path converts an all-valid mask to an unsupported 4D
  # additive mask, and the remote model does not advertise SDPA support.
  attn_implementation: eager
  use_liger_kernel: false
  use_sdpa_patching: false
  # The checkpoint stores pre-Transformers-5.18 parameter prefixes.
  key_mapping:
    '^language_model\.backbone\.': language_model.model.
    '^mlp1\.0\.': vision_projector.mlp1.norm.
    '^mlp1\.1\.': vision_projector.mlp1.linear1.
    '^mlp1\.3\.': vision_projector.mlp1.linear2.

compile:
  enabled: false

peft:
  _target_: nemo_automodel.components._peft.lora.PeftConfig
  target_modules:
    - "*language_model.model.layers.*.mixer.in_proj"
    - "*language_model.model.layers.*.mixer.q_proj"
    - "*language_model.model.layers.*.mixer.k_proj"
    - "*language_model.model.layers.*.mixer.v_proj"
    - "*language_model.model.layers.*.mixer.o_proj"
    - "*language_model.model.layers.*.mixer.fc1_latent_proj"
    - "*language_model.model.layers.*.mixer.fc2_latent_proj"
    - "*language_model.model.layers.*.mixer.shared_experts.up_proj"
    - "*language_model.model.layers.*.mixer.shared_experts.down_proj"
  dim: 8
  alpha: 32
  use_memory_efficient_lora: true
  use_triton: true

processor:
  _target_: transformers.AutoProcessor.from_pretrained
  pretrained_model_name_or_path: nvidia/NVIDIA-Nemotron-3.5-Bolt-74B-A9B-BF16
  trust_remote_code: true

checkpoint:
  enabled: true
  checkpoint_dir: vlm_checkpoints/nemotron_3_5_bolt_cord_v2_lora
  model_save_format: safetensors
  save_consolidated: false

distributed:
  strategy: fsdp2
  dp_size: 1
  tp_size: 1
  cp_size: 1
  pp_size: 1
  ep_size: 1
  sequence_parallel: false
  activation_checkpointing: false
  reshard_after_forward: true

freeze_config:
  freeze_modules:
    - path: vision_model
    - path: vision_projector

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy

dataset:
  _target_: nemo_automodel.components.datasets.vlm.datasets.make_cord_v2_dataset
  path_or_dataset: naver-clova-ix/cord-v2
  split: train

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  num_workers: 0
  collate_fn:
    _target_: nemo_automodel.components.datasets.vlm.collate_fns.nemotron_omni_collate_fn
    max_length: 4096
  drop_last: true

validation_dataset:
  _target_: nemo_automodel.components.datasets.vlm.datasets.make_cord_v2_dataset
  path_or_dataset: naver-clova-ix/cord-v2
  split: validation

validation_dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  num_workers: 0
  collate_fn:
    _target_: nemo_automodel.components.datasets.vlm.collate_fns.nemotron_omni_collate_fn
    max_length: 4096

optimizer:
  _target_: transformer_engine.pytorch.optimizers.fused_adam.FusedAdam
  lr: 2.0e-4
  weight_decay: 0.01
  betas: [0.9, 0.95]
  master_weights: true
  store_param_remainders: true
  exp_avg_dtype: torch.float32
  exp_avg_sq_dtype: torch.float32

wandb:
  enable: false
  project: nemo_automodel
  name: nemotron_3_5_bolt_cord_v2_lora

ci:
  recipe_owner: huiyingl
  cluster_tag: gb300
  nodes: 1
  nproc_per_node: 1
  time: "00:30:00"
  max_steps: 2
