# Configuration for LoRA fine-tuning NVIDIA Nemotron 3.5 Bolt E4B with MedPix dataset for image description.
# Nemotron 3.5 Bolt E4B keeps the Gemma 4 E4B architecture; the checkpoint refreshes the weights and
# the chat template. The chat template below is the one shipped with the checkpoint and is applied to
# the processor by the VLM dataset loader.
# Run command:
# torchrun --nproc-per-node=2 examples/vlm_finetune/finetune.py -c examples/vlm_finetune/nemotron_3_5_bolt/nemotron_3_5_bolt_e4b_peft.yaml

recipe: FinetuneRecipeForVLM

step_scheduler:
  global_batch_size: 8
  local_batch_size: 1
  ckpt_every_steps: 500
  val_every_steps: 500
  num_epochs: 2

dist_env:
  backend: nccl
  timeout_minutes: 10

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 42
  ranked: true

model:
  _target_: nemo_automodel.NeMoAutoModelForImageTextToText.from_pretrained
  pretrained_model_name_or_path: nvidia/NVIDIA-Nemotron-3.5-Bolt-E4B-4GB-BF16
  torch_dtype: torch.bfloat16
  use_liger_kernel: true
  use_sdpa_patching: false
  attn_implementation: sdpa
  # 4B uses kv_shared layers, hence use_cache: true.
  text_config:
    use_cache: true

peft:
  _target_: nemo_automodel.components._peft.lora.PeftConfig
  match_all_linear: False
  exclude_modules:
    - "*vision_tower*"
    - "*vision*"
    - "*visual*"
    - "*image_encoder*"
    - "*lm_head*"
    - "*audio*"
  dim: 16
  alpha: 32
  use_triton: True

checkpoint:
  enabled: true
  checkpoint_dir: vlm_checkpoints/nemotron_3_5_bolt_e4b_peft/
  model_save_format: safetensors
  save_consolidated: false

distributed:
  strategy: fsdp2
  dp_size: none
  tp_size: 1
  cp_size: 1
  sequence_parallel: false

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy

dataset:
  _target_: nemo_automodel.components.datasets.vlm.datasets.make_medpix_dataset
  path_or_dataset: mmoukouba/MedPix-VQA
  split: train[:1000]
  chat_template: examples/vlm_finetune/nemotron_3_5_bolt/nemotron_3_5_bolt_e4b_chat_template.jinja

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  num_workers: 0
  pin_memory: true
  collate_fn:
    _target_: nemo_automodel.components.datasets.vlm.collate_fns.default_collate_fn

validation_dataset:
  _target_: nemo_automodel.components.datasets.vlm.datasets.make_medpix_dataset
  path_or_dataset: mmoukouba/MedPix-VQA
  split: validation[:500]
  chat_template: examples/vlm_finetune/nemotron_3_5_bolt/nemotron_3_5_bolt_e4b_chat_template.jinja

validation_dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader

optimizer:
  _target_: torch.optim.AdamW
  lr: 2e-4
  weight_decay: 0.01
  betas: [0.9, 0.95]

lr_scheduler:
  lr_decay_style: cosine

freeze_config:
  freeze_vision_tower: true
  freeze_audio_tower: true
  freeze_language_model: false

# wandb:
#   project: <your-project>
#   entity: <your-entity>
#   name: <your-run-name>

ci:
  cluster_tag: h100
  recipe_owner: huiyingl
  nodes: 1
  time: "00:20:00"
