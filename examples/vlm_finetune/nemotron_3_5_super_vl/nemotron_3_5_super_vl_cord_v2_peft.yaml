# Nemotron 3.5 Super VL LoRA fine-tuning on CORD-v2 receipt field extraction
# (receipt image -> structured `<s_menu><s_nm>...` token sequence, as in the
# NemotronOmni CORD-v2 guide). The base model stays frozen and LoRA adapters
# (rank 64, alpha 128) are trained on the LLM linear projections (Mamba in/out
# projections, attention q/k/v/o, MoE latent projections and shared experts);
# the vision tower, vision projector and lm_head are excluded.
#
# Sizing: with the base weights frozen there are no fp32 master weights or
# optimizer states for the base model, so the recipe fits on 2 nodes x 8 H100
# (~22 GiB/GPU): 512 experts -> ep_size 16; global_batch_size 8 with cp_size 2
# gives dp=8 -> one sample per rank per optimizer step. Checkpoints hold the
# adapter weights only (adapter_model.safetensors + adapter_config.json).
#
# Run (2 nodes):
#   automodel examples/vlm_finetune/nemotron_3_5_super_vl/nemotron_3_5_super_vl_cord_v2_peft.yaml --nproc-per-node 8 --nnodes 2

recipe: FinetuneRecipeForVLM

step_scheduler:
  global_batch_size: 8
  local_batch_size: 1
  ckpt_every_steps: 400
  val_every_steps: 100
  max_steps: 400

dist_env:
  backend: nccl
  timeout_minutes: 30

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 42
  ranked: true

model:
  _target_: nemo_automodel.NeMoAutoModelForImageTextToText.from_pretrained
  pretrained_model_name_or_path: nvidia/NVIDIA-Nemotron-3.5-Super-midtrain-67B-vision-pretrained
  trust_remote_code: true
  num_nextn_predict_layers: 0
  torch_dtype: torch.bfloat16
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: te
    linear: te
    rms_norm: torch_fp32
    rope_fusion: false
    fake_balanced_gate: false
    enable_hf_state_dict_adapter: true

peft:
  _target_: nemo_automodel.components._peft.lora.PeftConfig
  match_all_linear: false
  exclude_modules:
    - "*vision_tower*"
    - "*vision_model*"
    - "*vision_projector*"
    - "*audio*"
    - "*sound*"
    - "*lm_head*"
    - "*mlp1*"
  dim: 64
  alpha: 128
  use_triton: true

processor:
  _target_: transformers.AutoProcessor.from_pretrained
  pretrained_model_name_or_path: nvidia/NVIDIA-Nemotron-3.5-Super-midtrain-67B-vision-pretrained
  trust_remote_code: true

checkpoint:
  enabled: true
  checkpoint_dir: vlm_checkpoints/nemotron_3_5_super_vl_cord_v2_peft
  model_save_format: safetensors
  save_consolidated: false

distributed:
  strategy: fsdp2
  tp_size: 1
  # cp_size 2 -> dp 8 on 16 GPUs -> one 1-sample microbatch per rank per optimizer step.
  cp_size: 2
  pp_size: 1
  ep_size: 16
  sequence_parallel: false
  activation_checkpointing: true
  reshard_after_forward: true
  moe:
    reshard_after_forward: true

freeze_config:
  freeze_embeddings: true
  freeze_vision_tower: true
  freeze_audio_tower: true
  freeze_language_model: false

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy

dataset:
  _target_: nemo_automodel.components.datasets.vlm.datasets.make_cord_v2_dataset
  path_or_dataset: naver-clova-ix/cord-v2
  split: train

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  num_workers: 0
  collate_fn:
    _target_: nemo_automodel.components.datasets.vlm.collate_fns.nemotron_omni_collate_fn
    max_length: 4096
  drop_last: true

validation_dataset:
  _target_: nemo_automodel.components.datasets.vlm.datasets.make_cord_v2_dataset
  path_or_dataset: naver-clova-ix/cord-v2
  split: validation

validation_dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  num_workers: 1
  collate_fn:
    _target_: nemo_automodel.components.datasets.vlm.collate_fns.nemotron_omni_collate_fn
    max_length: 4096

wandb:
  enable: false
  entity: Nemo-automodel
  project: huiyingl_workspace
  name: nemotron_3_5_super_vl_cord_v2_peft

optimizer:
  _target_: torch.optim.AdamW
  lr: 2e-4
  weight_decay: 0.01
  betas: [0.9, 0.95]

ci:
  recipe_owner: HuiyingLi
  nodes: 2
  time: "01:30:00"
  max_steps: 2
