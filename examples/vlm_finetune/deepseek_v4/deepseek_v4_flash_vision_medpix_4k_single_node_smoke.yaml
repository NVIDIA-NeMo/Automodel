# Copyright (c) 2026, NVIDIA CORPORATION. All rights reserved.
#
# Required pre-scale gate for the full EP32/PP4 run. This preserves the full
# 32-layer vision tower, 4096-token unpacked path, TileLang sparse attention,
# HybridEP dispatcher, torch-mm experts, activation checkpointing, backward,
# and optimizer step while scaling the 43 language layers to four and the
# topology to EP4/PP2 on one eight-GPU node. This is smoke evidence only.

recipe: FinetuneRecipeForVLM

seed: 1234

step_scheduler:
  # EP4 is also the four-rank data-parallel mesh: 2 samples/rank x 4.
  global_batch_size: 8
  # Two one-sample microbatches exercise both PP stages.
  local_batch_size: 2
  ckpt_every_steps: 1000
  val_every_steps: 1000
  log_remote_every_steps: 1
  gc_every_steps: 1
  num_epochs: 1
  max_steps: 2

dist_env:
  backend: nccl
  timeout_minutes: 30

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 1234
  ranked: true
  deterministic: true

model:
  _target_: nemo_automodel.NeMoAutoModelForImageTextToText.from_pretrained
  pretrained_model_name_or_path: deepseek-ai/DeepSeek-V4-Flash-Vision-Exp
  trust_remote_code: false
  torch_dtype: bfloat16
  num_hidden_layers: 4
  num_nextn_predict_layers: 0
  compress_ratios: [0, 0, 4, 128]
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: tilelang
    linear: torch
    rms_norm: torch_fp32
    rope_fusion: false
    dispatcher: hybridep
    experts: torch_mm
    gate_precision: float32
    fake_balanced_gate: false
    enable_hf_state_dict_adapter: true
    enable_fsdp_optimizations: true

processor:
  _target_: nemo_automodel.components.models.deepseek_v4.processing.DeepseekV4VisionProcessor.from_pretrained
  pretrained_model_name_or_path: deepseek-ai/DeepSeek-V4-Flash-Vision-Exp
  trust_remote_code: false

checkpoint:
  enabled: false
  checkpoint_dir: checkpoints/deepseek_v4_flash_vision_medpix_4k_single_node_smoke/
  model_save_format: safetensors
  save_consolidated: false
  dequantize_base_checkpoint: true

distributed:
  strategy: fsdp2
  tp_size: 1
  cp_size: 1
  pp_size: 2
  ep_size: 4
  sequence_parallel: false
  activation_checkpointing: true
  defer_fsdp_grad_sync: false
  pipeline:
    pp_schedule: interleaved1f1b
    pp_microbatch_size: 1
    layers_per_stage: 1
    round_virtual_stages_to_pp_multiple: down
    scale_grads_in_schedule: false
    patch_inner_model: false
    patch_causal_lm_model: false
  moe:
    reshard_after_forward: false
    wrap_outer_model: true

freeze_config:
  freeze_vision_tower: false
  freeze_audio_tower: true
  freeze_language_model: false

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy
  fp32_upcast: false

dataset:
  _target_: nemo_automodel.components.datasets.vlm.datasets.make_medpix_dataset
  path_or_dataset: mmoukouba/MedPix-VQA
  split: train

packed_sequence:
  packed_sequence_size: 0

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  num_workers: 1
  persistent_workers: true
  pin_memory: true
  collate_fn:
    _target_: nemo_automodel.components.datasets.vlm.collate_fns.default_collate_fn
    max_length: 4097
  drop_last: true

validation_dataset: none
validation_dataloader: none

optimizer:
  _target_: torch.optim.AdamW
  betas: [0.9, 0.95]
  eps: 1.0e-8
  lr: 5.0e-6
  weight_decay: 0.1

lr_scheduler:
  lr_decay_style: constant

wandb:
  enable: false
  project: huiyingl_workspace
  entity: Nemo-automodel
  name: deepseek_v4_flash_vision_medpix_4k_single_node_smoke
  dir: logs/deepseek_v4_flash_vision_medpix_4k_single_node_smoke/wandb

ci:
  recipe_owner: HuiyingLi
  nodes: 1
  time: "02:00:00"
