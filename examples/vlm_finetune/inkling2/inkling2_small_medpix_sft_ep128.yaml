# Full SFT of Inkling-2-Small (594B total, 17B active) on MedPix-VQA.
#
# Hardware target: 16 nodes x 8 H100 GPUs, FSDP2 + EP128 (3 of 384 experts per rank), no PP or CP.
# The released NVFP4 (layers 0-39) and MXFP8 (layers 40-47) experts are dequantized to BF16 on load.
# Per rank: ~4.6B parameters (experts are EP-only at EP128); BF16 params and grads plus TE FusedAdam
# FP32 master weights (16-bit remainders) and BF16 moments come to ~10 bytes per parameter, ~46 GB.
# The vision tower and projector stay frozen; the drafter in mtp.safetensors is not loaded.

recipe: FinetuneRecipeForVLM

step_scheduler:
  global_batch_size: 128
  local_batch_size: 1
  ckpt_every_steps: 500
  val_every_steps: 50
  log_remote_every_steps: 1
  gc_every_steps: 10
  num_epochs: 2
  max_steps: 100

dist_env:
  backend: nccl
  timeout_minutes: 60

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 1234
  ranked: true

model:
  _target_: nemo_automodel.NeMoAutoModelForImageTextToText.from_pretrained
  pretrained_model_name_or_path: thinkingmachines/Inkling-2-Small
  torch_dtype: bfloat16
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: sdpa
    linear: torch
    rms_norm: torch_fp32
    gate_precision: float32
    experts: torch_mm
    dispatcher: hybridep
    enable_hf_state_dict_adapter: true
    enable_fsdp_optimizations: true

processor:
  _target_: nemo_automodel.components.models.inkling2.processing.Inkling2Processor.from_pretrained
  pretrained_model_name_or_path: thinkingmachines/Inkling-2-Small

checkpoint:
  enabled: false
  checkpoint_dir: checkpoints/inkling2-small-medpix-sft-ep128/
  model_save_format: safetensors
  save_consolidated: false
  dequantize_base_checkpoint: true
  load_metadata_with_gloo: true

distributed:
  strategy: fsdp2
  tp_size: 1
  cp_size: 1
  pp_size: 1
  dp_replicate_size: 1
  ep_size: 128

  sequence_parallel: false
  activation_checkpointing: true

  moe:
    reshard_after_forward: true
    wrap_outer_model: true

freeze_config:
  freeze_vision_tower: true
  freeze_language_model: false

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy

dataset:
  _target_: nemo_automodel.components.datasets.vlm.datasets.make_medpix_dataset
  path_or_dataset: mmoukouba/MedPix-VQA
  split: train

# One image token per 40x40 pixel patch with no resizing: a 512x655 MedPix image is 13x17 = 221 tokens.
dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  num_workers: 1
  collate_fn:
    _target_: nemo_automodel.components.datasets.vlm.collate_fns.default_collate_fn
    max_length: 1024
  drop_last: true

validation_dataset:
  _target_: nemo_automodel.components.datasets.vlm.datasets.make_medpix_dataset
  path_or_dataset: mmoukouba/MedPix-VQA
  split: validation[:256]

validation_dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  num_workers: 1
  collate_fn:
    _target_: nemo_automodel.components.datasets.vlm.collate_fns.default_collate_fn
    max_length: 1024
  drop_last: true

optimizer:
  _target_: transformer_engine.pytorch.optimizers.fused_adam.FusedAdam
  betas: [0.9, 0.95]
  eps: 1.0e-08
  lr: 1.0e-05
  weight_decay: 0.1
  adam_w_mode: true
  bias_correction: true
  master_weights: true
  master_weight_dtype: torch.float32
  store_param_remainders: true
  # BF16 moments keep the optimizer near 10 bytes per parameter; FP32 moments (~65 GB per rank) do not fit H100.
  exp_avg_dtype: torch.bfloat16
  exp_avg_sq_dtype: torch.bfloat16

lr_scheduler:
  lr_decay_style: cosine
  min_lr: 1.0e-6

wandb:
  enable: false
  project: <your_wandb_project>
  entity: <your_wandb_entity>
  name: inkling2-small-medpix-sft-ep128
  dir: wandb

ci:
  cluster_tag: h100
  recipe_owner: ischencheng
  # ep_size(128) => 16 nodes (8 H100/node).
  nodes: 16
  time: "01:00:00"
