# Full-model, 100-step, 2048-token TP1/TP2 SFT parity recipe. Both runs use
# the same 1,600 deterministic samples and the same two eight-sample
# microbatches per optimizer step:
#   TP1: dp8 x tp1, LBS1, gradient accumulation 2
#   TP2: dp4 x tp2, LBS2, gradient accumulation 2
# Override distributed.tp_size=1 and step_scheduler.local_batch_size=1 for TP1.

recipe: FinetuneRecipeForVLM

step_scheduler:
  global_batch_size: 16
  local_batch_size: 2
  ckpt_every_steps: 200
  val_every_steps: 200
  max_steps: 100
  num_epochs: 1

dist_env:
  backend: nccl
  timeout_minutes: 30

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 42
  ranked: true

model:
  _target_: nemo_automodel.NeMoAutoModelForImageTextToText.from_pretrained
  pretrained_model_name_or_path: google/gemma-4-E4B-it
  torch_dtype: torch.bfloat16
  attn_implementation: sdpa
  use_liger_kernel: false
  use_sdpa_patching: false
  text_config:
    use_cache: false
    output_hidden_states: true

processor:
  padding_side: right

checkpoint:
  enabled: false

distributed:
  strategy: fsdp2
  dp_size: none
  tp_size: 2
  cp_size: 1
  sequence_parallel: false
  activation_checkpointing: false

loss_fn:
  _target_: nemo_automodel.components.models.gemma4_moe.loss.Gemma4TensorParallelFusedLinearCrossEntropy
  logit_softcapping: 30.0
  reduction: sum

dataset:
  _target_: nemo_automodel.components.datasets.vlm.mock.build_mock_vlm_dataset
  num_samples: 1600
  num_images_per_sample: 0
  max_length: 2048
  seed: 42
  truncate: true
  inject_fake_images: false

packed_sequence:
  pretokenize: true
  max_length: 2048
  pack_size: 0

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  num_workers: 0
  persistent_workers: false
  pin_memory: true

optimizer:
  _target_: torch.optim.AdamW
  lr: 2e-5
  weight_decay: 0.01
  betas: [0.9, 0.95]

freeze_config:
  freeze_embeddings: true
  freeze_vision_tower: true
  freeze_audio_tower: true
  freeze_language_model: false

wandb:
  enable: true
  project: gemma4-e4b-tp-parity
  entity: Nemo-automodel
  name: <override-per-run>
  group: gemma4-e4b-2k-tp1-tp2-exact-100step
  dir: <override-per-run>

ci:
  nodes: 1
  time: "01:00:00"
  env_vars:
    PYTORCH_ALLOC_CONF: "expandable_segments:True"
