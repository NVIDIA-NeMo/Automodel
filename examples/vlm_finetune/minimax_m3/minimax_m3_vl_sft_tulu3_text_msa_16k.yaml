# Tulu-3 text SFT: SM100 MSA, 16k BSHD packing, 128 GPUs (PP=4, EP=32).
recipe: FinetuneRecipeForVLM
seed: 1234
step_scheduler:
  global_batch_size: 128
  local_batch_size: 4
  ckpt_every_steps: 1000000
  val_every_steps: 1000000
  gc_every_steps: 10
  max_steps: 100
dist_env:
  timeout_minutes: 60

model:
  _target_: nemo_automodel.NeMoAutoModelForImageTextToText.from_pretrained
  pretrained_model_name_or_path: MiniMaxAI/MiniMax-M3
  torch_dtype: bfloat16
  text_config:
    # The BF16 checkpoint has no MTP weights.
    num_mtp_modules: 0
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    # Dense layers require SDPA for the packed 4D mask; MSA requires uv sync --extra msa.
    attn: sdpa
    sparse_attn: msa
    linear: te
    rope_fusion: false
    experts: gmm
    dispatcher: hybridep
    enable_fsdp_optimizations: true

processor:
  _target_: nemo_automodel.components.models.minimax_m3_vl.processing.build_minimax_m3_vl_processor
  pretrained_model_name_or_path: MiniMaxAI/MiniMax-M3
  trust_remote_code: true
checkpoint:
  enabled: false
  checkpoint_dir: vlm_checkpoints/minimax_m3_vl_sft_tulu3_text_msa_16k/
  save_consolidated: false
  dequantize_base_checkpoint: false

distributed:
  pp_size: 4
  ep_size: 32
  activation_checkpointing: true
  pipeline:
    pp_schedule: interleaved1f1b
    layers_per_stage: 2
    round_virtual_stages_to_pp_multiple: down
    patch_inner_model: false
    patch_causal_lm_model: false
freeze_config:
  freeze_audio_tower: true
loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy
  fp32_upcast: false

dataset:
  _target_: nemo_automodel.components.datasets.vlm.datasets.make_tulu3_dataset
packed_sequence:
  max_length: 16384
  pack_size: 16384
  collate_max_length: 16384
  packing_ratio: 0.9
  drop_long_samples: true
dataloader:
  num_workers: 4
  persistent_workers: true
  pin_memory: true
  drop_last: true

optimizer:
  _target_: torch.optim.AdamW
  betas: [0.9, 0.95]
  lr: 2.0e-5
lr_scheduler:
  min_lr: 2.0e-6

ci:
  recipe_owner: Butterfingrz
  time: "01:00:00"
  nodes: 32
  nproc_per_node: 4
  cluster_tag: gb200
