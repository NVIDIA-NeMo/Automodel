#
# Hy4-flash full SFT on MedPix-VQA (unpacked, 4K tokens), EP64 on 8 H100 nodes x 8 GPUs.
# Launch requirement on multi-node InfiniBand H100 systems: export NCCL_PXN_DISABLE=1 (or NCCL_NET_PLUGIN=none
# NCCL_NET=IB with PXN kept), as for DeepSeek-V4.1-Flash. With the container's default network plugin and PXN both
# active, the Engram row-owner ID all-to-all receives corrupted IDs from ranks on another node and the recipe stops in
# the shared table's received-ID check (issue #3959). ``ci.env_vars`` below sets it for CI.
# Point the JIT caches (HYBRID_EP_CACHE_DIR, TRITON_CACHE_DIR) at node-local storage, as on the DeepSeek-V4.1-Flash
# model-coverage page.

recipe: FinetuneRecipeForVLM
seed: 1234
step_scheduler:
  global_batch_size: 64
  local_batch_size: 1
  ckpt_every_steps: 1000
  save_checkpoint_every_epoch: false
  val_every_steps: 1000
  log_remote_every_steps: 1
  gc_every_steps: 10
  num_epochs: 1
  max_steps: 100

dist_env:
  backend: nccl
  timeout_minutes: 120

model:
  _target_: nemo_automodel.NeMoAutoModelForImageTextToText.from_config
  config:
    _target_: nemo_automodel.components.models.hy_v4_flash.config.HY4FlashConfig.from_pretrained
    pretrained_model_name_or_path: tencent/Hy4-flash
    name_or_path: tencent/Hy4-flash
    revision: eccd3123eec73f2040f4c9ed0de1883593470510  # pragma: allowlist secret (public model commit SHA)
  revision: eccd3123eec73f2040f4c9ed0de1883593470510  # pragma: allowlist secret (public model commit SHA)
  trust_remote_code: false
  load_base_model: true
  torch_dtype: bfloat16
  use_liger_kernel: false
  use_sdpa_patching: false
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: cudnn
    linear: torch
    rms_norm: torch
    experts: torch_mm
    dispatcher: hybridep
    gate_precision: float32
    rope_fusion: false
    shared_expert_overlap: true
    compile_router_weight: true
    compile_hc: true  # hyper-connection cores compiled once per static shape; the first step takes minutes longer
    compile_norm: false  # in BF16 the compiled core multiplies by the weight in FP32 and rounds once; the reference rounds twice
    fake_balanced_gate: false
    enable_hf_state_dict_adapter: true
    enable_fsdp_optimizations: true

processor:
  _target_: nemo_automodel.components.models.hy_v4_flash.processing.HY4FlashProcessor.from_pretrained
  pretrained_model_name_or_path: tencent/Hy4-flash
  revision: eccd3123eec73f2040f4c9ed0de1883593470510  # pragma: allowlist secret (public model commit SHA)
  trust_remote_code: false

distributed:
  strategy: fsdp2
  tp_size: 1
  pp_size: 1
  cp_size: 1
  ep_size: 64
  sequence_parallel: false
  activation_checkpointing: true
  defer_fsdp_grad_sync: false
  moe:
    reshard_after_forward: true
    wrap_outer_model: true
    lm_head_precision: float32
    mp_policy:
      _target_: torch.distributed.fsdp.MixedPrecisionPolicy
      param_dtype: bfloat16
      reduce_dtype: float32
      output_dtype: null
      cast_forward_inputs: false

freeze_config:
  freeze_vision_tower: false
  freeze_language_model: false

checkpoint:
  enabled: false
  checkpoint_dir: ../checkpoints/hy4_flash_medpix_4k_ep64
  model_save_format: safetensors
  save_consolidated: false

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy
  fp32_upcast: false

dataset:
  _target_: nemo_automodel.components.datasets.vlm.datasets.make_medpix_dataset
  path_or_dataset: mmoukouba/MedPix-VQA
  split: train

packed_sequence:
  packed_sequence_size: 0

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  num_workers: 4
  pin_memory: true
  shuffle: true
  drop_last: true
  collate_fn:
    _target_: nemo_automodel.components.datasets.vlm.collate_fns.default_collate_fn
    max_length: 4097  # the collator performs the sole next-token shift, leaving 4096 inputs

validation_dataset: none
validation_dataloader: none

optimizer:
  _target_: transformer_engine.pytorch.optimizers.fused_adam.FusedAdam
  betas: [0.9, 0.95]
  eps: 1.0e-8
  lr: 1.0e-5
  weight_decay: 0.1
  adam_w_mode: true
  bias_correction: true
  master_weights: true
  master_weight_dtype: torch.float32
  store_param_remainders: true
  exp_avg_dtype: torch.bfloat16
  exp_avg_sq_dtype: torch.bfloat16

lr_scheduler:
  lr_warmup_steps: 10
  lr_decay_steps: 100
  lr_decay_style: cosine
  min_lr: 1.0e-6

clip_grad_norm:
  backend: te  # avoids gradient-sized temporaries for the Engram owner shards
  max_norm: 1.0

mfu:
  peak_tflops: 989

wandb:
  enable: false
  entity: Nemo-automodel
  project: hy4_flash
  name: hy4-flash-medpix-4k-ep64-sft
  mode: online
  dir: ../logs/wandb

ci:
  nemo_ci_schedule: release
  recipe_owner: HuiyingLi
  nodes: 8
  cluster_tag: h100
  time: "01:00:00"
  nproc_per_node: 8
  env_vars:
    NCCL_PXN_DISABLE: "1"
