# Kimi K3.1 nonpacked MedPix training: FLA KDA and cuDNN sparse DSA, CP1.
# BF16 parameters and AdamW moments; EP32 x PP8 on 64 four-GPU GB200 nodes.
# Uses learned expert routing. Benchmark fake/static routing stays disabled.
# FLA supports CP; the optional CP-incompatible fused KDA implementation is not used.
# Native MedPix processing preserves individual examples and their padding.
# Four-layer validation does not certify this full 93-layer topology.

recipe: FinetuneRecipeForVLM
step_scheduler:
  global_batch_size: 256
  local_batch_size: 8
  ckpt_every_steps: 100
  val_every_steps: 100
  max_steps: 100
  num_epochs: 1
  gc_every_steps: 10
dist_env:
  backend: nccl
  timeout_minutes: 120
rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 1234
  ranked: true
model:
  _target_: nemo_automodel.NeMoAutoModelForImageTextToText.from_pretrained
  pretrained_model_name_or_path: moonshotai/Kimi-K3.1-Pro
  trust_remote_code: false
  use_liger_kernel: false
  use_sdpa_patching: false
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: cudnn
    linear: torch
    rms_norm: torch_fp32
    experts: torch_mm
    dispatcher: hybridep
    rope_fusion: false
    enable_hf_state_dict_adapter: true
    enable_fsdp_optimizations: true
    dispatcher_num_sms: 32
  revision: 6d0a0202956796543364d666ab19c6ad1a494ee1  # pragma: allowlist secret (public model commit SHA)
  torch_dtype: bfloat16
  text_config:
    kda_chunk_impl: fla
checkpoint:
  enabled: false
  checkpoint_dir: checkpoints/kimi_k31_medpix_nonpacked
  model_save_format: safetensors
  save_consolidated: false
  dequantize_base_checkpoint: true
distributed:
  strategy: fsdp2
  tp_size: 1
  cp_size: 1
  pp_size: 8
  ep_size: 32
  sequence_parallel: false
  activation_checkpointing: true
  pipeline:
    pp_schedule: 1f1b
    pp_microbatch_size: 1
    scale_grads_in_schedule: false
    patch_inner_model: false
    patch_causal_lm_model: false
    pp_batch_size: 8
    pp_seq_len: 4096
    pp_recv_buffer_pool: true
  moe:
    reshard_after_forward: true
    wrap_outer_model: true
  reshard_after_forward: true
  defer_fsdp_grad_sync: false
loss_fn:
  _target_: nemo_automodel.components.loss.chunked_ce.ChunkedCrossEntropy
dataset:
  _target_: nemo_automodel.components.datasets.vlm.datasets.make_medpix_dataset
  path_or_dataset: mmoukouba/MedPix-VQA
  split: train
packed_sequence:
  packed_sequence_size: 0
dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  num_workers: 1
  pin_memory: true
  shuffle: true
  drop_last: true
  collate_fn:
    _target_: nemo_automodel.components.datasets.vlm.collate_fns.default_collate_fn
    max_length: 4097
validation_dataset: null
validation_dataloader: null
optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-05
  weight_decay: 0.01
  betas:
  - 0.9
  - 0.95
  eps: 1.0e-08
  fused: true
wandb:
  enable: false
clip_grad_norm:
  max_norm: 1.0
prewarm:
  comm_groups: true
  cublas_backward: true
processor:
  _target_: nemo_automodel.components.models.kimi_k3.processing.KimiK3Processor.from_pretrained
  pretrained_model_name_or_path: moonshotai/Kimi-K3.1-Pro
  revision: 6d0a0202956796543364d666ab19c6ad1a494ee1  # pragma: allowlist secret (public model commit SHA)
freeze_config:
  freeze_vision_tower: false
  freeze_language_model: false
ci:
  nemo_ci_schedule: release
  recipe_owner: huiyingl
  nodes: 64
  cluster_tag: gb200
  time: 01:30:00
  env_vars:
    SBATCH_SEGMENT_SIZE: '8'
    FLA_DISABLE_TENSOR_CACHE: '1'
