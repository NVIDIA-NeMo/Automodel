# Two-node target for packed MuseGlimmer TP2 + TE CP8 parity. The required world size
# is TP2 * CP8 = 16 GPUs. TP2 shards every language attention projection while
# TE p2p context parallelism distributes each 4096-token THD pack.

recipe: FinetuneRecipeForVLM
seed: 1234

step_scheduler:
  global_batch_size: 8
  local_batch_size: 1
  ckpt_every_steps: 1000
  val_every_steps: 1000
  log_remote_every_steps: 1
  gc_every_steps: 5
  num_epochs: 1
  max_steps: 100

dist_env:
  backend: nccl
  timeout_minutes: 30

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 1234
  ranked: true

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: meta-models/Muse-Glimmer-30B
  torch_dtype: bfloat16
  # HF config validation remains on SDPA; native language attention is selected below.
  attn_implementation: sdpa
  backend:
    attn: te
  use_liger_kernel: false

processor:
  _target_: transformers.AutoProcessor.from_pretrained
  pretrained_model_name_or_path: meta-models/Muse-Glimmer-30B
  trust_remote_code: true

checkpoint:
  enabled: false
  checkpoint_dir: checkpoints/muse_glimmer_30b_medpix_te_tp2_cp8/
  model_save_format: safetensors
  save_consolidated: false

distributed:
  strategy: fsdp2
  dp_size: none
  tp_size: 2
  cp_size: 8
  pp_size: 1
  ep_size: 1
  sequence_parallel: false
  activation_checkpointing: true
  # CP8 accumulates eight microbatches at global batch 8. Reduce-scatter after
  # each microbatch to avoid holding full gradients throughout accumulation.
  defer_fsdp_grad_sync: false

freeze_config:
  freeze_vision_tower: true
  freeze_audio_tower: true
  freeze_language_model: false

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy

dataset:
  _target_: nemo_automodel.components.datasets.vlm.datasets.make_medpix_dataset
  path_or_dataset: mmoukouba/MedPix-VQA
  split: train

packed_sequence:
  pretokenize: true
  # Individual documents stay within MuseGlimmer's native sliding window. Multiple
  # real MedPix documents are packed together into each 4096-token THD stream.
  max_length: 2048
  pack_size: 4096
  collate_max_length: 4096
  packing_ratio: 0.9
  drop_long_samples: true
  balance_media_tokens: true
  packing_format: thd

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  num_workers: 0
  drop_last: true

# Parity measures exactly 100 optimizer steps without a trailing validation
# epoch changing the run lifetime or W&B finalization point.
validation_dataset: none
validation_dataloader: none

optimizer:
  _target_: torch.optim.AdamW
  betas: [0.9, 0.95]
  eps: 1e-8
  lr: 5.0e-6
  weight_decay: 0.1

lr_scheduler:
  lr_decay_style: constant

wandb:
  enable: false
  project: automodel-muse-glimmer
  entity: <your_wandb_entity>
  name: muse_glimmer_30b_medpix_packed4k_te_tp2_cp8_100step_parity
  group: muse_glimmer_30b_medpix_packed4k_te_tp2_cp1_cp8_100step_parity
  tags: [muse_glimmer, 30b, dense, vlm, medpix, packed4k, thd, te, tp2, cp8, parity]
  dir: logs/muse_glimmer_30b_medpix_te_tp2_cp8/wandb

ci:
  recipe_owner: HuiyingLi
  nodes: 2
  time: "02:00:00"
  max_steps: 5
