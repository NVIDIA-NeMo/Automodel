# Configuration for fine-tuning Qwen2.5-VL-3B on the Shopify product-catalogue
# dataset: predict a product's taxonomy category from its photo.

# To run this recipe:
#   automodel examples/vlm_finetune/qwen2_5/qwen2_5_vl_3b_shopify.yaml --nproc-per-node 8
# Adjust --nproc-per-node to the number of GPUs available on your machine.

recipe: FinetuneRecipeForVLM

step_scheduler:
  global_batch_size: 8
  local_batch_size: 1
  ckpt_every_steps: 200
  val_every_steps: 200  # will run every x number of gradient steps
  num_epochs: 1

dist_env:
  backend: nccl
  timeout_minutes: 10

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 42
  ranked: true

model:
  _target_: nemo_automodel.NeMoAutoModelForImageTextToText.from_pretrained
  pretrained_model_name_or_path: Qwen/Qwen2.5-VL-3B-Instruct
  attn_implementation: sdpa

processor:
  _target_: transformers.AutoProcessor.from_pretrained
  pretrained_model_name_or_path: Qwen/Qwen2.5-VL-3B-Instruct
  # Product photos are full resolution (up to 2084x2084); max_pixels bounds the
  # visual token count so sequences stay within budget.
  min_pixels: 200704  # 256*28*28
  max_pixels: 1003520  # 1280*28*28

checkpoint:
  enabled: true
  checkpoint_dir: checkpoints/
  model_save_format: safetensors

distributed:
  strategy: fsdp2
  dp_size: none
  tp_size: 1
  cp_size: 1
  sequence_parallel: false

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy

dataset:
  _target_: nemo_automodel.components.datasets.vlm.datasets.make_shopify_product_catalogue_dataset
  path_or_dataset: Shopify/product-catalogue
  split: train

validation_dataset:
  _target_: nemo_automodel.components.datasets.vlm.datasets.make_shopify_product_catalogue_dataset
  path_or_dataset: Shopify/product-catalogue
  split: test
  # The full test split is 9,658 rows; cap it so validation does not dominate.
  limit_dataset_samples: 500

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  num_workers: 4
  pin_memory: true
  collate_fn:
    _target_: nemo_automodel.components.datasets.vlm.collate_fns.qwen2_5_collate_fn

validation_dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  num_workers: 2
  pin_memory: true
  collate_fn:
    _target_: nemo_automodel.components.datasets.vlm.collate_fns.qwen2_5_collate_fn

optimizer:
  _target_: torch.optim.AdamW
  lr: 1e-5
  weight_decay: 0.01
  betas: [0.9, 0.95]

lr_scheduler:
  lr_warmup_steps: 100
  lr_decay_style: cosine

freeze_config:
  freeze_vision_tower: true
  freeze_language_model: false

# Uncomment and configure for W&B logging
# wandb:
#   project:
#   entity:
#   name:
#   save_dir:

ci:
  recipe_owner: HuiyingLi
  nodes: 1
  time: "00:30:00"
