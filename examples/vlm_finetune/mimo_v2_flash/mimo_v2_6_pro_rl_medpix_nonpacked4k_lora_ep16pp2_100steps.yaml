# Attention and routed-expert LoRA for MiMo-V2.6-Pro-RL on real MedPix-VQA.
# Non-packed 4096-token inputs, 100 steps, LBS2 / GBS32 / GA1; LoRA rank 8 / alpha 32.
# Hardware target: 8 nodes x 4 GB200 GPUs, EP16 / PP2 / CP1 / TP1.
# Allocate all 8 nodes in one NVLink domain (HSG: --segment=8).
# Validated for 100 steps on 32 GB200 GPUs: loss 2.2387 -> 1.3835.
# Peak across all ranks: 133.23 GiB allocated during training, 141.74 GiB including setup.
# The current grouped-expert LoRA wrapper stores frozen expert weights in FP32.

recipe: FinetuneRecipeForVLM

seed: 1234

step_scheduler:
  global_batch_size: 32
  local_batch_size: 2
  ckpt_every_steps: 1000
  save_checkpoint_every_epoch: false
  val_every_steps: 1000
  log_remote_every_steps: 1
  gc_every_steps: 5
  num_epochs: 100
  max_steps: 100

dist_env:
  backend: nccl
  timeout_minutes: 120

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 1234
  ranked: true
  deterministic: true

model:
  _target_: nemo_automodel.NeMoAutoModelForImageTextToText.from_config
  config:
    _target_: nemo_automodel.components.models.mimo_v2_flash.config.MiMoV2Config.from_pretrained
    pretrained_model_name_or_path: XiaomiMiMo/MiMo-V2.6-Pro-RL
    name_or_path: XiaomiMiMo/MiMo-V2.6-Pro-RL
    use_cache: false
    output_hidden_states: true
    num_nextn_predict_layers: 0
    # Fused QKV storage layout; independent of runtime TP.
    checkpoint_tp_size: 8
  trust_remote_code: false
  load_base_model: true
  torch_dtype: bfloat16
  use_liger_kernel: false
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: te
    linear: te
    rms_norm: te
    experts: torch_mm
    dispatcher: hybridep
    rope_fusion: false
    gate_precision: float32
    fake_balanced_gate: false
    enable_hf_state_dict_adapter: true
    enable_fsdp_optimizations: true
  use_sdpa_patching: false

peft:
  _target_: nemo_automodel.components._peft.lora.PeftConfig
  target_modules:
    - "model.layers.*.self_attn.q_proj"
    - "model.layers.*.self_attn.k_proj"
    - "model.layers.*.self_attn.v_proj"
    - "model.layers.*.self_attn.o_proj"
    - "model.layers.*.mlp.experts"
  dim: 8
  alpha: 32
  dropout: 0.0
  use_memory_efficient_lora: true
  use_triton: false
  moe_rank_scaling: false

processor:
  _target_: transformers.AutoProcessor.from_pretrained
  pretrained_model_name_or_path: XiaomiMiMo/MiMo-V2.6-Pro-RL
  trust_remote_code: false
  max_pixels: 1048576

checkpoint:
  enabled: false
  checkpoint_dir: checkpoints/mimo_v2_6_pro_rl_medpix_nonpacked4k_lora_ep16pp2_100steps
  model_save_format: safetensors
  save_consolidated: false
  dequantize_base_checkpoint: true

distributed:
  strategy: fsdp2
  tp_size: 1
  cp_size: 1
  pp_size: 2
  ep_size: 16
  sequence_parallel: false
  activation_checkpointing: true
  reshard_after_forward: true
  defer_fsdp_grad_sync: false
  moe:
    reshard_after_forward: true
    wrap_outer_model: true
    ignore_router_for_ac: true
  pipeline:
    pp_schedule: 1f1b
    pp_microbatch_size: 1
    layers_per_stage: 35
    scale_grads_in_schedule: false

freeze_config:
  freeze_vision_tower: true
  freeze_audio_tower: true
  freeze_language_model: false

loss_fn:
  _target_: nemo_automodel.components.loss.linear_ce.FusedLinearCrossEntropy

dataset:
  _target_: nemo_automodel.components.datasets.vlm.datasets.make_medpix_dataset
  path_or_dataset: mmoukouba/MedPix-VQA
  split: train

packed_sequence:
  packed_sequence_size: 0

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  num_workers: 2
  persistent_workers: true
  pin_memory: true
  shuffle: false
  drop_last: true
  collate_fn:
    _target_: nemo_automodel.components.datasets.vlm.collate_fns.default_collate_fn
    max_length: 4097

validation_dataset: none

validation_dataloader: none

optimizer:
  _target_: transformer_engine.pytorch.optimizers.fused_adam.FusedAdam
  betas: [0.9, 0.95]
  eps: 1.0e-08
  lr: 1.0e-05
  weight_decay: 0.1
  master_weights: true
  master_weight_dtype: torch.float32
  exp_avg_dtype: torch.bfloat16
  exp_avg_sq_dtype: torch.bfloat16
  adam_w_mode: true
  store_param_remainders: false

lr_scheduler:
  lr_decay_style: constant

clip_grad_norm:
  max_norm: 1.0
  backend: te

ci:
  recipe_owner: huiyingl
  nodes: 8
  nproc_per_node: 4
  cluster_tag: gb200
  time: "01:00:00"
  max_steps: 5

