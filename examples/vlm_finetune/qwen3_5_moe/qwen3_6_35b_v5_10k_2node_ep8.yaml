# qwen3_6_35b_v4_88k_2node_ep8.yaml with only these changes:
#   - data: a 10k-row uniform random subset of v5_130k (sample_v5_10k.py, seed 1234) for
#     training, the full v5_130k val split for validation;
#   - sampler: random shuffling instead of length-grouped batching;
#   - num_epochs 3, and its own checkpoint_dir so it cannot auto-resume from (or into) the
#     v4 run's LATEST;
#   - the v5_130k run's WSD lr schedule (rescaled to 3 epochs) and its W&B project.
#
# Launch from node-2 (NODE_IPS ranks 0 and 1 are node-2 and node-3):
#   NNODES=2 RUN_NAME=v5_10k CONFIG=examples/vlm_finetune/qwen3_5_moe/qwen3_6_35b_v5_10k_2node_ep8.yaml \
#     bash examples/vlm_finetune/qwen3_5_moe/launch_4node_v5_130k.sh

recipe: FinetuneRecipeForVLM

seed: 1234

step_scheduler:
  # dp_size = world(16) / (tp 1 * cp 1 * pp 1) = 16, so
  #   grad_accum = global_batch_size / (local_batch_size * dp_size) = 64 / (4 * 16) = 1.
  # global_batch_size must be a multiple of local_batch_size * 16 (step_scheduler.py).
  # 10,000 train rows / 16 ranks = 625 => 156 optimizer steps per epoch, 468 over 3 epochs.
  global_batch_size: 64
  # Measured over 100 length-grouped steps: 123.7 GiB nvidia-smi peak (88%), 106 GiB torch
  # peak on a 4 x 40k-token chunk. lbs 8 OOMs even at EP16. Fallback if memory becomes a
  # problem: lbs 2 / global_batch_size 32 (77 GiB peak, 4.9 samples/s).
  local_batch_size: 4
  num_epochs: 3
  ckpt_every_steps: 200
  val_every_steps: 100
  log_remote_every_steps: 1
  save_checkpoint_every_epoch: false
  validate_on_checkpoint: true

dist_env:
  backend: nccl
  # The first step pays DeepEP/NVSHMEM buffer allocation across both nodes and FLA autotuning.
  timeout_minutes: 120

model:
  _target_: nemo_automodel.NeMoAutoModelForImageTextToText.from_pretrained
  pretrained_model_name_or_path: Qwen/Qwen3.6-35B-A3B
  torch_dtype: torch.bfloat16
  text_config:
    # Keep MTP: disabling it drops the 19 mtp.* tensors from the export.
    num_nextn_predict_layers: 1
    output_hidden_states: true
    use_cache: false
  mtp_loss_scaling_factor: 0.1
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: te
    linear: te
    rms_norm: torch_fp32
    rope_fusion: false
    experts: te
    dispatcher: deepep
    fake_balanced_gate: false
    enable_hf_state_dict_adapter: true
    enable_fsdp_optimizations: true

processor:
  _target_: transformers.AutoProcessor.from_pretrained
  pretrained_model_name_or_path: Qwen/Qwen3.6-35B-A3B
  padding_side: right

checkpoint:
  enabled: true
  checkpoint_dir: checkpoints/qwen3_6_35b_v5_10k_2node_ep8_lr5e-5/
  model_save_format: safetensors
  save_consolidated: final
  max_recent_checkpoints: 3
  # restore_from: checkpoints/qwen3_6_35b_v5_10k_2node_ep8_lr5e-5/epoch_1_step_200

distributed:
  strategy: fsdp2
  dp_size: none
  dp_replicate_size: 1
  tp_size: 1
  cp_size: 1
  pp_size: 1
  # 256 routed experts % 8 == 0 (32 experts per GPU), and dp_size(16) * cp_size(1) % 8 == 0.
  # The MoE mesh is (ep_shard=2, ep=8): each expert is FSDP-sharded across its two
  # replicas (one per node) and its gradient is reduced across nodes every step.
  ep_size: 8
  sequence_parallel: false
  # Full recomputation; `selective` OOMs at lbs 4 on EP8 (see the EP8 file).
  activation_checkpointing: true
  defer_fsdp_grad_sync: false
  multimodal:
    frozen_sharding: per_layer
  moe:
    # MUST be true on this topology. At ep_size 8 on 16 GPUs the experts are FSDP-sharded
    # over the 2-way ep_shard mesh, and FSDP2 only reshards in the post-backward hook, so
    # a forward-only pass (validation) leaves the expert parameters unsharded. The
    # checkpoint that follows (validate_on_checkpoint) then calls DCP's
    # get_optimizer_state_dict, which maps optimizer params to model params by identity
    # and fails with `KeyError: 11` (the first expert weight); the model shards are
    # written but the optimizer is not. Measured: with false, the step-200 save of a
    # 350-step run died this way; with true, saves after validation complete (80 GB in
    # ~40 s, optimizer shards present). The single-node recipe keeps false because at
    # ep_size == world_size the experts are not FSDP-wrapped at all.
    reshard_after_forward: true
    wrap_outer_model: true
    ignore_router_for_ac: true

freeze_config:
  freeze_vision_tower: true
  freeze_audio_tower: true
  freeze_language_model: false

loss_fn:
  _target_: nemo_automodel.components.loss.linear_ce.FusedLinearCrossEntropy

dataset:
  _target_: examples/vlm_finetune/qwen3_5_moe/v4_88k.py:make_v4_88k_dataset
  path_or_dataset: data/v5_10k/train.parquet

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  drop_last: true
  # Random order: no length_grouped_sampler, so the loader shuffles per epoch.
  shuffle: true
  collate_fn:
    # Final-assistant-turn supervision; deliberately no max_length (see the EP8 file).
    _target_: examples/vlm_finetune/qwen3_5_moe/v4_88k.py:last_turn_collate_fn

validation_dataset:
  _target_: examples/vlm_finetune/qwen3_5_moe/v4_88k.py:make_v4_88k_dataset
  path_or_dataset: data/v5_130k_filtered/val.parquet

validation_dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  num_workers: 2
  pin_memory: true
  drop_last: true
  shuffle: false
  collate_fn:
    _target_: examples/vlm_finetune/qwen3_5_moe/v4_88k.py:last_turn_collate_fn

optimizer:
  # torchao 8-bit AdamW, as in the EP8 recipe. Needs torchao 0.14.x (the version the
  # 8xH200 sweep ran on): the 0.17.0 shipped in nemo-automodel:26.08.00 fails on FSDP2
  # DTensor params ("OptimState8bit dispatch: unimplemented aten.view(dtype)" from its
  # inline torch.compile). The deepep564 image pins torchao==0.14.0 for this reason.
  _target_: torchao.optim.AdamW8bit
  lr: 5.0e-5
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.1

lr_scheduler:
  # The v5_130k (run 5) schedule, rescaled to 468 steps: warmup -> stable for epochs 1-2 ->
  # cosine decay to min_lr across epoch 3. lr_decay_steps defaults to total_steps (468),
  # so the WSD anneal begins at 468 - 156 = 312, the start of the 3rd epoch.
  lr_warmup_steps: 50
  lr_decay_style: WSD
  wsd_decay_steps: 156
  lr_wsd_decay_style: cosine
  # 10x run 5's 5e-6 / 5e-8. The first 5e-6 attempt was stopped at step 68.
  max_lr: 5.0e-5
  min_lr: 5.0e-7

clip_grad_norm:
  max_norm: 1.0

prewarm:
  cublas_backward: true
  fla_gdn_autotune: true
  comm_groups: true

moe_metrics:
  enabled: true

# Same W&B project as the v5_130k run.
wandb:
  project: qwen3_6_35b_v5_130k
  name: v5_10k_2node_ep8_3ep_wsd_random_lr5e-5
  dir: logs/wandb
