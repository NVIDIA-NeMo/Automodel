# Four-node production run: 4 x 8 x H200 (GCP a3-ultragpu-8g), FSDP2 over all 32 GPUs +
# EP8 + DeepEP, length-grouped batching, 5 epochs on vuhaian/v5_130k with a WSD schedule.
#
# Derived from qwen3_6_35b_v4_88k_2node_ep8.yaml; read MULTINODE_2xH200_v4_88k.md for the
# node setup, the patched image (DeepEP PR #564, torchao 0.14) and why every knob below
# that is not listed here is set the way it is. Only the corpus, the batch shape, the
# schedule, the node count and the checkpoint cadence differ from that file.
#
# ep_size 8 keeps every expert reachable within a node, so DeepEP's all-to-all stays on
# NVLink; data parallelism, dense-parameter sharding and expert-gradient reduction span
# all four nodes. The MoE mesh is (ep_shard=4, ep=8).
#
# Requires the nemo-automodel:26.08.00-deepep564 image and one launch_2node_v4_88k.sh per
# node with NNODES=4. checkpoint_dir and the dataset paths are relative to the repo root,
# which must be on a filesystem all four nodes share: DCP writes each rank's shards
# locally and rank 0 consolidates by reading all of them.
#
# Corpus note (vuhaian/v5_130k vs v4_88k): v5 carries `reasoning_content`, so the chat
# template renders the final assistant turn as `<think>\n` + reasoning + `</think>\n\n` +
# content. Only the `<think>\n` opening tag is masked, so the reasoning IS supervised and
# the model is trained for thinking-ENABLED inference -- the opposite of the v4 run. This
# is the semantics change predicted in RUNBOOK_v4_88k.md section 5; rung 2 passes 64/64.
# v5 rows are also much shorter: mean 4,664 tokens vs 11,700 (p50 3,349 vs 8,802), so an
# epoch is 0.600B processed tokens against v4's 1.015B.

recipe: FinetuneRecipeForVLM

seed: 1234

step_scheduler:
  # dp_size = world(32) / (tp 1 * cp 1 * pp 1) = 32, so
  #   grad_accum = global_batch_size / (local_batch_size * dp_size) = 128 / (4 * 32) = 1.
  # global_batch_size must be a multiple of local_batch_size * 32 (step_scheduler.py).
  global_batch_size: 128
  # 128,575 train rows; the length-grouped sampler shards interleaved and drops the tail,
  # leaving 4,016 samples / 1,004 micro-batches per rank per epoch, so with grad_accum 1
  #   epoch_len = 1,004 optimizer steps and 5 epochs = 5,020 steps -- the same totals as
  # the lbs 2 x accum 2 shape this replaced, so the WSD and checkpoint cadences are unchanged.
  #
  # lbs 4 is the faster shape (2.08x over lbs 2 at matched batch on EP8) but it is the one
  # SWEEP_8xH200_v4_88k.md sections 4 and 7 flag as unverified WITH checkpointing live: with
  # length grouping the worst-case batch is certain rather than rare, 4 x 40,925 = 163,700
  # padded tokens per rank, which measured 139.5 GiB (99.4%) on 8 GPUs and 123.7 GiB (88%)
  # on 16. At 32-way sharding the fixed per-GPU cost (params + grads + 8-bit moments) is
  # half the 16-GPU figure again, and moe.reshard_after_forward below took the 16-GPU peak
  # from 124 to 113 GiB, so the expectation is ~105-115 GiB. Watch the nvidia-smi trace
  # across the first step-251 save, which gathers a state dict while the training peak is
  # still resident -- that specific coincidence has never been observed at this occupancy.
  local_batch_size: 4
  num_epochs: 5
  # 25% of one epoch (1,004 / 4). validate_on_checkpoint makes each save a val point too.
  ckpt_every_steps: 251
  val_every_steps: 251
  log_remote_every_steps: 1
  save_checkpoint_every_epoch: false
  validate_on_checkpoint: true

dist_env:
  backend: nccl
  # The first step pays DeepEP/NVSHMEM buffer allocation across all four nodes and FLA autotuning.
  timeout_minutes: 120

model:
  _target_: nemo_automodel.NeMoAutoModelForImageTextToText.from_pretrained
  pretrained_model_name_or_path: Qwen/Qwen3.6-35B-A3B
  torch_dtype: torch.bfloat16
  text_config:
    # Keep MTP: disabling it drops the 19 mtp.* tensors from the export.
    num_nextn_predict_layers: 1
    output_hidden_states: true
    use_cache: false
  mtp_loss_scaling_factor: 0.1
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: te
    linear: te
    rms_norm: torch_fp32
    rope_fusion: false
    experts: te
    dispatcher: deepep
    fake_balanced_gate: false
    enable_hf_state_dict_adapter: true
    enable_fsdp_optimizations: true

processor:
  _target_: transformers.AutoProcessor.from_pretrained
  pretrained_model_name_or_path: Qwen/Qwen3.6-35B-A3B
  padding_side: right

checkpoint:
  enabled: true
  checkpoint_dir: checkpoints/qwen3_6_35b_v5_130k_4node_ep8/
  model_save_format: safetensors
  save_consolidated: final
  # Each sharded save is ~80 GB, so two rolling copies plus LOWEST_VAL is ~240 GB.
  max_recent_checkpoints: 2
  # restore_from: checkpoints/qwen3_6_35b_v5_130k_4node_ep8/epoch_0_step_251

distributed:
  strategy: fsdp2
  dp_size: none
  dp_replicate_size: 1
  tp_size: 1
  cp_size: 1
  pp_size: 1
  # 256 routed experts % 8 == 0 (32 experts per GPU), and dp_size(32) * cp_size(1) % 8 == 0.
  # The MoE mesh is (ep_shard=4, ep=8): each expert is FSDP-sharded across its four
  # replicas (one per node) and its gradient is reduced across nodes every step.
  ep_size: 8
  sequence_parallel: false
  # Full recomputation; `selective` OOMs at lbs 4 on EP8 (see the EP8 file).
  activation_checkpointing: true
  defer_fsdp_grad_sync: false
  multimodal:
    frozen_sharding: per_layer
  moe:
    # MUST be true on this topology. At ep_size 8 on more than 8 GPUs the experts are
    # FSDP-sharded over the ep_shard mesh, and FSDP2 only reshards in the post-backward
    # hook, so a forward-only pass (validation) leaves the expert parameters unsharded.
    # The checkpoint that follows (validate_on_checkpoint) then calls DCP's
    # get_optimizer_state_dict, which maps optimizer params to model params by identity
    # and fails with `KeyError: 11` (the first expert weight); the model shards are
    # written but the optimizer is not. Measured on 2 nodes: with false, the step-200 save
    # of a 350-step run died this way; with true, saves after validation complete.
    reshard_after_forward: true
    wrap_outer_model: true
    ignore_router_for_ac: true

freeze_config:
  freeze_vision_tower: true
  freeze_audio_tower: true
  freeze_language_model: false

loss_fn:
  _target_: nemo_automodel.components.loss.linear_ce.FusedLinearCrossEntropy

dataset:
  _target_: examples/vlm_finetune/qwen3_5_moe/v4_88k.py:make_v4_88k_dataset
  path_or_dataset: data/v5_130k_filtered/train.parquet

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  drop_last: true
  shuffle: true
  # 1.70x faster at lbs 2 on EP8; see SWEEP_8xH200_v4_88k.md section 4. It supersedes
  # `shuffle` with a per-epoch chunk shuffle and places the longest rows together by
  # construction, so the worst-case batch is certain rather than rare.
  length_grouped_sampler:
    seed: 1234
    length_key: n_tokens
  collate_fn:
    # Final-assistant-turn supervision; deliberately no max_length (see the EP8 file).
    _target_: examples/vlm_finetune/qwen3_5_moe/v4_88k.py:last_turn_collate_fn

validation_dataset:
  _target_: examples/vlm_finetune/qwen3_5_moe/v4_88k.py:make_v4_88k_dataset
  path_or_dataset: data/v5_130k_filtered/val.parquet

validation_dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  num_workers: 2
  pin_memory: true
  drop_last: true
  shuffle: false
  collate_fn:
    _target_: examples/vlm_finetune/qwen3_5_moe/v4_88k.py:last_turn_collate_fn

optimizer:
  # torchao 8-bit AdamW. Needs torchao 0.14.x; the 0.17.0 shipped in
  # nemo-automodel:26.08.00 fails on FSDP2 DTensor params, so the deepep564 image pins it.
  _target_: torchao.optim.AdamW8bit
  lr: 5.0e-6
  betas: [0.9, 0.95]
  eps: 1.0e-8
  # The scheduler's start_wd/end_wd default to this value with wd_incr_style `constant`,
  # so weight decay is held at 0.01 for the whole run.
  weight_decay: 0.01

lr_scheduler:
  lr_warmup_steps: 50
  # Warmup -> stable at max_lr for epochs 1-4 -> cosine decay to min_lr across epoch 5.
  # lr_decay_steps defaults to total_steps (5,020); the WSD anneal therefore begins at
  # total_steps - wsd_decay_steps = 4,016, which is exactly the start of the 5th epoch.
  lr_decay_style: WSD
  wsd_decay_steps: 1004
  lr_wsd_decay_style: cosine
  max_lr: 5.0e-6
  min_lr: 5.0e-8

clip_grad_norm:
  max_norm: 1.0

prewarm:
  cublas_backward: true
  fla_gdn_autotune: true
  comm_groups: true

moe_metrics:
  enabled: true

wandb:
  project: qwen3_6_35b_v5_130k
  name: v5_130k_4node_ep8_5ep_wsd
  dir: logs/wandb
