# Two-node recipe: 2 x 8 x H200 (GCP a3-ultragpu-8g), FSDP2 over all 16 GPUs + EP8 +
# DeepEP, length-grouped batching. This is the measured-best configuration of the 2-node
# sweep in MULTINODE_2xH200_v4_88k.md: 7.1 s/step (9.0 samples/s, 2.3x the single-node
# recipe), 124 GiB nvidia-smi peak. Only parallelism, batch shape, batching order and
# paths differ from qwen3_6_35b_v4_88k_ep8.yaml; see that file and SWEEP_8xH200_v4_88k.md
# for why every other knob is set the way it is.
#
# ep_size 8 keeps every expert reachable within a node, so DeepEP's all-to-all stays on
# NVLink; data parallelism, dense-parameter sharding and expert-gradient reduction still
# span both nodes. ep_size 16 (qwen3_6_35b_v4_88k_ep16_2node.yaml) sends half of every
# dispatch over RoCE and measured 4.3 samples/s at 95% memory.
#
# Requires the nemo-automodel:26.08.00-deepep564 image (deepep564/Dockerfile) and
# launch_2node_v4_88k.sh, one launch per node. checkpoint_dir and the dataset paths are
# relative to the repo root, which must be on a filesystem both nodes share: DCP writes
# each rank's shards locally and consolidation reads all of them from rank 0.

recipe: FinetuneRecipeForVLM

seed: 1234

step_scheduler:
  # dp_size = world(16) / (tp 1 * cp 1 * pp 1) = 16, so
  #   grad_accum = global_batch_size / (local_batch_size * dp_size) = 64 / (4 * 16) = 1.
  # global_batch_size must be a multiple of local_batch_size * 16 (step_scheduler.py).
  # 86,767 train rows => ~1,355 optimizer steps per epoch.
  global_batch_size: 64
  # Measured over 100 length-grouped steps: 123.7 GiB nvidia-smi peak (88%), 106 GiB torch
  # peak on a 4 x 40k-token chunk. lbs 8 OOMs even at EP16. A checkpoint save at this
  # occupancy has not been exercised yet; if it OOMs, set moe.reshard_after_forward: true
  # or drop to lbs 2 / global_batch_size 32 (77 GiB peak, 4.9 samples/s).
  local_batch_size: 4
  num_epochs: 2
  ckpt_every_steps: 200
  val_every_steps: 100
  log_remote_every_steps: 1
  save_checkpoint_every_epoch: false
  validate_on_checkpoint: true

dist_env:
  backend: nccl
  # The first step pays DeepEP/NVSHMEM buffer allocation across both nodes and FLA autotuning.
  timeout_minutes: 120

model:
  _target_: nemo_automodel.NeMoAutoModelForImageTextToText.from_pretrained
  pretrained_model_name_or_path: Qwen/Qwen3.6-35B-A3B
  torch_dtype: torch.bfloat16
  text_config:
    # Keep MTP: disabling it drops the 19 mtp.* tensors from the export.
    num_nextn_predict_layers: 1
    output_hidden_states: true
    use_cache: false
  mtp_loss_scaling_factor: 0.1
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: te
    linear: te
    rms_norm: torch_fp32
    rope_fusion: false
    experts: te
    dispatcher: deepep
    fake_balanced_gate: false
    enable_hf_state_dict_adapter: true
    enable_fsdp_optimizations: true

processor:
  _target_: transformers.AutoProcessor.from_pretrained
  pretrained_model_name_or_path: Qwen/Qwen3.6-35B-A3B
  padding_side: right

checkpoint:
  enabled: true
  checkpoint_dir: checkpoints/qwen3_6_35b_v4_88k_2node_ep8/
  model_save_format: safetensors
  save_consolidated: final
  max_recent_checkpoints: 3
  # restore_from: checkpoints/qwen3_6_35b_v4_88k_2node_ep8/epoch_0_step_200

distributed:
  strategy: fsdp2
  dp_size: none
  dp_replicate_size: 1
  tp_size: 1
  cp_size: 1
  pp_size: 1
  # 256 routed experts % 8 == 0 (32 experts per GPU), and dp_size(16) * cp_size(1) % 8 == 0.
  # The MoE mesh is (ep_shard=2, ep=8): each expert is FSDP-sharded across its two
  # replicas (one per node) and its gradient is reduced across nodes every step.
  ep_size: 8
  sequence_parallel: false
  # Full recomputation; `selective` OOMs at lbs 4 on EP8 (see the EP8 file).
  activation_checkpointing: true
  defer_fsdp_grad_sync: false
  multimodal:
    frozen_sharding: per_layer
  moe:
    reshard_after_forward: false
    wrap_outer_model: true
    ignore_router_for_ac: true

freeze_config:
  freeze_vision_tower: true
  freeze_audio_tower: true
  freeze_language_model: false

loss_fn:
  _target_: nemo_automodel.components.loss.linear_ce.FusedLinearCrossEntropy

dataset:
  _target_: examples/vlm_finetune/qwen3_5_moe/v4_88k.py:make_v4_88k_dataset
  path_or_dataset: data/v4_88k_filtered/train.parquet

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  drop_last: true
  shuffle: true
  # Enabled here (off in the EP8 recipe). On EP8 it was 1.70x faster at lbs 2 and 2.08x
  # at lbs 4, with validation ~2% worse over 50 steps; see SWEEP_8xH200_v4_88k.md §4.
  # It supersedes `shuffle` with a per-epoch chunk shuffle and places the longest rows
  # together by construction.
  length_grouped_sampler:
    seed: 1234
    length_key: n_tokens
  collate_fn:
    # Final-assistant-turn supervision; deliberately no max_length (see the EP8 file).
    _target_: examples/vlm_finetune/qwen3_5_moe/v4_88k.py:last_turn_collate_fn

validation_dataset:
  _target_: examples/vlm_finetune/qwen3_5_moe/v4_88k.py:make_v4_88k_dataset
  path_or_dataset: data/v4_88k_filtered/val.parquet

validation_dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  num_workers: 2
  pin_memory: true
  drop_last: true
  shuffle: false
  collate_fn:
    _target_: examples/vlm_finetune/qwen3_5_moe/v4_88k.py:last_turn_collate_fn

optimizer:
  # torchao 8-bit AdamW, as in the EP8 recipe. Needs torchao 0.14.x (the version the
  # 8xH200 sweep ran on): the 0.17.0 shipped in nemo-automodel:26.08.00 fails on FSDP2
  # DTensor params ("OptimState8bit dispatch: unimplemented aten.view(dtype)" from its
  # inline torch.compile). The deepep564 image pins torchao==0.14.0 for this reason.
  _target_: torchao.optim.AdamW8bit
  lr: 5.0e-6
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.1

lr_scheduler:
  lr_warmup_steps: 50
  lr_decay_style: cosine
  # Halved from the single-node recipe's 1.0e-5: clip_grad_norm fired on every step of
  # every 100-step run (grad_norm 1.6-12), so the clip, not the schedule, was setting the
  # effective step size. Not A/B-tested; see MULTINODE_2xH200_v4_88k.md.
  max_lr: 5.0e-6
  min_lr: 5.0e-7

clip_grad_norm:
  max_norm: 1.0

prewarm:
  cublas_backward: true
  fla_gdn_autotune: true
  comm_groups: true

moe_metrics:
  enabled: true

