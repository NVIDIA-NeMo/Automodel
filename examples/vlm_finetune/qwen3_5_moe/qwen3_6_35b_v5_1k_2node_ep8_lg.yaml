# qwen3_6_35b_v5_1k_2node_ep8.yaml (1k rows, 5 epochs, lr 5e-5) with length-grouped batching
# instead of random order -- the only change, apart from the W&B name and checkpoint_dir.
#
# Launch from node-2 (NODE_IPS ranks 0 and 1 are node-2 and node-3):
#   NNODES=2 RUN_NAME=v5_1k_lg CONFIG=examples/vlm_finetune/qwen3_5_moe/qwen3_6_35b_v5_1k_2node_ep8_lg.yaml \
#     bash examples/vlm_finetune/qwen3_5_moe/launch_4node_v5_130k.sh

recipe: FinetuneRecipeForVLM

seed: 1234

step_scheduler:
  # dp_size = world(16) / (tp 1 * cp 1 * pp 1) = 16, so
  #   grad_accum = global_batch_size / (local_batch_size * dp_size) = 64 / (4 * 16) = 1.
  # 1,000 train rows / 16 ranks => 15 optimizer steps per epoch, 75 over 5 epochs.
  global_batch_size: 64
  # With length grouping the worst-case batch (4 x ~39k tokens) is certain rather than rare;
  # measured 123.7 GiB nvidia-smi peak (88%) at this shape on 16 GPUs.
  local_batch_size: 4
  num_epochs: 5
  # Validate every epoch; checkpoint every 2 epochs (plus the final consolidated save).
  ckpt_every_steps: 30
  val_every_steps: 15
  log_remote_every_steps: 1
  save_checkpoint_every_epoch: false
  validate_on_checkpoint: true

dist_env:
  backend: nccl
  timeout_minutes: 120

model:
  _target_: nemo_automodel.NeMoAutoModelForImageTextToText.from_pretrained
  pretrained_model_name_or_path: Qwen/Qwen3.6-35B-A3B
  torch_dtype: torch.bfloat16
  text_config:
    # Keep MTP: disabling it drops the 19 mtp.* tensors from the export.
    num_nextn_predict_layers: 1
    output_hidden_states: true
    use_cache: false
  mtp_loss_scaling_factor: 0.1
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: te
    linear: te
    rms_norm: torch_fp32
    rope_fusion: false
    experts: te
    dispatcher: deepep
    fake_balanced_gate: false
    enable_hf_state_dict_adapter: true
    enable_fsdp_optimizations: true

processor:
  _target_: transformers.AutoProcessor.from_pretrained
  pretrained_model_name_or_path: Qwen/Qwen3.6-35B-A3B
  padding_side: right

checkpoint:
  enabled: true
  checkpoint_dir: checkpoints/qwen3_6_35b_v5_1k_2node_ep8_lg_lr5e-5/
  model_save_format: safetensors
  save_consolidated: final
  max_recent_checkpoints: 3

distributed:
  strategy: fsdp2
  dp_size: none
  dp_replicate_size: 1
  tp_size: 1
  cp_size: 1
  pp_size: 1
  # MoE mesh (ep_shard=2, ep=8).
  ep_size: 8
  sequence_parallel: false
  activation_checkpointing: true
  defer_fsdp_grad_sync: false
  multimodal:
    frozen_sharding: per_layer
  moe:
    # MUST be true at ep_size 8 on 16 GPUs: otherwise the save after validation fails with
    # `KeyError: 11` in get_optimizer_state_dict (see qwen3_6_35b_v4_88k_2node_ep8.yaml).
    reshard_after_forward: true
    wrap_outer_model: true
    ignore_router_for_ac: true

freeze_config:
  freeze_vision_tower: true
  freeze_audio_tower: true
  freeze_language_model: false

loss_fn:
  _target_: nemo_automodel.components.loss.linear_ce.FusedLinearCrossEntropy

dataset:
  _target_: examples/vlm_finetune/qwen3_5_moe/v4_88k.py:make_v4_88k_dataset
  path_or_dataset: data/v5_1k/train.parquet

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  drop_last: true
  shuffle: true
  # As in qwen3_6_35b_v4_88k_2node_ep8.yaml: supersedes `shuffle` with a per-epoch chunk
  # shuffle and places rows of similar length together.
  length_grouped_sampler:
    seed: 1234
    length_key: n_tokens
  collate_fn:
    # Final-assistant-turn supervision; deliberately no max_length (see the EP8 file).
    _target_: examples/vlm_finetune/qwen3_5_moe/v4_88k.py:last_turn_collate_fn

validation_dataset:
  _target_: examples/vlm_finetune/qwen3_5_moe/v4_88k.py:make_v4_88k_dataset
  path_or_dataset: data/v5_130k_filtered/val.parquet

validation_dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  num_workers: 2
  pin_memory: true
  drop_last: true
  shuffle: false
  collate_fn:
    _target_: examples/vlm_finetune/qwen3_5_moe/v4_88k.py:last_turn_collate_fn

optimizer:
  # torchao 8-bit AdamW; needs torchao 0.14.x (the deepep564 image pins it).
  _target_: torchao.optim.AdamW8bit
  lr: 5.0e-5
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.1

lr_scheduler:
  # WSD rescaled to 75 steps: 8 warmup steps -> stable at max_lr for epochs 1-4 -> cosine
  # decay to min_lr across epoch 5, which begins at total_steps(75) - 15 = 60.
  lr_warmup_steps: 8
  lr_decay_style: WSD
  wsd_decay_steps: 15
  lr_wsd_decay_style: cosine
  max_lr: 5.0e-5
  min_lr: 5.0e-7

clip_grad_norm:
  max_norm: 1.0

prewarm:
  cublas_backward: true
  fla_gdn_autotune: true
  comm_groups: true

moe_metrics:
  enabled: true

# Same W&B project as the v5_130k run.
wandb:
  project: qwen3_6_35b_v5_130k
  name: v5_1k_2node_ep8_5ep_wsd_lengthgrouped_lr5e-5
  dir: logs/wandb
