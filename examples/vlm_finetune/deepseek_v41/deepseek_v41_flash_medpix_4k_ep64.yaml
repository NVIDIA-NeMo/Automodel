#
# DSV4.1-Flash full-parameter MedPix SFT: 40 language layers plus the complete
# pretrained vision tower and projector. Target: 16 nodes x 4 GPUs, EP64/FSDP2
# in one NVLink domain. CP, PP and sequence packing are disabled.
#
# TE gradient norm is enabled for the large Engram owner shards.
# For a local snapshot, override both model.config checkpoint paths and the
# processor checkpoint path. Keep the processor and model revision identical.

recipe: FinetuneRecipeForVLM
seed: 1234

step_scheduler:
  global_batch_size: 64
  local_batch_size: 1
  ckpt_every_steps: 1000
  save_checkpoint_every_epoch: false
  val_every_steps: 1000
  log_remote_every_steps: 1
  gc_every_steps: 10
  num_epochs: 1
  max_steps: 100

dist_env:
  backend: nccl
  timeout_minutes: 120

model:
  _target_: nemo_automodel.NeMoAutoModelForImageTextToText.from_config
  config:
    _target_: nemo_automodel.components.models.deepseek_v41.config.DeepseekV41Config.from_pretrained
    pretrained_model_name_or_path: deepseek-ai/DeepSeek-V4.1-Flash
    name_or_path: deepseek-ai/DeepSeek-V4.1-Flash
    revision: df42c109f1defefcbfcedbe7d905718a12266e40  # pragma: allowlist secret (public model commit SHA)
  trust_remote_code: false
  load_base_model: true
  torch_dtype: bfloat16
  use_liger_kernel: false
  use_sdpa_patching: false
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: tilelang
    linear: torch
    rms_norm: torch_fp32
    experts: torch_mm
    dispatcher: hybridep
    gate_precision: float32
    rope_fusion: false
    fake_balanced_gate: false
    enable_hf_state_dict_adapter: true
    enable_fsdp_optimizations: true

processor:
  _target_: nemo_automodel.components.models.deepseek_v41.processing.DeepseekV41Processor.from_pretrained
  pretrained_model_name_or_path: deepseek-ai/DeepSeek-V4.1-Flash
  revision: df42c109f1defefcbfcedbe7d905718a12266e40  # pragma: allowlist secret (public model commit SHA)
  trust_remote_code: false

distributed:
  strategy: fsdp2
  tp_size: 1
  pp_size: 1
  cp_size: 1
  ep_size: 64
  sequence_parallel: false
  activation_checkpointing: true
  defer_fsdp_grad_sync: false
  moe:
    reshard_after_forward: true
    wrap_outer_model: true
    lm_head_precision: float32
    mp_policy:
      _target_: torch.distributed.fsdp.MixedPrecisionPolicy
      param_dtype: bfloat16
      reduce_dtype: float32
      output_dtype: null
      cast_forward_inputs: false

freeze_config:
  freeze_vision_tower: false
  freeze_language_model: false

checkpoint:
  # Saving/restoring full-model TE optimizer state is not validated here.
  enabled: false
  checkpoint_dir: ../checkpoints/deepseek_v41_flash_medpix_4k_ep64
  model_save_format: safetensors
  save_consolidated: false
  dequantize_base_checkpoint: true

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy
  fp32_upcast: false

dataset:
  _target_: nemo_automodel.components.datasets.vlm.datasets.make_medpix_dataset
  path_or_dataset: mmoukouba/MedPix-VQA
  split: train

packed_sequence:
  packed_sequence_size: 0

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  num_workers: 4
  pin_memory: true
  shuffle: true
  drop_last: true
  collate_fn:
    _target_: nemo_automodel.components.datasets.vlm.collate_fns.default_collate_fn
    # The collator performs the sole next-token shift, leaving 4096 inputs.
    max_length: 4097

validation_dataset: none
validation_dataloader: none

optimizer:
  _target_: transformer_engine.pytorch.optimizers.fused_adam.FusedAdam
  betas: [0.9, 0.95]
  eps: 1.0e-8
  lr: 5.0e-6
  weight_decay: 0.1
  adam_w_mode: true
  bias_correction: true
  master_weights: true
  master_weight_dtype: torch.float32
  store_param_remainders: true
  exp_avg_dtype: torch.bfloat16
  exp_avg_sq_dtype: torch.bfloat16

lr_scheduler:
  lr_warmup_steps: 10
  lr_decay_steps: 100
  lr_decay_style: cosine
  min_lr: 5.0e-7

clip_grad_norm:
  backend: te  # Avoid gradient-sized temporaries for the Engram owner shards.
  max_norm: 1.0

wandb:
  enable: false  # Set true to log training to W&B.
  entity: Nemo-automodel
  project: automodel-ds41-medpix
  name: ds41-medpix-4k-ep64
  mode: online
  dir: ../logs/wandb

ci:
  recipe_owner: huiyingl
  nodes: 16
  time: "01:00:00"
