# Launch on 4 GB200 GPUs:
# automodel examples/vlm_finetune/qwen3_5/qwen3_5_4b_neat_packing_gb200_benchmark.yaml --nproc-per-node 4
#
# Training settings exported from native_fused_noac_warm, job 511659145:
# https://gitlab-master.nvidia.com/dl/JoC/nemo-ci/-/jobs/511659145
# AutoModel: 27874314be6ba9a045cabc16996578d2d854fc9f
# Runtime: nvcr.io/nvidia/nemo-automodel:26.10.00, with FA4 updated to
# 3c2c6b31e730fd13e7d6f0d384af22684b24c532 (the measured AutoModel source pin).
# Checkpoint revision: 851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a.
#
# Warm-cache steps 20-49: 53,802 aggregate tokens/s versus 51,005 for the
# reconstructed Accelerate + FSDP2 baseline on the same 4 GB200 GPUs (+5.5%).
# The harness replayed 50 steps in a fresh process with the compiler caches
# retained. Initial compilation/autotuning is excluded from that comparison.
# This YAML preserves every saved training setting; only CI hardware metadata
# is corrected to describe the measured 4-GPU allocation. The CLI command runs
# the standard recipe, not the comparison/timing harness.
#
# Native FA4 attention, TE linear backend, compiled fused linear CE, 16K NEAT
# packing, FP32 resident parameters, default BF16 compute / FP32 reductions.
# MTP and activation checkpointing are disabled in both compared arms.
# Checkpoint saving and validation are disabled for this 50-step benchmark.

recipe: FinetuneRecipeForVLM

step_scheduler:
  global_batch_size: 16
  local_batch_size: 1
  ckpt_every_steps: 100
  val_every_steps: 100000
  num_epochs: 2
  max_steps: 50
  validate_on_checkpoint: false

dist_env:
  backend: nccl
  timeout_minutes: 3

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 1234
  ranked: true

model:
  _target_: nemo_automodel.NeMoAutoModelForImageTextToText.from_pretrained
  pretrained_model_name_or_path: Qwen/Qwen3.5-4B
  dtype: float32
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: fa4
    linear: te
    rms_norm: te
    rope_fusion: false
  attn_implementation: flash_attention_4
  num_nextn_predict_layers: 0

processor:
  _target_: transformers.AutoProcessor.from_pretrained
  pretrained_model_name_or_path: Qwen/Qwen3.5-4B

checkpoint:
  enabled: false
  checkpoint_dir: /tmp/checkpoints/qwen3_5_4b_packed_b300/
  model_save_format: safetensors
  save_consolidated: true

distributed:
  _target_: nemo_automodel.components.distributed.fsdp2.FSDP2Manager
  tp_size: 1
  cp_size: 1
  pp_size: 1
  dp_replicate_size: 1
  ep_size: 1
  sequence_parallel: false
  activation_checkpointing: false

freeze_config:
  freeze_vision_tower: false
  freeze_audio_tower: true
  freeze_language_model: false

loss_fn:
  _target_: nemo_automodel.components.loss.linear_ce.FusedLinearCrossEntropy
  impl: torch_compile

dataset:
  _target_: nemo_automodel.components.datasets.vlm.datasets.make_medpix_dataset
  path_or_dataset: mmoukouba/MedPix-VQA
  split: train

packed_sequence:
  packing_format: neat
  pretokenize: true
  max_length: 16384
  pack_size: 16384
  packing_ratio: 0.9
  drop_long_samples: true

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  num_workers: 4
  persistent_workers: true
  prefetch_factor: 2
  pin_memory: true

optimizer:
  _target_: transformer_engine.pytorch.optimizers.FusedAdam
  adam_w_mode: true
  bias_correction: true
  master_weights: false
  exp_avg_dtype: torch.float32
  exp_avg_sq_dtype: torch.float32
  betas:
  - 0.9
  - 0.95
  eps: 1e-8
  lr: 1.0e-05
  weight_decay: 0.1

seed: 42

ci:
  cluster_tag: gb200
  recipe_owner: akoumpa
  nodes: 1
  nproc_per_node: 4
  time: 00:30:00
  max_steps: 2
