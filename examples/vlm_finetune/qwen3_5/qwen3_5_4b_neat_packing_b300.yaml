# automodel examples/vlm_finetune/qwen3_5/qwen3_5_4b_neat_packing_b300.yaml --nproc-per-node 1
# Single B300: native FA4 full attention + HF FA4 vision attention, 16K NEAT packs.
# Requires a Blackwell-capable AutoModel environment with FlashAttention 4 installed.
# This is a starting configuration, not a measured throughput reference.

recipe: FinetuneRecipeForVLM

step_scheduler:
  global_batch_size: 16
  local_batch_size: 1
  ckpt_every_steps: 100
  val_every_steps: 100
  num_epochs: 2
  max_steps: 100

dist_env:
  backend: nccl
  timeout_minutes: 10

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 1234
  ranked: true

model:
  _target_: nemo_automodel.NeMoAutoModelForImageTextToText.from_pretrained
  pretrained_model_name_or_path: Qwen/Qwen3.5-4B
  # FP32 resident parameters provide the optimizer master weights.
  dtype: float32
  # MTP follows the checkpoint configuration; see README.md for matched comparisons.
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: fa4
    linear: torch
    rms_norm: torch
    rope_fusion: false
  attn_implementation: flash_attention_4

processor:
  _target_: transformers.AutoProcessor.from_pretrained
  pretrained_model_name_or_path: Qwen/Qwen3.5-4B

checkpoint:
  enabled: true
  checkpoint_dir: /tmp/checkpoints/qwen3_5_4b_packed_b300/
  model_save_format: safetensors
  save_consolidated: true

distributed:
  _target_: nemo_automodel.components.distributed.fsdp2.FSDP2Manager
  tp_size: 1
  cp_size: 1
  pp_size: 1
  dp_replicate_size: 1
  ep_size: 1
  sequence_parallel: false
  activation_checkpointing: true

freeze_config:
  freeze_vision_tower: false
  freeze_audio_tower: true
  freeze_language_model: false

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy

dataset:
  _target_: nemo_automodel.components.datasets.vlm.datasets.make_medpix_dataset
  path_or_dataset: mmoukouba/MedPix-VQA
  split: train

packed_sequence:
  # Keep compact document IDs and packed metadata for native FA4 and linear attention.
  packing_format: neat
  pretokenize: true
  max_length: 4096
  pack_size: 16384
  packing_ratio: 0.9
  drop_long_samples: true

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  num_workers: 4
  persistent_workers: true
  prefetch_factor: 2
  pin_memory: true

validation_dataset:
  _target_: nemo_automodel.components.datasets.vlm.datasets.make_medpix_dataset
  path_or_dataset: mmoukouba/MedPix-VQA
  split: validation

validation_dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  num_workers: 0
  collate_fn:
    _target_: nemo_automodel.components.datasets.vlm.collate_fns.default_collate_fn

optimizer:
  _target_: transformer_engine.pytorch.optimizers.FusedAdam
  adam_w_mode: true
  bias_correction: true
  # Parameters are already FP32; a separate master-weight copy is unnecessary.
  master_weights: false
  exp_avg_dtype: torch.float32
  exp_avg_sq_dtype: torch.float32
  betas: [0.9, 0.95]
  eps: 1e-8
  lr: 1.0e-5
  weight_decay: 0.1

# wandb:
#   project: <your_wandb_project>
#   entity: <your_wandb_entity>
#   name: <your_wandb_name>

ci:
  cluster_tag: gb300
  recipe_owner: akoumparouli
  nodes: 1
  nproc_per_node: 1
  time: "00:30:00"
  max_steps: 2
