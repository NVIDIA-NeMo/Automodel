# MiMo-V2.6-Pro-RL LoRA: 8 nodes x 4 GB200, EP16/PP2, rank 8 / alpha 32.
# Load the released base checkpoint; benchmark the text backbone with full-length
# 4K mock tokens and balanced expert routing. Vision/audio are frozen and receive
# no media inputs. This is not the MedPix VLM fine-tuning measurement.
# Run 20 warmup + 30 measured optimizer steps, with checkpointing disabled.

recipe: BenchmarkingRecipeForNextTokenPrediction

seed: 1234

benchmark:
  warmup_steps: 20
  peak_tflops: 2500
  nsys_start: -1
  nsys_end: -1
  nsys_ranks: []
  num_nodes: 8
  flops_scope: text
  json_output_path: training_logs/mimo_v2_6_pro_rl_lora_gb200.json

step_scheduler:
  global_batch_size: 32
  local_batch_size: 2
  ckpt_every_steps: 1000
  val_every_steps: 1000
  gc_every_steps: 5
  num_epochs: 1
  max_steps: 50

dist_env:
  backend: nccl
  timeout_minutes: 120

model:
  _target_: nemo_automodel.NeMoAutoModelForImageTextToText.from_config
  config:
    _target_: nemo_automodel.components.models.mimo_v2_flash.config.MiMoV2Config.from_pretrained
    pretrained_model_name_or_path: XiaomiMiMo/MiMo-V2.6-Pro-RL
    name_or_path: XiaomiMiMo/MiMo-V2.6-Pro-RL
    revision: 73875d00b30a89ef8cc353a0b60b0e9f9561952d  # pragma: allowlist secret - HF checkpoint commit
    use_cache: false
    output_hidden_states: true
    num_nextn_predict_layers: 0
  trust_remote_code: false
  load_base_model: true
  torch_dtype: bfloat16
  use_liger_kernel: false
  use_sdpa_patching: false
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: te
    linear: te
    rms_norm: te
    experts: torch_mm
    dispatcher: hybridep
    rope_fusion: false
    gate_precision: float32
    fake_balanced_gate: true
    enable_hf_state_dict_adapter: true
    enable_fsdp_optimizations: true

peft:
  _target_: nemo_automodel.components._peft.lora.PeftConfig
  target_modules:
    - "model.layers.*.self_attn.q_proj"
    - "model.layers.*.self_attn.k_proj"
    - "model.layers.*.self_attn.v_proj"
    - "model.layers.*.self_attn.o_proj"
    - "model.layers.*.mlp.experts"
  dim: 8
  alpha: 32
  dropout: 0.0
  use_memory_efficient_lora: true
  use_triton: false
  moe_rank_scaling: false

distributed:
  strategy: fsdp2
  tp_size: 1
  cp_size: 1
  pp_size: 2
  ep_size: 16
  sequence_parallel: false
  activation_checkpointing: true
  reshard_after_forward: true
  defer_fsdp_grad_sync: false
  moe:
    reshard_after_forward: true
    wrap_outer_model: true
    ignore_router_for_ac: true
  pipeline:
    pp_schedule: 1f1b
    pp_microbatch_size: 1
    layers_per_stage: 35
    scale_grads_in_schedule: false

freeze_config:
  freeze_vision_tower: true
  freeze_audio_tower: true
  freeze_language_model: false

checkpoint:
  enabled: false
  dequantize_base_checkpoint: true

loss_fn:
  _target_: nemo_automodel.components.loss.linear_ce.FusedLinearCrossEntropy

dataset:
  _target_: nemo_automodel.components.datasets.llm.mock_iterable_dataset.MockIterableDataset
  seq_len: 4096
  num_samples: 100000

dataloader:
  _target_: torch.utils.data.DataLoader
  batch_size: null
  num_workers: 0

optimizer:
  _target_: transformer_engine.pytorch.optimizers.fused_adam.FusedAdam
  betas: [0.9, 0.95]
  eps: 1.0e-8
  lr: 1.0e-5
  weight_decay: 0.1
  master_weights: true
  master_weight_dtype: torch.float32
  exp_avg_dtype: torch.bfloat16
  exp_avg_sq_dtype: torch.bfloat16
  adam_w_mode: true
  store_param_remainders: false

lr_scheduler:
  lr_decay_style: constant

ci:
  recipe_owner: huiyingl
  nodes: 8
  nproc_per_node: 4
  cluster_tag: gb200
  time: "01:00:00"
  max_steps: 50
