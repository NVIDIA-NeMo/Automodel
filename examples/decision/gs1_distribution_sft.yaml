recipe: nemo_automodel.recipes.decision.train_gs1.TrainGS1DecisionRecipe

seed: 42
output_dir: runs/gs1/0.8b-distribution-sft

dist_env:
  backend: nccl
  timeout_minutes: 60

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: bigai/GS1-0.8B
  revision: 5c8dfd6486ac0eaabd27d3ec7637982bcd5eb3e9
  code_revision: 5c8dfd6486ac0eaabd27d3ec7637982bcd5eb3e9
  trust_remote_code: true
  force_hf: true
  use_liger_kernel: false
  use_sdpa_patching: false
  dtype: bfloat16
  attn_implementation: sdpa

distributed:
  strategy: ddp
  tp_size: 1
  cp_size: 1
  pp_size: 1
  ep_size: 1
  find_unused_parameters: true

optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-5
  weight_decay: 0.0

checkpoint:
  enabled: true
  save_consolidated: final

data:
  train: /path/to/distribution-v4.5/train.jsonl
  max_examples: 3000
  max_length: 16384

train:
  epochs: 1
  local_batch_size: 1
  max_grad_norm: 1.0
  log_interval: 10

loss:
  brier_weight: 1.0

ci:
  nemo_ci_schedule: skipped
  cluster_tag: h100
