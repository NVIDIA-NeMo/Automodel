# State-blind (always packed) LoRA post-training of an always-packed Nemotron Decision checkpoint on fictional SOC
# alert triage (choice, yes/no and ordinal-score questions). Each alert is ONE packed read: the state once, closed by
# the state-end token, then every question with its own mask token. The state attends only to the state, a question to
# the state and itself (never to another question), question positions restart after the state, and each question is
# read at its own mask. Train state-blind, serve either way: the same stage also reads one question per sequence.
#
#   PYTHONPATH=tutorials/decision_models uv run --no-project python -m decision_tutorial.data \
#       --output-dir data/soc_triage --seed 7
#   # before: score the starting checkpoint, packed and one question per read
#   automodel examples/decision/nemotron_decision_soc_triage_packed_lora.yaml --mode eval --output_dir runs/soc/base_packed
#   automodel examples/decision/nemotron_decision_soc_triage_packed_lora.yaml --mode eval --data.packed_read false \
#       --output_dir runs/soc/base_single
#   # train state-blind (validation selects the stage on packed reads)
#   automodel examples/decision/nemotron_decision_soc_triage_packed_lora.yaml --output_dir runs/soc/packed_lora
#   # the selected stage read one question per sequence
#   automodel examples/decision/nemotron_decision_soc_triage_packed_lora.yaml --mode eval --data.packed_read false \
#       --init_from runs/soc/packed_lora/LOWEST_VAL --output_dir runs/soc/packed_lora_single
#   # export: config.json records prompt_format, packed_read and the read_layout block
#   uv run python examples/decision/export_nemotron_decision.py --base <checkpoint> \
#       --stage runs/soc/packed_lora/LOWEST_VAL --output exports/soc_packed_lora
#
# Packed reads need a checkpoint whose prompt closes the state with the state-end token (prompt_format json-sep,
# usually declared in its config.json) and SDPA or eager attention (a dense attention mask).
#
# Supported checkpoints: text Nemotron 3.5 Decision checkpoints (NemotronForDecision, a bidirectional Ministral 3
# encoder) that ship decision.json and decision_template.jinja. Vision and quantized variants are rejected at setup.
# For backbone fine-tuning set peft: null, optimizer.lr: 1.0e-6, model.torch_dtype: float32 and
# checkpoint.save_consolidated: every (decoder layers and final norm train; embeddings and head stay frozen).

recipe: nemo_automodel.recipes.decision.train_nemotron_decision.TrainNemotronDecisionRecipe

mode: train            # eval | train
seed: 101
output_dir: runs/soc/packed_lora
init_from: null        # a published stage of the same base and method, e.g. runs/.../LOWEST_VAL

dist_env:
  backend: nccl
  timeout_minutes: 60

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: /path/to/nemotron-decision-8b-packed   # a local always-packed decision checkpoint
  torch_dtype: bfloat16
  attn_implementation: sdpa

peft:
  _target_: nemo_automodel.components._peft.lora.PeftConfig
  match_all_linear: false
  target_modules:
    - "*.q_proj"
    - "*.k_proj"
    - "*.v_proj"
    - "*.o_proj"
    - "*.gate_proj"
    - "*.up_proj"
    - "*.down_proj"
  dim: 32
  alpha: 64
  dropout: 0.0

distributed:
  strategy: fsdp2
  tp_size: 1
  cp_size: 1
  pp_size: 1
  sequence_parallel: false
  activation_checkpointing: true

optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-4
  betas: [0.9, 0.95]
  weight_decay: 0.0

lr_scheduler:
  lr_decay_style: cosine   # warmup and decay steps are set from train.* below

checkpoint:
  enabled: true
  save_consolidated: false  # LoRA stages save adapters; export_nemotron_decision.py merges them

data:
  train: data/soc_triage/train.jsonl
  validation: data/soc_triage/validation.jsonl
  test: data/soc_triage/test.jsonl
  max_tokens: 8192       # longest read; a longer alert splits into several packed reads of the same state, and a
                         # question whose own prompt + mask is longer is skipped and counted (no compaction)
  slice_keys: [evidence, verdict, family]
  packed_read: true      # one read per alert: [state][question 1, mask][question 2, mask] ...
  prompt_format: json-sep  # the state is closed by the state-end token (<SPECIAL_101>), as packed reads need

train:
  global_batch_size: 16  # packed rows (alerts) per optimizer step over all ranks (one packed read per forward);
                         # a row's loss is the mean over its questions, and a step averages its rows
  epochs: 1.0
  max_steps: 0           # 0: train.epochs decide
  warmup_fraction: 0.05  # linear warmup, then cosine decay to min_lr_ratio * lr
  min_lr_ratio: 0.1
  canonical_fraction: 0.5  # option shuffle (training only): each question keeps the checkpoint's option order with
                           # this probability, else it is shuffled and re-coded by position; 1.0 disables it
  max_grad_norm: 1.0
  val_every_steps: 50

loss:
  _target_: nemo_automodel.components.loss.decision.DecisionLossConfig
  mode: sft                    # the recipe trains SFT stages only
  label_smoothing: 0.0         # plain cross-entropy over the options, as in the reference fine-tuning
  brier_weight: 0.0
  ordinal_weight: 0.0
  soft_label_kl_weight: 0.0    # 0: soft labels replace the gold target; > 0: CE(gold) + weight * KL(soft || p)
  soft_label_gold_mask: false  # true: ignore soft labels whose top option is not the gold answer

ci:
  nemo_ci_schedule: skipped  # needs a Nemotron 3.5 Decision checkpoint; covered by the functional test
  cluster_tag: h100
