recipe: TrainBiEncoderRecipe

seed: 42

temperature: 0.02

step_scheduler:
  global_batch_size: 16
  local_batch_size: 4
  ckpt_every_steps: 10
  # val_every_steps: 25  # No validation dataset configured for this tutorial
  max_steps: 20
  num_epochs: null
  save_checkpoint_every_epoch: false

dist_env:
  backend: nccl
  timeout_minutes: 15

model:
  _target_: nemo_automodel.NeMoAutoModelBiEncoder.from_pretrained
  pretrained_model_name_or_path: mistralai/Ministral-3-3B-Instruct-2512-BF16
  trust_remote_code: true
  pooling: avg
  l2_normalize: true
  is_causal: false
  use_liger_kernel: true
  use_sdpa_patching: true
  torch_dtype: bfloat16
  attn_implementation: flash_attention_2
  extract_submodel: language_model
  do_distributed_inbatch_negative: true

tokenizer:
  _target_: nemo_automodel.NeMoAutoTokenizer.from_pretrained
  pretrained_model_name_or_path: mistralai/Ministral-3-3B-Instruct-2512-BF16
  padding_side: left
  tokenizer_backend: tokenizers
  fix_mistral_regex: true
  split_special_tokens: true
  add_bos_token: true
  add_eos_token: false

dataset:
  _target_: nemo_automodel.components.datasets.llm.retrieval_dataset.RetrievalDatasetConfig
  model_type: bi_encoder
  data_dir_list:
    # 32 sample pairs from nvidia/embed-nemotron-dataset-v1/FEVER for local demonstration.
    # For full training, specify 'hf://nvidia/embed-nemotron-dataset-v1/FEVER'
    - tutorials/embedding-biencoder/sample_retrieval_data.jsonl
  data_type: train
  n_passages: 2
  seed: 42

dataloader:
  collate_fn:
    _target_: nemo_automodel.components.datasets.llm.BiEncoderCollator
    q_max_len: 128
    p_max_len: 256
    query_prefix: "query:"
    passage_prefix: "passage:"
    pad_to_multiple_of: 8
  shuffle: true
  num_workers: 0

optimizer:
  _target_: transformer_engine.pytorch.optimizers.fused_adam.FusedAdam
  lr: 2.0e-6
  weight_decay: 0.01
  adam_w_mode: true
  bias_correction: true
  master_weights: true

lr_scheduler:
  lr_warmup_steps: 2
  lr_decay_style: linear

checkpoint:
  enabled: true
  checkpoint_dir: ./output/ministral3_3b_embed_tutorial/checkpoints
  model_save_format: safetensors
  save_consolidated: final
  max_recent_checkpoints: 2

distributed:
  strategy: fsdp2
  dp_size: none
  tp_size: 1
  cp_size: 1
  sequence_parallel: false
