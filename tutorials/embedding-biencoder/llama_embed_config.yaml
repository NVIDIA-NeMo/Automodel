recipe: TrainBiEncoderRecipe

seed: 42

temperature: 0.02

step_scheduler:
  global_batch_size: 16
  local_batch_size: 4
  ckpt_every_steps: 50
  val_every_steps: 25
  max_steps: 100

dist_env:
  backend: nccl
  timeout_minutes: 15

model:
  _target_: nemo_automodel.NeMoAutoModelBiEncoder.from_pretrained
  pretrained_model_name_or_path: meta-llama/Llama-3.2-1B
  pooling: avg
  l2_normalize: true
  is_causal: false
  use_sdpa_patching: true
  torch_dtype: bfloat16
  do_distributed_inbatch_negative: false

tokenizer:
  _target_: nemo_automodel.NeMoAutoTokenizer.from_pretrained
  pretrained_model_name_or_path: meta-llama/Llama-3.2-1B
  add_eos_token: false

dataset:
  _target_: nemo_automodel.components.datasets.llm.retrieval_dataset.RetrievalDatasetConfig
  model_type: bi_encoder
  data_dir_list:
    - tutorials/embedding-biencoder/sample_retrieval_data.jsonl
  data_type: train
  n_passages: 2
  seed: 42

dataloader:
  collate_fn:
    _target_: nemo_automodel.components.datasets.llm.BiEncoderCollator
    q_max_len: 256
    p_max_len: 256
    query_prefix: "query: "
    passage_prefix: "passage: "
    pad_to_multiple_of: 8
  shuffle: true
  num_workers: 0

optimizer:
  _target_: torch.optim.AdamW
  lr: 5.0e-6
  weight_decay: 0.01

lr_scheduler:
  lr_warmup_steps: 10
  lr_decay_style: linear

checkpoint:
  enabled: true
  checkpoint_dir: ./output/llama_embed_tutorial/checkpoints
  model_save_format: safetensors
  save_consolidated: true

distributed:
  strategy: fsdp2
  dp_size: none
  tp_size: 1
  cp_size: 1
  sequence_parallel: false
