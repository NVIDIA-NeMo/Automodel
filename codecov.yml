comment: false
coverage:
  status:
    project: false
    patch:
      default:
        target: 80%
        threshold: 10%
        base: auto
        if_ci_failed: error
        if_not_found: success
        paths:
          - "!nemo_automodel/retrieval/**"
          - "!nemo_automodel/recipes/retrieval/**"
          - "!nemo_automodel/components/datasets/llm/retrieval_*.py"
          - "!nemo_automodel/components/datasets/multimodal/**"
          - "!nemo_automodel/_transformers/models/bagel/**"
          - "!nemo_automodel/_transformers/models/inkling/**"
          - "!nemo_automodel/recipes/multimodal/**"
          - "!nemo_automodel/components/training/ema.py"
          - "!examples/multimodal_finetune/**"
          - "!examples/multimodal_pretrain/**"
      retrieval:
        target: 60%
        threshold: 30%
        base: auto
        if_ci_failed: error
        if_not_found: success
        paths:
          - "nemo_automodel/retrieval/**"
          - "nemo_automodel/recipes/retrieval/**"
          - "nemo_automodel/components/datasets/llm/retrieval_*.py"
      bagel:
        target: 0%
        threshold: 100%
        base: auto
        if_ci_failed: error
        if_not_found: success
        informational: true
        paths:
          - "nemo_automodel/components/datasets/multimodal/**"
          - "nemo_automodel/_transformers/models/bagel/**"
          - "nemo_automodel/recipes/multimodal/**"
          - "nemo_automodel/components/training/ema.py"
          - "examples/multimodal_finetune/**"
          - "examples/multimodal_pretrain/**"
      inkling:
        target: 0%
        threshold: 100%
        base: auto
        if_ci_failed: error
        if_not_found: success
        informational: true
        paths:
          - "nemo_automodel/_transformers/models/inkling/**"

fixes:
  - "/opt/Automodel/::"
