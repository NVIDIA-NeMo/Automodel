instances:
- url: https://nemo-automodel.docs.buildwithfern.com/nemo/automodel
  custom-domain: docs.nvidia.com/nemo/automodel
  multi-source: true
title: NVIDIA NeMo AutoModel

# Version-root landing: each version YAML's first nav entry is the index page
# mounted with slug: "" (e.g. docs/index.mdx for nightly), so /nemo/automodel/v0.4,
# /latest, and /nightly render the documentation landing page directly — matching
# the old Sphinx site's /latest/index.html. The /<version>/index.html redirect
# rules below point at the bare version root, which now serves that landing page.

# Inherit NVIDIA branding (footer, colors, layout, fonts, NVIDIA logos+favicon,
# OneTrust JS, theme CSS) from the central control repo at
# https://github.com/NVIDIA/fern-components. At publish time Fern fetches the
# `nvidia` theme from the registry and merges it on top of this file, so the
# theme-owned fields (footer / layout / colors / theme / logo SVGs / favicon /
# js / css) intentionally do NOT appear below.
global-theme: nvidia

theme:
  sidebar: default

layout:
  breadcrumbs:
    current-page: true

# NVIDIA green (#76B900) does not meet WCAG AA contrast for normal text on
# white. Keep the brand hue while using accessible light and dark variants.
colors:
  accent-primary:
    light: "#418326"
    dark: "#ADFF8C"

# Override only the `right-text` slot of the theme's logo; SVG paths, height,
# href stay inherited from the global theme. Same pattern as NeMo Curator.
logo:
  right-text: NeMo AutoModel

navbar-links:
- type: github
  value: https://github.com/NVIDIA-NeMo/Automodel
libraries:
  nemo-automodel:
    input:
      git: https://github.com/NVIDIA-NeMo/Automodel
      subpath: nemo_automodel
    output:
      path: ./product-docs/nemo-automodel/Full-Library-Reference
    lang: python

experimental:
  mdx-components:
  - ./components

versions:
  - display-name: Nightly
    slug: nightly
    path: ./versions/nightly.yml
    availability: beta
  - display-name: Latest
    slug: latest
    path: ./versions/latest.yml
    availability: stable
  - display-name: "0.5.0 · 26.06"
    slug: v0.5
    path: ./versions/v0.5.yml
    availability: stable
  - display-name: "0.4.0 · 26.04"
    slug: v0.4
    path: ./versions/v0.4.yml
    availability: stable

