override-dependencies = [
    # Override Trackio's Pillow<13 cap to enforce the security update.
    "pillow==13.0.0",
    # The 26.10 base registers platformdirs.pytest_plugin; an older venv copy
    # shadows its module while pytest still discovers the system entry point.
    # Update this pin with the base image; remove once the regular lock is aligned.
    "platformdirs==4.12.4",
    # Match the 26.10 base and TE 2.20.2's >=1.29 requirement; keep the venv
    # from shadowing the system frontend with the regular lock's older version.
    # Update this pin with the base image.
    "nvidia-cudnn-frontend==1.30.0",
    # leptonai (via nemo-run) caps anyio<=4.9.0; retain the security floor
    "anyio>=4.14.2",
    "cuda-bindings; sys_platform == 'never'",
    "cuda-pathfinder; sys_platform == 'never'",
    "flash-attn; sys_platform == 'never'",
    "nvidia-cublas; sys_platform == 'never'",
    "nvidia-cuda-cupti; sys_platform == 'never'",
    "nvidia-cuda-nvrtc; sys_platform == 'never'",
    "nvidia-cuda-runtime; sys_platform == 'never'",
    "nvidia-cudnn-cu13; sys_platform == 'never'",
    "nvidia-cufft; sys_platform == 'never'",
    "nvidia-cufile; sys_platform == 'never'",
    "nvidia-curand; sys_platform == 'never'",
    "nvidia-cusolver; sys_platform == 'never'",
    "nvidia-cusparse; sys_platform == 'never'",
    "nvidia-cusparselt-cu13; sys_platform == 'never'",
    "nvidia-nccl-cu13; sys_platform == 'never'",
    "nvidia-nvjitlink; sys_platform == 'never'",
    "nvidia-nvshmem-cu13; sys_platform == 'never'",
    "nvidia-nvtx; sys_platform == 'never'",
    "torch; sys_platform == 'never'",
    "torchao; sys_platform == 'never'",
    "torchcodec; sys_platform == 'never'",
    "torchvision; sys_platform == 'never'",
    "transformer-engine; sys_platform == 'never'",
    "transformer-engine-cu13; sys_platform == 'never'",
    "transformer-engine-torch; sys_platform == 'never'",
    "triton; sys_platform == 'never'",
    # leptonai pins 7.0.0, which caps Starlette below its security-fixed 1.x releases
    "prometheus-fastapi-instrumentator>=8.1.0",
    # databricks-sql-connector caps thrift<0.25; retain the security floor.
    # Remove once the connector accepts Thrift 0.25+; binary protocol/RPC smoke checks pass.
    "thrift>=0.25.0",
    # torchx (via nemo-run) caps urllib3<1.27; override to keep the CVE pin
    "urllib3>=2.8.0",
]
