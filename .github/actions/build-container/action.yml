name: Build container
description: Build and publish a container from public dependencies at the verified revision

inputs:
  container-registry:
    description: "Container registry to push/pull images"
    required: true
  dockerfile-path:
    description: "Path to dockerfile to build"
    required: true
  PAT:
    description: "Deprecated legacy input"
    deprecationMessage: "Remove the PAT input. This action builds with public dependencies."
    required: false
  repo-name:
    description: "The name of the repo to build container"
    required: true

runs:
  using: "composite"
  steps:
    - name: Install GH CLI
      shell: bash
      run: |
        if command -v gh >/dev/null; then exit 0; fi
        for i in 1 2 3; do
          if apt-get update && apt-get install -y gh; then exit 0; fi
          if [[ "$i" != 3 ]]; then sleep 10; fi
        done
        exit 1

    - name: Resolve verified container revision
      id: revision
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        sha=$GITHUB_SHA
        pr_number=""
        base=""
        if [[ "$GITHUB_REF" == refs/heads/pull-request/* ]]; then
          if ! [[ "$GITHUB_REF" =~ ^refs/heads/pull-request/([1-9][0-9]*)$ ]]; then
            echo "::error::Invalid PR mirror branch."
            exit 1
          fi
          pr_number=${BASH_REMATCH[1]}
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number" \
            --jq '[.state, .head.sha, .base.sha, .merge_commit_sha] | @tsv')
          read -r state head base sha <<< "$pr"
          if [[ "$state" != open || "$head" != "$GITHUB_SHA" || ! "$sha" =~ ^[0-9a-f]{40}$ || ! "$base" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The PR mirror is stale or the current test merge is unavailable."
            exit 1
          fi
          parents=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$sha" --jq '[.parents[].sha] | join(" ")')
          if [[ "$parents" != "$base $GITHUB_SHA" ]]; then
            echo "::error::Test merge parents do not match the current base and vetted PR head."
            exit 1
          fi
        fi
        printf 'sha=%s\npr_number=%s\nbase=%s\n' "$sha" "$pr_number" "$base" | tee -a "$GITHUB_OUTPUT"

    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        ref: ${{ steps.revision.outputs.sha }}
        persist-credentials: false

    - name: Normalize repo name to lowercase
      shell: bash
      env:
        REPO: ${{ inputs.repo-name }}
        REGISTRY: ${{ inputs.container-registry }}
      run: |
        if [[ "$REPO$REGISTRY" == *$'\n'* || "$REPO$REGISTRY" == *$'\r'* ]]; then
          echo "::error::Repository and registry names must fit on one line."
          exit 1
        fi
        echo "REPO_LOWER=${REPO,,}" >> "$GITHUB_ENV"
        echo "container-registry=${REGISTRY}" >> "$GITHUB_ENV"

    - name: Get last merged PR
      shell: bash
      id: cache_from
      env:
        GH_TOKEN: ${{ github.token }}
        REPO_NAME: ${{ inputs.repo-name }}
        REGISTRY: ${{ inputs.container-registry }}
      run: |
        # shellcheck disable=SC2016
        LAST_PRS=$(gh api graphql \
          -F owner="NVIDIA-NeMo" \
          -f name="$REPO_NAME" \
          -f query='
            query($owner: String!, $name: String!) {
              repository(owner: $owner, name: $name) {
                pullRequests(states: MERGED, first: 100, orderBy: {field: UPDATED_AT, direction: DESC}) {
                  nodes {
                    number
                  }
                }
              }
            }' | jq -r '.data.repository.pullRequests.nodes[].number' | while read -r number; do
            echo "type=registry,ref=$REGISTRY/$REPO_LOWER:$number-buildcache,mode=max"
          done)

        echo "LAST_PRS<<EOF" | tee -a "$GITHUB_OUTPUT"
        echo "$LAST_PRS" | tee -a "$GITHUB_OUTPUT"
        echo "EOF" | tee -a "$GITHUB_OUTPUT"

    - name: Set up Docker Buildx
      id: setup-buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

    # Keep multi-GB cache ownership on main. Copied PR branches can restore
    # main's cache without consuming repository storage with scoped copies.
    - name: Restore and save BuildKit cache mounts
      id: buildkit-cache-main
      if: github.ref == 'refs/heads/main'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: .buildkit-cache
        # Compiled CUDA wheels are ABI-bound to the Dockerfile base image and lockfiles.
        key: buildkit-cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(inputs.dockerfile-path, 'docker/common/uv-pytorch.lock', 'uv.lock') }}

    - name: Restore BuildKit cache mounts
      id: buildkit-cache-branch
      if: github.ref != 'refs/heads/main'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: .buildkit-cache
        # Compiled CUDA wheels are ABI-bound to the Dockerfile base image and lockfiles.
        key: buildkit-cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(inputs.dockerfile-path, 'docker/common/uv-pytorch.lock', 'uv.lock') }}

    - name: Inject cache mounts into BuildKit
      uses: reproducible-containers/buildkit-cache-dance@5b81f4d29dc8397a7d341dba3aeecc7ec54d6361 # v3.3.0
      with:
        builder: ${{ steps.setup-buildx.outputs.name }}
        utility-image: ghcr.io/containerd/busybox@sha256:52f73a0a43a16cf37cd0720c90887ce972fe60ee06a687ee71fb93a7ca601df7
        scratch-dir: .buildkit-cache/scratch
        cache-dir: .buildkit-cache
        dockerfile: ${{ inputs.dockerfile-path }}
        # Branch runs are restore-only, so extracting their updated mounts
        # after the build would create an archive that no step persists.
        skip-extraction: ${{ github.ref != 'refs/heads/main' || steps.buildkit-cache-main.outputs.cache-hit == 'true' }}

    - name: Build and push
      uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
      with:
        file: ${{ inputs.dockerfile-path }}
        push: true
        context: .
        build-args: |
          BASE_IMAGE=pytorch
        cache-from: |
          type=registry,ref=${{ env.container-registry }}/${{ env.REPO_LOWER }}:${{ steps.revision.outputs.pr_number || '0' }}-buildcache,mode=max
          type=registry,ref=${{ env.container-registry }}/${{ env.REPO_LOWER }}:main-buildcache,mode=max
          ${{ steps.cache_from.outputs.LAST_PRS }}
        cache-to: |
          type=registry,ref=${{ env.container-registry }}/${{ env.REPO_LOWER }}:${{ steps.revision.outputs.pr_number || '0' }}-buildcache,mode=max
        no-cache: false
        tags: |
          ${{ env.container-registry }}/${{ env.REPO_LOWER }}:${{ steps.revision.outputs.pr_number || '0' }}
          ${{ env.container-registry }}/${{ env.REPO_LOWER }}:${{ github.sha }}
