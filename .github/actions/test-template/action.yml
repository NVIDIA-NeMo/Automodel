name: "Test Template"
description: "Template for running NeMo tests in a containerized environment"

inputs:
  timeout:
    description: "Max runtime of test in minutes"
    required: false
    default: "10"
  max-attempts:
    description: "Maximum attempts when the test command reaches the job timeout"
    required: false
    default: "3"
  retry-extra-timeout:
    description: "Minutes added to the timeout of each retry attempt"
    required: false
    default: "0"
  test-folder:
    description: "Comma-separated names of folders containing test suites"
    required: false
  is-optional:
    description: "Failure will cancel all other tests if set to true"
    required: false
    default: "false"
  is-unit-test:
    description: "Upload coverage as unit test"
    required: false
    default: "false"
  cpu-only:
    description: "Run tests on CPU only"
    required: false
    default: "false"
  shard-id:
    description: "0-based shard index for splitting the unit suite across runners by test file"
    required: false
    default: ""
  num-shards:
    description: "Total number of shards the unit suite is split into"
    required: false
    default: ""
  full-moe-matrix:
    description: "Run the full MoE parity matrix instead of representative PR cases"
    required: false
    default: "false"
  PAT:
    description: "GitHub Personal Access Token"
    required: true
  container-image:
    description: "Container image to use for test"
    required: true
  test-data-path:
    description: "Test data path"
    required: true
  runner:
    description: "Runner to use for test"
    required: true

runs:
  using: "composite"
  steps:
    - name: Restore MoE JIT kernels
      if: ${{ contains(inputs.test-folder, 'moe') && inputs.cpu-only == 'false' }}
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ runner.temp }}/moe-jit-cache
        # Separate runner/GPU pools and invalidate when the compiler image or DeepEP pin changes.
        key: moe-jit-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.runner }}-${{ hashFiles('docker/Dockerfile', 'docker/common/deepep.patch', 'pyproject.toml', 'nemo_automodel/components/moe/megatron/fused_a2a.py') }}

    - name: Install uuidgen
      shell: bash -x -e -u -o pipefail {0}
      if: ${{ contains(inputs.runner, 'aws') || contains(inputs.runner, 'gcp') }}
      run: |
        for i in 1 2 3; do
          apt-get update && apt-get install -y uuid-runtime && break
          echo "Attempt $i failed, retrying in 10s..."
          sleep 10
        done

    - name: Start container
      shell: bash
      run: |
        echo "::group::Start test container"

        ARG=("")
        if [[ "${{ inputs.cpu-only }}" == "false" ]]; then
          ARG=("--runtime=nvidia --gpus all")
        fi
        if [[ "${{ contains(inputs.test-folder, 'moe') }}" == "true" ]]; then
          mkdir -p "${{ runner.temp }}/moe-jit-cache"
          ARG+=("--env NEMO_HYBRIDEP_JIT_CACHE=/opt/moe-jit-cache/hybridep")
          ARG+=("--env TRITON_CACHE_DIR=/opt/moe-jit-cache/triton")
          ARG+=("--env TORCHINDUCTOR_CACHE_DIR=/opt/moe-jit-cache/inductor")
          ARG+=("--env CUDA_CACHE_PATH=/opt/moe-jit-cache/cuda")
          ARG+=("--volume ${{ runner.temp }}/moe-jit-cache:/opt/moe-jit-cache")
        fi

        cmd=$(cat <<RUN_TEST_EOF
        #!/bin/bash
        docker container rm -f nemo_container_${{ github.run_id }} || true
        docker run \
          --rm \
          -d \
          --name nemo_container_${{ github.run_id }} ${ARG[@]} \
          --shm-size=64g \
          --env TRANSFORMERS_OFFLINE=0 \
          --env HYDRA_FULL_ERROR=1 \
          --env HF_CACHE=/home/TestData/lite/hf_cache \
          --env HF_HOME=/home/TestData/HF_HOME \
          --env RUN_ID=${{ github.run_id }} \
          --env TEST_DATA_DIR=/home/TestData/automodel \
          --env NEMO_MOE_TEST_FULL_MATRIX=${{ inputs.full-moe-matrix }} \
          --volume ${{ inputs.test-data-path }}:/home/TestData \
          ${{ inputs.container-image }} \
          bash -c "sleep \${1:?container lifetime in seconds}"
        RUN_TEST_EOF
        )

        echo "$cmd" | tee "retry_job.sh"
        bash retry_job.sh $(( ${{ inputs.timeout }} * 60 + 60 ))
        echo "::endgroup::"

    - name: Create run-script
      id: create
      shell: bash
      run: |
        echo "::group::Create run-script"
        COVERAGE_PREFIX=$([[ "${{ inputs.is-unit-test }}" == "true" ]] && echo "unit-test" || echo "e2e")
        echo "coverage-prefix=$COVERAGE_PREFIX" | tee -a "$GITHUB_OUTPUT"

        cmd=$(cat <<'RUN_TEST_EOF'
        #!/bin/bash

        docker exec -t nemo_container_${{ github.run_id }} bash -c '
          set -e

          . /opt/venv/env.sh

          if [[ "${{ contains(inputs.runner, 'gcp') }}" == "true" ]]; then
            export NCCL_ENV_PLUGIN=none
            export NCCL_NET_PLUGIN=none
            export NCCL_NET=Socket
          fi

          bash tests/run_test.sh --UNIT_TEST=${{ inputs.is-unit-test }} --CPU=${{ inputs.cpu-only}} --TEST_NAME=${{ inputs.test-folder }} --SHARD_ID=${{ inputs.shard-id }} --NUM_SHARDS=${{ inputs.num-shards }}

        '


        RUN_TEST_EOF
        )

        echo "$cmd" | tee "job.sh"
        echo "::endgroup::"

    - name: Display launch info
      shell: bash
      run: |
        echo -e "\033[1;34m┌─ launching test ─────────────────────────────────────────────────────────┐\033[0m"
        echo -e "\033[1;34m│  test      : ${{ inputs.test-folder }}\033[0m"
        echo -e "\033[1;34m│  runner    : ${{ inputs.runner }}\033[0m"
        echo -e "\033[1;34m│  container : ${{ inputs.container-image }}\033[0m"
        echo -e "\033[1;34m└──────────────────────────────────────────────────────────────────────────┘\033[0m"

    - name: Run main script
      id: run-main-script
      shell: bash
      continue-on-error: ${{ inputs.is-optional == 'true' }}
      env:
        TIMEOUT_MINUTES: ${{ inputs.timeout }}
        RETRY_EXTRA_TIMEOUT_MINUTES: ${{ inputs.retry-extra-timeout }}
        MAX_ATTEMPTS: ${{ inputs.max-attempts }}
      run: |
        # Retry only attempts that hit their timeout, in a fresh container. Each retry gets
        # RETRY_EXTRA_TIMEOUT_MINUTES more, so a suite that just overran its first attempt can finish.
        exit_code=1
        trap 'echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"' EXIT
        for (( attempt = 1; attempt <= MAX_ATTEMPTS; attempt++ )); do
          minutes=$TIMEOUT_MINUTES
          if (( attempt > 1 )); then
            minutes=$(( TIMEOUT_MINUTES + RETRY_EXTRA_TIMEOUT_MINUTES ))
            /bin/bash retry_job.sh $(( minutes * 60 + 60 )) || echo "::warning::Could not restart the test container."
          fi
          echo "::group::Attempt $attempt (timeout $minutes minutes)"
          start=$SECONDS
          exit_code=0
          timeout --kill-after=30 $(( minutes * 60 )) /bin/bash job.sh || exit_code=$?
          echo "::endgroup::"
          if (( exit_code == 0 )); then
            echo "Command completed after $attempt attempt(s)."
            break
          fi
          if (( exit_code != 124 && exit_code != 137 )) || (( SECONDS - start < minutes * 60 )); then
            echo "::error::Attempt $attempt failed with exit code $exit_code."
            break
          fi
          exit_code=1
          if (( attempt == MAX_ATTEMPTS )); then
            echo "::error::Final attempt failed. Timeout of $minutes minutes hit."
          else
            echo "::warning::Attempt $attempt failed. Reason: Timeout of $minutes minutes hit."
          fi
        done
        exit "$exit_code"

    - name: Check result
      id: check
      shell: bash -e -u -o pipefail {0}
      if: always()
      run: |
        docker exec nemo_container_${{ github.run_id }} /opt/venv/bin/coverage combine || true
        docker exec nemo_container_${{ github.run_id }} /opt/venv/bin/coverage xml || true
        docker cp nemo_container_${{ github.run_id }}:/opt/Automodel/.coverage .coverage || true
        docker cp nemo_container_${{ github.run_id }}:/opt/Automodel/coverage.xml coverage.xml || true

        coverage_report=coverage-${{ steps.create.outputs.coverage-prefix }}-${{ github.run_id }}-$(uuidgen)
        echo "coverage_report=$coverage_report" | tee -a "$GITHUB_OUTPUT"

        EXIT_CODE=${{ steps.run-main-script.outputs.exit_code }}
        IS_SUCCESS=$([[ "$EXIT_CODE" -eq 0 ]] && echo "true" || echo "false")
        IS_ALLOWED_FAILURE=false

        if [[ "$IS_SUCCESS" == "false" && "${{ inputs.is-optional }}" == "true" ]]; then
          IS_ALLOWED_FAILURE=true
        fi

        echo "::group::Coverage report"
        docker exec -t nemo_container_${{ github.run_id }} /opt/venv/bin/coverage report -i || true
        echo "::endgroup::"

        if [[ "$IS_ALLOWED_FAILURE" == "true" ]]; then
          echo -e "\033[1;33m╔══════════════════════════════════════════════════════════════════════════╗\033[0m"
          echo -e "\033[1;33m║                                                                          ║\033[0m"
          echo -e "\033[1;33m║   ⚠️   ALLOWED FAILURE  (exit code: ${EXIT_CODE})                        ║\033[0m"
          echo -e "\033[1;33m║   ${{ inputs.test-folder }}\033[0m"
          echo -e "\033[1;33m║                                                                          ║\033[0m"
          echo -e "\033[1;33m╚══════════════════════════════════════════════════════════════════════════╝\033[0m"
          echo "::warning title=Result::⚠️ ${{ inputs.test-folder }} — ALLOWED FAILURE (exit $EXIT_CODE)"
          exit 0
        elif [[ "$IS_SUCCESS" == "true" ]]; then
          echo -e "\033[1;32m╔══════════════════════════════════════════════════════════════════════════╗\033[0m"
          echo -e "\033[1;32m║                                                                          ║\033[0m"
          echo -e "\033[1;32m║   ✅  PASSED                                                             ║\033[0m"
          echo -e "\033[1;32m║   ${{ inputs.test-folder }}\033[0m"
          echo -e "\033[1;32m║                                                                          ║\033[0m"
          echo -e "\033[1;32m╚══════════════════════════════════════════════════════════════════════════╝\033[0m"
          echo "::notice title=Result::✅ ${{ inputs.test-folder }} — PASSED"
          exit 0
        else
          echo -e "\033[1;31m╔══════════════════════════════════════════════════════════════════════════╗\033[0m"
          echo -e "\033[1;31m║                                                                          ║\033[0m"
          echo -e "\033[1;31m║   ❌  FAILED  (exit code: ${EXIT_CODE})                                  ║\033[0m"
          echo -e "\033[1;31m║   ${{ inputs.test-folder }}\033[0m"
          echo -e "\033[1;31m║                                                                          ║\033[0m"
          echo -e "\033[1;31m╚══════════════════════════════════════════════════════════════════════════╝\033[0m"
          echo "::error title=Result::❌ ${{ inputs.test-folder }} — FAILED (exit $EXIT_CODE)"
          exit 1
        fi

    - name: Upload artifacts
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      if: ${{ !cancelled() && steps.check.outputs.coverage_report != '' && steps.check.outputs.coverage_report != 'none' }}
      with:
        name: ${{ steps.check.outputs.coverage_report }}
        path: |
          coverage.xml
          .coverage
        include-hidden-files: true
