name: "Build, validate, and release Automodel"

on:
  push:
    branches:
      - main
      - "r**"
      - "pull-request/**"
      - "deploy-release/*"
  workflow_dispatch:
    inputs:
      release-ref:
        description: Full 40-character commit SHA to release
        required: true
        type: string
      dry-run:
        description: Compute the release but do not publish wheel, GH release, or docs.
        required: true
        default: true
        type: boolean
      create-gh-release:
        description: Create a GitHub release
        required: true
        default: true
        type: boolean
      generate-changelog:
        description: Generate changelog
        required: false
        default: true
        type: boolean
      # Fern publishes documentation through its own workflow.
      publish-docs:
        # Sphinx docs (conf.py) were retired in favor of Fern; the Fern site
        # publishes via .github/workflows/publish-fern-docs.yml, not this
        # release pipeline. Default off so the FW-CI finalize stage skips its
        # Sphinx build-docs/publish-docs jobs (which would fail: no conf.py).
        description: Publish docs (Sphinx; retired — leave false, Fern publishes separately)
        required: false
        default: false
        type: boolean
      version-bump-branch:
        description: Protected target branch (main or a release branch matching [rv][0-9].[0-9].[0-9])
        required: true
        type: string
      gh-release-from-tag:
        description: Tag of previous release for changelog builder
        required: false
        type: string
        default: ""

defaults:
  run:
    shell: bash -x -e -u -o pipefail {0}

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  pre-flight:
    if: github.event_name != 'workflow_dispatch'
    permissions:
      contents: read
      pull-requests: read
    uses: NVIDIA-NeMo/FW-CI-templates/.github/workflows/_cicd_preflight.yml@1ebb754bdbe6680cce2b3d81da4e63be7200380a

  release-workflow-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout workflow and regression tests
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Run offline release regression tests
        run: |
          python -m venv .venv-release-tests
          .venv-release-tests/bin/python -m pip install PyYAML==6.0.3
          .venv-release-tests/bin/python .github/tests/test_release_workflow.py -v

  validate-inputs:
    needs: [pre-flight]
    if: |
      !cancelled() && !failure()
      && !(needs.pre-flight.outputs.docs_only == 'true'
           || needs.pre-flight.outputs.is_deployment_workflow == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Validate immutable release ref
        env:
          RELEASE_REF: ${{ inputs.release-ref || github.sha }}
        run: |
          if [[ ! "$RELEASE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::release-ref must be a full 40-character commit SHA"
            exit 1
          fi

      - name: Check documentation publisher
        if: inputs.publish-docs
        run: |
          echo "::error::Sphinx publishing is retired. Use the Publish Fern Docs workflow."
          exit 1

      - name: Require dispatch from main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Select the main branch when starting the release workflow."
          exit 1

      - name: Verify release commit belongs to the protected target branch
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ inputs.release-ref }}
          TARGET_BRANCH: ${{ inputs.version-bump-branch }}
        run: |
          case "$TARGET_BRANCH" in
            main|[rv][0-9].[0-9].[0-9]) ;;
            *) echo "::error::Select main or a branch covered by Automodel's release-branch rule."; exit 1 ;;
          esac
          target_sha=$(gh api "repos/$GITHUB_REPOSITORY/branches/$TARGET_BRANCH" \
            --jq 'select(.protected == true) | .commit.sha')
          if [[ ! "$target_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The version bump target must be a protected branch."
            exit 1
          fi
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$RELEASE_REF...$target_sha" --jq '.status')
          if [[ "$status" != identical && "$status" != ahead ]]; then
            echo "::error::The release commit must be on the version bump target branch."
            exit 1
          fi

  bump:
    needs: [validate-inputs, release-workflow-tests]
    if: |
      !cancelled() && !failure() && needs.validate-inputs.result == 'success'
      && needs.release-workflow-tests.result == 'success'
    permissions:
      contents: read
    uses: NVIDIA-NeMo/FW-CI-templates/.github/workflows/_release_bump.yml@1ebb754bdbe6680cce2b3d81da4e63be7200380a
    with:
      release-ref: ${{ inputs.release-ref || github.sha }}
      python-package: nemo_automodel
      library-name: NeMo-Automodel
      validate-only: ${{ github.event_name != 'workflow_dispatch' }}
      dry-run: ${{ inputs.dry-run || false }}
      version-bump-branch: ${{ inputs.version-bump-branch || github.ref_name }}
      packaging: uv
      has-src-dir: false
      release-environment: automodel-release
      restrict-to-admins: true
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  build-wheel:
    needs: [bump, pre-flight]
    if: |
      !cancelled() && !failure() && needs.bump.result == 'success'
    permissions:
      contents: read
    uses: NVIDIA-NeMo/FW-CI-templates/.github/workflows/_build_test_wheel.yml@1ebb754bdbe6680cce2b3d81da4e63be7200380a
    with:
      python-package: nemo_automodel
      packaging: uv
      has-src-dir: false
      skip-test-wheel: true
      runner: linux-amd64-cpu16
      no-build-isolation: true
      ref: ${{ inputs.release-ref || github.sha }}

  publish-wheel:
    needs: build-wheel
    if: >-
      ${{ !cancelled() && !failure() && needs.build-wheel.result == 'success'
          && github.event_name == 'workflow_dispatch' && !inputs.dry-run
          && github.repository == 'NVIDIA-NeMo/Automodel' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/${{ needs.build-wheel.outputs.pypi-name }}/
    permissions:
      id-token: write
    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build-wheel.outputs.artifact-name }}
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  finalize:
    needs: [bump, build-wheel, publish-wheel, pre-flight]
    if: |
      !cancelled() && !failure() && needs.bump.result == 'success'
      && needs.build-wheel.result == 'success'
      && (github.event_name != 'workflow_dispatch' || inputs.dry-run || needs.publish-wheel.result == 'success')
    permissions:
      contents: read
      pull-requests: read
    uses: NVIDIA-NeMo/FW-CI-templates/.github/workflows/_release_finalize.yml@1ebb754bdbe6680cce2b3d81da4e63be7200380a
    with:
      release-ref: ${{ inputs.release-ref || github.sha }}
      library-name: NeMo-Automodel
      validate-only: ${{ github.event_name != 'workflow_dispatch' }}
      dry-run: ${{ inputs.dry-run || false }}
      create-gh-release: ${{ github.event_name != 'workflow_dispatch' || inputs.create-gh-release }}
      release-environment: automodel-release
      gh-release-use-changelog-builder: ${{ inputs.generate-changelog || false }}
      # Fern publishes documentation through its own workflow.
      publish-docs: false
      gh-release-from-tag: ${{ inputs.gh-release-from-tag || '' }}
      release-version: ${{ needs.bump.outputs.release-version || needs.build-wheel.outputs.version }}
      pypi-name: ${{ needs.build-wheel.outputs.pypi-name }}
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

  release-summary:
    needs: [release-workflow-tests, pre-flight, validate-inputs, bump, build-wheel, publish-wheel, finalize]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check release results
        env:
          NEEDS: ${{ toJSON(needs) }}
          PUBLISH_EXPECTED: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry-run }}
          RELEASE_SKIPPED: ${{ needs.pre-flight.outputs.docs_only == 'true' || needs.pre-flight.outputs.is_deployment_workflow == 'true' }}
        run: |
          jq -e 'all(.[]; .result != "failure" and .result != "cancelled")' <<< "$NEEDS"
          if [[ "$RELEASE_SKIPPED" == "true" ]]; then
            exit 0
          fi
          jq -e '[.["release-workflow-tests"], .["validate-inputs"], .bump, .["build-wheel"], .finalize] | all(.[]; .result == "success")' <<< "$NEEDS"
          if [[ "$PUBLISH_EXPECTED" == "true" ]]; then
            jq -e '.["publish-wheel"].result == "success"' <<< "$NEEDS"
          else
            jq -e '.["publish-wheel"].result == "skipped"' <<< "$NEEDS"
          fi
