name: "Build, validate, and release Automodel"

on:
  push:
    branches:
      - main
      - "r**"
      - "pull-request/**"
      - "deploy-release/*"
  workflow_dispatch:
    inputs:
      release-ref:
        description: Full 40-character commit SHA to release
        required: true
        type: string
      dry-run:
        description: Compute the release but do not publish wheel, GH release, or docs.
        required: true
        default: true
        type: boolean
      create-gh-release:
        description: Create a GitHub release
        required: true
        default: true
        type: boolean
      generate-changelog:
        description: Generate changelog
        required: false
        default: true
        type: boolean
      # Fern publishes documentation through its own workflow.
      publish-docs:
        # Sphinx docs (conf.py) were retired in favor of Fern; the Fern site
        # publishes via .github/workflows/publish-fern-docs.yml, not this
        # release pipeline. Default off so the FW-CI finalize stage skips its
        # Sphinx build-docs/publish-docs jobs (which would fail: no conf.py).
        description: Publish docs (Sphinx; retired — leave false, Fern publishes separately)
        required: false
        default: false
        type: boolean
      version-bump-branch:
        description: Branch for version bump
        required: true
        type: string
      gh-release-from-tag:
        description: Tag of previous release for changelog builder
        required: false
        type: string
        default: ""

defaults:
  run:
    shell: bash -x -e -u -o pipefail {0}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  pre-flight:
    if: github.event_name != 'workflow_dispatch'
    uses: NVIDIA-NeMo/FW-CI-templates/.github/workflows/_cicd_preflight.yml@037094bcc9138c72bc125418e6e3653f9e1c4160 # v1.11.0
    with:
      workflow_ref: 037094bcc9138c72bc125418e6e3653f9e1c4160  # pragma: allowlist secret

  validate-inputs:
    needs: [pre-flight]
    if: |
      !cancelled() && !failure()
      && !(needs.pre-flight.outputs.docs_only == 'true'
           || needs.pre-flight.outputs.is_deployment_workflow == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Validate immutable release ref
        env:
          RELEASE_REF: ${{ inputs.release-ref || github.sha }}
        run: |
          if [[ ! "$RELEASE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::release-ref must be a full 40-character commit SHA"
            exit 1
          fi

  bump:
    needs: [validate-inputs]
    if: |
      !cancelled() && !failure() && needs.validate-inputs.result == 'success'
    permissions:
      contents: write
      pull-requests: write
    uses: NVIDIA-NeMo/FW-CI-templates/.github/workflows/_release_bump.yml@2eee849aec3da7b625a798188a0e1ba603e448d8
    with:
      release-ref: ${{ inputs.release-ref || github.sha }}
      python-package: nemo_automodel
      library-name: NeMo-Automodel
      validate-only: ${{ github.event_name != 'workflow_dispatch' }}
      dry-run: ${{ inputs.dry-run || false }}
      version-bump-branch: ${{ inputs.version-bump-branch || github.ref_name }}
      packaging: uv
      has-src-dir: false
      app-id: ${{ vars.BOT_ID }}
      restrict-to-admins: true
    secrets:
      BOT_KEY: ${{ secrets.BOT_KEY }}

  build-wheel:
    needs: [bump, pre-flight]
    if: |
      !cancelled() && !failure() && needs.bump.result == 'success'
    permissions:
      contents: read
    uses: NVIDIA-NeMo/FW-CI-templates/.github/workflows/_build_test_wheel.yml@2eee849aec3da7b625a798188a0e1ba603e448d8
    with:
      python-package: nemo_automodel
      packaging: uv
      has-src-dir: false
      skip-test-wheel: true
      runner: linux-amd64-cpu16
      no-build-isolation: true
      ref: ${{ inputs.release-ref || github.sha }}

  publish-wheel:
    needs: build-wheel
    if: >-
      ${{ !cancelled() && !failure() && needs.build-wheel.result == 'success'
          && github.event_name == 'workflow_dispatch' && !inputs.dry-run
          && github.repository == 'NVIDIA-NeMo/Automodel' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/${{ needs.build-wheel.outputs.pypi-name }}/
    permissions:
      id-token: write
    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build-wheel.outputs.artifact-name }}
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  finalize:
    needs: [bump, build-wheel, publish-wheel, pre-flight]
    if: |
      !cancelled() && !failure() && needs.bump.result == 'success'
      && needs.build-wheel.result == 'success'
      && (github.event_name != 'workflow_dispatch' || inputs.dry-run || needs.publish-wheel.result == 'success')
    permissions:
      contents: write
    uses: NVIDIA-NeMo/FW-CI-templates/.github/workflows/_release_finalize.yml@2eee849aec3da7b625a798188a0e1ba603e448d8
    with:
      release-ref: ${{ inputs.release-ref || github.sha }}
      library-name: NeMo-Automodel
      validate-only: ${{ github.event_name != 'workflow_dispatch' }}
      dry-run: ${{ inputs.dry-run || false }}
      create-gh-release: ${{ github.event_name != 'workflow_dispatch' || inputs.create-gh-release }}
      app-id: ${{ vars.BOT_ID }}
      gh-release-use-changelog-builder: ${{ inputs.generate-changelog || false }}
      # Fern publishes documentation through its own workflow.
      publish-docs: ${{ inputs.publish-docs || false }}
      gh-release-from-tag: ${{ inputs.gh-release-from-tag || '' }}
      release-version: ${{ needs.bump.outputs.release-version || needs.build-wheel.outputs.version }}
      pypi-name: ${{ needs.build-wheel.outputs.pypi-name }}
    secrets: inherit  # pragma: allowlist secret

  release-summary:
    needs: [pre-flight, validate-inputs, bump, build-wheel, publish-wheel, finalize]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check release results
        env:
          NEEDS: ${{ toJSON(needs) }}
          PUBLISH_EXPECTED: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry-run }}
          RELEASE_SKIPPED: ${{ needs.pre-flight.outputs.docs_only == 'true' || needs.pre-flight.outputs.is_deployment_workflow == 'true' }}
        run: |
          jq -e 'all(.[]; .result != "failure" and .result != "cancelled")' <<< "$NEEDS"
          if [[ "$RELEASE_SKIPPED" == "true" ]]; then
            exit 0
          fi
          jq -e '[.["validate-inputs"], .bump, .["build-wheel"], .finalize] | all(.[]; .result == "success")' <<< "$NEEDS"
          if [[ "$PUBLISH_EXPECTED" == "true" ]]; then
            jq -e '.["publish-wheel"].result == "success"' <<< "$NEEDS"
          else
            jq -e '.["publish-wheel"].result == "skipped"' <<< "$NEEDS"
          fi
