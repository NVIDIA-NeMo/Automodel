name: "Code freeze"

on:
  workflow_dispatch:
    inputs:
      release-type:
        type: choice
        description: Type of release
        options:
          - major
          - minor
      freeze-commit:
        type: string
        description: Commit SHA to use for cut-off
        required: false
        default: main
      dry-run:
        type: boolean
        description: Dry-run of code-freeze
        required: false
        default: true

permissions:
  contents: read

jobs:
  code-freeze:
    uses: NVIDIA-NeMo/FW-CI-templates/.github/workflows/_code_freeze.yml@1ebb754bdbe6680cce2b3d81da4e63be7200380a
    with:
      release-environment: automodel-release
      freeze-source-branch: main
      library-name: NeMo-Automodel
      python-package: nemo_automodel
      has-src-dir: false
      release-type: ${{ inputs.release-type }}
      freeze-commit: ${{ inputs.freeze-commit }}
      dry-run: ${{ inputs.dry-run }}
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_RELEASE_ENDPOINT }}
      SLACK_WEBHOOK_ADMIN: ${{ secrets.SLACK_WEBHOOK_ADMIN }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  # bump-docs-versions: the Sphinx-era docs/versions1.json, docs/project.json,
  # and docs/conf.py no longer exist; Fern manages version metadata via
  # docs/fern/docs.yml `versions:` and docs/fern/versions/*.yml. The
  # equivalent step under Fern is to add a new version pin in those files
  # and tag docs/v<X>.<Y>.0 to trigger publish-fern-docs.yml — done by hand
  # at release cut time, not on every code freeze.
