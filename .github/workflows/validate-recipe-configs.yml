name: Validate recipe configs

on:
  pull_request:
    paths:
      - 'tests/ci_tests/configs/**'
      - 'examples/**/*.yaml'
      - 'examples/**/*.yml'
      - '.github/workflows/validate-recipe-configs.yml'
      - 'tests/ci_tests/utils/validate_nightly_recipes.py'
      - 'tests/ci_tests/utils/validate_generate_ci.py'
      - 'tests/ci_tests/utils/validate_new_recipe_ci.py'
      - 'tests/ci_tests/utils/generate_ci_tests.py'
      - 'tools/lint_example_yamls.py'
      - 'tools/recipes/**'
      - 'tests/unit_tests/tools/recipes/**'
      - 'tests/unit_tests/config/test_example_yaml_linter.py'

permissions:
  contents: read

jobs:
  validate-nightly-recipes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up UV
        uses: astral-sh/setup-uv@162b8acf397cb069dec09a3f5a9847cf71cfa46a # v1
        with:
          version: 0.8.22

      - name: Check recipes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: uv run --script tools/recipes/check_recipes.py --base-ref "$BASE_SHA" --head-ref "$HEAD_SHA"

      - name: Test recipe checker
        run: |
          uv run --no-project --isolated --python 3.12 \
            --with pytest --with pytest-timeout --with pyyaml --with ruamel.yaml \
            python -m pytest -q --noconftest tests/unit_tests/tools/recipes
