name: ~Update dependencies template
on:
  workflow_call:
    inputs:
      target-branch:
        required: true
        type: string
        description: "The target branch to bump"
    secrets:
      PR_APP_PRIVATE_KEY:
        required: true
      SSH_KEY:
        required: true
      SSH_PWD:
        required: true

permissions: {}

jobs:
  pre-flight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      bump-branch: bump-ci-container-${{ steps.ref.outputs.date }}-${{ inputs.target-branch }}
      date: ${{ steps.ref.outputs.date }}
    steps:
      - name: Get date
        id: ref
        run: echo "date=$(date +%F)" | tee -a "$GITHUB_OUTPUT"

  update-lockfile:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: [pre-flight]
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    env:
      SOURCE_BRANCH: ${{ needs.pre-flight.outputs.bump-branch }}
      TARGET_BRANCH: ${{ inputs.target-branch }}
    steps:
      - name: Select the revision to upgrade
        id: source
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads "https://github.com/$GITHUB_REPOSITORY.git" "refs/heads/$SOURCE_BRANCH"; then
            ref=$SOURCE_BRANCH
          else
            status=$?
            [[ "$status" == 2 ]] || exit "$status"
            ref=$TARGET_BRANCH
          fi
          echo "ref=$ref" | tee -a "$GITHUB_OUTPUT"

      - name: Checkout repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.source.outputs.ref }}
          persist-credentials: false

      # uv resolves with the .python-version interpreter (3.12). With --upgrade it rebuilds the
      # metadata of git dependencies, and mixture-of-kittens requires Python 3.12.
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version

      # Same uv version as uv-lock-generation.yml, so the bump does not churn the lock format.
      - name: Set up UV
        uses: astral-sh/setup-uv@162b8acf397cb069dec09a3f5a9847cf71cfa46a # v1
        with:
          version: 0.8.22

      - name: Upgrade lock files
        run: |
          set -e
          uv lock --upgrade

          # Images built on the PyTorch base install from docker/common/uv-pytorch.lock.
          mv uv.lock uv_main.lock
          bash docker/common/update_pyproject_pytorch.sh "$GITHUB_WORKSPACE"
          uv lock --upgrade
          mv uv.lock docker/common/uv-pytorch.lock
          mv uv_main.lock uv.lock

      - name: Upload lock files
        id: upload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: lock-file-${{ env.SOURCE_BRANCH }}-${{ github.run_attempt }}
          path: |
            uv.lock
            docker/common/uv-pytorch.lock

  create-pr:
    permissions:
      contents: write
    needs: [update-lockfile, pre-flight]
    runs-on: ubuntu-latest
    environment: main
    outputs:
      pr-number: ${{ steps.create-pull-request.outputs.pull-request-number }}
    env:
      SOURCE_BRANCH: ${{ needs.pre-flight.outputs.bump-branch }}
      TARGET_BRANCH: ${{ inputs.target-branch }}
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.TARGET_BRANCH }}
          persist-credentials: false

      - name: Install GPG
        run: |
          for i in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y gnupg2 && break
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec # v6.3.0
        with:
          gpg_private_key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PWD }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Download lock file
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: ${{ needs.update-lockfile.outputs.artifact_id }}
          path: ${{ runner.temp }}/dependency-locks

      - name: Stage the two lock files for the bump
        run: |
          cp -- "$RUNNER_TEMP/dependency-locks/uv.lock" uv.lock
          cp -- "$RUNNER_TEMP/dependency-locks/docker/common/uv-pytorch.lock" docker/common/uv-pytorch.lock

      - name: Create token to manage the bump pull request
        id: pr-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.PR_APP_ID }}
          private-key: ${{ secrets.PR_APP_PRIVATE_KEY }}
          permission-pull-requests: write

      - name: Create Bump PR
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6
        id: create-pull-request
        env:
          title: "chore(beep boop 🤖): Bump `uv.lock` (${{ inputs.target-branch}}) (${{ needs.pre-flight.outputs.date }})"
        with:
          branch: ${{ env.SOURCE_BRANCH }}
          base: ${{ env.TARGET_BRANCH }}
          title: ${{ env.title }}
          token: ${{ steps.pr-token.outputs.token }}
          git-token: ${{ github.token }}
          add-paths: |
            uv.lock
            docker/common/uv-pytorch.lock
          body: |
            🚀 PR to bump `uv.lock` in `${{ inputs.target-branch }}`.  

            📝 This PR will be automatically merged if all CI checks pass successfully.
            If any CI checks fail, the PR will remain open for manual review.

            🤖 **Auto-merge enabled** - No manual action required if CI passes.
          commit-message: ${{ env.title }}
          signoff: true

  auto-merge:
    needs: [create-pr, pre-flight]
    runs-on: ubuntu-latest
    if: needs.create-pr.outputs.pr-number != ''
    env:
      PR_NUMBER: ${{ needs.create-pr.outputs.pr-number }}
      TARGET_BRANCH: ${{ inputs.target-branch }}
      GH_TOKEN: ${{ secrets.PAT }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}

      - name: Wait for CI checks and auto-merge
        run: |
          echo "Monitoring PR #${PR_NUMBER} for CI check completion..."
          
          MAX_ATTEMPTS=144  # Wait up to 12 hours (144 attempts * 5 minutes)
          ATTEMPT=0
          
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS: Checking CI status..."
            
            # Get PR status checks
            STATUS_JSON=$(gh pr view ${PR_NUMBER} --json statusCheckRollup)
            
            # Count total checks, successful checks, and failed checks
            TOTAL_CHECKS=$(echo "$STATUS_JSON" | jq '.statusCheckRollup | length')
            
            if [ "$TOTAL_CHECKS" -eq 0 ]; then
              echo "No status checks found yet. Waiting..."
              sleep 300
              continue
            fi
            
            PENDING_CHECKS=$(echo "$STATUS_JSON" | jq '[.statusCheckRollup[] | select(.conclusion == null or .conclusion == "" or .status == "IN_PROGRESS" or .status == "PENDING" or .status == "QUEUED")] | length')
            FAILED_CHECKS=$(echo "$STATUS_JSON" | jq '[.statusCheckRollup[] | select(.conclusion == "FAILURE" or .conclusion == "CANCELLED" or .conclusion == "TIMED_OUT")] | length')
            SUCCESS_CHECKS=$(echo "$STATUS_JSON" | jq '[.statusCheckRollup[] | select(.conclusion == "SUCCESS")] | length')
            
            echo "Status: $SUCCESS_CHECKS successful, $FAILED_CHECKS failed, $PENDING_CHECKS pending (out of $TOTAL_CHECKS total)"
            
            # If any checks failed, exit and leave PR open
            if [ "$FAILED_CHECKS" -gt 0 ]; then
              echo "❌ CI checks failed. Leaving PR open for manual review."
              echo "Failed checks:"
              echo "$STATUS_JSON" | jq -r '.statusCheckRollup[] | select(.conclusion == "FAILURE" or .conclusion == "CANCELLED" or .conclusion == "TIMED_OUT") | "  - \(.name): \(.conclusion)"'
              exit 0
            fi
            
            # If all checks are done and successful, merge
            if [ "$PENDING_CHECKS" -eq 0 ] && [ "$SUCCESS_CHECKS" -gt 0 ]; then
              echo "✅ All CI checks passed! Auto-merging PR #${PR_NUMBER}..."
              
              # Merge the PR
              gh pr merge ${PR_NUMBER} --squash --auto --delete-branch
              
              echo "✅ PR #${PR_NUMBER} has been merged successfully!"
              exit 0
            fi
            
            # Still waiting for checks to complete
            echo "Waiting for pending checks to complete..."
            sleep 300
          done
          
          echo "⏱️  Timeout reached. PR #${PR_NUMBER} will remain open for manual review."
          exit 0
