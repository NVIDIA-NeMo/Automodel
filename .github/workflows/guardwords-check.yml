name: Guardwords check

on:
  push:
    branches: ["pull-request/[0-9]+"]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-info:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      pr-number: ${{ steps.verify.outputs.number }}
      base-sha: ${{ steps.verify.outputs.base }}
    steps:
      - name: Verify the approved PR mirror
        id: verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^pull-request/([1-9][0-9]*)$ ]]
          number=${BASH_REMATCH[1]}
          refs=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number" --jq '[.base.sha, .head.sha] | @tsv')
          IFS=$'\t' read -r base head <<< "$refs"
          if [[ ! "$base" =~ ^[0-9a-f]{40}$ || "$head" != "$GITHUB_SHA" ]]; then
            echo "::error::The mirror does not match the current PR head and base."
            exit 1
          fi
          printf 'number=%s\nbase=%s\n' "$number" "$base" | tee -a "$GITHUB_OUTPUT"

  guardwords-check:
    needs: pr-info
    uses: NVIDIA-NeMo/FW-CI-templates/.github/workflows/_guardwords_check.yml@1ebb754bdbe6680cce2b3d81da4e63be7200380a
    with:
      base-sha: ${{ needs.pr-info.outputs.base-sha }}
      head-sha: ${{ github.sha }}
      pr-number: ${{ fromJSON(needs.pr-info.outputs.pr-number) }}
    secrets:
      GUARDWORDS_DEPLOY_KEY: ${{ secrets.GUARDWORDS_DEPLOY_KEY }}
