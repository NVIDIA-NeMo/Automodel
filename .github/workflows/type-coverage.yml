name: Python type coverage

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  type-coverage:
    name: Python annotation coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Test coverage reporter
        run: python -m unittest discover -s tests/unit_tests/tools -p test_type_coverage.py
      - name: Report annotation coverage
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          args=(--head "$HEAD_SHA" --output-dir type-coverage)
          if [[ -n "$BASE_SHA" ]]; then
            args+=(--base "$BASE_SHA")
          fi
          python tools/type_coverage.py "${args[@]}"
          tee -a "$GITHUB_STEP_SUMMARY" < type-coverage/summary.md
      - name: Upload annotation coverage
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: type-coverage
          path: type-coverage/
          if-no-files-found: error
          retention-days: 14
