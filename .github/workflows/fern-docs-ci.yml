# Validates Fern docs configuration on pull requests.

name: Fern docs (check)

# Runs the shared docs check on every push to a `pull-request/<n>` branch -- i.e. whenever
# `/ok to test <sha>` is posted: copy-pr-bot copies the PR onto pull-request/<n>
# and pushes it, which fires this (exactly like the main `CICD NeMo` pipeline).
#
# Deliberately NO `paths:` filter. GitHub evaluates a push `paths:` filter against
# the branch-creation diff, which is unreliable for the first push copy-pr-bot
# makes to a brand-new pull-request/<n> branch, so a docs-only PR can skip a
# path-filtered check entirely -- that is how a malformed nightly.yml slipped past
# CI and broke the publish on main. cicd-main.yml omits the filter for the same
# reason. The shared check needs no secrets and runs on every mirror push.
on:
  push:
    branches:
      - "pull-request/[0-9]+"

permissions:
  contents: read

env:
  FERN_NO_VERSION_REDIRECTION: "true"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up UV
        uses: astral-sh/setup-uv@162b8acf397cb069dec09a3f5a9847cf71cfa46a # v1
        with:
          version: 0.8.22

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'

      - name: Check documentation
        # Single validation entry point, also used by contributors and agents.
        run: uv run --script tools/docs/check_docs.py

      - name: Test documentation tools
        # Regression tests exercise tool behavior; validation rules live in tools/docs.
        run: |
          uv run --no-project --isolated --python 3.12 \
            --with pytest --with pytest-timeout --with pyyaml --with pillow \
            python -m pytest -q --noconftest -o 'norecursedirs=.* node_modules __pycache__' \
            tests/unit_tests/tools/docs
