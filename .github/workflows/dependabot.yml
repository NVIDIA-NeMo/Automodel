name: Dependabot
on:
  schedule:
    - cron: 0 0 * * 1 # Run at midnight UTC on Mondays
  workflow_dispatch: # Allow manual triggering

permissions: {}

jobs:
  get-release-branch-names:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    outputs:
      automodel: ${{ steps.get-branch.outputs.automodel_release_branch }}
    steps:
      - name: Get release branch names
        id: get-branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest_branch=$(gh api --paginate "repos/$GITHUB_REPOSITORY/branches?protected=true&per_page=100" \
            --jq '.[].name | select(test("^r[0-9]+[.][0-9]+[.][0-9]+$"))' | sort -V | tail -n1)
          test -n "$latest_branch"
          echo "automodel_release_branch=$latest_branch" | tee -a "$GITHUB_OUTPUT"

  bump-tags:
    needs: [get-release-branch-names]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target-branch: ${{ needs.get-release-branch-names.outputs.automodel }}
          - target-branch: main
    uses: ./.github/workflows/_update_dependencies.yml
    with:
      target-branch: ${{ matrix.target-branch }}
    secrets:
      PR_APP_PRIVATE_KEY: ${{ secrets.PR_APP_PRIVATE_KEY }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      SSH_PWD: ${{ secrets.SSH_PWD }}

  notify:
    if: failure()
    needs: [bump-tags]
    permissions: {}
    uses: ./.github/workflows/_notify-ci-failure.yml
    secrets:
      SLACK_CI_CHANNEL_WEBHOOK: ${{ secrets.SLACK_CI_CHANNEL_WEBHOOK }}
      SLACK_TEAM_GROUP_ID: ${{ secrets.SLACK_TEAM_GROUP_ID }}
