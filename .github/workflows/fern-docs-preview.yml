name: Preview Fern Docs

on:
  push:
    branches:
      - "pull-request/[0-9]+"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FERN_NO_VERSION_REDIRECTION: "true"

jobs:
  changed-files:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs: ${{ steps.changed-files.outputs.docs_any_changed }}
    steps:
      - name: Checkout approved PR mirror
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Get PR info
        id: get-pr-info
        uses: nv-gha-runners/get-pr-info@090577647b8ddc4e06e809e264f7881650ecdccf # main
      - name: Get changed files
        id: changed-files
        uses: step-security/changed-files@2e07db73e5ccdb319b9a6c7766bd46d39d304bad # v47.0.5
        with:
          base_sha: ${{ fromJSON(steps.get-pr-info.outputs.pr-info).base.sha }}
          sha: ${{ github.sha }}
          files_yaml: |
            docs:
              - docs/**
              - nemo_automodel/_transformers/registry.py
              - examples/**
              - tests/unit_tests/_transformers/test_doc_coverage.py
              - tests/ci_tests/utils/sync_model_coverage_tables.py
              - tools/apply_fern_code_styles.py
              - .github/workflows/fern-docs-ci.yml
              - .github/workflows/fern-docs-preview.yml
      - name: Report docs preview gate
        env:
          DOCS_CHANGED: ${{ steps.changed-files.outputs.docs_any_changed }}
        run: |
          printf 'Docs or preview workflow changed: %s\n' "$DOCS_CHANGED" | tee -a "$GITHUB_STEP_SUMMARY"

  preview:
    needs: changed-files
    # An approved upstream mirror is the trust boundary, even for a fork PR.
    # The original PR head repository does not change when its commit is mirrored.
    if: >-
      github.repository == 'NVIDIA-NeMo/Automodel' &&
      needs.changed-files.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Verify current PR against mirror push
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" =~ ^refs/heads/pull-request/([1-9][0-9]*)$ ]]
          PR_NUMBER=${BASH_REMATCH[1]}
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" | jq -e \
            --arg repo "$GITHUB_REPOSITORY" --arg sha "$GITHUB_SHA" --argjson number "$PR_NUMBER" \
            '.number == $number and .state == "open" and .head.sha == $sha and
             .base.repo.full_name == $repo'
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted configuration
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          path: trusted-source
          persist-credentials: false

      - name: Checkout approved PR content
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: pr-source
          persist-credentials: false

      - name: Checkout archived version pages
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: docs-archive
          path: archived-source
          persist-credentials: false

      - name: Restore trusted archived pages
        run: |
          set -euo pipefail
          test -z "$(find pr-source/docs -type l -print -quit)"
          for VERSION in v0.4 v0.5; do
            ROOT="docs/fern/versions/$VERSION/pages"
            test -d "archived-source/$ROOT"
            rm -rf "pr-source/$ROOT"
            mkdir -p "pr-source/$(dirname "$ROOT")"
            cp -R "archived-source/$ROOT" "pr-source/$ROOT"
          done

          # Pin links to retired recipes without changing archived prose/layout.
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          snapshot = "291a8f21681d86f0dbb4f91fb906d5219ea0d07a"
          source = Path("pr-source")
          pattern = re.compile(r"https://github\.com/NVIDIA-NeMo/Automodel/blob/main/(examples/[^\s)#]+\.ya?ml)")
          for page in (source / "docs/fern/versions").glob("v*/pages/**/*"):
              if not page.is_file() or page.suffix not in {".md", ".mdx"}:
                  continue
              def pin(match):
                  recipe = match.group(1)
                  exists = subprocess.run(["git", "-C", str(source), "cat-file", "-e", f"{snapshot}:{recipe}"], capture_output=True).returncode == 0
                  return match.group(0).replace("/blob/main/", f"/blob/{snapshot}/") if not (source / recipe).is_file() and exists else match.group(0)
              page.write_text(pattern.sub(pin, page.read_text()))
          PY

      - name: Generate model coverage tables with trusted tooling
        run: |
          set -euo pipefail
          # Replace the helper, not the PR model/document data it inspects.
          # Only inspect coverage inputs; unrelated source documentation may be symlinked.
          test ! -L pr-source/nemo_automodel
          test -z "$(find pr-source/tests pr-source/examples pr-source/nemo_automodel/_transformers -type l -print -quit)"
          test -z "$(find pr-source/docs -type l -print -quit)"
          cp trusted-source/tests/ci_tests/utils/sync_model_coverage_tables.py \
            pr-source/tests/ci_tests/utils/sync_model_coverage_tables.py
          python3 -I pr-source/tests/ci_tests/utils/sync_model_coverage_tables.py

      - name: Prepare preview docs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fern-preview"
          CONTENT='.*\.(md|mdx|png|jpg|jpeg|gif|svg|webp|ico|pdf)'
          for ROOT in docs; do
            test -d "pr-source/$ROOT"
            test -z "$(find "pr-source/$ROOT" -type l -print -quit)"
            mkdir -p "$RUNNER_TEMP/fern-preview/$(dirname "$ROOT")"
            cp -R "trusted-source/$ROOT" "$RUNNER_TEMP/fern-preview/$ROOT"
            # Keep newer main pages as fallbacks, but honor explicit PR deletions.
            BASE=$(git -C pr-source merge-base HEAD refs/remotes/origin/main)
            git -C pr-source diff --no-renames --diff-filter=D --name-only -z \
              "$BASE" HEAD -- "$ROOT/" > "$RUNNER_TEMP/fern-deleted-paths"
            while IFS= read -r -d '' path; do
              case "$path" in
                */.*|*/components/*) continue ;;
              esac
              case "$path" in
                *.md|*.mdx|*.png|*.jpg|*.jpeg|*.gif|*.svg|*.webp|*.ico|*.pdf)
                  rm -f -- "$RUNNER_TEMP/fern-preview/$path" ;;
              esac
            done < "$RUNNER_TEMP/fern-deleted-paths"
            # Navigation, components and tooling stay on the trusted branch.
            (cd pr-source && find "$ROOT" -regextype posix-extended -type f \
              -regex "$CONTENT" ! -path '*/.*' ! -path '*/components/*' \
              -exec cp --parents -- '{}' "$RUNNER_TEMP/fern-preview/" \;)
          done
          printf '%s\n' '{"organization":"nvidia","version":"5.139.0"}' \
            > "$RUNNER_TEMP/fern-preview/docs/fern/fern.config.json"

      - name: Resolve model card paths in trusted navigation
        run: |
          python3 -I - <<'PYCODE'
          import copy
          import os
          import re
          from pathlib import Path

          import yaml

          preview = Path(os.environ["RUNNER_TEMP"]) / "fern-preview"
          navigation_file = preview / "docs/fern/versions/nightly.yml"
          navigation = yaml.safe_load(navigation_file.read_text(encoding="utf-8"))
          coverage = next(item for item in navigation["navigation"] if item.get("section") == "Model Coverage")
          categories = {item["slug"]: item for item in coverage["contents"] if "section" in item}
          providers = {
              item["slug"]: item
              for category in categories.values()
              for item in category["contents"]
              if "section" in item
          }
          directories = {
              "llm": "large-language-models", "vlm": "vision-language-models",
              "multimodal": "multimodal", "omni": "omni", "dllm": "dllm",
              "diffusion": "diffusion", "embedding": "embedding-models", "reranker": "reranking-models",
          }
          canonical_routes = set()
          # Derive only card entries from content. Components, tooling, and all
          # other navigation/configuration remain from the trusted checkout.
          for directory, category_slug in directories.items():
              category = categories[category_slug]
              for card in sorted((preview / "docs/model-coverage" / directory).glob("*/*.mdx")):
                  if card.stem == "index":
                      continue
                  provider_slug = card.parent.name
                  if not all(re.fullmatch(r"[\w.-]+", name) for name in (provider_slug, card.stem)):
                      raise ValueError(f"Invalid model card path: {card}")
                  metadata = yaml.safe_load(card.read_text(encoding="utf-8").split("---", 2)[1])
                  expected_slug = f"model-coverage/{category_slug}/{provider_slug}/{card.stem}"
                  if metadata.get("slug") != expected_slug:
                      raise ValueError(f"Model card filename must match its public checkpoint URL: {card}")
                  canonical_routes.add("/" + expected_slug.casefold())
                  provider = next((item for item in category["contents"] if item.get("slug") == provider_slug), None)
                  if provider is None:
                      # Reuse an existing trusted provider's name and icon.
                      trusted_provider = providers[provider_slug]
                      provider = {key: copy.deepcopy(trusted_provider[key]) for key in ("section", "slug", "icon")}
                      provider["path"] = f"../../model-coverage/{directory}/{provider_slug}/index.mdx"
                      provider["contents"] = []
                      category["contents"].append(provider)
                  page = next((item for item in provider["contents"] if item.get("page") == card.stem), None)
                  if page is None:
                      page = {"page": card.stem}
                      provider["contents"].append(page)
                  page["path"] = "../../" + card.relative_to(preview / "docs").as_posix()
                  provider["contents"].sort(key=lambda item: item["page"].casefold())
              overview = [item for item in category["contents"] if "section" not in item]
              sections = []
              for provider in (item for item in category["contents"] if "section" in item):
                  # Explicit PR deletions remove the page and its trusted-main
                  # navigation entry. Keep providers with surviving cards.
                  provider["contents"] = [
                      page for page in provider["contents"]
                      if (navigation_file.parent / page["path"]).is_file()
                  ]
                  if provider["contents"]:
                      sections.append(provider)
              sections.sort(key=lambda item: item["section"].casefold())
              category["contents"] = overview + sections
          navigation_file.write_text(yaml.safe_dump(navigation, sort_keys=False), encoding="utf-8")

          config_file = preview / "docs/fern/docs.yml"
          config = yaml.safe_load(config_file.read_text(encoding="utf-8"))
          # A newly restored canonical card supersedes main's retired-page alias.
          config["redirects"] = [
              item for item in config["redirects"]
              if item["source"].removeprefix("/nemo/automodel/nightly").removeprefix("/nemo/automodel").casefold()
              not in canonical_routes
          ]
          config_file.write_text(yaml.safe_dump(config, sort_keys=False), encoding="utf-8")
          PYCODE

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'

      - name: Install fixed Fern CLI
        working-directory: ${{ runner.temp }}
        run: npm install --prefix "$RUNNER_TEMP/fern-cli" --ignore-scripts --no-audit --no-fund fern-api@5.139.0

      - name: Generate library reference with trusted configuration
        env:
          FERN_TOKEN: ${{ secrets.DOCS_FERN_TOKEN }}
        working-directory: ${{ runner.temp }}/fern-preview/docs/fern
        run: '"$RUNNER_TEMP/fern-cli/node_modules/.bin/fern" docs md generate'

      - name: Style generated pages with trusted tooling
        run: python3 -I trusted-source/tools/apply_fern_code_styles.py --repo-root "$RUNNER_TEMP/fern-preview"

      - name: Generate preview
        env:
          FERN_TOKEN: ${{ secrets.DOCS_FERN_TOKEN }}
          FERN_DOCS_DEPLOY_MODE: ledger
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        working-directory: ${{ runner.temp }}/fern-preview/docs/fern
        run: |
          set -euo pipefail
          # Preserve diagnostics in the job log and fail if Fern or tee fails.
          "$RUNNER_TEMP/fern-cli/node_modules/.bin/fern" generate --docs --preview \
            --id "pr-${PR_NUMBER}-${GITHUB_SHA:0:12}" 2>&1 | tee "$RUNNER_TEMP/fern-preview.log"

      - name: Read preview URL without credentials
        id: preview
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          URL=$(sed -n 's/^.*Published docs to \(https:\/\/[^ ]*\) (.*/\1/p' "$RUNNER_TEMP/fern-preview.log")
          HOST="nvidia-preview-pr-${PR_NUMBER}-${GITHUB_SHA:0:12}.docs.buildwithfern.com"
          [[ "$URL" == "https://$HOST" || "$URL" == "https://$HOST/"* ]]
          PATH_PART=${URL#"https://$HOST"}
          [[ "$PATH_PART" =~ ^(/[a-zA-Z0-9/_-]*)?$ ]]
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Post or update preview comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" | jq -e \
            --arg sha "$GITHUB_SHA" '.state == "open" and .head.sha == $sha'
          BODY=$(printf ':herb: **Preview your docs:** <%s>\n\n<!-- preview-docs -->' "$PREVIEW_URL")
          COMMENT_ID=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- preview-docs -->"))) | .id' | head -1)
          if [ -n "$COMMENT_ID" ]; then
            gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" -X PATCH -f body="$BODY"
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$BODY"
          fi

  clear-preview:
    needs: changed-files
    if: >-
      github.repository == 'NVIDIA-NeMo/Automodel' &&
      needs.changed-files.outputs.docs == 'false'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Remove stale preview comments after docs changes are reverted
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" =~ ^refs/heads/pull-request/([1-9][0-9]*)$ ]]
          PR_NUMBER=${BASH_REMATCH[1]}
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" | jq -e \
            --arg repo "$GITHUB_REPOSITORY" --arg sha "$GITHUB_SHA" --argjson number "$PR_NUMBER" \
            '.number == $number and .state == "open" and .head.sha == $sha and
             .base.repo.full_name == $repo'
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- preview-docs -->"))) | .id' \
            > "$RUNNER_TEMP/fern-preview-comments"
          while IFS= read -r comment; do
            [[ "$comment" =~ ^[1-9][0-9]*$ ]]
            gh api "repos/$GITHUB_REPOSITORY/issues/comments/$comment" -X DELETE
          done < "$RUNNER_TEMP/fern-preview-comments"
