name: Preview Fern Docs

on:
  push:
    branches:
      - "pull-request/[0-9]+"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FERN_NO_VERSION_REDIRECTION: "true"

jobs:
  changed-files:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs: ${{ steps.changed-files.outputs.docs_any_changed }}
    steps:
      - name: Checkout approved PR mirror
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Get PR info
        id: get-pr-info
        uses: nv-gha-runners/get-pr-info@090577647b8ddc4e06e809e264f7881650ecdccf # main
      - name: Get changed files
        id: changed-files
        uses: step-security/changed-files@2e07db73e5ccdb319b9a6c7766bd46d39d304bad # v47.0.5
        with:
          base_sha: ${{ fromJSON(steps.get-pr-info.outputs.pr-info).base.sha }}
          sha: ${{ github.sha }}
          files_yaml: |
            docs:
              - docs/**
              - nemo_automodel/_transformers/registry.py
              - examples/**
              - tools/docs/**
              - tests/unit_tests/tools/docs/**
              - .github/workflows/fern-docs-ci.yml
              - .github/workflows/fern-docs-preview.yml
      - name: Report docs preview gate
        env:
          DOCS_CHANGED: ${{ steps.changed-files.outputs.docs_any_changed }}
        run: |
          printf 'Docs or preview workflow changed: %s\n' "$DOCS_CHANGED" | tee -a "$GITHUB_STEP_SUMMARY"

  preview:
    needs: changed-files
    # An approved upstream mirror is the trust boundary, even for a fork PR.
    # The original PR head repository does not change when its commit is mirrored.
    if: >-
      github.repository == 'NVIDIA-NeMo/Automodel' &&
      needs.changed-files.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Verify current PR against mirror push
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" =~ ^refs/heads/pull-request/([1-9][0-9]*)$ ]]
          PR_NUMBER=${BASH_REMATCH[1]}
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" | jq -e \
            --arg repo "$GITHUB_REPOSITORY" --arg sha "$GITHUB_SHA" --argjson number "$PR_NUMBER" \
            '.number == $number and .state == "open" and .head.sha == $sha and
             .base.repo.full_name == $repo'
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted configuration
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          path: trusted-source
          persist-credentials: false

      - name: Checkout approved PR content
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: pr-source
          persist-credentials: false

      - name: Checkout archived version pages
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: docs-archive
          path: archived-source
          persist-credentials: false

      - name: Restore trusted archived pages
        run: |
          set -euo pipefail
          test -z "$(find pr-source/docs -type l -print -quit)"
          for VERSION in v0.4 v0.5 v0.7; do
            ROOT="docs/fern/versions/$VERSION/pages"
            test -d "archived-source/$ROOT"
            rm -rf "pr-source/$ROOT"
            mkdir -p "pr-source/$(dirname "$ROOT")"
            cp -R "archived-source/$ROOT" "pr-source/$ROOT"
          done

      - name: Generate model coverage tables with trusted tooling
        run: |
          set -euo pipefail
          # Execute trusted code against PR data, without importing PR modules.
          # Only inspect coverage inputs; unrelated source documentation may be symlinked.
          test ! -L pr-source/nemo_automodel
          test ! -L pr-source/tools
          test ! -L pr-source/tools/docs
          if test -d pr-source/tools/docs; then
            test -z "$(find pr-source/tools/docs -type l -print -quit)"
          fi
          test -z "$(find pr-source/tests pr-source/examples pr-source/nemo_automodel/_transformers -type l -print -quit)"
          test -z "$(find pr-source/docs -type l -print -quit)"
          python3 -I - <<'PY'
          from pathlib import Path
          import runpy
          import sys

          # Isolated Python may import packages only from the trusted checkout.
          sys.path.insert(0, str(Path("trusted-source").resolve()))
          repo_root = Path("pr-source").resolve()
          tool = Path("trusted-source/tools/docs/build/coverage_tables.py")
          # Remove the fallback once tools/docs is present on main.
          if not tool.is_file():
              tool = Path("trusted-source/tests/ci_tests/utils/sync_model_coverage_tables.py")
              # Old trusted tooling reads literal alias data from the former test path.
              catalog = repo_root / "tools/docs/catalog.py"
              if catalog.is_file():
                  aliases = repo_root / "tests/unit_tests/_transformers/test_doc_coverage.py"
                  aliases.parent.mkdir(parents=True, exist_ok=True)
                  aliases.write_text(catalog.read_text(encoding="utf-8"), encoding="utf-8")
          helpers = runpy.run_path(str(tool))
          helpers["_sync_tables"](repo_root, check=False)
          PY

      - name: Prepare preview docs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fern-preview"
          CONTENT='.*\.(md|mdx|png|jpg|jpeg|gif|svg|webp|ico|pdf)'
          for ROOT in docs; do
            test -d "pr-source/$ROOT"
            test -z "$(find "pr-source/$ROOT" -type l -print -quit)"
            mkdir -p "$RUNNER_TEMP/fern-preview/$(dirname "$ROOT")"
            cp -R "trusted-source/$ROOT" "$RUNNER_TEMP/fern-preview/$ROOT"
            # Retain pages and assets that archived navigation or retained pages
            # still reference when the PR moves or deletes content. Site config,
            # components and tooling stay on main; nightly navigation is validated
            # separately before it replaces the trusted navigation.
            (cd pr-source && find "$ROOT" -regextype posix-extended -type f \
              -regex "$CONTENT" ! -path '*/.*' ! -path '*/components/*' \
              -exec cp --parents -- '{}' "$RUNNER_TEMP/fern-preview/" \;)
          done
          printf '%s\n' '{"organization":"nvidia","version":"5.139.0"}' \
            > "$RUNNER_TEMP/fern-preview/docs/fern/fern.config.json"

      - name: Set up UV
        uses: astral-sh/setup-uv@162b8acf397cb069dec09a3f5a9847cf71cfa46a # v1
        with:
          version: 0.8.22

      - name: Use validated PR nightly navigation
        run: |
          uv run --no-project --isolated --python 3.12 --with pyyaml==6.0.3 python -I - <<'PY'
          import base64
          import binascii
          import os
          import re
          from pathlib import Path

          import yaml

          docs = (Path(os.environ["RUNNER_TEMP"]) / "fern-preview/docs").resolve()
          destination = docs / "fern/versions/nightly.yml"
          trusted = yaml.safe_load(destination.read_text())
          proposed = yaml.safe_load(Path("pr-source/docs/fern/versions/nightly.yml").read_text())

          def entries(items):
              for item in items:
                  yield item
                  yield from entries(item.get("contents", []))

          trusted_folders = {item["folder"] for item in entries(trusted["navigation"]) if "folder" in item}
          trusted_icons = {item["icon"] for item in entries(trusted["navigation"]) if "icon" in item}
          # New providers use the generator's fixed SVG wrapper around raster data.
          # Never allow arbitrary PR SVG markup, attributes, paths or remote URLs.
          provider_icon = re.compile(
              r'<svg xmlns="http://www\.w3\.org/2000/svg" viewBox="0 0 20 20">'
              r'<image width="20" height="20" href="data:image/webp;base64,([A-Za-z0-9+/=]+)"/></svg>'
          )

          def valid_icon(icon: object) -> bool:
              if not isinstance(icon, str):
                  return False
              if icon in trusted_icons:
                  return True
              if len(icon) > 16 * 1024:
                  return False
              match = provider_icon.fullmatch(icon)
              if match is None:
                  return False
              try:
                  image = base64.b64decode(match[1], validate=True)
              except binascii.Error:
                  return False
              return (
                  base64.b64encode(image).decode("ascii") == match[1]
                  and image[:4] == b"RIFF"
                  and image[8:12] == b"WEBP"
                  and image[12:16] in {b"VP8 ", b"VP8L", b"VP8X"}
                  and int.from_bytes(image[4:8], "little") == len(image) - 8
              )

          allowed_keys = {
              "page": {"page", "path", "slug"},
              "section": {"section", "path", "contents", "slug", "skip-slug", "icon"},
              "folder": {"folder"},
          }

          published_pages = set()

          def validate(items, depth=0):
              if not isinstance(items, list) or depth > 20:
                  raise ValueError("Navigation must be a finite list of pages and sections")
              for item in items:
                  if not isinstance(item, dict):
                      raise ValueError("Navigation entries must be mappings")
                  kinds = item.keys() & allowed_keys.keys()
                  if len(kinds) != 1:
                      raise ValueError("Only page, section, and trusted folder entries are supported")
                  kind = next(iter(kinds))
                  if item.keys() - allowed_keys[kind] or not isinstance(item[kind], str):
                      raise ValueError("Unsupported navigation fields")
                  if "slug" in item and not isinstance(item["slug"], str):
                      raise ValueError("Navigation slugs must be strings")
                  if "skip-slug" in item and not isinstance(item["skip-slug"], bool):
                      raise ValueError("skip-slug must be a boolean")
                  if "icon" in item and not valid_icon(item["icon"]):
                      raise ValueError("Preview icons must be trusted or compact embedded WebP provider logos")
                  if kind == "folder" and item["folder"] not in trusted_folders:
                      raise ValueError("Generated folders must come from trusted navigation")
                  if kind == "page" and "path" not in item:
                      raise ValueError("Pages must reference a documentation file")
                  if "path" in item:
                      path = item["path"]
                      if not isinstance(path, str) or Path(path).is_absolute() or ":" in path or "\\" in path:
                          raise ValueError("Page paths must be relative documentation paths")
                      target = (destination.parent / path).resolve()
                      if (
                          not target.is_relative_to(docs)
                          or target == docs
                          or target.relative_to(docs).parts[0] == "fern"
                      ):
                          raise ValueError("Nightly pages must stay in the documentation content tree")
                      if target.suffix not in {".md", ".mdx"} or not target.is_file():
                          raise ValueError("Navigation paths must reference existing Markdown pages")
                      header = re.match(r"\A---\r?\n(.*?)\r?\n---(?:\r?\n|$)", target.read_text(), re.DOTALL)
                      if header:
                          metadata = yaml.safe_load(header[1])
                          slug = metadata.get("slug") if isinstance(metadata, dict) else None
                          if isinstance(slug, str) and re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._/-]*", slug):
                              published_pages.update(
                                  f"{prefix}/{slug}".casefold()
                                  for prefix in ("/nemo/automodel", "/nemo/automodel/nightly")
                              )
                  if kind == "section":
                      validate(item.get("contents", []), depth + 1)

          if not isinstance(proposed, dict) or set(proposed) != {"navigation"}:
              raise ValueError("Only the nightly navigation may be overridden")
          validate(proposed["navigation"])
          # A newly canonical PR page must not be hidden by a legacy main redirect.
          # Only remove trusted redirects to declared pages; never load PR site settings.
          site_path = docs / "fern/docs.yml"
          site = yaml.safe_load(site_path.read_text())
          if isinstance(site, dict) and isinstance(site.get("redirects"), list):
              redirects = site["redirects"]
              remaining = [item for item in redirects if item["source"].casefold() not in published_pages]
              if len(remaining) != len(redirects):
                  site["redirects"] = remaining
                  site_path.write_text(yaml.safe_dump(site, sort_keys=False, allow_unicode=True))
          destination.write_text(yaml.safe_dump(proposed, sort_keys=False, allow_unicode=True))
          PY

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'

      - name: Install fixed Fern CLI
        working-directory: ${{ runner.temp }}
        run: npm install --prefix "$RUNNER_TEMP/fern-cli" --ignore-scripts --no-audit --no-fund fern-api@5.139.0

      - name: Generate library reference with trusted configuration
        env:
          FERN_TOKEN: ${{ secrets.DOCS_FERN_TOKEN }}
        working-directory: ${{ runner.temp }}/fern-preview/docs/fern
        run: '"$RUNNER_TEMP/fern-cli/node_modules/.bin/fern" docs md generate'

      - name: Style generated pages with trusted tooling
        run: |
          set -euo pipefail
          TOOL=trusted-source/tools/docs/build/code_styles.py
          # Remove the fallback once tools/docs is present on main.
          if ! test -f "$TOOL"; then
            TOOL=trusted-source/tools/apply_fern_code_styles.py
          fi
          python3 -I "$TOOL" --repo-root "$RUNNER_TEMP/fern-preview"

      - name: Generate preview
        env:
          FERN_TOKEN: ${{ secrets.DOCS_FERN_TOKEN }}
          FERN_DOCS_DEPLOY_MODE: ledger
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        working-directory: ${{ runner.temp }}/fern-preview/docs/fern
        run: |
          set -euo pipefail
          # Preserve diagnostics in the job log and fail if Fern or tee fails.
          "$RUNNER_TEMP/fern-cli/node_modules/.bin/fern" generate --docs --preview \
            --id "pr-${PR_NUMBER}-${GITHUB_SHA:0:12}" 2>&1 | tee "$RUNNER_TEMP/fern-preview.log"

      - name: Read preview URL without credentials
        id: preview
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          URL=$(sed -n 's/^.*Published docs to \(https:\/\/[^ ]*\) (.*/\1/p' "$RUNNER_TEMP/fern-preview.log")
          HOST="nvidia-preview-pr-${PR_NUMBER}-${GITHUB_SHA:0:12}.docs.buildwithfern.com"
          [[ "$URL" == "https://$HOST" || "$URL" == "https://$HOST/"* ]]
          PATH_PART=${URL#"https://$HOST"}
          [[ "$PATH_PART" =~ ^(/[a-zA-Z0-9/_-]*)?$ ]]
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Post or update preview comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" | jq -e \
            --arg sha "$GITHUB_SHA" '.state == "open" and .head.sha == $sha'
          BODY=$(printf ':herb: **Preview your docs:** <%s>\n\n<!-- preview-docs -->' "$PREVIEW_URL")
          COMMENT_ID=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- preview-docs -->"))) | .id' | head -1)
          if [ -n "$COMMENT_ID" ]; then
            gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" -X PATCH -f body="$BODY"
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$BODY"
          fi

  clear-preview:
    needs: changed-files
    if: >-
      github.repository == 'NVIDIA-NeMo/Automodel' &&
      needs.changed-files.outputs.docs == 'false'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Remove stale preview comments after docs changes are reverted
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" =~ ^refs/heads/pull-request/([1-9][0-9]*)$ ]]
          PR_NUMBER=${BASH_REMATCH[1]}
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" | jq -e \
            --arg repo "$GITHUB_REPOSITORY" --arg sha "$GITHUB_SHA" --argjson number "$PR_NUMBER" \
            '.number == $number and .state == "open" and .head.sha == $sha and
             .base.repo.full_name == $repo'
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- preview-docs -->"))) | .id' \
            > "$RUNNER_TEMP/fern-preview-comments"
          while IFS= read -r comment; do
            [[ "$comment" =~ ^[1-9][0-9]*$ ]]
            gh api "repos/$GITHUB_REPOSITORY/issues/comments/$comment" -X DELETE
          done < "$RUNNER_TEMP/fern-preview-comments"
