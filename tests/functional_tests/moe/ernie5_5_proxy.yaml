# Randomly initialized four-layer ERNIE 5.5 for the 2-GPU runners, shaped like
# `examples/llm_finetune/ernie5_5/ernie5_5_flash_squad_ep.yaml`: FSDP2 with expert
# parallelism only, one unpadded document per rank and microbatch, BF16 parameters
# with FP32 master weights.
#
# The layer schedule keeps every block type of the released model:
#   layer 0     HCA attention + dense FFN   (`first_k_dense_replace: 1`)
#   layers 1-2  HCA attention + latent MoE  (`compress_ratios` 128)
#   layer 3     DSA attention + latent MoE  (`compress_ratios` -2)
#
# Not scaled down, because the code branches on them:
#   * `hybrid_mla_kv_lora_rank` + `hybrid_mla_qk_rope_head_dim` = 576, `index_head_dim` 128 and
#     `index_n_heads` 32: shapes that the cuDNN path of the model accepts (576, 128, and 32 or 64
#     indexer heads), so one file serves `backend.attn: eager` and `backend.attn: cudnn`.
#   * `hc_mult` 4 and `hc_sinkhorn_iters` 20: the FP32 residual streams and their coefficients.
#   * The HCA compression ratio 128. Documents are 256 tokens long, so the second half of each
#     document attends a compressed block; a shorter document would leave the compressor unused.
#
# Sequence length: the eager DSA path accepts at most 512 tokens per document.
#
# Data: two synthetic documents, one per rank, repeated for eight epochs. Every update sees the
# same global batch, so the training loss has to fall; the script asserts that.

recipe: TrainFinetuneRecipeForNextTokenPrediction
seed: 1234

step_scheduler:
  global_batch_size: 2
  # One unpadded document per rank and microbatch, as in the recipe.
  local_batch_size: 1
  ckpt_every_steps: 1000
  # Recipe value. Every epoch is one batch here, so the default (true) would make every
  # update a checkpoint step and validate after each one.
  save_checkpoint_every_epoch: false
  val_every_steps: 1000
  num_epochs: 8
  max_steps: 8

dist_env:
  backend: nccl
  timeout_minutes: 10

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_config
  config:
    _target_: nemo_automodel.components.models.ernie5_5.config.Ernie5_5Config
    # Routes NeMoAutoModel to the NeMo class through MODEL_ARCH_MAPPING.
    architectures: [Ernie5_5_MoeForCausalLM]
    vocab_size: 4096
    hidden_size: 256
    intermediate_size: 896
    num_hidden_layers: 4
    num_nextn_predict_layers: 0
    mtp_shared_last_layer: true
    use_dense_mtp: false
    first_k_dense_replace: 1
    compress_ratios: [128, 128, 128, -2]
    max_position_embeddings: 1048576
    tie_word_embeddings: false
    # pad_token_id is left unset: the model rejects a document that contains the padding token,
    # and the synthetic documents carry no padding.
    hidden_act: situ
    activation_situ_beta: 4.0
    activation_situ_linear_beta: 25.0
    gated_linear_unit: true
    use_bias: false
    rms_norm_eps: 1.0e-6
    # HCA attention.
    num_attention_heads: 8
    num_key_value_heads: 1
    head_dim: 64
    qk_nope_head_dim: 48
    qk_rope_head_dim: 16
    qk_pos_emb_head_dim: 16
    v_head_dim: 64
    q_lora_rank: 64
    kv_lora_rank: 64
    o_lora_rank: 64
    o_groups: 2
    sliding_window: 64
    use_qk_norm: true
    qk_norm_type: per_head
    hca_rope_type: yarn
    compress_rope_theta: 160000.0
    use_vha_attention: true
    use_gated_attn: true
    gated_attn_act: sigmoid
    gated_attn_use_q_lora: true
    add_full_attention_sink_bias: true
    attention_bias: false
    use_attn_merger: true
    use_mla: false
    # DSA attention and its indexer.
    experimental_attention_variant: dsv4_hybrid
    hybrid_mla_attention: mqa_dsa
    csa_dense_mode: true
    hybrid_mla_num_attention_heads: 4
    hybrid_mla_num_key_value_heads: 4
    hybrid_mla_q_lora_rank: 64
    hybrid_mla_kv_lora_rank: 512
    hybrid_mla_qk_nope_head_dim: 48
    hybrid_mla_qk_rope_head_dim: 64
    hybrid_mla_v_head_dim: 64
    mqa_split_kv_b_proj: true
    index_n_heads: 32
    index_head_dim: 128
    index_topk: 32
    use_fast_hadamard: true
    # Rotary settings of the released configuration.
    rope_type: rope
    rope_theta: 8000000
    rotary_base: 8000000
    rotary_percent: 1.0
    rope_interleave: true
    rope_scaling:
      type: yarn
      factor: 16
      original_max_position_embeddings: 65536
      beta_fast: 32
      beta_slow: 1
    # Latent MoE. Routed and shared experts take different EP paths, so both stay present.
    n_routed_experts: 8
    n_shared_experts: 1
    num_experts_per_tok: 2
    moe_intermediate_size: 128
    moe_latent_size: 128
    moe_layer_freq: 1
    moe_split_feature_routing: true
    latent_moe_use_norm: true
    moe_shared_expert_gate: false
    moe_group_experts: false
    moe_token_dispatcher_type: deepep
    n_group: 1
    topk_group: 1
    topk_method: noaux_tc
    scoring_func: sigmoid
    norm_topk_prob: true
    routed_scaling_factor: 3.0
    routed_scaling_factor_learnable: true
    # Hyper-connections, hyper head and MultiMax.
    enable_hyper_connections: true
    hc_mult: 4
    hc_sinkhorn_iters: 20
    hc_eps: 1.0e-6
    multimax: lm_head
  dtype: bfloat16
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    # eager: both attention types on the eager PyTorch path; runs on every CUDA GPU.
    # cudnn: cuDNN sparse attention for the DSA layer; requires nvidia-cudnn-frontend[cutedsl] and
    #        FlashMLA; validated on SM100-class GPUs (GB200) only.
    attn: eager
    linear: torch
    experts: torch
    dispatcher: torch

distributed:
  strategy: fsdp2
  tp_size: 1
  pp_size: 1
  cp_size: 1
  # Two ranks, so the expert FSDP shard axis has size 1.
  ep_size: 2
  activation_checkpointing: false
  # Recipe values.
  mp_policy:
    _target_: torch.distributed.fsdp.MixedPrecisionPolicy
    param_dtype: null
    reduce_dtype: float32
    output_dtype: null
    cast_forward_inputs: false
  moe:
    reshard_after_forward: false
    wrap_outer_model: true

checkpoint:
  enabled: false
  checkpoint_dir: checkpoints/ernie5_5_proxy/

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy

# Synthetic fixed-length documents, so the test stages no tokenizer or dataset. Each document
# has `mean_len` tokens plus an end token: 256 tokens.
dataset:
  _target_: nemo_automodel.components.datasets.llm.mock.build_unpacked_dataset
  num_sentences: 2
  mean_len: 255
  std_len: 0
  vocab_size: 4096
  max_sentence_len: 255
  seed: 42

packed_sequence:
  packed_sequence_size: 0

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  # No pad_seq_len_divisible: the collator must not pad.
  collate_fn:
    _target_: nemo_automodel.components.datasets.utils.default_collater
  shuffle: false

validation_dataset:
  _target_: nemo_automodel.components.datasets.llm.mock.build_unpacked_dataset
  num_sentences: 2
  mean_len: 255
  std_len: 0
  vocab_size: 4096
  max_sentence_len: 255
  seed: 7

validation_dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn:
    _target_: nemo_automodel.components.datasets.utils.default_collater
  shuffle: false

optimizer:
  # Recipe optimizer. The learning rate is raised from the recipe's 1.0e-6 so that eight
  # updates on one repeated batch move the loss of a randomly initialized model.
  _target_: transformer_engine.pytorch.optimizers.fused_adam.FusedAdam
  betas: [0.9, 0.999]
  eps: 1.0e-8
  lr: 1.0e-3
  weight_decay: 0.01
  adam_w_mode: true
  bias_correction: true
  master_weights: true
  master_weight_dtype: torch.float32
  store_param_remainders: true
  exp_avg_dtype: torch.bfloat16
  exp_avg_sq_dtype: torch.bfloat16

clip_grad_norm:
  max_norm: 1.0
