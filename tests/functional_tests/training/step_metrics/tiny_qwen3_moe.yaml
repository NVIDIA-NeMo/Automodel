recipe: TrainFinetuneRecipeForNextTokenPrediction

step_scheduler:
  global_batch_size: 2
  local_batch_size: 1
  ckpt_every_steps: 1000
  val_every_steps: null
  num_epochs: 1
  max_steps: 4

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_config
  config:
    _target_: transformers.Qwen3MoeConfig
    architectures: [Qwen3MoeForCausalLM]
    vocab_size: 128
    hidden_size: 128
    intermediate_size: 256
    moe_intermediate_size: 64
    num_hidden_layers: 2
    num_attention_heads: 4
    num_key_value_heads: 2
    max_position_embeddings: 128
    num_experts: 4
    num_experts_per_tok: 2
    pad_token_id: 0
    eos_token_id: 1
    use_cache: false
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: sdpa
    linear: torch
    rms_norm: torch_fp32
    experts: torch
    dispatcher: torch

checkpoint:
  enabled: false
  checkpoint_dir: checkpoints

distributed:
  strategy: fsdp2
  activation_checkpointing: true

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy

dataset:
  _target_: nemo_automodel.components.datasets.llm.mock.MockUnpackedDatasetConfig
  num_sentences: 128
  mean_len: 14
  max_sentence_len: 23
  vocab_size: 128

packed_sequence:
  packed_sequence_size: 64
  packing_strategy: neat

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.default_collater
  shuffle: false
  pin_memory: true
  num_workers: 0

optimizer:
  _target_: torch.optim.Adam
  lr: 0.0005
  fused: true
