# Random initialization and synthetic data; no tokenizer or checkpoint downloads.
# Width 512 / latent 256 exercise HybridEP and TE grouped GEMM alignment.
# foreach=False supports TE expert parameters alongside FSDP DTensors.
recipe: TrainFinetuneRecipeForNextTokenPrediction
step_scheduler:
  global_batch_size: 8
  local_batch_size: 4
  ckpt_every_steps: 1000
  val_every_steps: 1000
  max_steps: 3
dist_env:
  backend: nccl
  timeout_minutes: 1
rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 42
  ranked: true
model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_config
  config:
    _target_: transformers.models.nemotron_h.configuration_nemotron_h.NemotronHConfig
    architectures:
    - NemotronHForCausalLM
    vocab_size: 128
    hidden_size: 512
    intermediate_size: 512
    num_attention_heads: 8
    num_key_value_heads: 2
    head_dim: 64
    layers_block_type:
    - attention
    - moe
    - attention
    - moe
    num_hidden_layers: 4
    residual_in_fp32: true
    dtype: bfloat16
    use_cache: false
    n_routed_experts: 4
    num_experts_per_tok: 2
    n_group: 1
    topk_group: 1
    routed_scaling_factor: 1.0
    norm_topk_prob: true
    moe_intermediate_size: 128
    moe_shared_expert_intermediate_size: 128
    mlp_bias: false
    num_nextn_predict_layers: 0
    moe_latent_size: 256
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: sdpa
    linear: torch
    rms_norm: torch
    rope_fusion: false
    experts: torch_mm
    dispatcher: hybridep
    fake_balanced_gate: false
    enable_hf_state_dict_adapter: false
    enable_fsdp_optimizations: true
checkpoint:
  enabled: false
  checkpoint_dir: checkpoints/tiny_pp_moe
distributed:
  strategy: fsdp2
  dp_size: none
  tp_size: 1
  cp_size: 1
  pp_size: 2
  ep_size: 2
  sequence_parallel: false
  activation_checkpointing: false
  pipeline:
    pp_schedule: 1f1b
    pp_microbatch_size: 1
    scale_grads_in_schedule: false
    patch_inner_model: false
    patch_causal_lm_model: false
  autocast_dtype: bfloat16
loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy
dataset:
  _target_: nemo_automodel.components.datasets.llm.mock.build_unpacked_dataset
  num_sentences: 64
  mean_len: 31
  std_len: 0
  vocab_size: 128
  max_sentence_len: 32
  seed: 42
dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.default_collater
  shuffle: false
validation_dataset:
  _target_: nemo_automodel.components.datasets.llm.mock.build_unpacked_dataset
  num_sentences: 8
  mean_len: 31
  std_len: 0
  vocab_size: 128
  max_sentence_len: 32
  seed: 7
validation_dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.default_collater
optimizer:
  _target_: torch.optim.AdamW
  lr: 1e-5
  weight_decay: 0.01
  betas:
  - 0.9
  - 0.95
  foreach: false
