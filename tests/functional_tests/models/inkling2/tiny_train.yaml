# Offline, two-GPU qualification fixture, not a released-model training recipe.
# automodel tests/functional_tests/models/inkling2/tiny_train.yaml --nproc-per-node 2
# Resume with --checkpoint.restore_from <checkpoint-directory>.
recipe: TrainFinetuneRecipeForNextTokenPrediction
seed: 481
dist_env:
  backend: nccl
  timeout_minutes: 3
step_scheduler:
  global_batch_size: 8
  local_batch_size: 1
  max_steps: 3
  num_epochs: 1
  ckpt_every_steps: 1
  val_every_steps: 100
  validate_on_checkpoint: false
model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_config
  dtype: float32
  use_liger_kernel: false
  use_sdpa_patching: false
  config:
    _target_: nemo_automodel.components.models.inkling2.config.Inkling2TextConfig
    architectures: [Inkling2ForCausalLM]
    hidden_size: 64
    intermediate_size: 64
    num_hidden_layers: 13
    vocab_size: 40
    unpadded_vocab_size: 37
    num_attention_heads: 4
    num_key_value_heads: 2
    head_dim: 8
    d_rel: 3
    rel_extent: 4
    sliding_window_size: 7
    n_routed_experts: 16
    num_experts_per_tok: 8
    log_scaling_n_floor: 4
    max_position_embeddings: 128
    dtype: float32
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: eager
    linear: torch
    rms_norm: torch
    experts: torch_mm
    dispatcher: torch
distributed:
  strategy: fsdp2
  tp_size: 1
  cp_size: 1
  pp_size: 1
  ep_size: 2
  activation_checkpointing: true
  reshard_after_forward: true
  enable_fsdp2_prefetch: false
  mp_policy:
    _target_: torch.distributed.fsdp.MixedPrecisionPolicy
    param_dtype: bfloat16
    reduce_dtype: float32
    output_dtype: null
    cast_forward_inputs: false
  moe:
    reshard_after_forward: true
    wrap_outer_model: true
loss_fn:
  _target_: nemo_automodel.components.models.inkling2.loss.Inkling2FusedLinearCrossEntropy
  unpadded_vocab_size: 37
  reduction: sum
optimizer:
  _target_: torch.optim.AdamW
  lr: 0.0001
  betas: [0.9, 0.95]
  eps: 0.00001
  weight_decay: 0.1
  foreach: false
clip_grad_norm:
  max_norm: 0.25
  backend: triton
dataset:
  _target_: tests.functional_tests.models.inkling2.test_recipe.TinyDatasetConfig
dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.default_collater
  num_workers: 0
  shuffle: false
checkpoint:
  enabled: true
  checkpoint_dir: checkpoints/inkling2-tiny
  model_save_format: safetensors
  save_consolidated: every
  is_async: false
