# Regression coverage for NVBug 6575831: FP32-storage BERT + LoRA under BF16 compute.
# Uses random weights and a mock dataset, so no downloads are needed.

step_scheduler:
  global_batch_size: 4
  local_batch_size: 4
  ckpt_every_steps: 2
  val_every_steps: 2
  num_epochs: 1
  max_steps: 1

dist_env:
  backend: nccl
  timeout_minutes: 1

model:
  _target_: nemo_automodel.NeMoAutoModelForSequenceClassification.from_config
  torch_dtype: float32
  config:
    _target_: transformers.BertConfig
    num_hidden_layers: 2
    num_attention_heads: 2
    hidden_size: 64
    intermediate_size: 128
    vocab_size: 256
    max_position_embeddings: 128
    num_labels: 2

distributed:
  strategy: fsdp2
  dp_size: none
  tp_size: 1
  cp_size: 1
  sequence_parallel: false
  autocast_dtype: bfloat16

peft:
  _target_: nemo_automodel.components._peft.lora.PeftConfig
  target_modules:
  - "*.query"
  - "*.value"
  dim: 4
  alpha: 8

freeze_config:
  unfreeze_modules:
  - glob: "*classifier"

dataset:
  _target_: nemo_automodel/components/datasets/llm/mock_seq_cls.py:MockSequenceClassificationDataset
  num_samples: 4
  num_labels: 2
  vocab_size: 256
  max_seq_len: 32

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.default_collater
  shuffle: false

optimizer:
  _target_: torch.optim.Adam
  betas: [0.9, 0.999]
  eps: 1e-8
  lr: 1.0e-4
  weight_decay: 0

checkpoint:
  enabled: false
  checkpoint_dir: checkpoints_seq_cls_lora_fp32_test/
