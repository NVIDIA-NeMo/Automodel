recipe: TrainFinetuneRecipeForNextTokenPrediction
step_scheduler:
  global_batch_size: 4
  local_batch_size: 2
  max_steps: 3
  ckpt_every_steps: 1000
  val_every_steps: null
dist_env:
  backend: nccl
  timeout_minutes: 2
model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_config
  config:
    _target_: nemo_automodel.NeMoAutoConfig.from_pretrained
    # The launcher replaces this with its freshly generated local config.
    pretrained_model_name_or_path: unused-local-config
    trust_remote_code: false
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: sdpa
    linear: torch
    rms_norm: torch
    rope_fusion: false
    enable_hf_state_dict_adapter: false
distributed:
  strategy: fsdp2
  tp_size: 1
  cp_size: 1
  pp_size: 2
  ep_size: 1
  activation_checkpointing: false
  pipeline:
    pp_schedule: 1f1b
    pp_microbatch_size: 1
    scale_grads_in_schedule: false
checkpoint:
  enabled: false
loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy
dataset:
  _target_: nemo_automodel.components.datasets.llm.mock_iterable_dataset.MockIterableDatasetConfig
  tokenizer: null
  vocab_size: 128
  seq_len: 32
  num_samples: 64
  exclude_token_ids: [0]
dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.default_collater
  num_workers: 2
  pin_memory: true
optimizer:
  _target_: torch.optim.AdamW
  lr: 0.001
  weight_decay: 0.0
