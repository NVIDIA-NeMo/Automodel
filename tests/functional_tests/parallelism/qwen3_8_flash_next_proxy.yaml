# Small randomly-initialized Qwen3.8-Flash-Next for parallelism parity runs,
# shrunk from `examples/llm_finetune/qwen/qwen3_8_flash_next_180b_hellaswag_ep64.yaml`.
#
# Every layer keeps the four HyperConnection streams that the stages exchange
# and the QSA sparse-attention path. All layers are full attention: the
# GatedDeltaNet layers keep SSM parameters in fp32, and at `ep_size: 1` the
# pipeline legs run through the dense FSDP path, which has no separate fp32
# FSDP group for them. The expert count is not scaled down below what EP shards.
#
# The PLE (Engram) layer is disabled: its owner-sharded table is bound to the
# per-stage FSDP group and is exercised by the dedicated Engram tests.
#
# Backends: QSA on CUDA requires `attn: flex`; `dispatcher: torch` so the
# EP legs run the same expert code at every expert-parallel degree.

recipe: TrainFinetuneRecipeForNextTokenPrediction

step_scheduler:
  global_batch_size: 16
  local_batch_size: 2
  ckpt_every_steps: 1000
  val_every_steps: 1000
  max_steps: 6

dist_env:
  backend: nccl
  timeout_minutes: 10

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 42
  ranked: true

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_config
  config:
    _target_: nemo_automodel.components.models.qwen3_8_flash_next.config.Qwen3_8_FlashNextConfig
    language_model_only: true
    text_config:
      vocab_size: 32000
      hidden_size: 256
      num_hidden_layers: 8
      full_attention_interval: 4
      layer_types: [full_attention, full_attention, full_attention, full_attention, full_attention, full_attention, full_attention, full_attention]
      num_attention_heads: 8
      num_key_value_heads: 2
      head_dim: 64
      hidden_act: silu
      attention_bias: false
      attention_dropout: 0.0
      rms_norm_eps: 1.0e-6
      max_position_embeddings: 4096
      tie_word_embeddings: false
      dtype: bfloat16
      rope_parameters:
        rope_type: default
        rope_theta: 10000000
        partial_rotary_factor: 0.25
        mrope_interleaved: true
        mrope_section: [11, 11, 10]
      output_gate_type: sigmoid
      linear_conv_kernel_dim: 4
      linear_key_head_dim: 32
      linear_value_head_dim: 32
      linear_num_key_heads: 4
      linear_num_value_heads: 8
      mamba_ssm_dtype: float32
      num_experts: 8
      num_experts_per_tok: 2
      moe_intermediate_size: 128
      shared_expert_intermediate_size: 128
      hc_count: 4
      hc_lowrank: 32
      ple_layer_ids: []
      indexer_budget: 64
      indexer_compress_ratio: 4
      indexer_head_dim: 64
      indexer_kv_heads: 1
      indexer_n_heads: 2
  trust_remote_code: false
  load_base_model: false
  torch_dtype: bfloat16
  use_liger_kernel: false
  use_sdpa_patching: false
  backend:
    _target_: nemo_automodel.components.models.qwen3_8_flash_next.backend.Qwen3_8_FlashNextBackendConfig
    attn: flex
    linear: torch
    rms_norm: torch_fp32
    rope_fusion: false
    experts: torch_mm
    dispatcher: torch
    fake_balanced_gate: false
    gate_precision: float32
    enable_hf_state_dict_adapter: false
    enable_fsdp_optimizations: true

checkpoint:
  enabled: false
  checkpoint_dir: checkpoints/qwen3_8_flash_next_proxy/

distributed:
  strategy: fsdp2
  dp_size: none
  tp_size: 1
  cp_size: 1
  pp_size: 1
  ep_size: 1
  sequence_parallel: false
  activation_checkpointing: false
  pipeline:
    pp_schedule: 1f1b
    pp_microbatch_size: 1
    scale_grads_in_schedule: false
    patch_inner_model: false
    patch_causal_lm_model: false
  moe:
    reshard_after_forward: true
    wrap_outer_model: true

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy

# Synthetic fixed-length token sequences: what is under test is whether two
# topologies agree on identical inputs. `std_len: 0` keeps every sample the
# same length so the pipeline stages can use static shapes.
dataset:
  _target_: nemo_automodel.components.datasets.llm.mock.build_unpacked_dataset
  num_sentences: 128
  mean_len: 127
  std_len: 0
  vocab_size: 32000
  max_sentence_len: 128
  seed: 42

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.default_collater
  shuffle: false

validation_dataset:
  _target_: nemo_automodel.components.datasets.llm.mock.build_unpacked_dataset
  num_sentences: 8
  mean_len: 127
  std_len: 0
  vocab_size: 32000
  max_sentence_len: 128
  seed: 7

validation_dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.default_collater

optimizer:
  _target_: torch.optim.AdamW
  lr: 1e-4
  weight_decay: 0.01
  betas: [0.9, 0.95]
